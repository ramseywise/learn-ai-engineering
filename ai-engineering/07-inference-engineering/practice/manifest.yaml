# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/inference-lab"
    purpose: "Seeded pure-Python simulation of batching policies, KV-cache eviction and prefix caching whose timings follow from params.json assumptions, with measure.py for real TTFT and TPOT when MODEL is set."
    demonstrates:
      - "notes/06-serving-at-scale.md"
      - "notes/07-prefill-decode-kv-cache.md"
    pattern: other
    language: python
    runs_offline: true
    verified_by: "cd inference-lab && uv run test.py"
    licence: course
  - path: "practice/inference-lab-ts"
    purpose: "TypeScript twin of the inference simulation: reads the same params.json, draws the same random numbers and prints the same report."
    demonstrates: []
    pattern: other
    language: typescript
    runs_offline: true
    verified_by: "cd inference-lab-ts && npx --yes tsx test.ts"
    licence: course
  - path: "practice/serving_encoders_vlm_lab.py"
    purpose: "Single-script lab that times serving an encoder and a small vision-language model on one laptop (downloads about 0.6 GB of models), to produce the ratios quoted in note 08b."
    demonstrates:
      - "notes/08b-serving-encoders-and-vision-models.md"
    pattern: other
    language: python
    runs_offline: false
    verified_by: none
    licence: course
