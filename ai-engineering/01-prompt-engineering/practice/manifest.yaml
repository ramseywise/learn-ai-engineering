# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/prompt-eval-harness"
    purpose: "TypeScript lab that runs three prompt variants over twelve labelled support tickets with a stub model, grades each output on three checks and reports which cases each change fixed or broke."
    demonstrates:
      - "notes/04-controlling-output.md"
      - "notes/08-evaluating-prompts.md"
      - "notes/09-prompt-optimization.md"
      - "notes/10-adversarial-prompting.md"
      - "notes/prompt-library.md"
    pattern: eval
    language: typescript
    runs_offline: true
    verified_by: "cd prompt-eval-harness && npx --yes tsx test.ts"
    licence: course
  - path: "practice/prompt-eval-harness-py"
    purpose: "Python twin of the prompt eval harness: same cases, variants, stub model and report, with a test.py of assertions."
    demonstrates: []
    pattern: eval
    language: python
    runs_offline: true
    verified_by: "cd prompt-eval-harness-py && uv run test.py"
    licence: course
