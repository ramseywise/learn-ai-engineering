# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/context-budgeter"
    purpose: "TypeScript lab that packs a support agent's context layers into a token budget by priority (pin, truncate, drop) and reports every decision, using a stub model."
    demonstrates:
      - "notes/03-budgeting-the-window.md"
    pattern: budget
    language: typescript
    runs_offline: true
    verified_by: "cd context-budgeter && npx --yes tsx test.ts"
    licence: course
  - path: "practice/context-budgeter-py"
    purpose: "Python twin of the context budgeter: same scenario, three budgets, packing rules and report, with assertions in test.py."
    demonstrates:
      - "notes/03-budgeting-the-window.md"
    pattern: budget
    language: python
    runs_offline: true
    verified_by: "cd context-budgeter-py && uv run test.py"
    licence: course
