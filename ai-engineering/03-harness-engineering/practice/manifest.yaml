# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/tool-server-sandbox"
    purpose: "TypeScript MCP-shaped JSON-RPC tool server over stdio with a symlink-resolving path jail, command allowlist without a shell, scrubbed environment, kill timer, output caps, write approval and audit log, attacked by a scripted agent."
    demonstrates:
      - "notes/01-what-a-harness-is.md"
      - "notes/03-tool-design.md"
      - "notes/03b-mcp-write-safety-and-async-tools.md"
      - "notes/04-execution-boundaries.md"
    pattern: guardrail
    language: typescript
    runs_offline: true
    verified_by: "cd tool-server-sandbox && npx --yes tsx test.ts"
    licence: course
  - path: "practice/tool-server-sandbox-py"
    purpose: "Python twin of the sandboxed tool server: same workspace, tools, policy and scripted attacks, plus a server.py that speaks the protocol over stdio."
    demonstrates:
      - "notes/01-what-a-harness-is.md"
      - "notes/03-tool-design.md"
      - "notes/03b-mcp-write-safety-and-async-tools.md"
      - "notes/04-execution-boundaries.md"
    pattern: guardrail
    language: python
    runs_offline: true
    verified_by: "cd tool-server-sandbox-py && uv run test.py"
    licence: course
