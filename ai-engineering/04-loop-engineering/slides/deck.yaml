  - title: What stops it
    summary: Traps · Silent costs · Layered exits · The same parts in your framework
    divider: true
    agenda: true
    notes: >-
      Now everything that goes wrong, by name, and the exits that contain it. We finish with the loop contract and
      how to find these parts in the framework you use.
    slides:
      - layout: statement
        kicker: The problem
        title: A cap reached is not a job finished
        statement: A cap is an escalation, never a success.
        attribution: "An open loop with no stopping condition is the most common way a small mistake turns expensive"
        takeaway: An open loop with no stopping condition is the most common way a small mistake turns into an expensive one.
        recall: Why must hitting an iteration cap be reported as an escalation?
        source: notes/09-failure-modes-and-guardrails.md
        notes: >-
          If our auth loop runs out of iterations at 45 of 47 and reports done, you have shipped a lie. Anthropic lists
          what an unattended run needs before you walk away: budgets, stopping conditions, recovery and observability. We
          begin with the ways it fails.
      - layout: table
        kicker: Name them
        title: Six traps, and what each looks like
        header: [Trap, Symptom, Fix]
        widths: [2.4, 3.6, 4]
        rows:
          - [No scorekeeper, Results inconsistent or meaningless, Write it first; objective and hard to game]
          - [Goal too big, Never finishes; scope drifts, Cut to one small testable piece]
          - [Cheating the tests, "Green score, wrong output", Protect the scorekeeper; held-out checks]
          - [Thrashing, "Lots of change, no improvement", "Smaller goal, smaller changes"]
          - [Context rot, Memory degrades as the transcript grows, Summarize and prune inside the loop]
          - [Unsafe autonomy, Risky commands or sweeping edits, Narrow write scope; approval gates]
        takeaway: Diagnose a loop by its symptom, since a green score with wrong output means cheating and change without gain means thrashing.
        recall: Name the six loop traps from their symptoms.
        source: notes/09-failure-modes-and-guardrails.md
        notes: >-
          Read the symptom column first, since that is what you will see. Green score and wrong output is the agent cheating,
          and it needs a protected scorekeeper. Lots of change and no improvement is thrashing, and more iterations will not
          help. Those at least show up in the logs. Some costs don't.
      - layout: cards
        kicker: Quiet failures
        title: Four costs that never trip an alert
        cards:
          - {title: Verification debt, body: "\"Looks fine\" stands in for \"confirmed\". Make stop conditions machine-checkable."}
          - {title: Comprehension rot, body: Code ships faster than you understand it. Fast loops require fast reading.}
          - {title: Cognitive surrender, accent: "D4621A", body: "\"The comfortable posture is the dangerous one.\" You take what it returns without an opinion."}
          - {title: Token blowout, body: Context grows roughly quadratically. Compaction or reset from the first loop.}
        takeaway: "Osmani's silent costs land on the engineer, so build a loop intending to stay the engineer and not just the person who presses go."
        recall: What are Osmani's four silent costs of loops?
        source: notes/09-failure-modes-and-guardrails.md
        notes: >-
          These come from Osmani, and they don't trip any alert. Three of the four happen to you, not the agent. The loop keeps
          producing, you keep accepting, and at some point you no longer understand what you own.
      - layout: table
        kicker: Stopping
        title: Layered exits, each one independent
        header: [Exit, Fires when, Outcome]
        widths: [2.2, 4.2, 3.6]
        highlight: [0]
        rows:
          - [Success, Scorekeeper confirms the goal, "Save, report, stop"]
          - [Iteration cap, N passes reached, "Escalate. The cap isn't success"]
          - [Budget cap, "Tokens, dollars or wall-clock spent", Escalate with state saved]
          - [Stall detector, "Score flat for K passes, or same action repeated", "Change strategy once, then escalate"]
          - [Human escalation, "Blocker, irreversible action, judgment call", Pause and hand over full context]
        takeaway: "Only the scorekeeper's confirmation counts as success, and the two ratchet rules are that score only rises and breaks get fixed first."
        recall: What five independent exits should a loop have, and which one counts as success?
        source: notes/09-failure-modes-and-guardrails.md
        notes: >-
          Five exits, and only one of them is a success. They must be independent, so one failing doesn't take out the rest.
          These are the exit codes from the Ralph script, grown up.
      - layout: flow
        kicker: Self-modifying loops
        title: Three boundaries a self-editing loop may not cross
        steps:
          - {label: Evidence, sub: is not instructions}
          - {label: Candidate, sub: is not production}
          - {label: Safety, sub: is not self-modifiable, accent: "D4621A"}
        bullets:
          - "Web pages and tool output are untrusted: summarize, version as a PR, review with another model family"
          - "New knowledge, prompts and code start where no traffic is served"
          - "Validators, thresholds, audit logs and backups stay out of the agent's reach"
        takeaway: The safety boundary is the write boundary extended to the release gate, so validators and audit logs stay out of the agent's reach.
        recall: What three boundaries guard a self-modifying loop?
        source: notes/09-failure-modes-and-guardrails.md
        notes: >-
          Back to the slow loop. Tool output could steer it, candidates could reach users, and it could weaken its own tests.
          The last boundary is the one from part one, the write boundary, extended to the whole release gate.
      - layout: code
        kicker: Monday morning
        title: Write the loop contract first
        lang: markdown
        code: |-
          ## Goal
          All tests in tests/auth/ pass
          ## Acceptance criteria (each a command)
          pytest tests/auth/ -q
          ## Scorekeeper / Write boundary
          tests/auth/ read-only; edit auth/ only
          ## Trigger / Stop rules
          /goal; 20 passes, 2 hours, stall at 3
          ## Ratchet
          score only rises; one change per pass
          ## Human gates
          anything that drops a legacy cookie
        bullets:
          - Illustrative values, in the note's template
          - Each acceptance line is a **command**
          - "The contract is what the checker reads first"
        takeaway: A one-page loop contract fixes goal, commands, boundary, trigger, stops, ratchet and human gates before the first pass.
        recall: What sections does a loop contract need?
        source: notes/09-failure-modes-and-guardrails.md
        notes: >-
          Here's the whole lecture as a document, filled in for our auth loop with illustrative values. The template is in
          note nine. If you can't write one of these sections, you are not ready to walk away from the loop.
      - layout: table
        kicker: Your framework
        title: The same loop parts in three frameworks
        header: [Loop part, Google ADK, Vercel AI SDK, LangGraph]
        widths: [2, 2.6, 2.8, 2.6]
        rows:
          - [Agent loop, "`LoopAgent`", "`ToolLoopAgent`", "`create_agent`"]
          - [Checker, critic sub-agent, your check in a tool, "`RubricMiddleware`"]
          - [Early exit, "`escalate = True`", "`stopWhen`", "edge to `END`"]
          - [Hard cap, "`max_iterations`", "`stepCountIs(n)`", "`recursion_limit`"]
          - [Durability, session state, "`WorkflowAgent`", checkpointer]
          - [Trace, events, "`result.steps`", LangSmith]
        takeaway: Frameworks mostly differ in names, so look for where each puts the goal, the scorekeeper and the stop rules.
        recall: How does each of ADK, the Vercel AI SDK and LangGraph express an early exit and a hard cap?
        source: notes/10-framework-bindings.md
        notes: >-
          Nothing you learned depends on a framework. Each has the same parts under different names. A closer look at one
          will show where the surprises are.
      - layout: code
        kicker: Worked example
        title: "ADK's loop stops only when a sub-agent asks"
        lang: python
        code: |-
          def exit_loop(tool_context: ToolContext):
              tool_context.actions.escalate = True
              return {}

          critic = LlmAgent(name="CriticAgent",
              instruction="Grade {draft} ...",
              output_key="critique")
          refiner = LlmAgent(name="RefinerAgent",
              instruction="If {critique} is clean, "
                          "call exit_loop. Else rewrite.",
              tools=[exit_loop], output_key="draft")
          refine = LoopAgent(name="Refine",
              sub_agents=[critic, refiner],
              max_iterations=5)       # backstop
        bullets:
          - "**Stopping is not automatic:** a sub-agent must set `escalate`"
          - "`output_key` writes state; `{draft}` reads it"
          - "`max_iterations` is the backstop, **not** the main exit"
        takeaway: In ADK's LoopAgent a sub-agent must set escalate to stop early, and max_iterations is only the backstop.
        recall: How does an ADK LoopAgent stop early, and what is max_iterations for?
        source: notes/10-framework-bindings.md
        notes: >-
          A maker and a checker in ADK. The surprise is that nothing stops by itself: a sub-agent has to call the exit tool.
          Forget that and it always runs to five iterations and looks like success. That is the cap trap once more.

  - title: Wrap-up
    agenda: false
    divider: false
    slides:
      - layout: cards
        kicker: Closing
        title: Rules of thumb
        cards:
          - {title: Foundation, body: "Goal and scorekeeper before anything runs. Go green once, then add parts."}
          - {title: Scorekeeper, body: "Deterministic first, out of the loop's write scope, some checks held out. The checker can say clean."}
          - {title: Ratchet, body: "The score only goes up. One change per pass; save or roll back."}
          - {title: Long runs, body: "State on disk, not in context. One item per session, leave the repo clean."}
          - {title: Autonomy, body: "Climb one rung at a time, each earned with a verifier you trust."}
          - {title: Stopping, accent: "D4621A", body: "Layered, independent exits. A cap is an escalation, never a success."}
        takeaway: Goal and scorekeeper come first, the score only rises, and a cap is an escalation and never a success.
        recall: Give one rule of thumb each for scorekeepers, ratchets, autonomy and stopping.
        source: notes/09-failure-modes-and-guardrails.md
        notes: >-
          Our auth loop now has a scorekeeper it can't edit, a memory file, a ratchet, a trigger with a cost ceiling and five
          exits. Each of these was there because something would otherwise go wrong while nobody was watching.
