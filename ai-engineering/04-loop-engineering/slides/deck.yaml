# Lecture deck for ai-engineering/04-loop-engineering, notes 01-10.
# Build: make slides PILLAR=04-loop-engineering STRICT=1 PREVIEW=1
# Running example: a loop told to make all tests in tests/auth/ pass (41/47 in notes/05),
# followed from one manual run to a scheduled loop that can edit its own procedure.
deck:
  title: Loop Engineering
  subtitle: Designing the cycle that prompts the agent
  tagline: |-
    One loop told to make the auth tests pass, from the first green pass to running without you.
    What keeps it honest, what keeps it going, how much to hand off, and what stops it.
  reference: "Notes: ai-engineering/04-loop-engineering"
  output: loop-engineering.pptx
  notes: >-
    Pillar four. The harness made one run safe. Today nobody types the next prompt. We will follow a single
    loop with a simple job, make the auth tests pass, and at each stage ask what goes wrong once you stop watching.
parts:
  - title: Who checks the work
    summary: What a loop is · The shape to design first · The scorekeeper
    divider: true
    agenda: true
    notes: >-
      The first question for any loop is not how to prompt it. It is who decides whether a pass helped.
      We define the loop, draw its skeleton, and spend the most time on the scorekeeper.
    slides:
      - layout: statement
        kicker: The problem
        title: Nobody is watching the next pass
        statement: Loop engineering is designing the cycle that keeps an agent correct and productive when nobody is watching.
        attribution: "\"Stop prompting your agents and start designing the loops that prompt them.\" — Adnan Masood"
        takeaway: The moment an agent's next run starts without you typing a prompt, you have crossed from harness into loop.
        recall: What marks the crossing from harness engineering into loop engineering?
        source: notes/01-what-a-loop-is.md
        notes: >-
          Say our agent can fix one failing auth test when you ask. Now you want it to keep going until all of them
          pass, and you want to go to lunch. Each pass used to have you in it, reading the result. Remove yourself
          and something else has to do that reading. That is what this pillar designs.
      - layout: image
        kicker: The cycle
        title: One cycle, three vocabularies
        image: ../sources/images/aibuilderclub-anthropic-agent-loop.png
        caption: "The loop Anthropic ships (AI Builder Club, 2026)"
        bullets:
          - "**Classic agents:** perceive → decide → act → repeat"
          - "**Claude Agent SDK:** gather → act → verify → repeat"
          - "**KodeKloud:** try → test → fix → **save** → repeat"
        takeaway: The save step makes progress a ratchet, so a bad pass costs one rollback and not the whole run.
        recall: Which step in try-test-fix-save makes progress a ratchet, and what does a bad pass then cost?
        source: notes/01-what-a-loop-is.md
        notes: >-
          You will meet this cycle under different names. They agree on nearly everything. The word worth noticing is
          save. If passing work gets committed, a later bad pass can only cost you that pass. So what do you need
          before starting the cycle at all?
      - layout: compare
        kicker: Before it runs
        title: A goal points the work, a scorekeeper proves it
        emphasis: right
        left:
          title: A clear goal
          bullets:
            - "\"Make all auth tests pass\", not \"improve the app\""
            - A testable goal is a loop invariant
            - A vague one is an infinite loop
          tag: Points the work
        right:
          title: A scorekeeper
          bullets:
            - An objective check that a step helped or hurt
            - "Test suite, build, linter, or a rubric graded by a separate agent"
            - "Then **go green once:** goal, one change, score, persist"
          tag: Proves the work
        takeaway: A loop needs a goal and a scorekeeper before anything runs, and it should complete one green pass before growing.
        recall: What two things must exist before a loop runs, and what is going green once?
        source: notes/01-what-a-loop-is.md
        notes: >-
          Our goal is checkable as written, and the test suite is already a scorekeeper. Before adding any machinery,
          run one pass by hand from start to end. And before any of this, ask if you need a loop at all.
      - layout: bullets
        kicker: Not always
        title: Build a loop only when it can pay back
        lead: "Both must hold. Otherwise use a fixed workflow or a good prompt."
        bullets:
          - "The work **repeats** often enough to cover the cost of many passes"
          - "A scorekeeper can **reliably validate** the result"
          - "If success only means it looks right, there is nothing to steer by"
          - "Many agents going in circles were a three-step task given to an open-ended loop"
        aside:
          title: Harness vs. loop
          accent: "1E3A5F"
          bullets:
            - "Harness: one run, how it is safe"
            - "Loop: many runs, what starts the next and when to stop"
            - "Harness ratchet: each failure becomes a rule"
            - "Loop ratchet: score only goes up"
        takeaway: Build a loop only when the work repeats enough to pay for many passes and a scorekeeper can reliably validate the result.
        recall: What two conditions justify building a loop, and what should you use otherwise?
        source: notes/01-what-a-loop-is.md
        notes: >-
          Anthropic's advice is workflow first. Our auth tests qualify because a script can say pass or fail. A loop
          that writes marketing copy mostly would not. When yours keeps circling, first ask if it should be a loop.
      - layout: code
        kicker: Worked example
        title: Draw the skeleton before the prompt
        lang: pseudocode
        code: |-
          initialize state with goal
          for step in range(MAX_STEPS):
              reason about current state   # model
              choose a concrete action     # model
              execute the tool
              update state with the outcome
              compact context
              if scorekeeper says goal met:
                  save; return success
              if score went down: roll back
              if no progress for N steps
                 or budget exhausted: escalate
          escalate to human  # cap is not success
        bullets:
          - The model supplies **two lines**
          - "**Save** on success, **roll back** on a drop"
          - "Five required parts: goal, tools, context, stop logic, error handling"
          - The last line is an escalation, not a return value
        takeaway: The model supplies two lines of a loop, and everything else is yours to design, so a prompt cannot fix a missing line.
        recall: How many lines of the canonical loop skeleton belong to the model, and what must the last line do?
        source: notes/02-loop-shapes.md
        notes: >-
          This is the important slide of part one. Count what the model does: reason and choose. Everything else is
          engineering. Remove the stall check and it thrashes. Remove the cap and it runs forever. Note that hitting
          the cap escalates: it doesn't report success, and that matters later.
      - layout: cards
        kicker: Task shape
        title: Pick the pattern by the shape of the task
        cards:
          - {title: Retry, body: "Atomic task, clear pass/fail. Act, check, act again with the error."}
          - {title: Plan–Execute–Verify, body: "Multi-step work where order matters. Plan once, verify each step."}
          - {title: Explore–Narrow, body: "Unfamiliar territory. Fan out in parallel, then converge on the best lead."}
          - {title: Human-in-the-loop, body: "Ambiguity or high stakes. Pause at decision points for approval."}
        takeaway: "Choose a loop pattern from the task's shape, adding tool use first, then reflection, then planning and multi-agent once evals exist."
        recall: Which loop pattern fits an atomic task, ordered steps, unfamiliar territory and high stakes?
        source: notes/02-loop-shapes.md
        notes: >-
          One failing test suits Retry. A refactor across files suits Plan-Execute-Verify. A bug with no leads suits
          Explore-Narrow. Vercel's order is a good sanity check: tool use, then reflection, then planning. Inside
          any of these shapes there are lots of small decisions, and not all need an expensive model.
      - layout: image
        kicker: The evidence
        title: Many loop decisions are multiple choice
        image: ../sources/images/zhu-jevagentharness-fig3.png
        caption: "Eight decision points in one step, five ways to share control (Zhu et al., 2026, Fig. 3)"
        bullets:
          - "A small decision model: **28%** of an LLM call's time, **2.6%** of its price"
          - "Without a fitted threshold, delegating tool choice cut success by **19 points**"
          - "With a per-point threshold: **81–89%** cheaper, up to **2.5×** faster, under 3 points lost"
        takeaway: A cheap decision component in the loop is safe only once you have measured where it is wrong.
        recall: What separated the harmful and helpful uses of a small decision model in the JEvAgentHarness results?
        source: notes/02-loop-shapes.md
        notes: >-
          Zhu and colleagues put a small classifier at each decision point. With no threshold, tool-choice delegation
          lost nineteen points of success. With a threshold fitted per decision point it was 81 to 89 percent cheaper.
          So measurement decides, which brings us to the thing doing the measuring.
      - layout: cards
        kicker: The load-bearing part
        title: Five traits of a scorekeeper, and its defenses
        cards:
          - {title: Objective, body: Same work gives the same result every time.}
          - {title: Automatic, body: One command or CI trigger. No manual step.}
          - {title: Fast, body: Cheap enough to run every pass.}
          - {title: Clear, body: "One unambiguous score, so the loop knows where it stands."}
          - {title: Hard to fake, accent: "D4621A", body: "A loop that can lower the bar will take the easiest path to green."}
          - {title: Defenses, accent: "0EA5C9", body: "Held-out checks, tamper-proof location, auditable artifacts, watch the trend."}
        takeaway: Build the verifier before you scale the generator, since a generator that cannot check itself only makes plausible work faster.
        recall: What five traits does a scorekeeper need, and why is hard to fake the critical one?
        source: notes/03-the-scorekeeper.md
        notes: >-
          Anthropic's web-app agent improved once it could test features as a human would. It wasn't a better prompt.
          Our pytest run is objective, automatic and clear. Is it hard to fake? An agent asked to make the tests pass
          can delete them. So where does the scorekeeper live?
      - layout: table
        kicker: The write boundary
        title: An editable evaluator is a negotiation
        lead: "Karpathy's `autoresearch` separates three files by who may write them."
        header: [File, Who writes it, Why]
        widths: [2.8, 1.8, 5.4]
        highlight: [1]
        rows:
          - ["`train.py`", Agent, The search space]
          - ["`prepare.py` (eval)", Nobody, The verifier must not be editable by the thing it grades]
          - ["`program.md`", Human, The contract]
        takeaway: An agent that can edit its own evaluator does not have a verifier, because it has a negotiation.
        recall: Who may write the evaluator in a loop, and why?
        source: notes/03-the-scorekeeper.md
        notes: >-
          For us the agent writes auth code, nobody writes tests/auth while the loop runs, and a human writes the
          contract. Tests still can't check judgment, though, so where a rubric is needed we use a second agent.
      - layout: code
        kicker: Monday morning
        title: The checker never trusts the maker
        lang: markdown
        code: |-
          ## Your role
          You are the Checker. Be strict, and
          honest in both directions.
          1. Read the loop contract.
          2. Read the diff, not the Maker's summary.
          3. Run the scorekeeper commands yourself.
          ## Checklist
          - Boundary: any file outside it changed?
            Tests or scoring touched? → auto Fail
          - Tests: would they fail if reverted?
          - Score: higher, equal or lower?
          ## Report
          Verdict: PASS / FAIL / PASS WITH NOTES
        bullets:
          - "A fresh agent with **no maker history**"
          - "Must be able to return **clean**, or it invents findings"
          - "ADK: `RefinerAgent` / `CriticAgent`; LangChain: `RubricMiddleware`"
        takeaway: A checker works from the diff with no maker history, runs the scorekeeper itself, and must be allowed to return clean.
        recall: What does a checker read, what does it run itself, and what happens if it cannot return clean?
        source: notes/03-the-scorekeeper.md
        notes: >-
          This is a prompt you can use this week. Read the diff, not the summary. Run the commands yourself. The most
          overlooked rule is honest in both directions: a checker that must find something will invent something.
          With an honest checker in place, the loop can start running longer.

  - title: What keeps it going
    summary: Six parts, added on failure · Memory on disk · Ralph · Triggers
    divider: true
    agenda: true
    notes: >-
      We have an honest loop that gets through one pass. Now it has to survive many: parallel attempts, full
      context, restarts, and starting with no one pressing go.
    slides:
      - layout: statement
        kicker: The problem
        title: Each pass makes the next one worse
        statement: A loop that runs for hours must forget on purpose and remember on disk.
        attribution: "Context rot, context anxiety and session end all have the same fix"
        takeaway: "Context rot, context anxiety and session end share one fix, which is that progress lives in files and not in the window."
        recall: What three walls does a long loop hit, and what one fix addresses all of them?
        source: notes/05-long-running-loops.md
        notes: >-
          Every pass adds tool output and errors to the transcript. Working memory degrades, the model starts wrapping
          up early, and then the session ends and the next one starts blank. Three different walls, one fix. Let's
          look at the parts that implement it, and when to add each one.
      - layout: table
        kicker: The inventory
        title: Six parts, each fixing one failure
        header: [Part, Fixes this failure]
        widths: [3, 7]
        rows:
          - [Automations, You are still the one pressing go]
          - [Worktrees, A bad try breaks main; parallel agents collide]
          - [Skills, The agent re-guesses your conventions every pass]
          - [Connectors / plugins, The loop can only edit local files]
          - [Sub-agents, Main context floods; the maker grades itself]
          - [Memory, Each restart forgets what was done]
        takeaway: Add a building block when you see the failure it fixes, and not before.
        recall: Name the six loop building blocks and the failure each one fixes.
        source: notes/04-building-blocks.md
        notes: >-
          Don't install all six. Each row names a failure, so wait for it. Our auth loop has no use for connectors
          until you want it to open a pull request. Memory arrives first, as we are about to see.
      - layout: flow
        kicker: One pass
        title: The whole loop in motion
        steps:
          - {label: Read memory, sub: where did I leave off}
          - {label: Make a worktree, sub: a safe place to try}
          - {label: One change, sub: with the right skill}
          - {label: Score it, sub: not the agent's claim}
          - {label: Save or roll back, sub: then update memory}
        loop: the next pass starts here
        bullets:
          - "A failed try costs one `git worktree remove`"
          - "Sub-agents: fresh context, one job, distilled return"
          - "Connectors start read-only: least privilege"
        takeaway: Each pass reads memory, tries one change somewhere disposable, is scored by the scorekeeper, and is saved or rolled back.
        recall: Walk through the steps of one full pass of a loop.
        source: notes/04-building-blocks.md
        notes: >-
          Now the parts fit together. The pass reads where we left off and makes a worktree. It loads a skill, makes
          one change, runs the tests, and saves or rolls back. One change per pass is what lets the score tell you
          what helped. What exactly does memory hold?
      - layout: table
        kicker: Worked example
        title: Five fields carry the auth loop across restarts
        header: [Field, Example]
        widths: [3, 7]
        highlight: [2]
        rows:
          - [Goal, "`All tests in tests/auth/ pass`"]
          - [Last score, "`41/47 passing`"]
          - [What was tried, "`Mocking the clock in test_expiry: no change`"]
          - [What is next, "`Check token refresh path in auth/session.py`"]
          - [Waiting for a human, "`Approve dropping the legacy cookie`"]
        takeaway: The field called what was tried earns its place, because without it a fresh pass reruns the attempt that failed an hour ago.
        recall: What five fields does loop memory need, and which one prevents repeated failures?
        source: notes/05-long-running-loops.md
        notes: >-
          This is what our loop's state file looks like at 41 of 47. It is short enough to load at every pass. The
          highlighted row is the one people leave out, and then a fresh agent cheerfully mocks the clock again.
      - layout: code
        kicker: The minimal loop
        title: The Ralph loop, with a ratchet
        lang: bash
        code: |-
          best=$(score)
          for ((i = 1; i <= MAX_ITERS; i++)); do
            past_deadline && exit 2       # clock
            $AGENT_CMD < "$PROMPT_FILE"   # fresh
            now=$(score)
            if worse; then                # undo
              git reset --hard; ((stall++))
            elif better; then             # keep
              git commit -qam "pass $i"
              best=$now; stall=0
            else ((stall++)); fi
            done_check && exit 0          # win
            ((stall >= STALL_LIMIT)) && exit 3
          done
          exit 1                     # cap != success
        bullets:
          - A fresh context on every pass
          - "Exits tell success **0**, cap **1**, clock **2**, stall **3** apart"
          - "Harnesses now ship it: stop hooks, `/goal`"
        takeaway: A Ralph loop restarts a fresh agent on every pass, and its exit codes keep success apart from cap, clock and stall.
        recall: What do the four exit codes in the Ralph loop distinguish, and why does it matter?
        source: notes/05-long-running-loops.md
        notes: >-
          Everything so far, in a shell script. Every pass is a new process, memory is the filesystem, and the score
          decides on commit or reset. Look at the exit codes: whatever runs this script can tell a win from a timeout.
          The note has the complete version.
      - layout: compare
        kicker: Two jobs
        title: One session plans, the rest pick one item
        emphasis: right
        left:
          title: Initializer (runs once)
          accent: "94A3B8"
          bullets:
            - Turns the task into files
            - "Feature list, progress log, scaffolding, `init` script"
            - Commits them
          tag: The plan on disk
        right:
          title: Worker (every session)
          bullets:
            - Reads the progress log and git history
            - "Picks **one** unfinished item, implements and tests it"
            - "Commits, updates the log, exits cleanly"
          tag: Leave the repo clean
        takeaway: Loops lean toward reset over compaction, since state is already on disk and the window can simply be cleared.
        recall: What is the difference between the initializer and worker sessions, and why do loops prefer reset over compaction?
        source: notes/05-long-running-loops.md
        notes: >-
          Larger jobs split in two. One session writes the plan to disk once. Every later session does one item and
          leaves. And because state already lives in files, clearing the window costs almost nothing. So far the loop
          runs until it finishes. Other work never finishes.
      - layout: compare
        kicker: Run again
        title: Run until done, or run on a timer
        emphasis: none
        left:
          title: Run-until-done
          bullets:
            - "Pass after pass, immediately"
            - Stops on the finish signal or a cap
            - Needs a precise done
          tag: "`/goal`"
        right:
          title: Timer
          bullets:
            - On an interval or cron
            - Never stops by itself; each run is short
            - "Must be cheap when there's nothing to do"
          tag: "`/loop 5m`, `/schedule`"
        takeaway: If the work has an end, run it until done, and if it is ongoing watching, put it on a timer.
        recall: What question decides between run-until-done and a timer?
        source: notes/06-triggers-and-schedules.md
        notes: >-
          One question decides this: does it have an end? Fixing the auth tests does, so that is a goal. Watching that
          the tests stay green doesn't, so that's a timer.
      - layout: table
        kicker: Monday morning
        title: An unattended trigger multiplies a run's cost
        header: [Trigger, Fires on, Example]
        widths: [1.6, 4, 4.4]
        rows:
          - [Manual, You, "Interactive work you're watching"]
          - [Event, "Sentry error, ticket, failing CI, Slack", Investigate the alert and open a PR]
          - [Schedule, The clock, "Nightly test-babysitting; 30-minute migration cycles"]
        lead: "Before turning one on: a per-run cap, a per-day cap, a no-op path that exits before the model, and alerts on spend."
        takeaway: "A trigger needs per-run and per-day caps, a no-op path that exits before the model, and alerts on spend, and events beat polling."
        recall: What four cost controls does an unattended trigger need before it goes on?
        source: notes/06-triggers-and-schedules.md
        notes: >-
          Oded Messer's skeptical point is worth hearing: much of this is automation rediscovered. What is new is that
          the thing on the cron is nondeterministic, so the scorekeeper and stop rules do the work. A cron on
          an unverifiable job only schedules unverified work. How much of this should you hand over?

  - title: How much to hand off
    summary: The autonomy ladder · The human's new job · Loops that edit loops
    divider: true
    agenda: true
    notes: >-
      Up to here the loop changes the code. This part asks two things: how far you should step back, and what
      happens when the loop starts editing its own procedure. The answer to both is verification.
    slides:
      - layout: statement
        kicker: The problem
        title: Handing off faster than you can verify
        statement: Earn each handoff with a verifier. Skipping rungs is how you get a doom loop.
        attribution: "Four rungs, each giving up one thing you used to do yourself (notes/07)"
        takeaway: Autonomy should grow one rung at a time, each earned with a verifier you trust for what that rung gives away.
        recall: What must you have before handing off the next piece of a loop's control?
        source: notes/07-autonomy-ladder.md
        notes: >-
          The temptation is to skip straight to a nightly job that opens pull requests. But each step away from the
          keyboard removes one way you were catching mistakes. So we go up a rung at a time.
      - layout: steps
        kicker: The ladder
        title: Four rungs, four things handed off
        axis: more handed off
        steps:
          - {title: Turn-based, n: "1", text: "tool approval within a turn. Where you learn how tasks fail"}
          - {title: "Goal-based (`/goal`)", n: "2", text: "the stop condition. Needs a measurable end state"}
          - {title: "Time-based (`/loop`)", n: "3", text: "the trigger, to a clock. Session-scoped, your permissions"}
          - {title: "Proactive (`/schedule`)", n: "4", accent: "D4621A", text: "trigger and session. Needs a verifier you trust unattended"}
        takeaway: The rungs hand off tool approval, the stop condition, the trigger to a clock, and finally the trigger and session.
        recall: What does each of the four rungs of the autonomy ladder hand off?
        source: notes/07-autonomy-ladder.md
        notes: >-
          Rung one is where you learn how the task fails, so don't skip it. Our auth loop reached rung two as soon as
          it had a measurable end state. Rung four, which runs without your session or attention, needs a verifier
          you trust while asleep. Why does each rung cost reliability?
      - layout: image
        kicker: The trade-off
        title: Each rung moves along a frontier
        image: ../sources/images/learning-langchain-fig8-1.png
        caption: "The agency-reliability frontier (Oshin & Campos, Learning LangChain, Fig. 8-1)"
        bullets:
          - "A chain: low agency, high reliability. An agent: the reverse"
          - "Engineering pushes the curve **outward**"
          - "Levers: streaming, structured output, human-in-the-loop, a mid-run input policy"
        takeaway: Climbing a rung trades reliability for agency, and streaming, structured output and human controls push that curve outward.
        recall: What is the agency-reliability frontier, and what can push it outward?
        source: notes/07-autonomy-ladder.md
        notes: >-
          Oshin and Campos draw this as a curve. Every point is the best choice for some application. Climbing moves you
          along it, while good engineering moves the curve itself. One of the levers is human control, and that means more
          than a yes or no.
      - layout: cards
        kicker: Human controls
        title: Approving each call is one control of six
        cards:
          - {title: Interrupt, body: Stop a running loop from outside.}
          - {title: Authorize, body: "Pause before chosen steps, usually tool calls, and wait."}
          - {title: Resume, body: Continue from the pause as if nothing happened.}
          - {title: Restart, body: "Send new input; pending steps cancel and the loop restarts with merged state."}
          - {title: Edit state, accent: "D4621A", body: "Change the saved state, then resume from the edit."}
          - {title: Fork, accent: "D4621A", body: Go back to any earlier checkpoint and run again from there.}
        takeaway: A loop that cannot be edited or forked mid-run pushes humans toward approving whatever is in front of them.
        recall: What six controls does a human need while a loop runs, and what do they all require?
        source: notes/07-autonomy-ladder.md
        notes: >-
          At rungs one and two you are still present, and approve or deny is a poor set of controls. Learning LangChain lists
          six, all needing a checkpointer and a thread ID. For a loop that took a wrong turn at pass nine, fork is the one that
          saves you redoing the rest.
      - layout: image
        kicker: The human side
        title: As the agent climbs, your job changes
        image: ../sources/images/building-applications-with-ai-agents-fig13-1.png
        caption: "Four human roles (Albada, Building Applications with AI Agents, Fig. 13-1)"
        bullets:
          - "**Executor:** reviews every output; needs tight feedback"
          - "**Reviewer:** spot-checks; needs dashboards and exception flags"
          - "**Collaborator:** sets priorities; needs a shared planning UI"
          - "**Governor:** sets policy and audits; needs logs and explainability"
        takeaway: As autonomy rises the human moves from executor to reviewer, collaborator and governor, and each role needs a different interface.
        recall: What four roles does a human move through as an agent gains autonomy?
        source: notes/07-autonomy-ladder.md
        notes: >-
          Albada adds the human half. As the agent climbs you stop reading every output and start setting policy. Each
          role needs its own interface, and a governor with no audit log isn't governing anything. Now for the case
          where the thing under review is the loop's own procedure.
      - layout: image
        kicker: The slow loop
        title: A second loop can edit the first
        image: ../sources/images/li-ai-agents-in-depth-fig9-1.svg
        caption: "Execute, record, form signals, generate candidate updates, verify, release (Li, 2026, Fig. 9-1, Apache-2.0)"
        bullets:
          - An evolve loop is a slower loop pointed at a faster one
          - "It rewrites files and leaves weights alone"
          - "Targets: contract, state, trigger logic, SOP steps"
          - "**No change needed** must be an explicit, successful outcome"
        takeaway: An evolve loop rewrites contract, state, triggers and procedure while the model stays fixed, and no change is a valid outcome.
        recall: What does an evolve loop edit, what does it leave fixed, and why must no change count as success?
        source: notes/08-self-improving-loops.md
        notes: >-
          Say our loop repeatedly misses the same kind of bug. The slow loop reads its traces and proposes an edit to
          its instructions. Agents default to doing something, so "no change needed" must count as success, or it will
          churn. But it needs a signal to learn from.
      - layout: code
        kicker: Worked example
        title: Verify the run before you learn from it
        lang: python
        code: |-
          def _promise_action(self, traj):
              ok = {c["name"]
                    for c in traj["tool_calls"]
                    if c["result"].get("success")}
              missing = [p for p in traj["promises"]
                         if p["required_tool"] not in ok]
              if missing:    # said it, never did it
                  return DimensionResult(
                      "promise_action_consistency",
                      "process_rules", FAIL, 0.0,
                      [f"turn {p['turn']}: {p['text']}"
                       for p in missing],  # evidence
                      confidence=1.0)
        bullets:
          - "Three layers: **outcome** and **process** in code, **quality** by rubric"
          - "False promise and privacy leak both average **0.571** but need different fixes"
        takeaway: Verification output should be structured by dimension, because a single 0.57 average points at no particular fix.
        recall: Why does a trajectory verifier return structured results and not a scalar?
        source: notes/08-self-improving-loops.md
        notes: >-
          From Li's chapter nine lab. This check compares what the agent said it would do with the tools that actually
          succeeded. Two very different failures average 0.571, one a false promise and one a privacy leak. A scalar would
          hide that, so the lesson needs evidence attached.
