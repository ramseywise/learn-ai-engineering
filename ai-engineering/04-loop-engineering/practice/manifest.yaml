# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/loop-scorekeeper"
    purpose: "TypeScript maker/scorekeeper loop where visible checks feed back, held-out checks stay hidden and checks are fingerprinted, ending for one of six named stop reasons across five scripted makers."
    demonstrates:
      - "notes/02-loop-shapes.md"
      - "notes/03-the-scorekeeper.md"
      - "notes/09-failure-modes-and-guardrails.md"
      - "notes/10-framework-bindings.md"
    pattern: loop
    language: typescript
    runs_offline: true
    verified_by: "cd loop-scorekeeper && npx --yes tsx test.ts"
    licence: course
  - path: "practice/loop-scorekeeper-py"
    purpose: "Python twin of the scorekeeper loop: same eight checks, five scripted makers and six stop reasons, with candidates run in a child process with a timeout."
    demonstrates:
      - "notes/02-loop-shapes.md"
      - "notes/03-the-scorekeeper.md"
      - "notes/09-failure-modes-and-guardrails.md"
      - "notes/10-framework-bindings.md"
    pattern: loop
    language: python
    runs_offline: true
    verified_by: "cd loop-scorekeeper-py && uv run test.py"
    licence: course
