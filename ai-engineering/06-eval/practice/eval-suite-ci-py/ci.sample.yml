# A sample, not active here. Copy to .github/workflows/eval.yml and adjust the paths.
# Without vars.EVAL_MODEL it runs the stub, which tests the pipeline and not your agent.
name: eval
on:
  pull_request:
    paths: # a README change should not trigger a model run
      - "ai-engineering/06-eval/practice/eval-suite-ci/*.json*"
      - "ai-engineering/06-eval/practice/eval-suite-ci-py/**"
jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engineering/06-eval/practice/eval-suite-ci-py
        shell: bash # with an explicit bash, GitHub sets pipefail, so `tee` cannot hide a failure
    env:
      MODEL: ${{ vars.EVAL_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run
        run: uv run --with anthropic run.py v1
      - name: Keep the results, whatever the gate says
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: ai-engineering/06-eval/practice/eval-suite-ci-py/results-v1.jsonl
      - name: Assert
        run: uv run gate.py v1 | tee report.txt
