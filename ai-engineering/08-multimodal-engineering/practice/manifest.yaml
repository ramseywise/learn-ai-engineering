# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/chartstyle.py"
    purpose: "Helper module holding the house matplotlib style (colours, rcParams, output folder) for this pillar's charts; not an example."
    demonstrates: []
    pattern: other
    language: python
    runs_offline: true
    verified_by: none
    licence: course
  - path: "practice/drawing_extraction_lab.py"
    purpose: "Generated engineering drawings read with a real OCR engine (RapidOCR), comparing whole-page OCR against crop-first extraction with typed fields, checks and review routing; no vision model is called."
    demonstrates:
      - "notes/02-document-understanding.md"
    pattern: other
    language: python
    runs_offline: true
    verified_by: "uv run drawing_extraction_lab.py --n 3"
    licence: course
  - path: "practice/invoice_pipeline.py"
    purpose: "Invoice pipeline over generated PDFs and scans with a text-layer extractor and an OCR extractor, validation checks, field F1 and cost per document; no vision-language model is called."
    demonstrates:
      - "notes/02-document-understanding.md"
    pattern: other
    language: python
    runs_offline: true
    verified_by: none
    verification_note: "Tried `uv run invoice_pipeline.py` in a temporary copy and it timed out after 300s; not confirmed."
    licence: course
  - path: "practice/multimodal_rag_lab.py"
    purpose: "Page retrieval on a synthetic corpus of patch vectors comparing text summaries, one vector per page, late interaction and pooling; no encoder or model runs."
    demonstrates:
      - "notes/03-multimodal-rag.md"
    pattern: retrieval
    language: python
    runs_offline: true
    verified_by: "uv run multimodal_rag_lab.py"
    licence: course
  - path: "practice/pair_eval_lab.py"
    purpose: "Scores four fake vision models under four test designs on generated invoice questions to show which shortcut each design exposes, using only the standard library."
    demonstrates:
      - "notes/07-evaluating-multimodal-systems.md"
    pattern: eval
    language: python
    runs_offline: true
    verified_by: "uv run pair_eval_lab.py"
    licence: course
  - path: "practice/vlm_finetune.py"
    purpose: "Helper module for vlm_finetune_lab.py: collator, LoRA setup, training loop and field accuracy; imports torch and is not run on its own."
    demonstrates:
      - "notes/02b-fine-tuning-a-vision-language-model.md"
    pattern: finetune
    language: python
    runs_offline: false
    verified_by: none
    licence: course
  - path: "practice/vlm_finetune_lab.py"
    purpose: "Fine-tunes SmolVLM-256M with LoRA to read generated invoices and scores field accuracy (downloads about 0.5 GB; about two and a half hours on an M4 Pro GPU)."
    demonstrates:
      - "notes/02b-fine-tuning-a-vision-language-model.md"
    pattern: finetune
    language: python
    runs_offline: false
    verified_by: none
    licence: course
  - path: "practice/vlm_invoices.py"
    purpose: "Generator of seeded synthetic invoice images with their ground-truth JSON, used by the VLM fine-tuning lab; imported, not run on its own."
    demonstrates:
      - "notes/02b-fine-tuning-a-vision-language-model.md"
    pattern: other
    language: python
    runs_offline: true
    verified_by: none
    licence: course
  - path: "practice/voice_stream_lab.py"
    purpose: "Voice agent real-time loop on synthetic audio samples: voice activity detection, endpointing and barge-in by task cancellation, with an optional off-by-default Whisper ASR path."
    demonstrates:
      - "notes/04-speech-and-voice-agents.md"
    pattern: other
    language: python
    runs_offline: true
    verified_by: "uv run voice_stream_lab.py"
    licence: course
  - path: "practice/voice_turn_lab.py"
    purpose: "Voice agent turn simulated without audio: latency budget as a distribution, barge-in with a tool in flight and word error rate, standard library only."
    demonstrates:
      - "notes/04-speech-and-voice-agents.md"
    pattern: other
    language: python
    runs_offline: true
    verified_by: "uv run voice_turn_lab.py"
    licence: course
