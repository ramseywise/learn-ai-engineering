# Lecture deck for ai-engineering/05-graph-engineering, notes 01-13.
# Build: make slides PILLAR=05-graph-engineering STRICT=1 PREVIEW=1
# Running examples: one review graph (thread review-42) for parts 1-3, the SEC filings graph
# from the Neo4j course for part 4, and a swarm writing to a shared graph for part 5.
deck:
  title: Graph Engineering
  subtitle: Which nodes exist, which transitions are permitted, what state they carry
  tagline: |-
    One review loop that outgrows itself: when to add a node, how to run the graph, and how it fails.
    Then the other kind of graph, and the point where the two meet.
  reference: "Notes: ai-engineering/05-graph-engineering"
  output: graph-engineering.pptx
  notes: >-
    Pillar five. The loop from last time is good at one job. Today we take a review loop, ask when it has
    truly outgrown itself, build the graph it needs, and then watch that graph fail in production. The second half
    turns to knowledge graphs, a different thing with the same name, and ends where the two join.
parts:
  - title: Do you need a graph at all
    summary: Loop or graph · Signals that justify a node · What fan-out costs
    divider: true
    agenda: true
    notes: >-
      We begin with the decision, because the most expensive mistake in this pillar is building a graph you did
      not need. By the end of this part you should be able to say no to one, with numbers.
    slides:
      - layout: statement
        kicker: The problem
        title: Our review loop keeps failing. Is it time for a graph?
        statement: Graph engineering is designing which nodes exist, which transitions are permitted, and what state they carry.
        attribution: "\"A loop is just a directed, cyclic graph.\" (LangChain, 3 years of LangGraph)"
        takeaway: A loop is already a directed cyclic graph, so moving to a graph means adding nodes and edges, each with a price.
        recall: Why is graph versus loop a difference of degree and not of kind?
        source: notes/01-graph-vs-loop.md
        notes: >-
          Picture a review loop. It drafts a change summary, checks it, and tries again. It keeps passing bad work,
          and someone on the team says we need a multi-agent graph. Before agreeing, notice what they are proposing.
          The loop is already a graph with one cycle. The real question is which extra nodes earn their cost.
      - layout: image
        kicker: Two shapes
        title: Workflows are graphs, and agents are loops inside them
        image: ../sources/images/langchain-langgraph-docs-workflows-vs-agent.png
        caption: LangGraph docs, "Workflows and agents", after Anthropic (2024)
        bullets:
          - "**Workflow:** predefined code paths"
          - "**Agent:** the model directs its own process"
          - Production graphs are mostly fixed shapes with **one or two agent nodes**
          - Production agents retry and revise, so they **need cycles**, which a DAG forbids
        takeaway: Graph engineering for agents means cyclic graphs, because retrying and revising need a way back.
        recall: Why does the Airflow-style DAG model break when you apply it to agents?
        source: notes/01-graph-vs-loop.md
        notes: >-
          On the left are the workflow shapes you have seen, on the right the agent loop. Most real systems put a
          couple of those loops inside a fixed shape. One lesson from LangChain matters here: an agent must go from A to B,
          find B failed, and come back. A DAG cannot say that. Anything that forbids cycles is a workflow engine, not an agent framework.
      - layout: table
        kicker: The test
        title: Five signals that justify a node
        lead: Start with a loop. Add a node only when one of these forces it.
        header: [Signal, Why the loop fails]
        rows:
          - [Distinct specialties, One agent carries each role's baggage into the next]
          - [Parallel fan-out and join, "A loop is sequential, so wall-clock cost is unnecessary"]
          - [Per-step model or tool, One agent enforces one model and one tool policy]
          - [Auditable control flow, Emergent loop paths are hard to reconstruct]
          - [Overloaded verifier, A dedicated reviewer removes criteria confusion]
        bold_first: true
        takeaway: Escalating to a graph is a cost you justify with a specific signal, and not a maturity level you graduate to.
        recall: Which five signals can justify adding a node to a loop?
        source: notes/01-graph-vs-loop.md
        notes: >-
          Run our review loop against this list. Does it need parallel work? Different models? If nothing applies, stop.
          And beware the name. Raieli and Iuculano's travel planner has four agents, but a controller calls them in a fixed order
          and no edge is conditional. That is a pipeline, and it is better for being one.
      - layout: code
        kicker: Worked example
        title: Split the verifier before you split the system
        lang: python
        code: |-
          # sketch: before, one call judges everything
          ok = llm_judge(draft, "correct, safe, complete?")

          # after: one check per criterion, in the same loop
          checks = {
              "tests":  run_tests(),            # code
              "schema": valid_schema(draft),    # code
              "safety": llm_judge(draft, RULE), # model
          }
          failing = [k for k, ok in checks.items()
                     if not ok]
        bullets:
          - One check judging four things **does all four badly**
          - Turn what you can into code
          - Measure again; if the pass rate recovers, **ship the loop**
          - If one criterion still fails, it has earned its own node
        takeaway: The most common "we need a graph" is really an overloaded verifier, which you can split inside the existing loop.
        recall: What should you try before adding nodes when a loop keeps passing bad work?
        source: notes/06-when-not-to-build-a-graph.md
        notes: >-
          This is what I would do with our review loop first. One judge is being asked about correctness, style, safety
          and completeness at once. Split it, make the mechanical parts code, and measure. The sketch is a shape and not a
          library. Either the loop recovers, or you now know exactly which node to add.
      - layout: image
        kicker: The evidence
        title: Adding agents averaged out to nothing
        image: ../sources/images/kim-2025-scaling-agent-systems-fig2.png
        caption: Kim et al., Towards a Science of Scaling Agent Systems (2025), Fig. 2
        bullets:
          - "260 configurations, six benchmarks, compute matched"
          - "Finance Agent: centralized team **+80.8%**; PlanCraft: every variant lost **39–70%**"
          - "Mean change **−0.3%**, 95% CI −58.7% to +77.2%"
          - "Above about **45%** single-agent score, more agents had negative returns"
        takeaway: Across 260 controlled configurations the mean multi-agent gain was −0.3%, so the task shape decides.
        recall: In Kim et al., what separated the benchmark that gained from the one that lost?
        source: notes/06-when-not-to-build-a-graph.md
        notes: >-
          Kim and colleagues matched compute and ran 260 configurations. Finance Agent splits into parallel subtasks, and a centralized
          team scored 80.8 percent higher. In PlanCraft each step constrains the next, and every variant lost. The mean is close to zero
          with an enormous interval. So check how your task decomposes, and whether a single agent already does well.
      - layout: cards
        kicker: The bill
        title: Fan-out costs tokens whether it helps or not
        cards:
          - title: Anthropic's research system
            body: Agents use about **4×** a chat's tokens; multi-agent systems about **15×**
          - title: Controlled runs
            body: Kim et al. saw **1.6–6.2×** a single agent's tokens at matched performance
          - title: Vendor estimate
            body: About **3×** tokens per cycle, break-even near a **50%** pass rate (flowtivity); test it
          - title: Poor fit
            accent: D4621A
            body: Every agent needs the same context, or the agents depend on each other
        takeaway: Fan-out pays only for high-value work whose branches are truly independent, so measure your own break-even.
        recall: When does a fan-out graph fail to pay for its extra tokens?
        source: notes/06-when-not-to-build-a-graph.md
        notes: >-
          Three sources and one shape. The first figure is first party, the second controlled, the third a vendor estimate, so treat
          that one as something to test. The logic is sound: when most cycles fail and get redone, you pay fan-out for work you throw away.
          Run the same tasks both ways and record tokens, wall-clock time and pass rate.
      - layout: steps
        kicker: Monday morning
        title: If you do need one, grow it in this order
        axis: adopt incrementally
        steps:
          - {title: Bottleneck, text: "Write down the workflow and where it stalls"}
          - {title: Real edges, text: "Mark each step: reads the previous output, or incidental"}
          - {title: 3–5 nodes, text: "Sketch a few. Not twelve"}
          - {title: Baseline, text: "Loop against graph: tokens, wall-clock, pass rate"}
          - {title: One at a time, text: "Each node justified by a signal", accent: D4621A}
        takeaway: Adopt a graph by finding real edges, sketching 3 to 5 nodes, and adding nodes one at a time against a baseline.
        recall: What is the adoption order for moving a loop to a graph?
        source: notes/06-when-not-to-build-a-graph.md
        notes: >-
          Say our review loop did earn a graph, because it needs one reviewer per changed file. This order keeps you honest. Every node
          brings a prompt to maintain, state to synchronise and another place a wrong answer could come from. Next we build the
          smallest version, and see what each primitive buys.

  - title: Building the first graph
    summary: Nodes and edges · State and reducers · Pausing for a human
    divider: true
    agenda: true
    notes: >-
      Now we build it. Three problems drive this part. The checker must stay independent. Many reviewers must write
      at once without losing work. And the run must be able to stop, wait for a person and come back.
    slides:
      - layout: statement
        kicker: The problem
        title: A loop can't do what our reviewer now needs
        statement: We need an independent checker, one reviewer per changed file, and a human before publish. A single loop expresses none of them cleanly.
        takeaway: A graph earns its place when work needs independent checking, parallel workers or a pause, which one loop can't express.
        recall: Which three needs push the review example from a loop to a graph?
        source: notes/02-graph-primitives.md
        notes: >-
          These three needs set the agenda. The checker gives us nodes and edges. The per-file reviewers give us state and reducers.
          The human before publish gives us checkpoints. We will add them one at a time, to the same review graph.
      - layout: image
        kicker: Nodes
        title: Spend agency per node, as if it costs money
        image: ../sources/images/learning-langchain-fig5-1.png
        caption: Oshin & Campos, Learning LangChain (O'Reilly, 2025), Fig. 5-1
        bullets:
          - "**Code:** parsing, validation, API calls"
          - "**Router or one LLM call:** classify, summarise, draft"
          - "**Agent:** open-ended reasoning, many variable calls"
          - "**Human checkpoint:** approval, paid for in latency"
        takeaway: Use code where you can, one LLM call where you must, and an agent only where the path is unknown.
        recall: How do you decide the kind of each node in a graph?
        source: notes/02-graph-primitives.md
        notes: >-
          The figure orders architectures by who decides: the output, the next step, the available steps. Moving down gives the model
          more freedom and costs you predictability. In our review graph, parsing the diff is code, summarising a file
          is one call, and almost nothing needs to be a full agent.
      - layout: code
        kicker: Edges
        title: The whole program fits on a slide
        lang: python
        code: |-
          builder = StateGraph(MessagesState)
          builder.add_node("node_a", node_a)
          builder.add_node("node_b", node_b)
          builder.add_edge(START, "node_a")
          builder.add_conditional_edges("node_a", router)
          builder.add_edge("node_b", "node_a")  # cycle
          graph = builder.compile()

          def router(state) -> str:
              # ordinary code over state
              if needs_more(state):
                  return "node_b"
              return END
        bullets:
          - "**Nodes** read state and return only changed keys"
          - "**The router** is plain code naming the next node"
          - "**Conditional edges** give branches, gates, cycles and early exit"
        takeaway: A graph program is nodes that return changed keys, plus routers that are ordinary code choosing the next node.
        recall: What does a router return, and what do nodes return?
        source: notes/02-graph-primitives.md
        notes: >-
          Nothing here is an LLM until you put one in a node. The router is a plain function. That matters, since routing you can read is
          routing you can test. The last edge makes the cycle, and the rest of this part fills in what state carries.
      - layout: flow
        kicker: The first shape
        title: The highest-yield first graph is generate, then verify
        steps:
          - {label: Generate, sub: produces a draft}
          - {label: Verify, sub: "tests, schema, rubric"}
          - {label: Done, sub: passes or attempts exhausted}
        loop: back-edge with the critique, bounded by an attempt counter
        bullets:
          - The verifier sees the task and the output, **never the generator's reasoning**
          - The back-edge carries the critique into the next attempt
        takeaway: A verifier that sees only the task and the output stays independent, and an attempt counter bounds the back-edge.
        recall: What must the verifier not see, and what limits the cycle?
        source: notes/02-graph-primitives.md
        notes: >-
          This is where our review graph starts: two nodes and a bounded back-edge. Keep two things straight. The critique travels
          back to the generator, but the reasoning never travels forward to the verifier. If it did, the verifier would inherit the
          framing and find the argument convincing.
      - layout: code
        kicker: State
        title: Every key has one writer or a reducer
        lang: python
        code: |-
          class ReviewState(TypedDict):
              task: str     # set once, read by all
              draft: str    # one writer: generator
              findings: Annotated[list[str],
                                  operator.add]
                            # many writers: reducer
              attempts: int # the bound on the cycle
        bullets:
          - "`operator.add` concatenates parallel writes"
          - Custom reducers can dedupe
          - "`attempts` lives in state so the router can bound the cycle"
        takeaway: Decide up front who writes each state key, and give any key with several writers a reducer.
        recall: What two options make a shared state key safe?
        source: notes/03-state-and-reducers.md
        notes: >-
          State is what the nodes coordinate through, so the type is the design. Read this class as a writing policy. The task is set once.
          The draft belongs to the generator. Findings have many writers, so they need a reducer. And the counter is here
          because a router can only read what is in state.
      - layout: image
        kicker: What breaks
        title: Parallel writes without a reducer fail
        image: ../sources/images/langchain-langgraph-docs-parallel-super-step.png
        caption: LangGraph docs (LangChain), via sources/langgraph_extended.pptx
        bullets:
          - Branches A and B run in **one super-step**
          - No checkpoint falls between them
          - Same key, no reducer gives **`InvalidUpdateError`**
          - Outside LangGraph the same race silently loses work
        takeaway: Branches in one super-step that write one key with no reducer raise an error in LangGraph and lose work elsewhere.
        recall: What happens when two parallel branches write one key with no reducer?
        source: notes/03-state-and-reducers.md
        notes: >-
          With a reducer, the checkpoint in the figure holds both writes merged before C runs. Without one, LangGraph raises an error and
          you are lucky, because you find out. A hand-rolled system has the same race and no error. You just lose a reviewer's findings
          on the occasional run, and nobody notices.
      - layout: code
        kicker: Fan-out
        title: One reviewer per changed file, decided at runtime
        lang: python
        code: |-
          def fan_out(state) -> list[Send]:
              return [Send("review_file",
                           {"path": p,
                            "task": state["task"]})
                      for p in state["changed_files"]]

          builder.add_conditional_edges(
              "plan", fan_out, ["review_file"])
          builder.add_edge("review_file", "synthesize")
        bullets:
          - Each `Send` carries its own private input
          - Results merge through the reducer
          - "**Cap N**: unbounded fan-out is a cost bug"
        takeaway: To tell a real edge from an incidental one, ask whether the next step reads the previous output. If not, fan out.
        recall: What is the true-dependency test for deciding whether steps can run in parallel?
        source: notes/03-state-and-reducers.md
        notes: >-
          We do not know how many files changed until the run begins, so static edges cannot express this. Send decides at runtime. Files do
          not read each other's reviews, so those edges were incidental and can fan out. The synthesis does read them, so that edge is real.
      - layout: image
        kicker: Pausing
        title: Checkpoints give you pause, resume and time travel
        image: ../sources/images/langchain-langgraph-docs-checkpoints-and-threads.png
        caption: LangGraph docs, persistence (LangChain), via sources/langgraph_extended.pptx
        bullets:
          - A **checkpoint** after every super-step
          - A **thread** collects them under one `thread_id`
          - Human-in-the-loop, crash resume and time travel share one mechanism
        takeaway: Saving state after every super-step gives one mechanism for human approval, crash recovery and time travel.
        recall: What single mechanism underlies human-in-the-loop, resume and time travel?
        source: notes/04-durable-execution-and-interrupts.md
        notes: >-
          A loop lives in a call stack, so when the process dies, the state dies with it. Writing state out after each super-step solves
          three problems at once. Choose the thread ID deliberately, because it decides what counts as the same conversation. Ours is review-42.
      - layout: code
        kicker: Worked example
        title: Publishing waits for a person
        lang: python
        code: |-
          graph = builder.compile(checkpointer=saver)
          config = {"configurable":
                    {"thread_id": "review-42"}}

          def publish(state):
              decision = interrupt(
                  {"draft": state["draft"]})
              if decision != "approve":
                  return {"status": "rejected"}
              send_to_cms(state["draft"])  # after
              return {"status": "published"}

          graph.invoke({"task": "..."}, config)  # pauses
          graph.invoke(Command(resume="approve"), config)
        bullets:
          - "`interrupt()` passes the human what they need"
          - "Gotcha: the node **reruns from line 1** on resume"
          - So keep side effects **after** the interrupt
          - "`interrupt_before/after` are for debugging"
        takeaway: On resume a node reruns from its first line, so any side effect belongs after the interrupt.
        recall: Where must a side effect sit relative to interrupt(), and why?
        source: notes/04-durable-execution-and-interrupts.md
        notes: >-
          This is the last piece of our review graph. The first invoke pauses inside publish. The second one, perhaps a day later, resumes it.
          The trap is that resume does not continue from the interrupt line. It runs the node again, so a send placed
          above the interrupt would send twice. Put the interrupt inside a tool and the gate travels with the tool.
      - layout: table
        kicker: Monday morning
        title: Gate the edges where consequence concentrates
        lead: "\"Human approval checkpoints ... at exactly the edges where consequence concentrates.\" (TrueFoundry)"
        header: [Gate before, Why]
        rows:
          - ["Irreversible actions: send, pay, delete, deploy", "Can't be undone, so check first"]
          - ["Crossing a trust boundary: external API, other tenant", Someone else bears the cost]
          - [Low-confidence router decisions, "Cheap for a human, expensive to mis-route"]
          - ["After the plan, before the build (n8n)", The plan is the cheapest thing to correct]
        takeaway: A gate on every node trains people to approve without reading, so gate only where consequence concentrates.
        recall: Which four places in a graph deserve a human approval gate?
        source: notes/04-durable-execution-and-interrupts.md
        notes: >-
          The first graph is now complete: generate, verify, one reviewer per file, a gate before publish. It has one gate, because of what too
          many gates do to the humans behind them. Look through your own graph on Monday, and find the single edge you could not take back.

  - title: Running it in production
    summary: Topologies · Who adds information · Failures · Who pays
    divider: true
    agenda: true
    notes: >-
      Our graph now works in a demo. This part is about what happens next: more shapes to choose from, a harder test for
      adding agents, the failures only graphs have, and how to find out what a run actually did.
    slides:
      - layout: statement
        kicker: The problem
        title: Fifty nodes ran and one broke production. Which?
        statement: A graph run can spawn fifty nodes, each calling models and tools. Without attribution you can't say which one spent the money or made the decision.
        takeaway: Graphs spread cost and decisions across many nodes, so every model and tool call has to carry its node's identity.
        recall: What basic questions become unanswerable in a graph without attribution?
        source: notes/08-governance-and-production.md
        notes: >-
          A single loop has one identity and one bill. A graph has neither. With Send and conditional edges, the graph that ran is not even
          the graph you drew. We will come back to attribution at the end of this part, once we have seen the failures that make it matter.
      - layout: table
        kicker: The catalogue
        title: Five topologies recur
        header: [Pattern, Shape, Use when, Fails by]
        widths: [2, 3, 3, 3]
        rows:
          - [Generate-then-verify, "produce, check, back-edge", Produce and check split cleanly, "Checker sees producer's reasoning"]
          - [Supervisor, "router, specialists, router", Work arrives in several kinds, "Mis-routing, bottleneck"]
          - [Fan-out and fan-in, "split, N workers, merge", Many independent items, "Missing reducer, correlated errors"]
          - [Hierarchical, subgraph as one node, Reused or team-owned sub-topology, Failures hidden inside]
          - [Handoff, status key read by an edge, "Agents shouldn't know each other", Status values drift]
        bold_first: true
        takeaway: Five shapes cover most graphs, and each has a named failure, so choosing a shape also chooses what to watch.
        recall: Name the five recurring topologies and how the supervisor pattern fails.
        source: notes/05-topology-patterns.md
        notes: >-
          Our review graph already combines two of these, generate-then-verify and fan-out. Read the last column most carefully. You can also
          search for a topology: Meta Agent Search in ADAS writes agents as code and scores them, but its evaluator runs model-written code in your process, so sandbox it.
      - layout: image
        kicker: A design dimension
        title: Should the agents share a context?
        image: ../sources/images/li-ai-agents-in-depth-fig10-1.svg
        caption: Li, AI Agents in Depth, ch. 10, Fig. 10-1 (Apache-2.0)
        bullets:
          - "**Shared:** one trajectory, like threads; nothing lost, everything accumulates"
          - "**Isolated:** own window, like processes; only what is passed"
          - Isolation keeps a verifier independent
          - Pass file paths, **not file contents**
        takeaway: Isolate contexts if the cumulative trajectory would pass about half the window; share if no information can be lost.
        recall: What rule of thumb chooses between shared and isolated context?
        source: notes/05-topology-patterns.md
        notes: >-
          Li's analogy is threads against processes. Our verifier must be isolated by design. Our per-file reviewers can be too, since each needs only
          a brief. Agents pass meaning and not bytes, and a message can be misread, so every interface needs a contract the receiver can check.
      - layout: compare
        kicker: A harder test
        title: A second agent helps only if it adds information
        emphasis: right
        left:
          title: Same information
          bullets:
            - Self-review with no tools is often neutral or harmful
            - "Debate among copies: a single agent was best or tied above 100 thinking tokens (Tran & Kiela)"
          tag: Recombining adds nothing
        right:
          title: New information
          bullets:
            - Execution, tool or visual feedback
            - "WebGen-Agent screenshots took Claude 3.5 Sonnet from **26.4% to 51.9%**"
            - A reviewer earns its node when it can **run something**
          tag: Tests, browser, search
        takeaway: A reviewer that only rereads text is the same model a second time; it earns a node when it can run something.
        recall: What did screenshot feedback do in WebGen-Agent, and why did debate not do the same?
        source: notes/05-topology-patterns.md
        notes: >-
          This is the data-processing argument: recombining the same information cannot add any. It has a boundary. With 70 percent of the context
          masked, a sequential pipeline beat the single agent, which is a context problem and not new information. So give our reviewer the test runner.
      - layout: table
        kicker: What breaks first
        title: Mechanical failures come from the wiring
        header: [Failure, Detect, Fix]
        widths: [2, 4, 4]
        rows:
          - [Infinite cycle, "`GraphRecursionError` (`recursion_limit`, default **25**)", "Attempt counter in state, bound per node"]
          - [Deadlock, Run idle at a join, Explicit join inputs; error nodes still write the key]
          - [Race on shared state, "`InvalidUpdateError`, or silent loss", A reducer or one writer per key]
          - [Unbounded fan-out, "Token spend spikes, rate limits", Cap N; budget per run and per node]
          - [Mis-routing, Route distribution in traces, Test the router as a classifier]
          - [File-space collision, Diffs match no single worker, One worktree per worker]
        bold_first: true
        takeaway: Wiring failures such as cycles, deadlocks and races have mechanical detectors and fixes, if you let the framework report them.
        recall: How do you detect and fix a deadlock in a graph?
        source: notes/07-failure-modes-at-scale.md
        notes: >-
          These are the friendly failures, since something visibly goes wrong. Our review graph could hit several. A reviewer that errors without
          writing its key leaves the join waiting forever, so route errors to a node that still writes. The harder ones are coming.
      - layout: code
        kicker: Worked example
        title: Bounds belong in the wiring
        lang: python
        code: |-
          # sketch: three bounds on the review graph
          MAX_ATTEMPTS, MAX_FILES = 3, 20

          def route_after_verify(state) -> str:
              if state["passed"]:
                  return "publish"
              if state["attempts"] >= MAX_ATTEMPTS:
                  return "escalate"
              return "generate"

          def fan_out(state) -> list[Send]:
              files = state["changed_files"][:MAX_FILES]
              return [Send("review_file", {"path": p})
                      for p in files]

          graph.invoke(inputs, {"recursion_limit": 40})
        bullets:
          - Every back-edge has a counter
          - Every `Send` has a cap on N
          - "`recursion_limit` is set deliberately"
          - The limits here are illustrative
        takeaway: Before running unattended, give every back-edge a counter, every Send a cap, and recursion_limit a chosen value.
        recall: Which three bounds does the pre-flight check require on a graph's wiring?
        source: notes/07-failure-modes-at-scale.md
        notes: >-
          This is the pre-flight check as code. The numbers are mine, chosen for illustration, so pick yours from your traces. Notice the escalate route.
          When attempts run out, the honest outcome is to say so and not to publish the last draft.
      - layout: cards
        kicker: What breaks at scale
        title: Swarms fail in ways single agents don't
        cards:
          - title: Correlated errors
            body: Shared model, prompt and index, so N agreeing workers are not N independent ones
          - title: Byzantine faults
            body: Agents fail by being confidently wrong; timeouts can't catch that
          - title: Semantic conflicts
            body: Both writes succeed and the result is still wrong; reducers don't help
          - title: Cascading amplification
            body: "Merged unchecked, errors grew **17.2×**; an orchestrator held them to **4.4×** (Kim et al.)"
          - title: MAST
            body: "**14** failure modes in three groups, κ = **0.88**"
          - title: Structure beats wording
            accent: D4621A
            body: Better prompts and roles improved ChatDev by only **+15.6%**
        takeaway: Most multi-agent failures are structural, so fix topology and verification before you reword prompts.
        recall: Why don't timeouts and retries catch most agent failures?
        source: notes/07-failure-modes-at-scale.md
        notes: >-
          In the book's translation lab the glossary agent mistranslated reasoning. The translator applied it faithfully, and the proofreader,
          checking against the glossary, saw perfect consistency. Every stage did its job and the error survived all of them. Hence the fix: a reviewer who reads the output against the source.
      - layout: compare
        kicker: What breaks last
        title: Coupled loops drift together, so keep an anchor
        emphasis: right
        left:
          title: Control failures
          bullets:
            - "**Goodhart:** the metric detaches from its meaning"
            - "**Upward blindness:** a loop can't question its target"
            - "**Inter-loop conflict:** loops fight each other"
            - "**Measurement decay:** the gauge gets tuned"
        right:
          title: The answer to each
          bullets:
            - Paired metrics, with a counter-metric
            - Owned references, held by slower loops
            - Separated cadences, where fast loops escalate
            - "**Frozen nodes:** anchors the graph can't edit"
          tag: Held-out tests, banked revenue
        takeaway: Without an anchor the graph can't edit, it stays perfectly self-consistent while drifting far from reality.
        recall: What is an anchor, and what happens to a graph that has none?
        source: notes/07-failure-modes-at-scale.md
        notes: >-
          This reading comes from Eigent, a vendor blog, though each failure has an older name in control theory. The danger is that nothing looks wrong:
          every loop agrees with every other loop, and they are all wrong. An anchor made tunable is an anchor that will eventually be tuned.
      - layout: cards
        kicker: Back to attribution
        title: Operate the graph, don't just demo it
        cards:
          - title: Identity
            bullets:
              - "`graph_id`: topology and version"
              - "`run_id` / `thread_id`: one execution"
              - "`node_id`: cost and errors per node"
          - title: Budgets
            bullets:
              - "**Per node:** one node looping"
              - "**Per run:** a whole run going wrong"
              - "**Per tenant:** one customer draining the pool"
          - title: Records
            accent: 0EA5C9
            bullets:
              - The actual runtime graph, not the declared one
              - "Model calls through a named alias, so rollback is a config change"
        takeaway: Carry graph, run and node IDs on every call, and budget per node, per run and per tenant.
        recall: At which three levels do you budget a graph, and which ID makes the first possible?
        source: notes/08-governance-and-production.md
        notes: >-
          This answers the opening question. With node_id on every call you learn why a run was expensive, and not just that it was. The tenant
          level is the one a run-scoped framework can't enforce alone, since the limit has to hold across concurrent runs, so it usually lives in a gateway.
      - layout: table
        kicker: Case study
        title: "n8n's workflow builder: every loop has a bound"
        lead: "From a third-party teardown (Rathod), not n8n itself. Check the repository before relying on the constants."
        header: [Node, Role, Bound]
        widths: [2, 5, 2]
        rows:
          - [Supervisor, Routes each message to a subgraph, "-"]
          - [Discovery, Explores the node registry, "**50** iterations"]
          - [Planner, "Builds a plan, then **pauses for approval**", "-"]
          - [Builder, Executes tool calls, "**100** per session"]
          - [Responder, Renders the user-facing reply, "-"]
          - [Parameter Updater, Surgical edits to node parameters, "-"]
        bold_first: true
        takeaway: "n8n's reported design: per-node bounds, one gate after planning, and a 30K cap on the artifact under construction."
        recall: Where does n8n's builder place its single approval gate, and why there?
        source: notes/08-governance-and-production.md
        notes: >-
          Everything we covered appears here. Specialisation is prompt-only, on the same model. Compaction triggers at 150K in a 200K window, and the workflow itself is capped
          at 30K tokens, so the agent can't fill its context with the thing it is editing. That closes the execution graph. Now, the other graph.

  - title: The other kind of graph
    summary: Knowledge graphs · Building one with LLMs · Retrieval and text-to-Cypher
    divider: true
    agenda: true
    notes: >-
      New problem, new example. We leave the review graph and turn to SEC filings from the Neo4j course. Here a graph is
      data and not execution. We will see why vector search needs it, how to build one you can trust, and how to query it.
    slides:
      - layout: statement
        kicker: The problem
        title: The top vector hits didn't mention the entity
        statement: "\"How is Lauritsen related to cyclotron research?\" The top three chunks scored 0.906, 0.903 and 0.902. Only the first mentioned Lauritsen."
        attribution: KG & LLMs in Action, ch. 13
        takeaway: Embeddings encode overall meaning and don't guarantee a named entity is present, so high scores can miss the entity.
        recall: What does the Lauritsen example show about cosine similarity and named entities?
        source: notes/11-kg-rag-and-text-to-cypher.md
        notes: >-
          Three near-identical scores, and two of those chunks never name the person we asked about. Vector retrieval is doing its job. It finds
          text with similar overall meaning. Facts split across chunks, aggregate questions and exact entities all need something else.
      - layout: table
        kicker: A warning about the word
        title: Two things are called "graph"
        header: ["", "Agent graph", "Knowledge graph"]
        rows:
          - [Nodes are, Units of computation, Entities]
          - [Edges are, Permitted transitions, Typed relationships]
          - [The graph is, Execution topology, Data structure for retrieval]
          - [Runtime concern, "Routing, state, cost", "Traversal, entity resolution"]
        bold_first: true
        takeaway: An agent graph is execution topology and a knowledge graph is a data structure; they share only a name until agents share memory.
        recall: What are nodes and edges in an agent graph, and in a knowledge graph?
        source: notes/01-graph-vs-loop.md
        notes: >-
          Everything so far was the left column. From here on we are in the right column, so a node is an entity like a company or a fund manager.
          The two meet in the final part of the talk, where a knowledge graph becomes the state that agents coordinate through.
      - layout: image
        kicker: The data model
        title: Entities, and relationships that carry facts
        image: ../sources/images/kollegger-knowledge-graphs-for-rag-relationship-properties.png
        caption: Knowledge Graphs for RAG, DeepLearning.AI and Neo4j (Kollegger, 2024)
        bullets:
          - "**Nodes** carry labels and properties"
          - "**Relationships** are typed and directed, and carry properties too"
          - "**LPG** (Neo4j): properties on edges, Cypher"
          - "**RDF:** triples, SPARQL, ontologies"
        takeaway: A graph whose edges are all RELATED_TO says that things connect but not how, so the edge type holds the knowledge.
        recall: Why does naming edges by meaning matter more than having edges?
        source: notes/09-kg-fundamentals-and-cypher.md
        notes: >-
          Evidence often belongs on the edge. In the book's rare-disease graph, each disease and phenotype link carries its reference and frequency as properties,
          and that single fact is why the chapter picks a property graph over RDF. Type 1 diabetes keeps two IDs, disease and phenotype, because its role depends on context.
      - layout: code
        kicker: The query language
        title: Cypher lets you draw the pattern you want
        lang: cypher
        code: |-
          // co-actors of a person
          MATCH (p:Person {name: $name})
                -[:ACTED_IN]->(m:Movie)
                <-[:ACTED_IN]-(co:Person)
          RETURN co.name, collect(m.title) AS movies

          // idempotent load: constraint + MERGE
          CREATE CONSTRAINT unique_chunk IF NOT EXISTS
            FOR (c:Chunk) REQUIRE c.chunkId IS UNIQUE;
          MERGE (c:Chunk {chunkId: $id})
            ON CREATE SET c.text = $text
        bullets:
          - "`()` nodes, `-[]->` relationships"
          - "**MERGE** matches or creates"
          - A uniqueness constraint makes reloads safe
        takeaway: Cypher draws graph patterns in ASCII, and MERGE with a uniqueness constraint makes data loads idempotent.
        recall: What makes a Cypher load safe to run twice?
        source: notes/09-kg-fundamentals-and-cypher.md
        notes: >-
          Read the first query aloud and you have read the picture: a person, acted in, a movie, acted in by someone else. The second half matters more for
          us, because the pipeline we build next will reload data many times, and it must not create duplicates when it does.
      - layout: flow
        kicker: Building one
        title: From text to a graph you can trust
        steps:
          - {label: Chunk, sub: "keep doc, page, offset"}
          - {label: Extract, sub: small model gives mentions}
          - {label: Resolve, sub: stronger model and graph signals}
          - {label: Assemble, sub: MERGE with provenance}
          - {label: Evaluate, sub: "false-merge rate blocks the load", accent: D4621A}
        bullets:
          - "An n-hop answer is right with probability pⁿ: **85%** per hop is **44%** over five hops"
          - That is arithmetic and not a measurement, but errors compound with depth
          - Use the model only where judgement is needed
        takeaway: Errors compound per hop, so 85% per hop gives 44% over five, which makes entity resolution the load-bearing step.
        recall: Why is entity resolution the load-bearing step in building a knowledge graph?
        source: notes/10-building-kgs-with-llms.md
        notes: >-
          Do the arithmetic first, and the pipeline explains itself. If each hop can be wrong, deep traversal multiplies the risk. Most per-hop errors are resolution errors: two entities merged,
          or one split. Hence the separate stage, the stronger model, and an evaluation that can block the load.
      - layout: code
        kicker: Worked example
        title: Keep mentions, and never merge at extraction time
        lang: cypher
        code: |-
          // raw mentions
          (:Document)-[:HAS_PAGE]->(:Page)
            -[:MENTIONS]->(:Entity)
          // resolution evidence
          (:Entity)-[:META_SIMILAR]->(:Entity)
          // the KG proper
          (:Entity)-[:RESOLVES_TO]->(:Canonical)

          // graph-based resolution: weakly connected
          // components over META_SIMILAR, one canonical
        bullets:
          - The metagraph keeps resolution **reversible**
          - Weight **false merges** above missed merges
          - A high compression ratio rewards over-merging
        takeaway: Storing mentions and resolution evidence separately keeps merges reversible, and a false merge corrupts every path through it.
        recall: Why is a high compression ratio a misleading resolution metric?
        source: notes/10-building-kgs-with-llms.md
        notes: >-
          This schema has three layers. Mentions record what the text said, evidence records why two mentions might be the same, and canonicals are the current
          belief. If a merge turns out wrong, you undo the last layer and lose nothing. A merge in place has no such exit.
      - layout: image
        kicker: The course's graph
        title: Extract, enhance, expand
        image: ../sources/images/kollegger-knowledge-graphs-for-rag-extract-enhance-expand.png
        caption: Knowledge Graphs for RAG, DeepLearning.AI and Neo4j (Kollegger, 2024)
        bullets:
          - "**Extract:** 10-K text into `Chunk` nodes with embeddings"
          - "**Enhance:** `NEXT` and `PART_OF` add document structure"
          - "**Expand:** fuse Form 13 managers and holdings"
          - One `OWNS_STOCK_IN` edge **per quarter**
        takeaway: Start with a minimum viable graph, add document structure, then fuse structured data onto the same entities.
        recall: What does each of the extract, enhance and expand stages add to the SEC graph?
        source: notes/10-building-kgs-with-llms.md
        notes: >-
          This is our SEC graph. Notice the order. Text first, because it is what you can search. Then structure, so chunks know their neighbours. Then a second source joined by key,
          where a manager owns stock in a company. The quarter sits on the relationship key, so each quarter gets its own edge.
      - layout: cards
        kicker: The evidence
        title: What GraphRAG actually showed
        cards:
          - title: Comprehensiveness
            body: Win rates **72–83%** (podcasts), **72–80%** (news)
          - title: Diversity
            body: Win rates **75–82%** and **62–71%**
          - title: Directness
            accent: D4621A
            body: "**Vector RAG wins**, with more concise answers"
          - title: The caveat
            accent: 0EA5C9
            body: LLM judge, global sensemaking questions, corpora of about 1M tokens
        takeaway: GraphRAG's community summaries help whole-corpus questions, which falls short of showing that graphs beat vectors.
        recall: What did the GraphRAG paper's evaluation measure, and who judged it?
        source: notes/11-kg-rag-and-text-to-cypher.md
        notes: >-
          Edge and colleagues at Microsoft Research pre-summarise communities in an entity graph. The judge was an LLM, with no ground truth accuracy. You may also meet a 53.4 versus 42.9 figure
          for multi-hop accuracy. That is a vendor post with no dataset or method, so do not quote it. Write your own test set.
      - layout: table
        kicker: Choosing
        title: Five ways to retrieve, tried in order
        header: [Mode, Use when, Fails when]
        widths: [2, 4, 4]
        rows:
          - [Vector, "Local lookups: the passage about X", "Multi-hop, aggregates, exact entities"]
          - [Canned traversal, Known question shapes in production, A shape you didn't template]
          - [Text-to-Cypher, Open-ended questions over a well-named schema, "Large or badly named schema, no validator"]
          - [Hybrid, Vector entry points and graph expansion, Wrong entry points make expansion worse]
          - [Global, Themes across a whole corpus, "Specific lookups, high indexing cost"]
        bold_first: true
        takeaway: Default to vector, then canned traversals, then text-to-Cypher with a validator for the long tail.
        recall: What is the default order for adding retrieval modes over a knowledge graph?
        source: notes/11-kg-rag-and-text-to-cypher.md
        notes: >-
          The order is about risk. A canned traversal can't invent a relationship. Text-to-Cypher can, so it comes last and with a validator. In the course, widening each vector hit with its NEXT neighbours
          also surfaced NetApp's ONTAP software, which the plain retriever's answer left out. That is hybrid at its smallest.
      - layout: image
        kicker: Monday morning
        title: The QA agent is generate-then-verify again
        image: ../sources/images/negro-kg-and-llms-in-action-fig15-3.png
        caption: Negro et al., Knowledge Graphs and LLMs in Action, Fig. 15.3 (2025)
        bullets:
          - Ask for `relationships`, then `reasoning`, then `query`
          - Annotate the schema; **one few-shot** fixes `value` on `OWNS_STOCK_IN`
          - The database is the verifier; retry on error is bounded
          - "Missing: an **`EXPLAIN` validator** before execution"
        takeaway: Text-to-Cypher is a bounded generate-then-verify loop, and listing relationships first reduces invented relationship types.
        recall: What verifies the generated Cypher in the QA agent, and what's still missing?
        source: notes/11-kg-rag-and-text-to-cypher.md
        notes: >-
          And here the two graphs touch for the first time: a knowledge graph queried by an execution graph. The back-edge carries the database error to the next attempt. The typed state doubles as an audit trail, and a free
          dataset of failures. If you try one thing Monday, put EXPLAIN in front of execution.

  - title: Where the graphs meet
    summary: Shared memory · The write path · Learning on graphs
    divider: true
    agenda: true
    notes: >-
      Last part. Parallel agents repeat each other's work because each run starts fresh. What if the knowledge graph were
      their shared state? It works, and it makes mistakes permanent, so most of this part is about the write path.
    slides:
      - layout: statement
        kicker: The problem
        title: A swarm keeps rediscovering what it already found
        statement: A swarm alone re-derives findings. A swarm writing to a shared graph accumulates them. The agent forgets; the graph does not, and that cuts both ways.
        takeaway: Execution-state mistakes die with the run, while knowledge-graph mistakes persist and spread to every later reader.
        recall: How does a mistake in a knowledge graph differ from one in execution state?
        source: notes/12-kg-as-shared-agent-memory.md
        notes: >-
          Execution state lives for one thread, and only the graph's own nodes read it. A knowledge graph lives across runs, for any agent and for people too. That lifetime is the appeal. It is also the risk, since nothing throws the mistakes away for you.
      - layout: flow
        kicker: The progression
        title: Each step moves something out of the agent
        steps:
          - {label: Loop, sub: iteration and evaluation}
          - {label: Swarm, sub: "parallel search, with redundancy"}
          - {label: Graph, sub: "shared facts, provenance, memory", accent: D4621A}
        bullets:
          - "Loop: Karpathy's autoresearch keeps a change only if the metric improves"
          - "The swarm costs real money: Anthropic reports about **15×** chat tokens"
          - Topology makes spend **tractable**, not cheap
        takeaway: Loops externalise evaluation, swarms externalise search, and a shared graph externalises facts and provenance.
        recall: What does each of loop, swarm and graph move out of the agent?
        source: notes/12-kg-as-shared-agent-memory.md
        notes: >-
          The same move, three times. Autoresearch moves judgement into a fixed metric. A swarm moves search into parallel workers, and it creates redundancy. A graph moves shared facts into something
          that outlives them. Shared-graph workers can also spread a correlated error further, which is why the write path comes next.
      - layout: code
        kicker: Worked example
        title: All the safety lives in the write path
        lang: python
        code: |-
          @dataclass
          class GraphUpdate:
              nodes: list[dict]  # id, type, props, spans
              edges: list[dict]  # src, type, dst, conf
              run_id: str
              agent_id: str

          def publish(update, graph, validator):
              validator.check_schema(update.nodes,
                                     update.edges)
              validator.check_provenance(update.nodes,
                                         update.edges)
              with graph.transaction() as tx:
                  tx.upsert_versioned_nodes(update.nodes)
                  tx.add_edges(update.edges)
                  tx.commit()
        bullets:
          - Workers **submit**, never write directly
          - The reducer idea, at database scale
          - Validation runs before the transaction
        takeaway: Workers submit updates to a validator instead of writing directly, which is the reducer idea at database scale.
        recall: Why do workers submit a GraphUpdate and not write to the graph directly?
        source: notes/12-kg-as-shared-agent-memory.md
        notes: >-
          Remember the reducer from our review graph: many writers, one rule for merging. This is the same idea with a longer lifetime. No worker gets a database connection. Each hands over
          a typed update, and the publisher checks schema and provenance before anything is stored.
      - layout: cards
        kicker: The non-negotiables
        title: Whoever owns the schema owns the errors
        cards:
          - title: Complete provenance
            body: Every node and edge records `run_id`, `agent_id` and a source span
          - title: Reversible resolution
            body: "`ALIAS_OF` or `RESOLVES_TO` with evidence; never merge destructively"
          - title: Claims are not truths
            accent: D4621A
            body: "Agent A claims X, citing S. Contradictions live side by side"
        takeaway: A shared graph stores claims with provenance and keeps contradictions, because no agent's write counts as truth.
        recall: What three properties must a shared agent graph never give up?
        source: notes/12-kg-as-shared-agent-memory.md
        notes: >-
          The anti-pattern is the chat transcript becoming the database. If a run's only durable record is its conversation log, you can't query it, can't roll it back, and the next agent can't read it without reading everything.
          These three properties are what make a graph more than a bigger transcript.
      - layout: image
        kicker: Learning on the graph
        title: Know the pattern? Hand-written features can win
        image: ../sources/images/negro-kg-and-llms-in-action-fig11-5.png
        caption: Negro et al., Knowledge Graphs and LLMs in Action, Fig. 11.5 (2025)
        bullets:
          - "Degree only: F1 **0.43**; Node2Vec: **0.64**"
          - "Degree and neighbours per faction: **0.93**, stable"
          - "Elliptic: SAGE caught **82.7%** of illicit nodes; GCN missed **32%**"
          - Predicted links are **claims**, out of default traversals
        takeaway: Features are the graph ML bottleneck, and a false predicted link does what a false merge does to every later traversal.
        recall: Why should predicted edges stay out of default traversals?
        source: notes/13-graph-ml-and-gnns.md
        notes: >-
          Connected nodes tend to be alike, so encoding that by hand beat an untuned embedding on the book's small example, where the test set is 14 members, so read the numbers small. Compute it from training labels only, or the test nodes leak answers. The figure shows message passing, where
          a GNN learns the same kind of thing. If such a model writes to the shared graph, it goes through the write path like any other agent.
      - layout: steps
        kicker: Monday morning
        title: Build a shared-memory swarm in four gates
        axis: each step earns the next
        steps:
          - {title: One measured loop, text: "A fixed metric and reversible actions"}
          - {title: A role split, text: "Generator and verifier with isolated contexts"}
          - {title: A persistent graph, text: "Gate: do queries across sessions work?"}
          - {title: A swarm writing to it, text: "Gate: wall-clock gain with **no loss of quality**", accent: D4621A}
        takeaway: Build one measured loop first and add the swarm last, evaluating each layer by its own metric.
        recall: What is the gate before adding a swarm to a persistent graph?
        source: notes/12-kg-as-shared-agent-memory.md
        notes: >-
          This is the whole pillar in four steps. Evaluate by layer: extraction F1, false-merge rate, path validity and redundant findings. Each has a misreading, and a right answer through a wrong path is luck. We began by asking if you need a graph. This is the same question, asked four more times.

  - title: Wrap-up
    agenda: false
    divider: false
    slides:
      - layout: cards
        kicker: Keep these
        title: Rules of thumb
        cards:
          - {title: First graph, body: "Generate-then-verify is the highest-yield first graph"}
          - {title: Agency, body: "Code where you can, one LLM call where you must, an agent only where the path is unknown"}
          - {title: State, body: "Every shared key has one writer or a reducer"}
          - {title: Gates, body: "Gate the edges where consequence concentrates, not every node"}
          - {title: Verifiers, body: "See the task and the output, never the generator's reasoning"}
          - {title: Anchors, accent: D4621A, body: "Keep at least one anchor the graph can't edit"}
        takeaway: Start with a loop, and add a node only when a specific signal forces it.
        recall: What single rule decides when a loop becomes a graph?
        source: notes/01-graph-vs-loop.md
        notes: >-
          If you remember six things, make them these. Each came from a failure we walked through today, from the verifier that ratified a draft to the graph that agreed with itself while drifting away from reality.
      - layout: bullets
        kicker: Keep going
        title: Where to go next
        bullets:
          - "**The lab:** `practice/langgraph-graph`, in Python or TypeScript"
          - "**Your own domain:** build a small graph, then a shared-memory swarm"
          - "**The notes:** every slide here has its code and figures in notes 01–13"
          - "**Knowledge Graphs for RAG:** the hosted DeepLearning.AI and Neo4j course"
          - "**06-eval:** measure whether the whole system is correct"
        aside:
          title: Try this first
          body: Take a loop you already run, and split its verifier by criterion. Measure before you draw a single node.
        takeaway: The cheapest graph experiment is splitting one verifier by criterion and measuring before drawing any node.
        recall: What is the first experiment to run on an existing loop?
        source: notes/06-when-not-to-build-a-graph.md
        notes: >-
          The lab walks you through a graph with real code. Next pillar is evaluation, which asks the question we kept postponing today: how do you know the whole system is right? Thank you.
