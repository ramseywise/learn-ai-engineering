# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/langgraph-graph"
    purpose: "LangGraph support-triage graph with parallel retrieval via Send, a join, a draft/check retry loop and a human approval interrupt that survives a restart, run with a stub model on five tickets."
    demonstrates:
      - "notes/02-graph-primitives.md"
      - "notes/04-durable-execution-and-interrupts.md"
      - "notes/07-failure-modes-at-scale.md"
      - "notes/08-governance-and-production.md"
    pattern: graph
    language: python
    runs_offline: true
    verified_by: "cd langgraph-graph && uv run test.py"
    licence: course
  - path: "practice/langgraph-graph-ts"
    purpose: "LangGraph.js twin of the triage graph: same nodes, edges, tickets and report (needs npm install for its dependencies)."
    demonstrates: []
    pattern: graph
    language: typescript
    runs_offline: true
    verified_by: "cd langgraph-graph-ts && npm install --no-audit --no-fund && npx tsx test.ts"
    licence: course
  - path: "practice/multi-tenant-agents"
    purpose: "One agent core serving four fictional tenants, showing a tenant budget that holds across concurrent runs, context and tool isolation, burst limits, trace labelling and a per-tenant regression the fleet average hides."
    demonstrates:
      - "notes/08-governance-and-production.md"
    pattern: guardrail
    language: python
    runs_offline: true
    verified_by: "cd multi-tenant-agents && uv run test.py"
    licence: course
