# Python 03 Language for engineers: study deck (flashcards). Covers notes/01-09 (08 objects and MRO, 09 memory).
# Build:  make slides PILLAR=programming/python/03-language-for-engineers [PREVIEW=1]
# Spec:   .claude/skills/slides/references/deck-spec.md

deck:
  title: Python for Engineers
  subtitle: The language features production code relies on
  tagline: |-
    Data model · Iterators · Closures · Errors
    Types · Tooling · Concurrency · Objects · Memory
  reference: "Notes: programming/python/03-language-for-engineers"
  output: python-for-engineers.pptx
  notes: >-
    The study deck for Python 03. Every slide is a flashcard: the title is the question and the
    takeaway is the rule that answers it. How the language works, then how to write code that
    holds up, then how to run many things at once, then what classes and objects really do.

parts:
  - title: How the language works
    summary: Names and objects · Dunder methods · Iterators · Generators · Closures · Decorators
    slides:
      - layout: statement
        title: Why does Python's "weird" behaviour keep surprising people?
        kicker: The problem
        statement: A function changes your list, a default argument remembers old calls, and a second loop over a generator finds nothing. One model explains the first two, and a protocol explains the third.
        takeaway: Names are labels on objects, not boxes holding values. Most surprising Python behaviour follows from that.
        source: notes/01-data-model-and-idioms.md
        notes: Everything is an object with an identity, a type and a value.

      - layout: code
        title: What is the difference between mutating and rebinding?
        kicker: Names and objects
        lang: text
        code: |-
          b = a             a ───┐
                                 ├──► [1, 2, 3]         one object, two names
                            b ───┘

          b.append(4)       a ───┐
                                 ├──► [1, 2, 3, 4]      mutate: both names see it
                            b ───┘

          b = [9]           a ───► [1, 2, 3, 4]
                            b ───► [9]                  rebind: only b moves
        takeaway: Mutating changes the object, so every name sees it. Rebinding moves one label, so nothing else changes.
        source: notes/01-data-model-and-idioms.md
        notes: Arguments are passed by assignment, so a function that mutates is visible to the caller and one that rebinds is not.

      - layout: compare
        title: When do you use == and when do you use is?
        kicker: Equality and identity
        emphasis: none
        left:
          title: Equality (`==`)
          bullets:
            - Compares values
            - "Calls `__eq__`"
          tag: Equal is not identical
        right:
          title: Identity (`is`)
          bullets:
            - Compares identity
            - "Use only for `None`, `True`, `False` and sentinels"
          tag: "Everything else uses `==`"
        takeaway: "`==` compares values and `is` compares identity. Use `is` only for `None`, `True`, `False` and sentinels."
        source: notes/01-data-model-and-idioms.md
        notes: Hashability is a separate idea. Dict keys and set members need a hash that never changes. Immutable built-ins are hashable, lists and dicts aren't, and a tuple is hashable only if everything inside it is. Defining __eq__ without __hash__ stops instances working as keys. A frozen dataclass solves it.

      - layout: table
        title: How does Python syntax map to methods?
        kicker: The data model
        header: [You write, Python calls]
        widths: [3, 5]
        rows:
          - ["`len(x)`", "`x.__len__()`"]
          - ["`x[k]`, `x[k] = v`", "`__getitem__`, `__setitem__`"]
          - ["`for i in x`", "`__iter__`, then `__next__`"]
          - ["`a + b`, `a == b`, `a < b`", "`__add__`, `__eq__`, `__lt__`"]
          - ["`if x:`", "`__bool__`, else `__len__`"]
          - ["`with x:`, `x(...)`", "`__enter__` and `__exit__`, `__call__`"]
        takeaway: Syntax calls dunder methods, so implementing them plugs your objects into the language.
        source: notes/01-data-model-and-idioms.md
        notes: "Idioms by reflex: `first, *rest = xs`, `a, b = b, a`, `zip(xs, ys, strict=True)`, `{**defaults, **overrides}`. `copy.copy` is shallow and `copy.deepcopy` goes all the way down."

      - layout: flow
        title: What does a for loop actually do?
        kicker: The iterator protocol
        steps:
          - {label: "`iter(xs)`", sub: "calls `__iter__`, returns an iterator"}
          - {label: "`next(it)`", sub: "calls `__next__`, returns a value"}
          - {label: Bind, sub: "the value goes to `x`, and the body runs"}
          - {label: "`StopIteration`", sub: the loop catches it and ends}
        loop: "repeat `next` until exhausted"
        caption: A list is an iterable, and can make new iterators. An iterator is single-use and stays empty once exhausted.
        takeaway: A `for` loop calls `iter()` once, then `next()` until `StopIteration`. Iterators are single-use, so a second pass yields nothing.
        source: notes/02-generators-and-iteration.md
        notes: That is why looping twice over a generator or a map object silently yields nothing the second time.

      - layout: code
        title: Why would you write a generator?
        kicker: Laziness
        lang: python
        code: |-
          def read_records(path):
              with open(path, encoding="utf-8") as f:
                  for line in f:
                      if line.strip() and not line.startswith("#"):
                          yield line.rstrip("\n").split(",")

          total = sum(x * x for x in range(10**6))   # generator expression: no list built
        takeaway: A function with `yield` runs only as values are requested and holds one item at a time, so memory stays constant.
        source: notes/02-generators-and-iteration.md
        notes: The with block stays open until the generator finishes or is collected. Consume it fully. Stop comprehensions at two for clauses.

      - layout: table
        title: Which itertools do you actually use?
        kicker: itertools
        recall: What must you do before `itertools.groupby`?
        header: [Function, Does]
        widths: [3.2, 5]
        rows:
          - ["`islice(it, n)`", "First n items of any iterator"]
          - ["`chain.from_iterable(xs)`", "Flatten one level"]
          - ["`groupby(it, key)`", "Group **consecutive** equal keys, so sort first"]
          - ["`batched(it, n)`", "Tuples of n (3.12+)"]
          - ["`pairwise(it)`", "`(a, b), (b, c), …`"]
          - ["`accumulate(it)`", "Running totals"]
        takeaway: "`groupby` only groups consecutive keys, so sort first."
        source: notes/02-generators-and-iteration.md
        notes: Pair infinite streams such as count and cycle with islice or zip. collections adds Counter, defaultdict, deque with maxlen for a sliding window, and namedtuple.

      - layout: compare
        title: What do closures capture?
        kicker: Closures
        left:
          title: The trap
          code: |-
            fs = [lambda: i for i in range(3)]
            [f() for f in fs]    # [2, 2, 2]
          tag: Captures the variable
        right:
          title: Bind early
          code: |-
            fs = [lambda i=i: i for i in range(3)]
            [f() for f in fs]    # [0, 1, 2]
          tag: A default is evaluated at def time
        takeaway: Closures capture variables, not values. Bind early with a default, and use `nonlocal` to rebind an outer name.
        source: notes/03-functions-deeper.md
        notes: "Signatures: parameters before / are positional-only, parameters after * are keyword-only, a good default for flags."

      - layout: code
        title: What is a decorator?
        kicker: Decorators
        lang: python
        code: |-
          def timed(fn):
              @functools.wraps(fn)              # keep fn's name and docstring
              def wrapper(*args, **kwargs):
                  start = time.perf_counter()
                  try:
                      return fn(*args, **kwargs)
                  finally:
                      print(f"{fn.__name__} took {time.perf_counter() - start:.3f}s")
              return wrapper

          @timed                                # same as: load = timed(load)
          def load(path): ...
        takeaway: A decorator is a function that wraps a function. `@timed` means `load = timed(load)`, and arguments add one more level.
        source: notes/03-functions-deeper.md
        notes: "`@retry(times=3)` is a function returning a decorator. Also useful: functools.cache, partial, operator.itemgetter."

  - title: Code that holds up
    summary: Exceptions · Context managers · Type hints · Dataclasses and Pydantic · uv, ruff and pytest
    slides:
      - layout: statement
        title: What separates a script from code others depend on?
        kicker: The problem
        statement: Failures that surface clearly, cleanup that always happens, signatures a checker can read, and an environment anyone can rebuild.
        attribution: Each one is a small habit, and the tools do most of the work.
        takeaway: Code others depend on fails clearly, always cleans up, has signatures a checker can read, and has an environment anyone can rebuild.
        source: notes/04-errors-and-context-managers.md
        notes: The next slides take these one at a time. Failures and cleanup are in this note, signatures in note 05, and the environment in note 06.

      - layout: flow
        title: What does each clause of try do?
        kicker: Exceptions
        recall: How do you write a safe try/except?
        steps:
          - {label: "`try`", sub: only the line that can fail}
          - {label: "`except`", sub: "the narrowest exception you can handle"}
          - {label: "`else`", sub: runs only if nothing was raised}
          - {label: "`finally`", sub: "always runs, even after `return`"}
        bullets:
          - "`raise ValueError(...) from err` keeps the original as the cause, and a bare `raise` re-raises unchanged"
          - "One base exception per package lets callers write `except PipelineError`"
          - "A bare `except:` hides bugs like `NameError`, and even `KeyboardInterrupt`"
        takeaway: Catch the narrowest exception, keep the `try` small, and use `raise ... from err` to keep the cause.
        source: notes/04-errors-and-context-managers.md
        notes: Add fields to custom exceptions for anything a caller might branch on. Use log.exception inside except, not print.

      - layout: code
        title: How do you write your own context manager?
        kicker: Context managers
        lang: python
        code: |-
          from contextlib import contextmanager

          @contextmanager
          def timer(label: str):
              start = time.perf_counter()      # setup
              try:
                  yield
              finally:                         # teardown runs on error too
                  print(f"{label}: {time.perf_counter() - start:.2f}s")
        takeaway: With `@contextmanager`, code before `yield` is setup and code after is teardown. Use `try/finally` so teardown runs on error.
        source: notes/04-errors-and-context-managers.md
        notes: As a class, implement __enter__ and __exit__. Returning True from __exit__ swallows the exception, which is rarely what you want.

      - layout: bullets
        title: Who checks Python's type hints?
        kicker: Type hints
        bullets:
          - "Tools do, not Python: run `mypy` or `pyright`"
          - "Accept the loosest type that works (`Iterable`, `Mapping`) and return the most specific (`list`, `dict`)"
          - "`X | None` makes callers handle `None`, which is most of the value"
          - "`Any` turns checking off, so prefer `object` and narrow with `isinstance`"
          - "A `Protocol` is duck typing the checker understands: no inheritance needed"
        takeaway: Python ignores hints at runtime, so run a checker. `X | None` forces callers to handle the missing case.
        source: notes/05-types-and-dataclasses.md
        notes: The TypeScript track teaches the same ideas with a stricter checker.

      - layout: compare
        title: When do you use a dataclass, and when Pydantic?
        kicker: Inside and at the edge
        left:
          title: Dataclass
          code: |-
            @dataclass(frozen=True, slots=True)
            class Chunk:
                doc_id: str
                text: str
                score: float = 0.0
          tag: Inside the program. Trusts its inputs
        right:
          title: Pydantic
          code: |-
            class Review(BaseModel):
                rating: int = Field(ge=1, le=5)
                summary: str

            Review.model_validate_json(raw)
          tag: At a boundary. Validates and converts
        takeaway: Use dataclasses inside the program and a validator at every edge, such as API JSON, config and LLM output.
        source: notes/05-types-and-dataclasses.md
        notes: "frozen=True makes instances immutable and hashable. Mutable defaults need field(default_factory=list). Pydantic coerces \"4\" to 4 for an int field."

      - layout: cards
        title: What are the parts of a modern Python project?
        kicker: Tooling
        cards:
          - {title: Layout, body: "`pyproject.toml`, `src/my_tool/`, `tests/`. Install the project and don't edit `sys.path`."}
          - {title: uv, body: "`uv add httpx`, `uv run pytest`. Commit `uv.lock`, because it pins every transitive version."}
          - {title: ruff, body: "`ruff check --fix` lints and `ruff format` formats, replacing flake8, isort and black."}
          - {title: pytest, body: "Plain `assert`, `parametrize`, `raises`, and fixtures such as `tmp_path` injected by name."}
          - {title: Imports, accent: "D4621A", body: "`sys.path` starts with the script's directory, so a file named `json.py` shadows the real module."}
        takeaway: A project is a `pyproject.toml`, `src/` and `tests/`, with uv, ruff and pytest. Never name a file after a standard-library module.
        source: notes/06-modules-packaging-tooling.md
        notes: "Three tools cover what used to take many. `import` runs a module once and caches it in `sys.modules`. `if __name__ == \"__main__\":` guards code that should only run when the file is executed. Avoid `from x import *`. \"Works when I run it from here\" bugs come from the same place as the shadowing: uv sync installs the project so imports stop depending on the working directory."

  - title: Many things at once
    summary: Picking a tool · The GIL · The event loop · Never block · Retries
    slides:
      - layout: statement
        title: What decides which concurrency tool you use?
        kicker: The problem
        statement: Fifty HTTP calls and fifty pure-Python number crunches need different tools, because one spends its time waiting and the other spends it computing.
        takeaway: Pick by what you are waiting on. I/O-bound work uses threads or `asyncio`, and CPU-bound Python uses processes.
        source: notes/07-concurrency.md
        notes: NumPy releases the GIL, so array work is a separate case.

      - layout: table
        title: Threads, asyncio or processes?
        kicker: Which tool
        recall: Why do threads help waiting but not computing?
        header: [Work, Tool, Why]
        widths: [3.4, 2.4, 3.2]
        rows:
          - ["A few dozen blocking HTTP calls, existing sync code", "`ThreadPoolExecutor`", Threads release the GIL while waiting on I/O]
          - ["Hundreds+ requests, an async SDK, a web server", "`asyncio`", "One thread, cheap tasks, explicit `await` points"]
          - [CPU-heavy pure Python, "`ProcessPoolExecutor`", "Separate interpreters, so no GIL contention"]
        takeaway: The GIL lets one thread run Python bytecode at a time, and threads release it while waiting on I/O. So threads help with waiting, and processes help with computing.
        source: notes/07-concurrency.md
        notes: Free-threaded builds (3.13t+) remove the GIL, but most code and libraries still assume it.

      - layout: flow
        title: How does the event loop run two tasks on one thread?
        kicker: The event loop
        steps:
          - {label: Run, sub: "a ready task runs until an `await` on something unfinished"}
          - {label: Suspend, sub: it hands control back to the loop}
          - {label: Next, sub: "the loop runs the next ready task, or sleeps if none"}
          - {label: Resume, sub: "a timer or socket fires, and the task is ready again"}
        loop: until every task is done
        caption: "`sleep(0.2)` and `sleep(0.1)` as two tasks take about 0.2 s in total, not 0.3 s."
        takeaway: One thread runs ready tasks until each hits an `await`. Nothing preempts a task, so switching happens only at `await`.
        source: notes/07-concurrency.md
        notes: The same model as JavaScript promises. Promise.all corresponds to gather and TaskGroup.

      - layout: code
        title: How do you limit concurrency in asyncio?
        kicker: TaskGroup and Semaphore
        lang: python
        code: |-
          async def main(urls: list[str]) -> list[str]:
              sem = asyncio.Semaphore(10)                  # at most 10 in flight
              async with httpx.AsyncClient() as client:
                  async def limited(url):
                      async with sem:
                          return await fetch(client, url)
                  async with asyncio.TaskGroup() as tg:    # cancels the rest if one fails
                      tasks = [tg.create_task(limited(u)) for u in urls]
              return [t.result() for t in tasks]
        takeaway: Use a `Semaphore` to cap requests in flight and a `TaskGroup` to cancel the rest when one fails.
        source: notes/07-concurrency.md
        notes: "`gather(*coros, return_exceptions=True)` collects errors without cancelling. `asyncio.timeout(5)` adds a deadline."

      - layout: compare
        title: What must you never do inside async def?
        kicker: Never block the loop
        left:
          title: Freezes every task
          bullets:
            - "`time.sleep(1)`"
            - "`requests.get(url)`"
            - Heavy CPU work
          tag: Nothing else can run
        right:
          title: Use instead
          bullets:
            - "`await asyncio.sleep(1)`"
            - "An async client such as `httpx.AsyncClient`"
            - "`await asyncio.to_thread(blocking_fn)`"
          tag: Control returns to the loop
        takeaway: Blocking calls inside `async def` freeze every task. Await an async client, or push the work to `asyncio.to_thread`.
        source: notes/07-concurrency.md
        notes: Calling an async def does nothing until it is awaited or scheduled as a task.

      - layout: code
        title: How should you retry a failed call?
        kicker: Retries with backoff
        lang: python
        code: |-
          async def with_retry(make_call, attempts=4, base=0.5):
              for i in range(attempts):
                  try:
                      return await make_call()
                  except (TimeoutError, ConnectionError):
                      if i == attempts - 1:
                          raise
                      await asyncio.sleep(base * 2**i + random.random() * base)
        takeaway: Back off exponentially with jitter, and retry only errors that can succeed next time, such as timeouts, 429 and 5xx.
        source: notes/07-concurrency.md
        notes: Never retry 4xx validation errors. LLM SDKs already retry for you, so check before you wrap them.

  - title: What classes really do
    summary: Shared state · Inheritance or composition · The MRO · Descriptors · Class creation
    notes: >-
      Classes stop being a mystery once you can work them out. Each of these has a rule you can check with a
      print statement, and each tool has a cost.
    slides:
      - layout: statement
        title: Why does class behaviour seem unpredictable?
        kicker: The problem
        statement: "A `super()` call runs a method in a class you never named, an instance attribute silently replaces a method, or two libraries refuse to combine with a metaclass conflict."
        attribution: One small set of rules explains all three.
        recall: What explains a `super()` call reaching a class you never named, a method replaced by an instance attribute, and a metaclass conflict?
        takeaway: Attribute lookup, the order of a class's ancestors and how a class gets built explain these, so you can work the behaviour out.
        source: notes/08-objects-inheritance-and-mro.md
        notes: >-
          Lookup has a fixed order. A data descriptor such as a property beats the instance dict, and a function is a non-data
          descriptor, which is why a method can be shadowed and a property can't. For class creation, pick the first tool that
          works: a class decorator, then __init_subclass__, then a metaclass. Inheritance also couples you to the parent's
          internals, so composition is the default for reusing behaviour.

      - layout: code
        title: Why can tenant B read tenant A's message?
        kicker: Class attributes
        lang: python
        code: |-
          class Conversation:
              messages = []          # shared

              def add(self, text):
                  self.messages.append(text)

          a, b = Conversation(), Conversation()
          a.add("hello from tenant A")
          print(b.messages)      # ['hello from tenant A']
        bullets:
          - "Reading `obj.x` searches the instance, then the class"
          - "Assigning through an instance always writes to the instance"
          - "Mutating a shared class attribute writes to every instance"
        takeaway: Per-instance state belongs in `__init__`, never in a mutable class attribute. In a service, the shared list is a data leak.
        source: notes/08-objects-inheritance-and-mro.md
        notes: >-
          `fast.describe` is a bound method, a small object that remembers `fast` and passes it as self. Set per-instance state in
          __init__, or use a dataclass with field(default_factory=list).

      - layout: compare
        title: Why count writes with composition instead of a subclass?
        kicker: Inheritance couples you to internals
        recall: A subclass overrides `put` and `put_many` to count writes. Why does `put_many` of two items count 4, and what avoids it?
        emphasis: right
        left:
          title: Subclass
          code: |-
            class CountingCache(ResponseCache):
                def put(self, p, r):
                    self.writes += 1
                    super().put(p, r)
          tag: "`put_many` of 2 items counts **4**"
        right:
          title: Wrap
          code: |-
            class CountingCache:
                def __init__(self, inner):
                    self._inner = inner
                def put(self, p, r):
                    self.writes += 1
                    self._inner.put(p, r)
          tag: "The same call counts **2**"
        takeaway: A subclass depends on which parent methods call which others, and the parent never promised that. Compose by default, and inherit when the parent was designed for it.
        source: notes/08-objects-inheritance-and-mro.md
        notes: >-
          The subclass counts the items in put_many, then the parent's put_many calls the overridden put. If the parent later writes
          straight to its dict, the behaviour changes with no signature to warn you. Composition costs you forwarding every method
          you expose, and isinstance against the parent is false. Use a Protocol for the type relationship alone. Inheritance is still
          right for frameworks, exception hierarchies and a parent built to be extended.

      - layout: flow
        title: What does super() call in a diamond?
        kicker: The MRO
        recall: In `class ProdClient(Retrying, Logged)`, with both parents inheriting `BaseClient`, what does `super()` inside `Retrying` reach, and why?
        steps:
          - {label: ProdClient, sub: "the instance's class"}
          - {label: Retrying, sub: "`super()` is written here"}
          - {label: Logged, sub: "next in the MRO, not Retrying's parent"}
          - {label: BaseClient, sub: "after both of its children"}
          - {label: object, sub: "the end of the chain"}
        bullets:
          - "**C3 guarantees** a class before its parents, parents in written order, and an order subclasses can't reshuffle"
          - "**It can refuse:** parents that disagree on order raise `TypeError` when the class is defined"
          - "**The cost:** to read a mixin's method, you have to know what class it was mixed into"
        takeaway: "It reaches `Logged`: `super()` continues from the entry after the current class in the MRO of the instance's type, so it can reach a sibling, not only a parent."
        source: notes/08-objects-inheritance-and-mro.md
        notes: >-
          Print type(self).__mro__ and read the order. Every occurrence of the method must call super(), or the chain stops there
          with no error. That is Hettinger's list: the method must exist, the signatures must match, and every occurrence must
          call super(). For a small stack of wrappers, composition is often clearer, because the nesting shows the order where
          the object is assembled.

      - layout: steps
        title: In what order does obj.x look for x?
        kicker: Attribute lookup
        axis: first checked → last checked
        steps:
          - {title: Data descriptor on the class, text: "Found in the MRO with `__set__` or `__delete__`? Call its `__get__`. A `property` is one."}
          - {title: Instance dict, text: "`x` in `obj.__dict__`? Return it."}
          - {title: Non-data descriptor, text: "A function or `cached_property` found in step 1: call its `__get__`. Functions are how methods bind."}
          - {title: Plain class attribute, text: "Found in step 1 and not a descriptor: return it."}
          - {title: AttributeError, text: "Then `__getattr__` is tried, if the class defines it.", accent: "D4621A", n: "!"}
        takeaway: A data descriptor beats the instance dict and a non-data one loses to it. So a method can be shadowed and a property can't.
        source: notes/08-objects-inheritance-and-mro.md
        notes: >-
          `functools.cached_property` is a non-data descriptor. After computing, it writes the value into the instance dict, and step 2
          finds it next time. classmethod, staticmethod and __slots__ entries are descriptors too. `__getattr__` runs only after normal
          lookup fails, while `__getattribute__` runs on every access and recurses forever if it reads self.x directly.

      - layout: code
        title: How do you validate the same field on many classes?
        kicker: Writing a descriptor
        lang: python
        code: |-
          class Bounded:
              def __init__(self, low, high):
                  self.low, self.high = low, high
              def __set_name__(self, owner, name):
                  self.private = f"_{name}"
              def __get__(self, obj, objtype=None):
                  if obj is None:
                      return self
                  return getattr(obj, self.private)
              def __set__(self, obj, value):
                  if not self.low <= value <= self.high:
                      raise ValueError(value)
                  setattr(obj, self.private, value)
        bullets:
          - "`temperature = Bounded(0.0, 2.0)` on the class serves every instance"
          - "Store the value on `obj`, never on `self`, or all instances share it"
          - "**Cost:** a read takes **59.9 ns**, against 21.4 ns for a property and 12.1 ns for a plain attribute"
        takeaway: A descriptor reuses attribute logic across fields. Store the value on the instance, and measure before you worry about its cost.
        source: notes/08-objects-inheritance-and-mro.md
        notes: >-
          The three timings include the lambda call that timeit makes, so read the gaps: about 9 ns for a property and about 48 ns for
          the descriptor, roughly five times the plain read. That matters over millions of records and not next to an LLM call. A larger cost
          is that `cfg.top_p = 1.5` looks like a store and can raise. Check whether Pydantic or a dataclass already validates at the boundary.

      - layout: table
        title: Decorator, __init_subclass__ or metaclass?
        kicker: How a class gets built
        recall: Which class-customisation tool should you try first, and what does a metaclass cost?
        header: [Tool, Runs, Good for]
        widths: [2.6, 3.2, 4]
        rows:
          - ["Class decorator", "After the class is built, on that one class", "`@dataclass`, generated methods"]
          - ["`__init_subclass__`", "When a subclass is created, for all future ones", "Plugin registries, a rule every subclass must follow"]
          - ["Metaclass", "Throughout class creation, and it stays", "A class's own behaviour, as in `Enum` and `ABCMeta`"]
        highlight: [1]
        takeaway: "Pick the first tool that works. A needless metaclass invites `TypeError: metaclass conflict` when someone combines your class with another library's."
        source: notes/08-objects-inheritance-and-mro.md
        notes: >-
          PEP 487 added __init_subclass__ and __set_name__ because most metaclass uses fell into a few categories and metaclasses combine badly.
          A provider registry needs only __init_subclass__. A class's metaclass must subclass all its bases' metaclasses, and Python won't merge
          two unrelated ones, so combining a custom metaclass with ABCMeta fails until you write a combined one. Libraries earn a metaclass: Enum
          needs iteration on the class, ABCMeta tracks abstract methods.

  - title: What memory really costs
    summary: Object sizes · Refcounts and cycles · Leaks · slots · Bytecode · Free-threading
    notes: >-
      Everything here was measured on CPython 3.14.7 on macOS arm64. This area changes between releases, so recheck the numbers on yours.
    slides:
      - layout: statement
        title: Why does a service run out of memory before it runs out of data?
        kicker: The problem
        statement: "A retrieval service holding embeddings as Python lists, or a worker that \"leaks\" with nothing leaked in the C sense, are both stories about what an object costs and what still holds it."
        attribution: A working model needs measurements, not folklore.
        takeaway: To diagnose memory in Python you need three things, what an object costs, what frees it and what still holds on to it.
        source: notes/09-memory-and-the-runtime.md
        notes: >-
          The garbage collector changed twice within 3.14 alone, so every number and internal detail here is true of that version.
          Recheck on yours.

      - layout: table
        title: What does one small record cost in bytes?
        kicker: Measured with tracemalloc, 200,000 records
        recall: Which record shape costs the most and the least in bytes, and why can't `sys.getsizeof` compare them?
        header: [Shape, Bytes each, getsizeof says]
        widths: [3.4, 2, 2.4]
        rows:
          - ["`dict`", "248.1", "184"]
          - ["`NamedTuple`", "136.1", "64"]
          - ["`tuple`", "128.1", "64"]
          - ["plain class, `dataclass`", "152.1", "48"]
          - ["`__slots__` class, `dataclass(slots=True)`", "112.1", "48"]
        highlight: [4]
        takeaway: A dict is the heaviest record, and `sys.getsizeof` is shallow, so it can't compare shapes. Count with `tracemalloc`.
        source: notes/09-memory-and-the-runtime.md
        notes: >-
          The figure includes the list slot and the int and float inside each record. Reading `vars(obj)` on every record builds the real
          __dict__ and costs 216.1 bytes for a plain class. For numbers, boxing dominates: one 1536-dimension embedding takes 49,416 bytes
          as list[float], 13,176 as array('d') and 6,628 as array('f'). A million list embeddings come to about 44 GiB. Use array or NumPy.

      - layout: flow
        title: What frees an object, and what frees a cycle?
        kicker: Reference counting and the cycle collector
        steps:
          - {label: Last reference dropped, sub: "the refcount hits zero"}
          - {label: Freed on the spot, sub: "most objects, with no collector involved"}
          - {label: A cycle, sub: "each object keeps the other above zero", accent: "D4621A"}
          - {label: Cycle collector, sub: "3 generations, young threshold 2000", accent: "0F7490"}
        caption: Only container objects can form cycles, so only they are tracked.
        takeaway: Refcounting frees most objects at once and a separate collector frees cycles. Use `with` for anything that must be released on time.
        source: notes/09-memory-and-the-runtime.md
        notes: >-
          Freeing by refcount is an implementation detail the data model warns against relying on. Which collector you have depends on the
          patch version: 3.14.0 to 3.14.4 shipped an incremental one and 3.14.5 reverted to the generational collector of 3.13. A full collection
          touches every tracked object, so it grew from about 5 ms to about 260 ms as the live heap grew from 100,000 to 4 million records,
          and gc.freeze() took a full collect to 0.0 ms. The free-threaded build has its own non-generational collector.

      - layout: bullets
        title: What is a memory leak in Python, and how do you find it?
        kicker: Measured on CPython 3.14.7, macOS arm64
        bullets:
          - "**Most objects** are freed when their refcount hits zero, and a cycle collector handles the cycles"
          - "**A leak is still reachable:** an unbounded cache, a listener, `lru_cache` on a method, a stored exception"
          - "**RSS is not proof:** keeping 1,500 of 3 million dicts held RSS at 686 MiB, because survivors pin arenas"
        aside:
          lang: python
          code: |-
            tracemalloc.start()
            snap = tracemalloc.take_snapshot
            traffic(0, 1_000)
            old = snap()
            traffic(1_000, 50_000)
            new = snap()
            new.compare_to(old, "lineno")[:2]
        takeaway: A Python leak is an object something can still reach, so diff two `tracemalloc` snapshots after warm-up, and don't trust RSS alone.
        source: notes/09-memory-and-the-runtime.md
        notes: >-
          These figures hold for CPython 3.14.7 on macOS arm64, and this area changes between releases. The dicts are small objects from
          pymalloc's 1 MiB arenas, and an arena goes back to the OS only when nothing in it is live. Dropping the last 1,500
          dicts gave back about 640 MiB. In a service, take the snapshots some time apart, because filling caches look like leaks
          in the first minutes. tracemalloc misses memory a C extension allocates privately, and slowed an allocation-heavy loop
          about 4 times here. Over 200,000 two-field records, __slots__ saved about a quarter, 112.1 against 152.1 bytes each, and
          sys.getsizeof reported 48 for both because it is shallow. A full collection grew from about 5 ms at 100,000 records to
          about 260 ms at 4 million. Free-threading in 3.14 is supported but optional, and it does not make your code thread-safe.

      - layout: compare
        title: Why does lru_cache on a method keep objects alive?
        kicker: A leak you can write by accident
        left:
          title: lru_cache on a method
          code: |-
            class WithLru:
                @functools.lru_cache(maxsize=128)
                def embed(self, text): ...
          tag: Still alive after `del`
        right:
          title: cached_property
          code: |-
            class WithCachedProperty:
                @functools.cached_property
                def corpus(self): ...
          tag: Freed with the instance
        emphasis: right
        takeaway: "`lru_cache` stores `self` in a class-level key, so instances live until evicted. `cached_property` stores on the instance and dies with it."
        source: notes/09-memory-and-the-runtime.md
        notes: >-
          The other usual suspects are a module-level dict used as a cache, a registered callback, conversation history on a long-lived session,
          a stored exception whose traceback holds frames and their locals, and metrics with unbounded label combinations. cached_property takes
          no arguments and can't be bounded.

      - layout: cards
        title: What does __slots__ buy, and what does it cost?
        kicker: Trading flexibility for size
        cards:
          - {title: Saves, body: "About a quarter: **112.1** against **152.1** bytes per record, not the factor of several often quoted."}
          - {title: Loses, accent: "D4621A", body: "New attributes, weak references unless declared, and `cached_property`."}
          - {title: Needs, accent: "0F7490", body: "Every class in the chain to declare it. One base without `__slots__` brings the `__dict__` back."}
        takeaway: Use `@dataclass(slots=True)` only for many instances of one small class, after measuring. Otherwise the plain class is the better default.
        source: notes/09-memory-and-the-runtime.md
        notes: >-
          Each slot is a member descriptor on the class, the data-descriptor rule from note 08. Two slotted bases fail with an instance lay-out conflict.
          For 500,000 records with 2 KB of text each, 40 bytes saved per record is about 2% of the total, because the size is in the strings.

      - layout: code
        title: Is self.total += n one operation?
        kicker: Bytecode
        lang: text
        code: |-
          LOAD_FAST_BORROW   0 (self)
          COPY               1
          LOAD_ATTR          0 (total)
          LOAD_FAST_BORROW   1 (n)
          BINARY_OP         13 (+=)
          SWAP               2
          STORE_ATTR         0 (total)
        bullets:
          - "A load, an add and a separate store: a thread switch can land between them"
          - "Since 3.11 the interpreter rewrites instructions for the types it sees, so warm up before you benchmark"
          - "Bytecode has no guarantees between versions, so read it to learn"
        takeaway: "`dis` shows that `x += 1` is several instructions, so it isn't atomic. Don't build tools on specific opcodes."
        source: notes/09-memory-and-the-runtime.md
        notes: >-
          That is the race behind a lost update. A single call into C may hold the GIL throughout on the default build, and that isn't a promise
          under free-threading. Use a lock or a queue when you need the guarantee. After warm-up the loop's BINARY_OP shows as BINARY_OP_ADD_FLOAT.

      - layout: table
        title: What does the free-threaded build change?
        kicker: Python 3.14, CPU-bound work, one short run
        recall: Does removing the GIL make code thread-safe, and what did 4 CPU-bound threads gain?
        header: [Build, 1 thread, 4 threads, Speedup, "`None` size"]
        widths: [2.6, 1.6, 1.6, 1.6, 1.8]
        rows:
          - [Default (GIL on), "0.28 s", "1.02 s", "1.1x", "16 bytes"]
          - ["`python3.14t` (GIL off)", "0.23 s", "0.36 s", "2.5x", "32 bytes"]
        highlight: [1]
        takeaway: CPU-bound threads scale only with the GIL off, and removing it doesn't make code thread-safe. Check `sys._is_gil_enabled()`, not the binary's name.
        source: notes/09-memory-and-the-runtime.md
        notes: >-
          One short run shows the shape, not a benchmark. Free-threading is officially supported but optional, and one C extension without declared
          support turns the GIL back on. Concurrency in note 07 still gives the right defaults. Free-threading adds a third option for CPU work with
          shared memory, if your dependencies support it. Use threading.Lock for your own correctness.

  - title: Rules to keep
    agenda: false
    divider: false
    slides:
      - layout: cards
        title: What are the engineering rules?
        cards:
          - {title: Model, body: "Names are labels. `None` as a default. `is` only for singletons."}
          - {title: Errors, body: "Narrow `except`, small `try`, `with` for cleanup, logging over print."}
          - {title: Types, body: "Hints on every signature. Dataclasses inside, a validator at the edge."}
          - {title: Concurrency, body: "Pick by what you wait on. Never block the loop. Always a limit and a timeout."}
          - {title: Objects and memory, body: "Compose before you inherit. `__init_subclass__` before a metaclass. Diff `tracemalloc` snapshots, and don't trust RSS alone."}
          - {title: Next, accent: "D4621A", body: "Pandas in `data-analytics`, TypeScript for the same type and async ideas, and `bash check.sh exercises 03`."}
        takeaway: Treat names as labels, fail narrowly, validate at edges, choose concurrency by what you wait on, and compose before you inherit.
        source: notes/01-data-model-and-idioms.md
        notes: These condense notes 01 to 09. Data work starts with 01-python-for-data-analysis in the data-analytics pillar, and the practice run includes the uv tooling package. See the programming start-here readme for the order of the tracks.
