[project]
name = "textstats"
version = "0.1.0"
description = "Practice package for Python 03 · note 06"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
textstats = "textstats.core:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
