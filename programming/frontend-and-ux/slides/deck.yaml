          - "**Application patterns**: choosing what kind of interface to build at all"
          - "**Real-time and multimodal agents**: where much of this changes"
          - "**Threat model**: the rest of what output handling sits inside"
        takeaway: Do the lab, read application patterns for which interface to build, and read the threat model for what output handling sits inside.
