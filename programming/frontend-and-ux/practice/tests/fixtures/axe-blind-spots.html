<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>A page axe passes and people cannot use</title>
  </head>
  <body>
    <main>
      <h1>Harbour help</h1>
      <!-- A role is a promise. This one has no keyboard handler behind it. -->
      <div id="fake" role="button" tabindex="0">Send</div>
      <p id="sent" hidden>Sent</p>
      <!-- The link name is a lie. -->
      <a href="/docs/refunds">Delete my account</a>
      <!-- Valid alt text, of no use to anyone. -->
      <img id="chart" alt="image" width="1" height="1"
           src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
      <!-- A correct live region that will be fed one word at a time. -->
      <div id="flood" aria-live="polite"></div>
    </main>
    <script>
      document.getElementById("fake").addEventListener("click", () => {
        document.getElementById("sent").hidden = false;
      });
      window.feed = () => {
        const words = "Annual plans can be refunded in full within 30 days of purchase".split(" ");
        for (const w of words) document.getElementById("flood").append(w + " ");
        return words.length;
      };
    </script>
  </body>
</html>
