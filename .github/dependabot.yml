version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # generative-ai project directories
  # Note: entries for vendored `-main`/`-master` snapshots were removed in LAE-106 —
  # those directories are no longer tracked (see THIRD_PARTY.md).
  - package-ecosystem: "uv"
    directory: "/generative-ai/07-agentic-applications/practice/deep-research-bot"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
