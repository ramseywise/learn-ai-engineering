# Quality and observability lecture deck. Covers notes 01-06.
# Build: make slides PILLAR=data-engineering/05-quality-and-observability STRICT=1 PREVIEW=1
# Running example: one quarter of synthetic taxi trips with five faults planted in March (notes 01-03).
deck:
  title: Quality and Observability
  subtitle: Finding out that the data is wrong, before anyone else does
  tagline: |-
    Tests judge rules · Monitors judge history · Lineage finds the damage · Playbooks repair it
  reference: "Notes: data-engineering/05-quality-and-observability"
  output: quality-and-observability.pptx
  notes: >-
    A stage silently trusts the one before it, and this pillar is where we stop trusting. One quarter of taxi trips
    runs through the whole session, and we planted five faults in March so that we can score every check against the
    truth. By the end we will have caught all five, and repaired them with a backfill that is safe to run twice.

parts:
  - title: Testing against rules
    summary: Dimensions · Tests · Tolerances · Great Expectations and dbt
    notes: >-
      We start with what good data means, and turn each meaning into a query. Then we see how far that gets us.
    slides:
      - layout: statement
        title: Green pipeline, wrong numbers
        kicker: The problem
        statement: "A pipeline fails when code fails. Nothing in the code reads what the data says."
        attribution: "After Sculley et al., NeurIPS 2015: compilers find code dependencies, nothing finds data ones"
        recall: "Why does data need its own checks?"
        takeaway: Every job can finish green while the report is wrong, so data needs its own checks.
        source: notes/01-quality-dimensions-and-tests.md
        notes: >-
          Sculley and colleagues point out that static analysis finds code dependencies, and nothing equivalent exists
          for data. So a broken data dependency runs without complaint. That is the gap this pillar closes.
      - layout: table
        title: Five faults planted in one feed
        recall: "Why plant synthetic faults in a feed?"
        header: [Date, Fault, Likely real cause]
        widths: [2, 3, 5]
        rows:
          - ["5 March", "20% of fare is null", "A deploy stops sending one field"]
          - ["10 March", "The day never lands", "An export fails quietly upstream"]
          - ["15 March", "Arrives 50 hours late", "A source system backlog"]
          - ["18 March", "Every row twice", "The producer retried a whole batch"]
          - ["From 24 March", "Distance in kilometres", "A vendor changes its app's locale"]
        bold_first: true
        takeaway: Synthetic faults let us score every check against what really happened.
        source: notes/01-quality-dimensions-and-tests.md
        notes: >-
          The data is synthetic on purpose. With real data you never know what you missed. With planted faults we can
          keep score, and the scoreboard is the thread through the whole session.
      - layout: cards
        title: Good data has six meanings
        recall: Which dimension can no query on the table alone ever test?
        cards:
          - {title: Completeness, body: "Is the value there? Null share where the field applies.", accent: 0EA5C9}
          - {title: Uniqueness, body: "Is each thing recorded once? Duplicate keys.", accent: 0EA5C9}
          - {title: Validity, body: "Is the value allowed? Ranges and allowed sets.", accent: 0F7490}
          - {title: Consistency, body: "Do facts agree across columns and tables?", accent: 0F7490}
          - {title: Timeliness, body: "Did it arrive when promised? Needs arrival time.", accent: 5B21B6}
          - {title: Accuracy, body: "Is it true? Needs an outside account.", accent: D4621A}
        takeaway: Each dimension needs more context than the last, and accuracy needs something outside the table.
        source: notes/01-quality-dimensions-and-tests.md
        notes: >-
          Schelter and colleagues name completeness, consistency and accuracy as the most common. Practitioners split
          them further, because each split needs a different check. The names vary. The questions are what matter.
      - layout: code
        title: A test is a query that should return nothing
        recall: "What happens to a hard rule on a soft fact?"
        lang: python
        code: |-
          TESTS = {
            'trip_id unique': """SELECT trip_id FROM trips
              WHERE dt=$d GROUP BY 1 HAVING count(*) > 1""",
            'fare mostly present': """SELECT 1 FROM trips
              WHERE dt=$d
              HAVING avg((fare IS NULL)::INT) > 0.01""",
          }
          # hard not_null(fare) fails on 86 of 87 normal days
          # the 1% tolerance fails only on 5 March
        bullets:
          - The rows it returns are the evidence
          - dbt defines its tests in the same way
          - State the tolerance you actually mean
        takeaway: A hard rule on a soft fact gets muted, and then it cannot catch the day that matters.
        source: notes/01-quality-dimensions-and-tests.md
        notes: >-
          Normal days carry about 0.2 percent null fares. A hard not-null would fail nearly every day and be silenced
          within a week. Great Expectations has this built in, as the mostly parameter.
      - layout: compare
        title: Great Expectations and dbt find the same faults
        recall: "When do you use dbt for data tests, and how many homes should a rule have?"
        left:
          title: Great Expectations
          bullets:
            - Declarative expectations, grouped in suites
            - "`mostly=0.99` states the tolerance"
            - Fits files and frames before the warehouse
        right:
          title: dbt tests
          bullets:
            - "`unique`, `not_null`, `accepted_values`, `relationships`"
            - Singular tests are SQL files returning bad rows
            - "`dbt build` skips what is downstream of a failure"
        takeaway: Use dbt when the model lives in dbt and keep one home per rule so rules do not drift.
        source: notes/01-quality-dimensions-and-tests.md
        notes: >-
          We ran both. Great Expectations 1.24 flagged the null spike and the duplicates, and passed the unit change
          because a median of 3.8 fits inside a range that looked generous. dbt found 2,947 duplicate keys.
      - layout: flow
        title: Each gate covers what the last cannot
        recall: "What does write-audit-publish do that a report afterwards cannot?"
        steps:
          - {label: Contract, sub: Names and types, accent: 0F7490}
          - {label: Staging, sub: Hidden from readers, accent: 0EA5C9}
          - {label: Row tests, sub: Rules on this batch, accent: 5B21B6}
          - {label: Publish, sub: Only if it passes, accent: 1E3A5F}
          - {label: Monitors, sub: Against history, accent: D4621A}
        caption: "A contract cannot see a null spike. A row test cannot see a day with no rows."
        takeaway: Write-audit-publish stops bad data before it is read, rather than reporting it afterwards.
        source: notes/01-quality-dimensions-and-tests.md
        notes: >-
          Not every failure should block. Finance numbers and training sets should. A dashboard people glance at may be
          better served by a warning, since a stale chart is a failure too. Decide per table.
      - layout: table
        title: Rules caught two of five
        recall: "Why can no rule within a batch catch the faults the rules missed?"
        header: [Fault, Rule tests, Reconciliation]
        widths: [4, 4, 4]
        rows:
          - ["Null spike", "Caught", "Missed: counts agree"]
          - ["Dropped day", "Missed: no rows", "Caught"]
          - ["Late partition", "Missed", "Missed, once landed"]
          - ["Duplicate keys", "Caught", "Caught"]
          - ["Unit change", "Missed", "Missed"]
        highlight: [2, 4]
        bold_first: true
        takeaway: Every miss is a question about this batch against time, which no rule within a batch can answer.
        source: notes/01-quality-dimensions-and-tests.md
        notes: >-
          Reconciliation against a producer manifest is the only test of accuracy, and it needs an independent count.
          But the misses share a cause. That leads straight into monitors.

  - title: Monitoring against history
    summary: Freshness · Volume · Distribution · Lineage
    notes: >-
      Monitors compare today with the past, so they find failures nobody thought to write a rule for.
    slides:
      - layout: statement
        title: The alert cleared and the data was still missing
        kicker: The problem
        statement: "On 12 March the freshness alert went quiet. The 10 March partition had never arrived."
        recall: "Why is an age check alone not enough?"
        takeaway: An age check tells you the feed is alive, and only a date spine tells you it is complete.
        source: notes/02-monitors-and-lineage.md
        notes: >-
          The newest record was never the problem. There is a hole behind it. Once a newer partition lands, the max of
          loaded_at looks healthy and the alert clears. dbt source freshness has the same blind spot.
      - layout: code
        title: Age alone clears too early
        recall: "How does a spine check differ from an age check after a gap?"
        lang: text
        code: |-
          monitor at     age h  stale  holes
          Mar 11 06:00      28  True   []
          Mar 12 06:00       4  False  [03-10]
          Mar 13 06:00       4  False  [03-10]
          Mar 16 06:00      28  True   [03-10]
          Mar 17 06:00       4  False  [03-15, 03-10]
          Mar 18 06:00       4  False  [03-10]
        bullets:
          - Age fires once, then clears
          - The spine fires until repaired
          - Use both, with different routes
        takeaway: The spine keeps firing until someone repairs the hole, and the age check does not.
        source: notes/02-monitors-and-lineage.md
        notes: >-
          Read the two columns together. The late partition shows the same pattern: the alert clears on the 17th, a
          full day before the data appears on the 18th.
      - layout: table
        title: Same-weekday median sees what three sigma misses
        recall: "Why does a naive three-sigma check let a quarter of the data vanish unseen?"
        lead: "Share of days detected, synthetic feed."
        header: [Rows lost that day, Mean and 3 sigma, Same-weekday median and MAD]
        widths: [4, 4, 5]
        rows:
          - ["0% (false alarms)", "0%", "0%"]
          - ["10%", "0%", "29%"]
          - ["15%", "0%", "67%"]
          - ["25%", "2%", "98%"]
          - ["50%", "36%", "100%"]
        highlight: [3]
        bold_first: true
        takeaway: Weekly cycles inflate a mixed window, so the naive check lets a quarter of the data vanish unseen.
        source: notes/02-monitors-and-lineage.md
        notes: >-
          Both caught the zero-row and doubled days, which makes the naive one look fine. So we removed rows from each of
          46 normal days and counted detections. These figures describe this synthetic feed. Run the same injection on
          your own history before you trust a threshold.
      - layout: compare
        title: Threshold on effect size, not on the p-value
        recall: Why would a chi-squared alarm get worse with more data?
        left:
          title: Our feed, KS test against February
          bullets:
            - "Largest `D` before the change: 0.029"
            - "Smallest `D` after the change: 0.182"
            - Detected on the first day
        right:
          title: Google's TFX experiment
          bullets:
            - 100 million points, 0.01% from a wider normal
            - Chi-squared alarms in 7 of 10 trials
            - L-infinity distance names a culprit too
        emphasis: right
        takeaway: With enough rows, trivial changes become significant, so alert on a distance you can reason about.
        source: notes/02-monitors-and-lineage.md
        notes: >-
          The second column is Breck and colleagues at MLSys 2019. With 3,000 rows a day our p-values still behave. The
          habit to form is a threshold on the effect, and a fixed reference, since a rolling one learns the bug.
      - layout: flow
        title: Monitoring is itself a pipeline
        recall: "How do you key monitoring metrics so a backfill replaces instead of adds?"
        steps:
          - {label: Partition lands, sub: Scheduled metric job, accent: 0F7490}
          - {label: monitor_metrics, sub: Keyed by logical date, accent: 0EA5C9}
          - {label: Baseline, sub: Same weekday, accent: 5B21B6}
          - {label: Alert, sub: "Twice, with an owner", accent: D4621A}
        bullets:
          - A backfill replaced 364 rows and changed none of them
          - The course stores the same shape in Postgres, with Grafana on top
          - Provision dashboards from files, so they live in version control
        takeaway: Key metrics by the data's date rather than the clock, so that a backfill replaces instead of adds.
        source: notes/02-monitors-and-lineage.md
        notes: >-
          The zoomcamp stack is Evidently, Postgres and Grafana. Prediction drift is the first model alarm to wire up when
          labels arrive late, because it needs no ground truth. Ours jumped from 0.022 to 0.679 on the unit change.
      - layout: code
        title: Lineage answers what this touched
        recall: "What does lineage plus run history turn an incident into?"
        lang: python
        code: |-
          walk(down, 'raw.trips')
          # staging.trips, features.trip,
          # marts.daily_revenue,
          # ml.fare_predictions, bi.zone_dashboard
          walk(up, 'bi.zone_dashboard')
          # marts.daily_revenue, ref.zones,
          # staging.trips, raw.trips, ext.vendor_export
          # 20 completed runs to redo since 24 March
        bullets:
          - OpenLineage events carry Job, Run, Dataset
          - Read from a file here, a backend in production
          - Down for blast radius, up for suspects
        takeaway: Lineage plus run history turns an incident into a finite list of datasets to check and runs to redo.
        source: notes/02-monitors-and-lineage.md
        notes: >-
          Each run sends a START and a COMPLETE with a shared run id, and a nominal time facet records which day of data it
          was for. dbt's graph stops at dbt. OpenLineage's point is to work across tools.

  - title: Repairing it
    summary: Roles · Triage · Containment · Backfills · Postmortems
    notes: >-
      A monitor has fired. What happens in the next hour decides whether this costs a morning or a quarter's trust.
    slides:
      - layout: statement
        title: Wrong data stays wrong after the cause is fixed
        kicker: The problem
        statement: "A service outage ends when the service returns. Wrong data keeps being read, and spreads."
        recall: "What do data incidents need that service incidents do not?"
        takeaway: Data incidents need a second half that service incidents do not, which is the backfill.
        source: notes/03-incident-playbooks.md
        notes: >-
          The incident practice here comes from Google's SRE book, which describes services. The adaptation to data is
          engineering judgment, and we have marked the chapter's confidence as medium for that reason.
      - layout: flow
        title: Contain before you diagnose
        recall: "Do you need to know the cause before you stop a dashboard showing bad data?"
        steps:
          - {label: Detect, sub: A monitor fires, accent: 0F7490}
          - {label: Triage, sub: "How bad, how far", accent: 0EA5C9}
          - {label: Contain, sub: Stop the spread, accent: D4621A}
          - {label: Repair, sub: Fix and backfill, accent: 5B21B6}
          - {label: Verify, sub: The same checks, accent: 1E3A5F}
        caption: "Stop the bleeding, restore service, preserve the evidence. In data, evidence means leaving raw alone."
        takeaway: You do not need to know why a metric jumped to stop a dashboard showing it.
        source: notes/03-incident-playbooks.md
        notes: >-
          The priority order is from the SRE book, chapter 14. Preserving evidence has a specific meaning for us: if you
          fix raw files in place, you have destroyed the only record of what the source sent.
      - layout: cards
        title: One group changes the tables
        recall: "Why make incident roles explicit on a small team?"
        cards:
          - {title: Commander, body: "Holds the state, assigns work, decides whether to pause publishing.", accent: D4621A}
          - {title: Operations, body: "The only people changing the system. Runs containment and backfill.", accent: 0F7490}
          - {title: Communications, body: "Tells dashboard and model owners what is wrong and until when.", accent: 0EA5C9}
          - {title: Planning, body: "Tracks hand-applied changes, so that they can be reverted.", accent: 5B21B6}
        takeaway: The common failure is capable people working uncoordinated, so make roles explicit even on a small team.
        source: notes/03-incident-playbooks.md
        notes: >-
          The commander holds any role not delegated, and keeps a living incident document. The book's test for declaring:
          a second team is needed, customers can see it, or it is unsolved after an hour's concentrated work.
      - layout: code
        title: A backfill must be safe to run twice
        recall: "How do you make a backfill safe to run twice?"
        lang: python
        code: |-
          def build_day(day, source='trips_clean'):
              con.execute("BEGIN")
              con.execute("DELETE FROM daily_revenue "
                          "WHERE dt = ?", [day])
              con.execute(f"""INSERT INTO daily_revenue
                  SELECT dt, sum(fare), count(*)
                  FROM {source} WHERE dt = ?
                  GROUP BY 1""", [day])
              con.execute("COMMIT")
        bullets:
          - "Append twice: 34,244 becomes 68,489"
          - "Replace twice: 2,776,463 both times"
          - Run in a transaction, one logical day
        takeaway: In a stressful incident jobs get run twice, so replace one logical day inside a transaction.
        source: notes/03-incident-playbooks.md
        notes: >-
          An appending job turns a repair into a second incident. In a warehouse, the equivalent is a merge or partition
          overwrite. Corrections live in a view above raw, with a dated row and a ticket number.
      - layout: table
        title: Five faults, five runbook pages
        recall: "What is a playbook, and why keep it short?"
        header: [Fault, Contain, Repair, Prevent]
        widths: [3, 3, 5, 5]
        rows:
          - ["Null spike", "Quarantine", "Re-request, rebuild the day", "Tell the source; add a contract"]
          - ["Dropped day", "Mark missing", "Re-export, audit, rebuild", "Date spine; producer manifest"]
          - ["Late partition", "Tell consumers", "Rebuild marts older than input", "Trigger on arrival"]
          - ["Duplicates", "Quarantine", "Dedupe on key in staging", "Idempotent producer; a key"]
          - ["Unit change", "Quarantine from onset", "Dated correction, backfill", "Units in the contract; KS monitor"]
        bold_first: true
        takeaway: A playbook is the decision made in advance, when nobody is stressed, so keep it short.
        source: notes/03-incident-playbooks.md
        notes: >-
          Two repairs cannot be finished from our side. 10 March and the fares on 5 March were never sent. You re-request
          them or publish a labelled estimate. An imputed value presented as repaired is a new fault.
      - layout: bullets
        title: A postmortem pays for the incident
        recall: "What is the only return on an incident?"
        bullets:
          - "Triggers include data loss of any kind, and a monitoring failure"
          - "If a stakeholder found it first, the monitor is one of the things that failed"
          - "Blameless: contributing causes, never a person"
          - "Actions with owners and dates, including at least one new check"
        takeaway: The only return on an incident is a check that catches the next one sooner.
        source: notes/03-incident-playbooks.md
        notes: >-
          The SRE book's reasoning for blamelessness is practical. If people are punished for errors, they stop surfacing
          them. A silent wrong number can sit for weeks if the person who noticed is afraid to say so.

  - title: Changing a live store
    summary: Locks · Safe forms · Expand and contract · Restores · Pools · Disk
    notes: >-
      The taxi feed steps aside here, and these chapters use their own benches. A real Postgres runs under load while we
      change it, restore it and run it out of connections.
    slides:
      - layout: statement
        title: A one-millisecond ALTER stops the reads
        kicker: The problem
        statement: "An `ALTER` that needs a millisecond stalled reads for 2,003 ms."
        attribution: "Postgres 16.2 on a laptop: it queued behind a report that ran on for 2 s. With a 100 ms `lock_timeout`, the worst stall was 101 ms"
        recall: "Why can a one-millisecond ALTER take a site down?"
        takeaway: A fast statement queues for its lock with every new query behind it, so set `lock_timeout` in the migration's session and retry.
        source: notes/04-schema-and-data-migrations.md
        notes: >-
          The report holds a weak lock, which conflicts with ACCESS EXCLUSIVE, so the ALTER waits, and new reads wait
          behind the ALTER even though they do not conflict with the report. The price of the timeout is that the ALTER
          did not happen, so the migration has to retry. Set it per session, not in postgresql.conf.
      - layout: table
        title: Split the slow work from the strong lock
        lead: "Worst stall seen by a small application. Postgres 16.2, 2,000,000-row table, on a laptop."
        recall: "How do you keep a slow migration step from stalling the application?"
        header: [Change, Direct, Safe form, Safe]
        widths: [2, 2, 6, 1.5]
        rows:
          - ["Column default", "1,461 ms", "A constant default, stored in the catalog, not a volatile one", "1 ms"]
          - ["`NOT NULL`", "157 ms", "`CHECK NOT VALID`, `VALIDATE`, then `SET NOT NULL`", "1 ms"]
          - ["Index", "314 ms", "`CREATE INDEX CONCURRENTLY`", "3 ms"]
          - ["Backfill", "5,237 ms", "Keyed batches of 10,000, each its own transaction", "20 ms"]
        bold_first: true
        takeaway: Spend very little time holding the strongest lock, and do the slow part under weak locks or in short keyed transactions.
        source: notes/04-schema-and-data-migrations.md
        notes: >-
          The shape holds and the absolute times grow with your tables. Only ACCESS EXCLUSIVE blocks a plain SELECT. A
          failed concurrent build leaves an INVALID index to drop. And a backfill alone is wrong on a live table: 1,932 rows
          came out wrong because the application kept writing, until a trigger and a repair pass took that to zero.
      - layout: flow
        title: Expand, migrate, contract
        recall: "How do you rename a column while old and new code both run?"
        steps:
          - {label: Add column, sub: "new, nullable", accent: 0F7490}
          - {label: Dual write, sub: both columns current, accent: 0EA5C9}
          - {label: Backfill, sub: then verify, accent: 5B21B6}
          - {label: Read new, sub: then stop old writes, accent: 1E3A5F}
          - {label: Contract, sub: drop the old column, accent: D4621A}
        bullets:
          - "Naive rename: 403 `UndefinedColumn` errors in half a second"
          - "Expand, migrate, contract: 0 errors, old code then new"
          - "A new embedding model takes the same moves: a second index, then an alias swap"
        takeaway: Keep old and new code working at every step, and delay the drop, the one step with no rollback, until no reader remains.
        source: notes/04-schema-and-data-migrations.md
        notes: >-
          Fowler calls this parallel change. Until contract, rollback is a redeploy or dropping the new column. After it,
          rollback is a restore from backup. A warehouse move is the same pattern: in our DuckDB simulation with a one-hour
          session difference planted, totals agreed to the cent and no day of 367 matched, so compare per partition and key.
      - layout: code
        title: Only a restore proves a backup
        recall: "How do you know a backup works?"
        lang: text
        code: |-
          # 1M accounts at 1,000, dumped during transfers
          real dump : ok in 0.40 s
                      invariant = 1,000,000,000

          # a job that wrote nothing
          empty file: FAILED
                      input file is too short
        bullets:
          - "GitLab 2017: `pg_dump` 9.2 against a 9.6 server failed every time"
          - "The failure emails were rejected, so nobody knew"
          - "A replica is no backup: it replays your mistake"
        takeaway: Only a scheduled restore that checks an invariant proves a backup, and the alert should fire when success is missing.
        source: notes/05-operating-data-stores.md
        notes: >-
          Run on Postgres 16.2 on a laptop. An exit code or a file proves neither. A real drill runs on other hardware and
          records the time, which is your measured recovery time. A dump loses everything since: with a base backup and
          archived WAL, our recovery to just before a bad DELETE brought all 5,000 orders back on a new timeline.
      - layout: compare
        title: 100 clients, 30 connections
        recall: "What does a pool change when clients outnumber connections?"
        left:
          title: No pool
          bullets:
            - "100 clients, 5 requests each, 50 ms of work"
            - "**349 of 500** requests failed"
            - "0.40 s in total, slowest 99 ms"
        right:
          title: Pool of 10
          bullets:
            - "The same traffic and the same server"
            - "**0 of 500** requests failed"
            - "2.58 s in total, slowest 521 ms"
        emphasis: right
        takeaway: A pool turns failure into waiting, so pool and queue in front of the database instead of raising `max_connections`.
        source: notes/05-operating-data-stores.md
        notes: >-
          Each connection is a server process, and max_connections is fixed at start and sizes shared memory. Connecting cost
          1.27 ms against 0.02 ms for reuse, on a local socket with no TLS, so the real gap is larger. PgBouncer was read
          about and not run. Its transaction mode breaks session state such as SET lock_timeout, so run migrations directly.
      - layout: table
        title: What grows when no new data arrives
        lead: "Measured on Postgres 16.2 on a laptop, with autovacuum off for the demonstration."
        recall: "Why can a Postgres table or disk grow while no new data arrives?"
        header: [Cause, Measured here, Guard]
        widths: [3, 5, 4]
        rows:
          - ["Updates, no vacuum", "16.9 MB became 67.6 MB after 3 full updates", "Keep autovacuum on, tune per table"]
          - ["Idle transaction", "200,000 dead rows `VACUUM` could not remove", "Timeout on idle transactions"]
          - ["Slot nobody reads", "978 MB of WAL held after 3 updates of 1M rows", "Alert; `max_slot_wal_keep_size`"]
          - ["Bulk update", "278 MB of WAL for a 73 MB table", "Plan headroom for operations"]
        bold_first: true
        takeaway: Dead rows, unread slots and bulk writes fill a disk slowly and without alarm, so graph each one and alert on the trend.
        source: notes/05-operating-data-stores.md
        notes: >-
          VACUUM frees space for reuse, and only VACUUM FULL returns it, under ACCESS EXCLUSIVE. A full disk stops the primary.
          Replicas have their own trap: a read straight after a write was stale 194 times in 200 on an idle pair, so never
          route a read-your-own-write through one unchecked. Wraparound is the failure to know by name.

  - title: Shipping the change
    summary: CI · Deploys · Service levels · On-call
    notes: >-
      Everything so far assumed someone was careful. This part makes the careful path the default one, from pull request to
      the page that wakes someone.
    slides:
      - layout: statement
        title: Correct models, wrong numbers
        kicker: The problem
        statement: "A data team can write correct models and still ship wrong numbers."
        attribution: "A change goes straight to production, and the first alert is a message from finance"
        recall: "What is DataOps in one line?"
        takeaway: DataOps applies software delivery habits to data, with version control, automated tests, isolated environments, automated deploys and service levels.
        source: notes/06-dataops.md
        notes: >-
          The DataOps Manifesto is stewarded by a vendor, so read it as a statement of intent. Snowflake against Airflow is not
          a real comparison, since one stores and computes and the other schedules. DataOps sits across the layers, and it
          changes how each one gets changed.
      - layout: flow
        title: A change reaches production through its own schema
        recall: "How do you stop a bad model reaching production without rebuilding everything?"
        steps:
          - {label: Pull request, sub: "lint DAGs, scan secrets", accent: 0F7490}
          - {label: Build, sub: "what changed, temporary schema", accent: 0EA5C9}
          - {label: Test, sub: red blocks the merge, accent: D4621A}
          - {label: Deploy, sub: "audit, then switch readers", accent: 5B21B6}
          - {label: Watch, sub: the SLO, accent: 1E3A5F}
        bullets:
          - "`state:modified+`: 5 of 12 resources in the demo dbt project"
          - "`--defer`: reads production for what it did not build"
          - "A failed `unique` test left production at its 28 rows"
        takeaway: Build what changed and its dependents in a temporary schema as a required check, so a failing test stops the merge with production untouched.
        source: notes/06-dataops.md
        notes: >-
          dbt 1.12 and DuckDB ran for real here; dbt's hosted CI did not. Rolling back code does not roll back rows, so build
          beside the old version, audit, and swap a view, which took about a millisecond on a local file. Terraform was modelled
          and not run: read every plan for destroys, since some edits replace the resource, and rotate any secret that reaches git.
      - layout: code
        title: Spend a budget, page on the symptom
        recall: "What should page someone about late batches, and what should not?"
        lang: text
        code: |-
          # SLO: 99% of hourly batches within 30 min, 28 days
          batches: 672   SLI: 98.51%
          budget: 6.72 late batches
          spent:  10 (149%), 5 outage + 5 scattered

          page on any task failure: 33 pages
          page on the symptom:      1 page
          symptom page at hour 412, outage began at 411
        bullets:
          - "A simulation with chosen rates: keep the method, not the values"
          - "Retries had already absorbed all 33 failures"
          - "Over budget, the agreed policy applies"
        takeaway: Page on actionable symptoms that threaten the SLO, and send task failures and scattered late batches to a ticket and the budget review.
        source: notes/06-dataops.md
        notes: >-
          An error budget is one minus the target, and the policy for spending it is agreed in advance. The symptom rule is 2 of
          the last 6 batches late. Burn-rate thresholds from the SRE workbook do not fit here, because one batch is 15% of the
          budget. A target has to come from what users need, and these numbers do not tell you what yours should be.

  - title: Rules of thumb
    summary: What to keep
    agenda: false
    divider: false
    slides:
      - layout: cards
        title: Rules of thumb
        recall: "What finds a data fault, what bounds it, and what repairs it?"
        cards:
          - {title: State a tolerance, body: "A hard rule on a soft fact gets muted. Bad rows are the evidence.", accent: 0EA5C9}
          - {title: Rules and history, body: "A test asks about a batch. A monitor asks about a batch against time.", accent: 0F7490}
          - {title: Spine with age, body: "Pair `max(loaded_at)` with a date spine.", accent: 5B21B6}
          - {title: Same weekday, body: "Median and MAD. Validate by injecting losses.", accent: 1E3A5F}
          - {title: Contain first, body: "Never fix raw in place. Correct in a dated layer.", accent: D4621A}
          - {title: Run it twice, body: "Prove the backfill is idempotent before you need it.", accent: 0F7490}
        takeaway: Tests and monitors find it, lineage bounds it, and an idempotent backfill repairs it.
        source: notes/03-incident-playbooks.md
        notes: >-
          If you keep one habit, make it the last one. Almost everything else can be improved during an incident, but a
          job that doubles the mart on a rerun cannot.
