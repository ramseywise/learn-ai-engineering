name: bayesml
# STALENESS NOTE (#37): This env was authored for Python 3.5 + PyMC3.
# PyMC3 is incompatible with PyMC 4+ (different backend: theano vs pytensor).
# Pin pymc3==3.11.4 and theano-pymc==1.1.2 to run week_4 notebooks as-is.
# For PyMC 5, see CamDavidsonPilon _PyMC_current notebooks.
# week_5 and final_assignment use TF 1.x (tf.Session/tf.placeholder) — pin tensorflow==1.15.
dependencies:
  - python=3.7  # 3.5 EOL; 3.7 is latest compat with pymc3==3.11.4 + theano-pymc
  - numpy
  - tensorflow==1.15  # week_5/final use tf.Session; TF 1.x required
  - matplotlib
  - keras==2.3.1  # last version compatible with TF 1.x
  - pandas
  - pymc3==3.11.4  # pin; incompatible with PyMC 4+
  - theano-pymc==1.1.2  # pymc3 backend
  - nb_conda_kernels
  - requests
  - pip
  - scikit-learn
