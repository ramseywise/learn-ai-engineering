deck:
  title: Clean
  subtitle: Every column the type it claims
  tagline: "Text · Duplicates · Gaps · Impossible values · One function · Dates · Time zones"
  reference: "Notes: data-analytics/01-python-for-data-analysis/notes/05-cleaning.md, 06-dates-and-times.md"
  output: 02-clean.pptx
  notes: >-
    The shop's export is loaded, and the file is a mess. By the end you should be able to take it to a frame in which
    every column is the type it claims to be, every removed row is accounted for, and the whole job is one function you
    can rerun next month. Dates get their own half, because a date is a type with a format, a resolution, a time zone
    and a calendar.

lecture:
  covers:
    - data-analytics/01-python-for-data-analysis/notes/05-cleaning.md
