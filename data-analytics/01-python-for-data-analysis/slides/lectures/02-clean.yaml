          - {title: Coerce, body: "Count the `NaN` and `NaT` it makes, and read `min` and `max`."}
          - {title: Gaps, body: "Ask why a value is missing before filling or dropping."}
          - {title: Assertions, body: "Assert the range and allowed values, not only the dtype."}
          - {title: Dates, body: "State the format. A period for a whole month."}
          - {title: Time zones, body: "Store in UTC. Pick the reporting zone before grouping."}
        takeaway: Keep the raw file, count what coerce makes, ask why a value is missing, assert meanings and store time in UTC.
