# Lecture on notes/07-groupby-and-aggregation.md and notes/08-time-series.md, in the notes' order.
# make slides PILLAR=data-analytics/01-python-for-data-analysis LECTURE=03-summarise STRICT=1 PREVIEW=1
deck:
  title: Summarise
  subtitle: One number per group
  tagline: "Split, apply, combine · Keys · agg · transform · filter and apply · Pivot tables · Shift · Resample · Rolling"
  reference: "Notes: data-analytics/01-python-for-data-analysis/notes/07-groupby-and-aggregation.md, 08-time-series.md"
  output: 03-summarise.pptx
  notes: >-
    The third step turns a clean table into one number per group, and time is one more group key. By the end you should
    pick agg, transform, filter or apply by the shape that comes back, compute a rate as a ratio of sums, and know how
    shift, resample and rolling windows can leak the future.

lecture:
  covers:
