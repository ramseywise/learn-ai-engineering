# Python for Data Analysis lecture deck. Covers notes 01-08 (plotting moved to data-analytics/05-visualisation-and-storytelling, note 01b).
# Build: make slides PILLAR=data-analytics/01-python-for-data-analysis STRICT=1 PREVIEW=1
# Spec:  .claude/skills/slides/references/deck-spec.md
# Running example: a small online shop, with 11 clean orders and a synthetic year of daily revenue.
# Every number on the slides is real output from the code in the notes, on pandas 3.1.0.
deck:
  title: Python for Data Analysis
  subtitle: From a messy export to a chart you can trust
  tagline: |-
    Load it · Select and join it · Clean it · Summarise it · Respect time
  reference: "Notes: data-analytics/01-python-for-data-analysis"
  output: python-for-data-analysis.pptx
  notes: >-
    Today we meet pandas from the start. We follow one small online shop that sells kettles, grinders, filters and
    scales. Its data arrives as a messy export, and by the end we can load it, select and join it, clean it, summarise it
    and put it on a time axis. The theme is that the dangerous errors here do not raise exceptions. They produce a clean number that is wrong.

parts:
  - title: What a clean table lets you say
    overview: true
    summary: The question · Five steps · What you will be able to do
    notes: >-
      Before any call, here is the one question this lecture keeps asking and the five steps we take to answer it.
    slides:
      - layout: statement
        beat: problem
        title: Is this number the one you meant?
        card: false
        recall: What question does every step of this lecture ask?
        kicker: The idea
        statement: "A small online shop sends a messy export. Every question we put to it has a tempting answer that looks right and raises no error."
        attribution: A synthetic shop that sells kettles, grinders, filters and scales
        takeaway: In pandas the dangerous mistakes give a clean number that is wrong, so each step comes with the check that catches it.
        source: README.md
        notes: >-
          We follow one shop from a messy CSV to a chart. Each part opens with a result that looks fine and is not, states the rule behind it, and then applies the rule to the shop's data.

      - layout: flow
        beat: fundamentals
        title: Five steps from an export to a number
        card: false
        recall: What are the five steps of this lecture, from the raw export to a number you can trust?
        answer: "Load (a frame that matches the file), Select (the right rows and tables), Clean (every column the type it claims), Summarise (groups without fooling yourself), and Time (bins and windows)."
        steps:
          - {label: Load, sub: "a frame that matches the file"}
          - {label: Select, sub: "the right rows and tables"}
          - {label: Clean, sub: "every column the type it claims"}
          - {label: Summarise, sub: "groups without fooling yourself"}
          - {label: Time, sub: "bins and windows", accent: "D4621A"}
        bullets:
          - "Each step opens with **the idea**, states **the principle**, then **applies** it to the shop."
          - "Each step ends on the mistake it usually produces."
        takeaway: The steps run from getting the table right to showing it, and each one ends on the check that catches its usual error.
        source: README.md
        notes: >-
          Chapters one and two get a frame that matches the file, three and four select and join, five and six clean, including dates, seven summarises and eight puts time on the axis. Charts come later, in the visualisation module.

      - layout: cards
        beat: wrap
        title: By the end you will be able to
        card: false
        recall: Name four things this lecture teaches you to do with a table.
        answer: "Load a messy CSV with the decisions stated, select and join with checks, clean text, types, dates and gaps in one function, summarise with agg, transform and filter, and resample and shift without leakage."
        cards:
          - {title: Load and select, body: "Read a messy CSV with the decisions stated, use loc, iloc and masks without surprises, and merge with checks."}
          - {title: Clean, body: "Fix text and types, decide what gaps mean, parse dates and wrap it all in one function."}
          - {title: Summarise, body: "Use agg, transform and filter, and compute ratios correctly."}
          - {title: Time, accent: "D4621A", body: "Resample and shift without leakage, and keep timestamps in UTC."}
        takeaway: You will be able to load, select, clean and summarise a table, and say how you know the number is the one you meant.
        source: README.md
        notes: >-
          This lecture assumes the Python of the programming track and no previous pandas. The next pillar asks whether a difference in these tables is real.

  - title: Loading a table without changing it
    summary: Why a DataFrame · Alignment · Dtypes · Copy-on-Write · Stating the parse
    notes: >-
      We start with the data structure, and then with the file we actually receive. By the end of this part the frame
      matches the file, mess included. Cleaning what is wrong inside it comes later, once we can select and join.
    slides:
      - layout: statement
        beat: problem
        title: Why not just use a list of dictionaries?
        kicker: The problem
        statement: "A DataFrame is a table whose rows and columns carry labels, and whose operations match on those labels."
        attribution: McKinney built pandas for labelled statistical data (SciPy 2010)
        takeaway: A DataFrame replaces loops over row dictionaries with named column operations that align on labels.
        source: notes/01-series-and-dataframe.md
        notes: >-
          The shop's first orders fit in a list of dictionaries, and computing revenue means writing a loop for every question.
          With a frame, the same question is one line that says what it means. That saving is why pandas exists. But the
          deeper idea is the one on this slide: labels are not decoration. Let's see what they do.

      - layout: code
        beat: fundamentals
        title: Pandas matches on labels, not on positions
        recall: "What happens when you add Series whose labels differ?"
        answer: "Pandas aligns on labels, not positions. The result has the union of the labels, and any label present on only one side gives NaN instead of a guess."
        lang: python
        code: |-
          week1 = pd.Series(
              {"kettle": 4, "filter": 30, "grinder": 2})
          week2 = pd.Series(
              {"filter": 25, "scale": 6, "kettle": 5})
          print(week1 + week2)
          # filter     55.0
          # grinder     NaN
          # kettle      9.0
          # scale       NaN
        bullets:
          - "**Same label, same row,** whatever the order."
          - "**Result:** the union of labels."
          - "**One side missing:** `NaN`, not a guess."
          - "**Bare NumPy** would add by position and give `[29 36 7]`."
        takeaway: Arithmetic between Series aligns on labels and gives NaN where a label exists on only one side.
        source: notes/01-series-and-dataframe.md
        notes: >-
          Two weeks of units sold, with products in different orders and not quite the same products. Filter meets filter,
          kettle meets kettle. Grinder has no partner, so the result is NaN, because pandas will not pretend it knows what two
          plus nothing is. The same numbers as bare arrays give 29, 36 and 7, which is meaningless, and nothing warns you.

      - layout: flow
        beat: fundamentals
        title: Four checks on every new frame
        recall: "Which checks do you run on every new frame?"
        answer: "Run shape, dtypes, head and isna().sum(). Together they show the size, the types, real values and the gaps per column, which is where most problems appear first."
        steps:
          - {label: "`shape`", sub: "the rows and columns the source says it holds"}
          - {label: "`dtypes`", sub: "a number stored as `str` concatenates"}
          - {label: "`head`", sub: "stray capitals, symbols, odd formats"}
          - {label: "`isna().sum()`", sub: "gaps per column", accent: "D4621A"}
        bullets:
          - "A whole-number column printing `.0` is hiding a gap, because `NaN` is a float."
        takeaway: Run shape, dtypes, head and isna().sum() on every new frame, since most problems show up there first.
        source: notes/01-series-and-dataframe.md
        notes: >-
          This is the habit that pays for the whole chapter. Dtypes deserve special care because they decide what an operation
          means. And a column of whole numbers printing as floats is the classic sign of a missing value, because NaN is a float.

      - layout: code
        beat: pitfalls
        title: "Pandas 3: a selection behaves like a copy"
        recall: Why does chained assignment no longer change a frame in pandas 3, and what do you write instead?
        answer: "Under Copy-on-Write any selection behaves like a copy, so assigning onto it changes a temporary that is thrown away. Write one call instead, such as fixed.loc[mask, \"qty\"] = 0."
        lang: python
        code: |-
          fixed = orders.copy()
          fixed["qty"][fixed["customer"] == "ana"] = 0
          # ChainedAssignmentError warning; nothing changes
          fixed.loc[fixed["customer"] == "ana", "qty"] = 0
          # one .loc call: this works
        bullets:
          - "**Copy-on-Write** is the only mode in pandas 3."
          - "**Old books** warn about views and `SettingWithCopyWarning`, which is gone."
          - "**One rule:** to change part of a frame, use a single `.loc`."
        takeaway: Under Copy-on-Write any selection acts as a copy, so change part of a frame with a single .loc call.
        source: notes/01-series-and-dataframe.md
        notes: >-
          This is where older material will actively mislead you. The first form selects, then assigns onto a temporary that is
          thrown away, and pandas warns about it. The second makes the selection and the assignment in one call, so it reaches the frame.

      - layout: table
        beat: problem
        title: A parse that ran without error is still not right
        recall: What can go wrong when read_csv runs on the shop's raw export without options?
        answer: "The banner line becomes the header (shape (14, 1)), qty loads as float64 because n/a is missing and a gap promotes it, unit_price stays text because of the dollar signs, date stays text, and the file's own - marker for a missing region is not known to pandas."
        lead: "The shop's raw export: first read with no options, then with the banner line skipped."
        header: [Column, What pandas gave, Why]
        widths: [2, 2, 6]
        rows:
          - ["Whole file", "shape `(14, 1)`", "The banner line became the header, so the real columns collapsed"]
          - ["`qty`", "`float64`", "`n/a` is missing by default, and a gap promotes the column to float"]
          - ["`unit_price`", "`str`", "The dollar signs keep it text"]
          - ["`date`", "`str`", "Pandas does not guess dates unless you ask"]
          - ["`region`", "`-` kept as text", "The `-` is this file's own marker, so pandas cannot know"]
        takeaway: read_csv almost never fails, so check shape, dtypes and isna().sum() against what the file should hold.
        source: notes/02-loading-data.md
        notes: >-
          Read the raw text before you parse anything: the first line is not data. The naive call gives a frame of one column named
          after the banner, and the shape gives it away, which is why we check it. Even after the comment line is handled, the parse runs
          without error and is still not right.

      - layout: cards
        beat: fundamentals
        title: State the decisions read_csv would otherwise guess
        recall: Which read_csv options state a parse decision, and what does each protect against?
        answer: "comment skips a banner line, na_values names a file's own missing marker, parse_dates gives real dates, and dtype keeps an identifier such as 01234 as text instead of the integer 1234."
        cards:
          - title: comment
            body: "Skips the banner line, so it is not the header."
          - title: na_values
            body: "Names the file's own marker, such as `-`."
          - title: parse_dates
            body: "Asks for real dates, since pandas does not guess."
          - title: dtype
            body: "`{\"zip\": \"str\"}` keeps `01234`. Guessing gives the integer 1234."
        takeaway: State the comment line, the missing markers, the dates and the identifier types, because read_csv guesses the rest.
        source: notes/02-loading-data.md
        notes: >-
          McKinney groups the options by purpose: indexing, type inference and conversion, date parsing, iterating over big files and handling unclean data.
          There are over 50 parameters, so when a file will not parse, go to the docs and not to memory. Pass encoding explicitly too, because the
          default differs across systems. The other readers follow the same pattern: learn read_csv and you know most of read_json, read_excel, read_parquet and read_sql.

      - layout: code
        beat: practice
        title: The shop's export, loaded with the decisions stated
        recall: Which three read_csv options load the shop's export with the banner, the dash marker and the dates handled?
        answer: "Pass comment=\"#\", na_values for the file's own - marker in region, and parse_dates=[\"date\"], then check isna().sum(): qty and region each have 2 gaps."
        lang: python
        code: |-
          orders = pd.read_csv(
              "orders_raw.csv",
              comment="#",
              na_values={"region": ["-"]},
              parse_dates=["date"],
          )
          print(orders.isna().sum())
          # qty         2
          # region      2
          # (the rest   0)
        bullets:
          - "**`date`** is now `datetime64`."
          - "**`qty`** is still `float64`: the gaps are real, and cleaning decides them."
          - "**`unit_price`** is still text. Fixing values is cleaning."
        takeaway: Load without changing the data, check the missing counts, and leave the fixes to the cleaning step.
        source: notes/02-loading-data.md
        notes: >-
          The frame now matches the file, mess included. Two cells say n/a, one is a blank region and one is a dash. The next parts take only the rows we mean and join other tables,
          and then the cleaning chapter fixes what is wrong inside the values. A peek with nrows=4 would have shown qty as an integer, because the n/a lies further down,
          so a peek tells you the layout of a file and nothing about the types of the full column.

  - title: Asking for the right rows and tables
    summary: loc and iloc · Boolean masks · Merge with checks · Long and wide
    notes: >-
      Now we have a frame that matches the file. This part is about asking for exactly the rows you mean, and bringing in other tables
      without changing the answer by accident. The examples use the 11 clean orders that the cleaning chapter produces from the export.
    slides:
      - layout: statement
        beat: problem
        title: Which row is "row 1" after you filter?
        kicker: The problem
        statement: "Filtering keeps the original labels, so label 3 can sit at position 1. loc and iloc then give different answers, and neither complains."
        attribution: Say which you mean, every time
        takeaway: After a filter, labels and positions differ, so use loc for labels and iloc for positions.
        source: notes/03-indexing-and-selection.md
        notes: >-
          With a fresh default index, labels and positions happen to match, which teaches a bad habit. The first filter breaks it.
          Everything in this chapter follows from keeping those two ideas apart.

      - layout: compare
        beat: fundamentals
        title: loc and iloc differ in more than labels
        recall: How do loc and iloc differ on slices, and which one works with a boolean mask and a column name?
        answer: "loc slices include the end, so df.loc[0:2] gives three rows, while iloc slices exclude it and give two. loc accepts masks and column names; iloc takes integers only."
        left:
          title: loc
          tag: labels
          bullets:
            - "`df.loc[0:2]` includes the end: three rows"
            - "Takes masks and column names"
            - "`df.loc[mask, \"qty\"] = 0` is the way to set values"
        right:
          title: iloc
          tag: positions
          bullets:
            - "`df.iloc[0:2]` excludes the end: two rows"
            - "Integers only, like a Python list"
            - "The way to say \"the first row\""
        takeaway: loc slices include the end and accept masks and names, while iloc slices exclude the end and accept only integers.
        source: notes/03-indexing-and-selection.md
        notes: >-
          Masks combine with an ampersand and a pipe, with parentheses around each condition, because the words and and or do not
          work element by element. The sum of a mask counts the matching rows, and its mean is the share.

      - layout: code
        beat: practice
        title: The same frame, two meanings of a number
        recall: Why does filters.loc[0] raise a KeyError on the filtered frame?
        answer: "A filtered frame keeps its original labels, and label 0 was a kettle that the filter removed. loc looks up labels, so label 0 no longer exists, while iloc counts positions from zero."
        lang: python
        code: |-
          filters = orders[orders["product"] == "filter"]
          #    order_id customer
          # 1      1002      ben
          # 3      1004     cara
          # 6      1007      eli
          # 9      1011      dev
          filters.iloc[1]["order_id"]   # 1004: second row
          filters.loc[3]["order_id"]    # 1004: label 3
          filters.loc[0]                # KeyError: 0
        bullets:
          - "**`iloc`** counts positions from zero."
          - "**`loc`** looks up labels, and label 0 was a kettle."
          - "**`reset_index(drop=True)`** renumbers after a filter."
        takeaway: A filtered frame keeps its labels with gaps, so position 1 can be label 3 and label 0 may no longer exist.
        source: notes/03-indexing-and-selection.md
        notes: >-
          Position 1 is the second row, whose label happens to be 3. Label 0 no longer exists, since order 1001 was a kettle.
          One more trap: a slice with loc includes its end, so loc zero to two has three rows, while iloc zero to two has two.

      - layout: code
        beat: pitfalls
        title: A careless join took revenue from 523.5 to 756.0
        recall: What happens to a total when you merge on a key that repeats on both sides, and how do you catch it?
        answer: "Rows multiply and the total inflates without any error: here rows went from 11 to 16 and revenue from 523.5 to 756.0. Passing validate=\"many_to_one\" raises a MergeError instead."
        lang: python
        code: |-
          blown = orders.merge(promos, on="customer",
                               how="left")
          # rows:    11 -> 16
          # revenue: 523.5 -> 756.0, and no error
          orders.merge(promos, on="customer", how="left",
                       validate="many_to_one")
          # MergeError: Merge keys are not unique in right
        bullets:
          - "**Repeats on both sides** multiply rows."
          - "**`validate`** turns a silent error into a loud one."
        takeaway: A merge on a key that repeats on both sides multiplies rows and inflates totals without error, so state validate.
        source: notes/04-reshaping-and-joins.md
        notes: >-
          This is the most expensive mistake in the chapter. Ana has two orders and two promotions, so four rows. Ben has three orders
          and two promotions, so six. Revenue goes up because rows were duplicated, and nothing raised an error.

      - layout: flow
        beat: fundamentals
        title: Four checks make any join safe
        recall: "What do you state and compare on every merge?"
        answer: "State how and validate, then compare the row count and one total before and after. In the shop that means 11 rows and revenue 523.5 both before and after."
        steps:
          - label: State how
            sub: "The default inner join drops unmatched rows."
          - label: State validate
            sub: "`many_to_one` checks the key really is unique on the right."
          - label: Compare row counts
            sub: "Before and after: 11 and 11."
          - label: Compare one total
            sub: "Revenue stays 523.5."
        caption: Audit unmatched keys with indicator=True, and clean keys first, since "Ana" and "ana " will not join.
        takeaway: On every merge state how and validate, then compare the row count and one total before and after.
        source: notes/04-reshaping-and-joins.md
        notes: >-
          The same checks apply to any SQL you write later. With them in place, joining orders to customers and products answers
          a question no single table could. Brew gear brings the most margin at 142.0, but consumables keep about 62 of every 100 in revenue.

      - layout: compare
        beat: fundamentals
        title: Long for analysis, wide for reading
        recall: Which shape do groupby and seaborn want, and what do melt and pivot do?
        answer: "They want long (tidy) data, with one row per observation. melt turns wide data into long, and pivot turns long into wide (pivot_table when keys repeat)."
        left:
          title: Long (tidy)
          tag: one row per observation
          bullets:
            - "Each variable is a column"
            - "What `groupby` and seaborn expect"
            - "Get there with `melt`"
        right:
          title: Wide
          tag: one column per category
          bullets:
            - "Easy for people to scan"
            - "Good for reports"
            - "Get there with `pivot`, or `pivot_table` when keys repeat"
        takeaway: Tidy long data has one variable per column and one observation per row, which is what groupby and seaborn expect.
        source: notes/04-reshaping-and-joins.md
        notes: >-
          Wickham's tidy data gives us the vocabulary. Before any aggregation, ask what one row means. Use plain pivot only when keys are
          unique, since it raises an error on repeats, and pivot_table otherwise.

  - title: Cleaning, and the date type
    summary: Text and numbers · What a gap means · One rerunnable function · Parsing dates · Time zones
    notes: >-
      The orders we selected from were already clean. The export is not, so now we make it so, and then we look at the one type that carries more than a number does.
    slides:
      - layout: statement
        beat: problem
        title: Can anyone rerun your cleaning?
        card: false
        kicker: The problem
        statement: "Prices carry currency signs, categories are spelled three ways, one row appears twice and a quantity says n/a."
        attribution: Wickham, Tidy Data (JSS 2014) - preparation is repeated as new problems surface
        takeaway: You will clean the same data again, so cleaning should be a script you can rerun and not a set of edits you did once.
        source: notes/05-cleaning.md
        notes: >-
          It is often said that 80 percent of data analysis goes on cleaning. Treat the 80 percent as folklore. The useful half of Wickham's remark is that preparation gets repeated as new problems surface.
          By the end of the part, every column is the type it claims to be and every removed row is accounted for.

      - layout: table
        beat: pitfalls
        title: A gap is a question, not a value to fill
        recall: How do you decide what to do with a missing value?
        answer: "Ask why it is missing. Not recorded gets labelled unknown, a lost value is confirmed with the owner, and a return is removed and reported. Filling with the mean by reflex can invent data."
        header: [In the shop's export, What it means, What we did]
        widths: [3, 4, 3]
        rows:
          - ["`region` blank or `-`", "Not recorded", "Label it `unknown`, and keep the row"]
          - ["`qty` is `n/a` on order 1006", "A value that exists but got lost", "Confirm with the owner, set it to 1"]
          - ["`qty` is -1 on order 1008", "A return, not a sale", "Remove it, and say so"]
          - ["Order 1006 appears twice", "Duplicate export row", "Drop on `order_id`"]
        takeaway: Decide what to do with a missing value by asking why it is missing, because filling with the mean by reflex can invent data.
        source: notes/05-cleaning.md
        notes: >-
          Filling with the mean shrinks the variance and can invent values that are impossible. So ask why each gap exists. And
          when you coerce, count: errors equal to coerce turns every failure into NaN without a word.

      - layout: flow
        beat: practice
        title: The export becomes a clean frame in one rerunnable function
        recall: What are the steps from raw CSV to clean frame, and why put them in a function?
        answer: "Read the raw text, parse with options, fix text and types, drop rows with reasons, then assert. One function over an unchanged raw file can be rerun and audited, for example on next month's export."
        lead: 13 raw rows go in, 11 orders come out, and every removal is accounted for.
        steps:
          - label: Read the raw text
            sub: "Find the comment line, the `$`, the `n/a`."
          - label: Parse with options
            sub: "`comment`, `na_values`, dates"
          - label: Fix text and types
            sub: "Strip and lower text, then `to_numeric`."
          - label: Drop with reasons
            sub: "One duplicate, one return."
          - label: Assert
            sub: "Unique ids, no missing prices."
        caption: Keep the raw file unchanged. Next month's export runs through the same steps.
        takeaway: Do every cleaning step in one function over an unchanged raw file, so the work can be rerun and audited.
        source: notes/05-cleaning.md
        notes: >-
          The export has a comment line, Ana and ana, a filter with a trailing space, a dollar sign in the price, a duplicated order
          and a negative quantity. None of this is exotic. Each fix goes into one function that prints how many rows it loaded and
          kept. If you edit the file by hand, nobody can rerun your work, including you next month.

      - layout: code
        beat: problem
        title: A date that sorts by its first character
        recall: Why must a date column be parsed, and what happens if you sort it as text?
        answer: "Text sorts by its first character, so October 2025 (10/1/2025) comes before November 2024. Any latest order or first purchase computed on the text is wrong and nothing says so, so parse with pd.to_datetime and a format."
        lang: python
        code: |-
          txt = pd.Series(
              ["9/1/2025", "10/1/2025", "11/12/2024"])
          txt.sort_values()
          # 10/1/2025, 11/12/2024, 9/1/2025
          pd.to_datetime(
              txt, format="%m/%d/%Y").sort_values()
          # 2024-11-12, 2025-09-01, 2025-10-01
        bullets:
          - "**Text** sorts by character, since `1` sorts before `9`."
          - "**Text** cannot be subtracted and has no month."
          - "**`format=`** stops pandas guessing on ambiguous dates."
        takeaway: A date left as text sorts alphabetically, so parse it with an explicit format before computing anything on it.
        source: notes/06-dates-and-times.md
        notes: >-
          Turning a date into a date type is a cleaning step like turning a price into a number, with the same trap: the conversion can succeed and still be wrong.
          03/04/2025 is the 3rd of April to one person and the 4th of March to another. Pandas 3.0 also infers the resolution, usually microseconds, so converting a datetime to an integer
          gives a number 1000 times smaller than old code expected. State the unit with as_unit if you depend on it.

      - layout: cards
        beat: fundamentals
        title: Three types for time, and which one a column holds
        card: false
        recall: What are Timestamp, Timedelta and Period, and which question does each answer?
        answer: "A Timestamp is a moment (when did it happen), a Timedelta is a length of time with no start (how long did it take), and a Period is a whole span with a start and an end (which month was it in)."
        cards:
          - title: Timestamp
            body: "A moment. When did it happen? Prints as `datetime64`."
          - title: Timedelta
            body: "A length of time with no start. How long did it take? Prints as `timedelta64`."
          - title: Period
            accent: "D4621A"
            body: "A whole span with a start and an end. Which month was it in?"
        takeaway: Most confusion about time goes away once you know whether a column holds a moment, a length or a span.
        source: notes/06-dates-and-times.md
        notes: >-
          Subtracting two datetimes gives a timedelta: in the shop, the mean wait from order to shipment is 3 days and 6 hours. A month is not a fixed length, so adding one month needs pd.DateOffset,
          which moves along the calendar: 31 January plus 30 days is 2 March, and plus one calendar month is 28 February. A period label for monthly reporting settles whether a row is labelled by the 1st or the 31st.

      - layout: bullets
        beat: pitfalls
        title: Five ways a date parse goes quietly wrong
        recall: Name the ways a parsed date can still be wrong, and the fix for each.
        answer: "Ambiguous day and month (state format=), a parse that ran (count the NaT and read min and max, since a date in 2052 parses), format=\"mixed\" (it keeps the ambiguity, so parse each source with its own format), 30 days is not a month (use DateOffset or periods), and naive timestamps (store in UTC and pick the reporting zone before daily totals)."
        bullets:
          - "**Ambiguous day and month.** `03/04/2025` is 3 April or 4 March, so state `format=`."
          - "**A parse that ran.** Count the `NaT`, read `min` and `max`: 2052 parses without complaint."
          - "**`format=\"mixed\"`** removes the error and keeps the ambiguity. Parse each source on its own."
          - "**30 days is not a month.** Use `pd.DateOffset(months=1)`, or a period."
          - "**Store in UTC,** convert for display, and pick the reporting zone before daily totals."
        aside: {title: "Which day?", body: "22:00 UTC on March 31 is already April 1 in Oslo, and March 31 there lasted only 23 hours."}
        takeaway: Count what failed, read the earliest and latest date, state the format, and keep timestamps in UTC.
        source: notes/06-dates-and-times.md
        notes: >-
          The error from a column that mixes two formats is the good outcome, because it tells you the column is not what you assumed. A zone-aware timestamp stores UTC, so tz_convert changes only how it is displayed.
          The zone changes the answer to which day, even which month, a sale happened in. Shop opening at 09:00 Oslo time is 08:00 UTC on one day and 07:00 UTC the next, because the offset changed overnight.

  - title: Summarising without fooling yourself
    summary: Split-apply-combine · agg and transform · The mean-of-rates trap · Lost keys
    notes: >-
      Groupby answers most analyst questions. It is also where a confident wrong number most often enters a report.
    slides:
      - layout: statement
        beat: problem
        title: What is the margin rate in each region?
        card: false
        kicker: The problem
        statement: "The obvious answer, averaging a rate per order, gives the wrong number for every region in the shop."
        attribution: The fix is one line, once you see it
        takeaway: Averaging per-order rates weights small and large orders alike, so it gives the wrong group rate.
        source: notes/07-groupby-and-aggregation.md
        notes: >-
          It looks like a simple question, and it has a tempting wrong answer. We get to it after the model that makes groupby simple.

      - layout: flow
        beat: fundamentals
        title: Every groupby is split, apply, combine
        card: false
        recall: What are the three stages of a groupby?
        answer: "Split the rows by key, apply a function to each piece on its own, and combine the results into one object."
        steps:
          - label: Split
            sub: "Divide rows by key."
          - label: Apply
            sub: "Compute on each piece, on its own."
          - label: Combine
            sub: "Put results into one object."
        caption: Wickham's name for the pattern (JSS 2011). Overlapping windows fall outside it and need rolling.
        takeaway: A groupby splits rows by key, applies a function to each piece independently, and combines the results.
        source: notes/07-groupby-and-aggregation.md
        notes: >-
          Wickham gave this pattern its name. Think about what comes out of each piece, because that picks the method.

      - layout: table
        beat: fundamentals
        title: The method depends on what each group should return
        card: false
        recall: How do agg, transform, filter and apply differ in what they return?
        answer: "agg returns one row per group, transform one value per original row, filter a subset of rows kept or dropped by group, and apply anything rebuilt from each piece (slowest)."
        header: [Method, Returns, Example]
        widths: [2, 3, 5]
        rows:
          - ["`agg`", "One row per group", "Revenue and count by region"]
          - ["`transform`", "One value per original row", "Each order's share of its region's revenue"]
          - ["`filter`", "Some rows, kept or dropped by group", "Customers with at least two orders"]
          - ["`apply`", "Anything, rebuilt from each piece", "Top order per region; slowest, so try the others first"]
        takeaway: agg returns one row per group, transform one value per original row, filter a subset of rows, and apply anything.
        source: notes/07-groupby-and-aggregation.md
        notes: >-
          Agg shrinks. Transform keeps the shape, which is why it's the tool for adding a group statistic as a new column. Reach for
          apply last. It is the most flexible and the slowest.

      - layout: table
        beat: practice
        title: Averaging rates overstates every region
        recall: How should you calculate a group's rate, and why is the mean of per-order rates wrong?
        answer: "Sum the numerator and the denominator per group, then divide. A mean of per-order rates weights small and large orders equally, so east shows 0.492 against its true 0.398."
        lead: "Margin rate by region, on the shop's 11 orders."
        header: [Region, Revenue, Margin, Mean of rates, True rate]
        widths: [2, 2, 2, 2, 2]
        highlight: [0]
        rows:
          - [east, "108.0", "43.0", "0.492", "0.398"]
          - [north, "169.0", "69.0", "0.453", "0.408"]
          - [south, "128.5", "64.0", "0.515", "0.498"]
          - [unknown, "118.0", "46.0", "0.415", "0.390"]
        takeaway: To get a group's rate, sum the numerator and the denominator and then divide, because a mean of rates ignores size.
        source: notes/07-groupby-and-aggregation.md
        notes: >-
          East has a small filter order at about 62 percent and a large grinder order at about 37. Averaging gives 0.492, while the shop
          kept 43 of 108, or 0.398. The ranking changes too: east beats north on the mean of rates and loses on the true rate.
          The same trap applies to conversion rate and to cost per click.

      - layout: code
        beat: pitfalls
        title: Name your aggregates, and always keep a count
        recall: Why should every group mean come with a count, and what happens to rows with a missing key?
        answer: "A mean of one order prints as confidently as a mean of ten thousand, so the count shows how much it rests on. Rows with a missing key vanish from a groupby unless you pass dropna=False."
        lang: python
        code: |-
          by_region = orders.groupby("region").agg(
              revenue=("revenue", "sum"),
              margin=("margin", "sum"),
              orders=("order_id", "count"),
          )
          by_region["rate"] = (
              by_region["margin"] / by_region["revenue"])
        bullets:
          - "**A mean of one order** prints as confidently as a mean of ten thousand."
          - "**Missing keys vanish** unless you pass `dropna=False`."
          - "**Check** that the groups add up to the total."
        takeaway: Report a count beside every group statistic, and check that groups add up, because missing keys vanish by default.
        source: notes/07-groupby-and-aggregation.md
        notes: >-
          Named aggregation gives you readable columns. Missing keys are the other silent loss here: a row with no region drops out of
          a groupby, so the groups no longer add up to the total. Size and count also differ when a column has gaps.

  - title: Respecting time
    summary: Gaps · Frequencies · Resampling · Shift and rolling · Leakage
    notes: >-
      The shop now has a full synthetic year of daily revenue. Time looks like one more grouping key, but it has its own rules.
    slides:
      - layout: image
        beat: problem
        title: The whole year in one line
        kicker: The problem
        recall: What can a line chart show about a time series that describe() cannot?
        answer: "The ordering in time: trend, weekly pattern, outages and the December jump. Rows have an order and absent days are invisible in a table, so the line makes gaps and changes visible."
        image: ../../sources/images/da01-plotting-line.png
        caption: Synthetic daily revenue for 2024, with trend, weekly pattern, outages and a December jump. How to draw it is in Plotting your own data (pillar 05).
        bullets:
          - "**Rows have an order,** so a previous value exists."
          - "**Months differ in length,** so monthly totals are not directly comparable."
          - "**A missing day** is often an absent row, invisible in a table."
        takeaway: Time series have ordered rows, unequal months and silently absent days, so they need more care than an ordinary grouping key.
        source: notes/08-time-series.md
        notes: >-
          How did we do last month sounds like a groupby, and it nearly is. But rows have order, months differ, a label can sit at either
          end of a period, and an outage leaves no row at all. Here the line breaks in March for two lost days, because we made gaps visible.

      - layout: table
        beat: fundamentals
        title: Old frequency names now raise an error
        recall: What did pandas 3 change about frequency aliases, and why?
        answer: "It removed the old aliases M, Q, Y, H and T, so write ME, QE, YE, h and min. The reason is ambiguity: ME says month end, as distinct from MS for month start."
        header: [Meaning, Current, Removed]
        widths: [4, 3, 3]
        rows:
          - ["Month end / month start", "`ME` / `MS`", "`M`"]
          - ["Quarter end", "`QE`", "`Q`"]
          - ["Year end", "`YE`", "`A`, `Y`"]
          - ["Hour", "`h`", "`H`"]
          - ["Minute", "`min`", "`T`"]
          - ["Second", "`s`", "`S`"]
        takeaway: Pandas 3 removed the frequency aliases M, Q, Y, H and T, so write ME, QE, YE, h and min instead.
        source: notes/08-time-series.md
        notes: >-
          This is where code from older books breaks most often. The reason is a real ambiguity: ME says month end, as distinct from MS for month start.

      - layout: code
        beat: practice
        title: resample is a groupby on time bins
        recall: What do closed and label control in a resample, and why check count?
        answer: "closed sets which edge of a bin belongs to it and label sets which edge names the bin. count shows how many observations each bin has, exposing that March lost two days."
        lang: python
        code: |-
          # asfreq shows absent days as NaN
          regular = daily.asfreq("D")
          regular.resample("ME").agg(
              ["sum", "mean", "count"])
          #                 sum   mean  count
          # 2024-01-31  11992.8  386.9     31
          # 2024-02-29  12266.4  423.0     29
          # 2024-03-31  12775.1  440.5     29
        bullets:
          - "**`count`** shows March lost two days."
          - "**`mean`** is fair across month lengths."
          - "**`closed`, `label`** set which edge belongs and which names the bin."
        takeaway: Resample into bins with sum, mean and count together, since months differ in length and absent days hide in the sum.
        source: notes/08-time-series.md
        notes: >-
          Asfreq makes the outage visible. Then resample gives a table per month, and count exposes that March has only 29 observations.
          A bin is an interval. For month-end bins, pandas defaults to closing and labelling on the right. For five-minute bins, on the left. Choose on purpose where it matters.

      - layout: compare
        beat: pitfalls
        title: A window that peeks ahead is cheating
        recall: What is leakage in a time series, and which two pandas options cause it?
        answer: "Leakage is a feature reading the future, which cannot exist in production. A negative shift such as shift(-1) and center=True in a rolling window both cause it."
        emphasis: left
        left:
          title: Backward-looking
          tag: safe in a model
          bullets:
            - "`shift(1)`: yesterday's value"
            - "`rolling(7).mean()` is trailing by default"
            - "Reacts after the December jump"
        right:
          title: Forward-looking
          tag: leakage
          bullets:
            - "`shift(-1)`: tomorrow's value"
            - "`center=True` reads future days"
            - "Rises on November 29, before the jump"
        takeaway: A negative shift and center=True both read the future, which is acceptable on a chart and cheating in a model.
        source: notes/08-time-series.md
        notes: >-
          The centred average starts rising on November 29, days before anything happened, because it reads from the future. That is fine for a
          chart. For a forecast it looks brilliant in testing and can't exist in production.

      - layout: bullets
        beat: pitfalls
        title: Two smaller rules that save real errors
        recall: Why compare with shift(7), and how do rolling(7) and rolling("7D") differ?
        answer: "shift(7) compares the same weekday, so the typical change drops from 13% to about 9%. rolling(7) counts rows and rolling(\"7D\") counts calendar days, so they differ when rows are absent."
        bullets:
          - "**Compare like with like:** `shift(7)` compares the same weekday. The typical change drops from 13% to about 9%."
          - "**Rows or calendar:** `rolling(7)` counts rows, and `rolling(\"7D\")` counts days. They differ when rows are absent."
        takeaway: Compare seasonal data with a seasonal shift, and use time-based windows when rows can be absent.
        source: notes/08-time-series.md
        notes: >-
          Daily change on this data mostly measures the weekly pattern, since Saturday beats Tuesday every week. Shift by seven and what remains is mostly noise.

  - title: What to remember
    agenda: false
    divider: false
    notes: >-
      We end with the habits, and where to go from here.
    slides:
      - layout: cards
        beat: wrap
        title: Rules of thumb
        recall: Name the checks you run when loading, cleaning, joining, grouping and resampling.
        answer: "Loading: keep the raw file and use one rerunnable function. Joining: state how and validate, then compare rows and one total. Grouping: print counts, sum then divide for ratios, check groups add up. Cleaning: count what coerce and parsing turn into NaN and NaT, and read the earliest and latest date. Resampling: show gaps with asfreq and keep model features looking backward."
        cards:
          - title: Load
            body: "Keep the raw file. Put every fix in one rerunnable function."
          - title: Select
            body: "`loc` for labels, `iloc` for positions, a single `.loc` to set."
          - title: Join
            body: "State `how` and `validate`. Compare rows and one total."
          - title: Clean
            body: "Count the `NaN` and `NaT` a conversion makes. Read `min` and `max`."
          - title: Group
            body: "Print counts. Sum then divide for ratios. Check groups add up."
          - title: Time
            body: "Show gaps with `asfreq`. Keep model features looking backward."

        takeaway: The dangerous errors in pandas raise no exception, so build the checks into every load, clean, join, group and resample.
        source: notes/08-time-series.md
        notes: >-
          If you remember one thing, it's that none of today's worst errors raise an exception. The row counts and totals are how you catch them.

      - layout: bullets
        beat: wrap
        title: Where next
        card: false
        recall: What can't this toolkit tell you yet?
        answer: "Whether a difference in the data is real or just luck. That takes probability and statistics, which is the next pillar."
        bullets:
          - "**Practice:** the notebooks in `practice/`, after `bash fetch_data.sh`."
          - "**Pillar 02:** is a difference real, or luck? Probability and statistics."
          - "**Pillar 03:** did the change cause it? Experiments and causality."
          - "**Pillar 05:** draw your own data, and make charts that convince other people."
          - "**Pillar 06:** forecasting, cohorts, funnels and SQL on real analyses."
        takeaway: With data in a frame, the next question is whether a difference is real, which takes probability and statistics.
        source: notes/08-time-series.md
        notes: >-
          You can now get data into a frame, clean it, reshape it, summarise it and respect its time. What it can't yet tell you is whether a difference is real or luck. That's next.
