          - [An average per user, "Users average 68 sessions; a random session belongs to a user with 373", State the denominator]
        takeaway: A summary can be computed correctly and still mislead, so state the group size, the denominator and what one row can do to it.
        source: notes/01-descriptive-statistics-and-eda.md
        notes: >-
          The two hundred groups were assigned at random, so none is really different from another, and a dashboard ranking them would still crown a winner. The session figure is the same arithmetic as the mean and the median: it depends on whether you sample users or sessions.
        narration: >-
          Three summaries at Larkspur were computed correctly and still misled. A ranking of group means: 200
          random groups ranged from 0 to 15.46 around an overall 3.30. They were assigned at random, so none is
          really different, yet a dashboard would still crown a winner. The habit is to show N with every rate. A
          correlation: one bad row moved Pearson from plus 0.44 to minus 0.31, while Spearman stayed near plus
          0.42. So plot it first. An average per user: users average 68 sessions, but a random session belongs to
          a user with 373. So state the denominator. A summary can be right and still mislead.

  - title: The rules of reasoning
    summary: Conditionals · Bayes and base rates · Independence · Expectation and variance
    notes: >-
      Now we want to reason about data we have not seen. There are only a few rules, and each one guards against a mistake intuition makes reliably.
    narration: >-
      Now we want to reason about data we have not seen. There are only a few rules, and each one guards against a
      mistake that intuition makes reliably. We cover conditional probability, Bayes and base rates, independence,
      and expectation and variance.
    slides:
      - layout: statement
        beat: problem
        title: A 99% accurate fraud filter flags an order
        kicker: The problem
        statement: "If 1 order in 1,000 is fraud, that flag is wrong about nine times in ten."
        attribution: "0.99 × 0.001 / (0.99 × 0.001 + 0.01 × 0.999) = 9%"
        takeaway: P(flag given fraud) and P(fraud given flag) can be a hundred times apart, and the base rate sets the gap.
        source: notes/02-probability-foundations.md
        notes: >-
          Nobody miscalculated. They answered the wrong conditional. Let us see where the 9% comes from.
        narration: >-
          A fraud filter is 99 percent accurate, and it flags an order. If one order in a thousand is fraud, that
          flag is wrong about nine times in ten. Working it through gives 9 percent. Nobody miscalculated. They
          answered the wrong conditional. The chance of a flag given fraud, and the chance of fraud given a flag,
          can be a hundred times apart, and the base rate sets the gap. That is worth pausing on, because it is
          how a very accurate test can still be wrong most of the time it speaks. Let us see where the 9 percent
          comes from.

      - layout: flow
        beat: fundamentals
        title: Count a million orders and Bayes does itself
        recall: Of 10,980 flagged orders out of a million, how many are fraud, and why?
        answer: "About 990 of the 10,980 flagged orders (9%) are fraud. The other 9,990 are legitimate orders caught by the 1% error rate, and that group is so large its false positives swamp the true hits."
        steps:
          - {label: "1M orders", sub: "1,000 fraud"}
          - {label: "Fraud flagged", sub: "990 at 99%"}
          - {label: "Legit flagged", sub: "9,990 at 1% error", accent: "D4621A"}
          - {label: "Flagged total", sub: "10,980, 9% fraud"}
        bullets:
          - "**Base rate 1 in 100** lifts it to 50%; so does **99.9% accuracy**."
          - "**Two independent flags** reach 91%, if they are truly independent."
        takeaway: With a rare event, false positives from the huge negative group swamp the true hits.
        source: notes/02-probability-foundations.md
        notes: >-
          Counting whole orders is easier than the formula and gives the same answer. The same arithmetic applies to testing, which the last slide of this part comes back to.
        narration: >-
          Counting is easier than the formula and gives the same answer. Take a million orders, of which 1,000 are
          fraud. The filter flags 990 of them, at 99 percent. Among the legitimate orders, a 1 percent error rate
          flags 9,990. So 10,980 orders are flagged, and only 9 percent of them are fraud. Raise the base rate to
          1 in 100 and it reaches 50 percent. So does improving accuracy to 99.9 percent. Two independent flags
          reach 91 percent, but only if they are truly independent. With a rare event, false positives from the
          huge negative group swamp the true hits. The last slide of this part comes back to the same arithmetic
          in testing.

      - layout: code
        beat: practice
        title: The whole calculation fits in three lines
        recall: What is P(fraud given flag) at base rates of 1 in 1,000, 1 in 100 and 1 in 10, with a 99% accurate filter?
        answer: "About 0.09 at 1 in 1,000, 0.50 at 1 in 100 and 0.92 at 1 in 10. The filter is the same each time; only the base rate changed."
        lang: Python
        code: |-
          def posterior(base, acc=0.99):
              hit = acc * base
              return hit / (hit + (1 - acc) * (1 - base))

          for base in (0.001, 0.01, 0.1):
              print(base, round(posterior(base), 2))
          # 0.001 0.09
          # 0.01 0.5
          # 0.1 0.92
        bullets:
          - "Same filter, three answers."
          - "Only the base rate changed."
        takeaway: The accuracy of a test does not tell you what a positive result means until you add the base rate.
        source: notes/02-probability-foundations.md
        notes: >-
          The habit from the chapter is to compute it, then simulate it. If the two disagree you have learned something.
        narration: >-
          The whole calculation fits in a few lines. A small function takes the base rate and an accuracy of 99
          percent. It works out the true hits, then divides by everything flagged. We loop it over base rates of 1
          in 1,000, 1 in 100 and 1 in 10. The answers are 0.09, 0.5 and 0.92. Same filter, three answers, and only
          the base rate changed. So the accuracy of a test does not tell you what a positive result means until
          you add the base rate. The habit is to compute it, then simulate it. If the two disagree, you have
          learned something.

      - layout: bullets
        beat: pitfalls
        title: Three places intuition breaks the rules
        recall: Name three ways the rules of probability get misapplied, with the number each one cost.
        answer: "Reading p as P(no effect): only 64% of significant drugs are real. Assuming independence: two flags reach 91% only if truly independent. Adding variances for dependent rows: the naive standard error is 1.75 times too small."
        bullets:
          - "**Reading p as P(no effect).** Of 100 drugs, 10 work: about 8 real and 4.5 false discoveries, so **64%** of the significant ones are real."
          - "**Assuming independence.** Two flags reach 91% only if they are truly independent."
          - "**Adding variances for rows that are not independent.** At 5 sessions per user with ρ = 0.5, the naive standard error is **1.75 times** too small."
        takeaway: Before applying a rule, check which conditional you have and whether the rows are independent.
        source: notes/02-probability-foundations.md
        notes: >-
          Expectations always add, whatever the dependence. Variances add only for independent rows, and sessions from one user are not independent. Reinhart calls the third mistake pseudoreplication.
        narration: >-
          Intuition breaks the rules in three places. First, reading p as the chance of no effect. Of 100 drugs,
          10 work, giving about 8 real and 4.5 false discoveries. So 64 percent of the significant ones are real.
          Second, assuming independence. Two flags reach 91 percent only if they are truly independent. Third,
          adding variances for rows that are not independent. At 5 sessions per user with a correlation of 0.5,
          the naive standard error is 1.75 times too small. Expectations always add, whatever the dependence.
          Variances add only for independent rows, and sessions from one user are not. Reinhart calls this third
          mistake pseudoreplication. Check which conditional you have before applying a rule.

  - title: Samples and estimates
    summary: Six distributions · CLT coverage · Intervals · Bootstrap
    notes: >-
      A handful of shapes describe most analytics data, and means of those shapes behave well until they do not. A number without a range cannot support a decision, so we also build the range.
    narration: >-
      A handful of shapes describe most analytics data, and means of those shapes behave well until they do not. A
      number without a range cannot support a decision, so we also build the range. We cover six distributions,
      how the central limit theorem covers in practice, intervals, and the bootstrap.
    slides:
      - layout: statement
        beat: problem
        title: A foundation funds small schools
        kicker: The problem
        statement: "The best-scoring schools were small. So were the worst."
        attribution: Wainer, The Most Dangerous Equation, as discussed in Bayesian Methods for Hackers, ch. 4
        takeaway: Small groups have noisy averages, so they crowd both ends of any ranking with no real difference.
        source: notes/03-distributions-and-sampling.md
        notes: >-
          We simulate it with 5,000 counties drawn from one height distribution. All ten tallest and all ten shortest have fewer than 300 people, while the median county has 808. A bigger biased sample has the opposite problem: when buyers reply four times as often, 57,152 survey rows give a mean of 11.06, while 5,000 random rows give 3.00 against a truth of 3.12. More rows made it more precise and no less wrong.
        narration: >-
          A foundation decides to fund small schools. The best-scoring schools were small. So were the worst.
          Small groups have noisy averages, so they crowd both ends of any ranking with no real difference. We can
          simulate it. Draw 5,000 counties from one height distribution. All ten tallest and all ten shortest have
          fewer than 300 people, while the median county has 808. A bigger biased sample has the opposite problem.
          When buyers reply four times as often, 57,152 survey rows give a mean of 11.06, while 5,000 random rows
          give 3.00 against a truth of 3.12. More rows made it more precise and no less wrong.

      - layout: table
        beat: fundamentals
        title: Name the distribution and you can usually name the test
        recall: Which distribution fits conversions, errors per hour, waiting time, order value and an unknown rate?
        answer: "Conversions: binomial. Errors per hour: Poisson. Gap between events (waiting time): exponential. Order value: lognormal. A rate you are unsure of: beta."
        header: [Data, Distribution, Typical question]
        widths: [5, 2.4, 4]
        rows:
          - [Conversions out of n users, Binomial, "Is p higher in B?"]
          - ["Errors per hour", Poisson, "Did the rate change?"]
          - [Gap between events, Exponential, "How long until the next?"]
          - [Order value, Lognormal, "Typical order, and how heavy a tail?"]
          - [A rate you are unsure of, Beta, "What do I believe p is?"]
        takeaway: Every test and every Bayesian model starts from a distribution, so naming it usually names the method.
        source: notes/03-distributions-and-sampling.md
        notes: >-
          Poisson and Exponential are two views of the same process. Every scipy distribution has the same methods. Watch for the off-by-one: sf of 9 gives P of 10 or more.
        narration: >-
          Name the distribution and you can usually name the test. Conversions out of n users are binomial, and
          the question is whether the rate is higher in B. Errors per hour are Poisson, and the question is
          whether the rate changed. The gap between events is exponential: how long until the next one? Order
          value is lognormal: what is the typical order, and how heavy is the tail? A rate you are unsure of is
          beta: what do I believe it is? Poisson and exponential are two views of the same process. Every test and
          every Bayesian model starts from a distribution, so naming it usually names the method.

      - layout: table
        beat: pitfalls
        title: On revenue, the CLT takes its time
        recall: How often does a nominal 95% Normal interval cover Larkspur's revenue mean at n = 30, 300, 3,000 and 30,000?
        answer: "Coverage is 0.563 at n = 30, 0.832 at 300, 0.928 at 3,000 and 0.948 at 30,000. Skewed, zero-inflated spend needs tens of thousands of users before the interval's 95% means 95%."
        header: [n, Skew of the mean, Coverage of a 95% interval]
        widths: [2, 3.4, 5]
        highlight: [0]
        rows:
          - ["30", "4.68", "0.563"]
          - ["300", "1.34", "0.832"]
          - ["3,000", "0.46", "0.928"]
          - ["30,000", "0.22", "0.948"]
        takeaway: N of 30 is not a law, because a skewed zero-inflated metric can need tens of thousands of users for a 95% interval to mean 95%.
        source: notes/03-distributions-and-sampling.md
        notes: >-
          The law of large numbers says where the mean goes, and the central limit theorem says how it wobbles on the way. Neither fixes selection bias or dependent rows. This is zero-inflated lognormal spend. Small samples mostly contain few whales, so they understate both the mean and the spread. The formula cannot warn you, because the standard error comes from the same sample.
        narration: >-
          The central limit theorem takes its time on revenue. This is zero-inflated lognormal spend. At n of 30,
          the mean is very skewed, and a nominal 95 percent interval covers the truth only 56 percent of the time.
          At 300 it covers 83 percent, at 3,000 about 93 percent, and at 30,000 about 95 percent. Small samples
          mostly contain few whales, so they understate both the mean and the spread. The formula cannot warn you,
          because the standard error comes from the same sample. So n of 30 is not a law. A skewed metric like
          this can need tens of thousands of users before 95 percent means 95 percent.

      - layout: code
        beat: practice
        title: Near zero, swap Wald for Wilson
        recall: What does Wald give for 0 of 50, and how do Wald and Wilson coverage compare at p = 0.02 and n = 50?
        answer: "Wald gives [0, 0], claiming certainty from 50 users, while Wilson gives [0, 0.0714]. At p = 0.02 and n = 50, Wald covers the truth only 63.3% of the time and Wilson 92.0%."
        lang: Text output
        code: |-
          0/50  Wald [0.0000, 0.0000]
                Wilson [0.0000, 0.0714]

          p=0.02 n=50
            Wald cover 0.633
            Wilson cover 0.920
        bullets:
          - "**Wald** claims certainty from 50 users."
          - "**Wilson** inverts the score test."
          - "Test any procedure by simulating coverage."
        takeaway: Use Wilson for rates in small segments, because Wald collapses near zero and can cover far below its label.
        source: notes/04-estimation.md
        notes: >-
          At n of 4,000 the two are indistinguishable. Simulating coverage is the general way to test any interval you do not trust. An estimate alone cannot support a plan: revenue per user of 2.68 is only usable with its interval of [2.09, 3.27], and the 95% describes the procedure's hit rate, which our simulation put at 94.8%.
        narration: >-
          Near zero, swap Wald for Wilson. Suppose 0 events out of 50 users. The Wald interval runs from zero to
          zero, which claims certainty from 50 users. The Wilson interval runs from zero to about 0.07. Now
          simulate a true rate of 0.02 with 50 users. Wald covers the truth only 63 percent of the time. Wilson
          covers it 92 percent of the time. Wilson inverts the score test. At n of 4,000 the two are
          indistinguishable. Simulating coverage is the general way to test any interval you do not trust. For
          rates in small segments, use Wilson.

      - layout: flow
        beat: fundamentals
        title: The bootstrap replaces algebra with resampling
        recall: How does the bootstrap get a standard error, and which unit do you resample for a ratio metric?
        answer: "Resample the sample with replacement, recompute the statistic thousands of times, and read the spread as the standard error. Resample the independent unit (users, not sessions): bootstrapping sessions gave 0.027 where the true SE was 0.049."
        steps:
          - {label: Sample, sub: "n independent users"}
          - {label: Resample, sub: "with replacement"}
          - {label: Recompute, sub: "any statistic"}
          - {label: Read spread, sub: "SE and interval", accent: "D4621A"}
        loop: Repeat thousands of times
        bullets:
          - "Revenue per session: **delta SE 0.193, bootstrap 0.195, naive by session 0.116**."
          - "**Fails** at the sample maximum, on rows that are not independent, and on tails the sample missed."
        takeaway: Resample the independent unit, because bootstrapping sessions gave 0.027 where the true standard error was 0.049.
        source: notes/04-estimation.md
        notes: >-
          The delta method needed a page of algebra. Efron's bootstrap needs three lines and works for medians and percentiles. Use BCa on skewed statistics. Precision also sets the cost of a test: n per arm is about 16 sigma squared over delta squared, so in Kohavi's example a 5% change costs about 409,000 users per arm on revenue and about 122,000 on conversion. The next pillar turns that into a plan.
        narration: >-
          The bootstrap replaces algebra with resampling. Start with a sample of n independent users. Resample it
          with replacement, recompute any statistic you like, and read the spread for a standard error and an
          interval. Repeat that thousands of times. For revenue per session, the delta method gives a standard
          error of 0.193 and the bootstrap 0.195. A naive bootstrap by session gives 0.116. So resample the
          independent unit. Elsewhere, bootstrapping sessions gave 0.027 where the true standard error was 0.049.
          It fails at the sample maximum, on rows that are not independent, and on tails the sample missed. Next,
          the move from a number to a decision.

  - title: From a number to a decision
    summary: The recipe · Choosing a test · What p is not · Multiple comparisons · Winner's curse
    notes: >-
      Now we ask whether a pattern could plausibly be noise. Hypothesis tests answer that one narrow question very well.
    narration: >-
      Now we ask whether a pattern could plausibly be noise. Hypothesis tests answer that one narrow question very
      well. We cover the recipe, choosing a test, what a p-value is not, multiple comparisons, and the winner's
      curse.
    slides:
      - layout: statement
        beat: problem
        title: One segment of twenty reached p = 0.04
        kicker: The problem
        statement: "Twenty tests of nothing produce at least one false positive 64% of the time."
        attribution: "1 − 0.95²⁰; simulated at 62% with 30 users per arm"
        takeaway: Treat a win found by slicing as a hypothesis to confirm, since noise alone usually produces one somewhere among twenty.
        source: notes/05-hypothesis-testing.md
        notes: >-
          A hypothesis test is a narrow tool: could this be noise? We start by seeing how it works without any formula. When you do run many tests, correct for them: of 100 tests with 10 real, raw thresholds gave 11 hits and 3 false, Holm 5 hits and 0 false, Benjamini-Hochberg 7 hits and 0 false. And expect winners to shrink: at 17% power and a true 1% lift, significant estimates average 2.45%.
        narration: >-
          One segment out of twenty reached a p-value of 0.04. Twenty tests of nothing produce at least one false
          positive 64 percent of the time. We simulated it at 62 percent, with 30 users per arm. So a win found by
          slicing is a hypothesis to confirm, since noise alone usually produces one somewhere among twenty. When
          you do run many tests, correct for them. Of 100 tests with 10 real, raw thresholds gave 11 hits and 3
          false. Holm gave 5 hits and none false. Benjamini-Hochberg gave 7 and none false. And expect winners to
          shrink. At 17 percent power and a true 1 percent lift, significant estimates average 2.45 percent.

      - layout: flow
        beat: fundamentals
        title: Every test follows one recipe
        recall: What are the steps of a hypothesis test, and what must be fixed before you see the data?
        answer: "State the null, fix alpha, choose a statistic and its null distribution, compute the p-value, then decide with the effect size. Alpha must be fixed before you see the data."
        steps:
          - {label: State H0, sub: "what no effect means"}
          - {label: Fix α, sub: "before seeing data"}
          - {label: Statistic, sub: "and its null distribution"}
          - {label: p-value, sub: "this extreme, by chance"}
          - {label: Decide, sub: "with the effect size", accent: "D4621A"}
        bullets:
          - "A test answers one question: could this be noise?"
          - "The effect size and interval answer the question the business asked."
        takeaway: Every test states a null, fixes alpha in advance, computes a surprise under the null, and then needs an effect size to mean anything.
        source: notes/05-hypothesis-testing.md
        notes: >-
          Every test in this chapter differs only in its statistic and its null distribution. Once you see this, a table of tests stops looking like a list to memorise. Welch is the two-group default, a paired t-test suits the same units twice, ANOVA with Tukey suits three or more groups, chi-square or Fisher suits categories, and Mann-Whitney tests a tendency rather than a mean.
        narration: >-
          Every test follows one recipe. State the null, meaning what no effect looks like. Fix alpha before
          seeing the data. Choose a statistic and its null distribution. Compute the p-value, which is how often
          chance alone gives a result this extreme. Then decide, with the effect size alongside. A test answers
          one question: could this be noise? The effect size and interval answer the question the business asked.
          Tests differ only in their statistic and null distribution. Welch is the two-group default. A paired
          t-test suits the same units twice. ANOVA with Tukey suits three or more groups. Chi-square or Fisher
          suits categories.

      - layout: code
        beat: practice
        title: Shuffling the labels shows what a test does
        recall: How does a permutation test build its null distribution, and how close was it to Welch here?
        answer: "Pool both arms and shuffle the labels many times (10,000 here), recording the difference in means each time; that distribution is the null. The permutation p was 0.007 against Welch's 0.009, very close."
        lang: Python
        code: |-
          pool = np.concatenate([a, b])
          for i in range(10_000):
              rng.shuffle(pool)
              diffs[i] = pool[400:].mean() - pool[:400].mean()
          np.mean(np.abs(diffs) >= abs(obs))
          # permutation p = 0.007, Welch p = 0.009
        bullets:
          - "No effect means labels are arbitrary."
          - "Classical tests approximate this."
          - "Unsure of a formula? Shuffle."
        takeaway: A p-value is how often chance alone gives a result this extreme, which you can compute directly by shuffling labels.
        source: notes/05-hypothesis-testing.md
        notes: >-
          This uses 400 skewed order values in each arm. Under a true null, p-values are uniform, and that uniformity is what alpha of 0.05 means.
        narration: >-
          Shuffling the labels shows what a test does. Here are 400 skewed order values in each arm. Pool them,
          shuffle 10,000 times, split off two groups of 400, and record the difference in means each time. The
          share of shuffles with a difference as large as the observed one is the p-value. It comes out at 0.007,
          against 0.009 from a Welch test. If there is no effect, the labels are arbitrary, so shuffling builds
          the null directly. Classical tests approximate this. A p-value is how often chance alone gives a result
          this extreme. Unsure of a formula? Shuffle.

      - layout: table
        beat: pitfalls
        title: What a p-value is not
        recall: Give three common misreadings of a p-value, and the correct reading of each.
        answer: "p = 0.03 is not a 3% chance the null is true, because p assumes the null. p = 0.2 is not proof of no effect, because the test may be underpowered. p = 0.003 is not a big effect: 5M per arm makes a 0.9% lift significant."
        header: [Wrong reading, Why]
        widths: [5.2, 6.2]
        rows:
          - ["p = 0.03: 3% chance the null is true", "p assumes the null. The other direction needs a prior"]
          - ["p = 0.2: no effect", "The test may be underpowered"]
          - ["p = 0.003: a big effect", "5M per arm makes a 0.9% lift significant"]
          - ["0.049 vs 0.051: they disagree", "The difference between them is not itself significant"]
        takeaway: A p-value measures surprise under the null, not the chance the null is true, the size of an effect, or its importance.
        source: notes/05-hypothesis-testing.md
        notes: >-
          The American Statistical Association's 2016 statement says these same things formally. Reinhart's book walks through them with examples.
        narration: >-
          Four common misreadings of a p-value. A p of 0.03 is not a 3 percent chance the null is true, because p
          assumes the null, and the other direction needs a prior. A p of 0.2 does not mean no effect, because the
          test may be underpowered. A p of 0.003 does not mean a big effect, because 5 million per arm makes a 0.9
          percent lift significant. And 0.049 against 0.051 do not disagree, because the difference between them
          is not itself significant. A p-value measures surprise under the null. It is not the chance the null is
          true, the size of an effect, or its importance.

  - title: Models that hold other things fixed
    summary: The t-test as OLS · Covariates · Diagnostics · Clustering · Logistic · Poisson
    notes: >-
      Everything so far compared groups. Regression does that and lets you hold other things fixed.
    narration: >-
      Everything so far compared groups. Regression does that, and lets you hold other things fixed. We cover the
      t-test as a regression, covariates, diagnostics, clustering, and then logistic and Poisson models for yes or
      no outcomes and counts.
    slides:
      - layout: statement
        beat: problem
        title: Free precision is one line away
        kicker: The problem
        statement: "Adding last month's spend cut the standard error from 0.343 to 0.287, with no extra traffic."
        attribution: Larkspur simulated experiment, 20,000 users, true effect 1.5
        takeaway: A t-test is a regression on a 0/1 column, so you can add pre-period covariates and shrink the error for free.
        source: notes/06-regression-and-glms.md
        notes: >-
          The difference in means of 1.350 and t of 3.942 match OLS exactly. The covariate removed 30% of the variance, which equals its R squared. Randomisation already made the estimate unbiased, so what it buys is precision. Only use variables measured before assignment.
        narration: >-
          Free precision is one line away. In a simulated Larkspur experiment with 20,000 users and a true effect
          of 1.5, adding last month's spend cut the standard error from 0.343 to 0.287, with no extra traffic. The
          reason is that a t-test is a regression on a 0 or 1 column. The difference in means of 1.350 and t of
          3.942 match the regression exactly. The covariate removed 30 percent of the variance, which equals its R
          squared. Randomisation already made the estimate unbiased, so what this buys is precision. Only use
          variables measured before assignment.

      - layout: flow
        beat: fundamentals
        title: Choose the model from the outcome, then check it
        recall: Which model fits a continuous outcome, a yes/no outcome and a count, and what do you check afterwards?
        answer: "Continuous: OLS. Yes/no: logistic regression with a log-odds link. Count: Poisson with an offset. Then check residuals, leverage, dispersion and clustering before trusting any standard error."
        steps:
          - {label: Continuous, sub: "OLS"}
          - {label: Yes or no, sub: "logistic, log-odds link"}
          - {label: Count, sub: "Poisson with offset"}
          - {label: Diagnostics, sub: "residuals, leverage, clusters", accent: "D4621A"}
        bullets:
          - "**One family:** linear predictor, a distribution, a link function."
          - "**Cluster on the user:** 27.8% false positives at nominal 5% until you do."
          - "**Overdispersed?** Robust SEs or negative binomial."
        takeaway: Pick the GLM from the outcome's type, then check residuals, leverage, dispersion and clustering before trusting any standard error.
        source: notes/06b-logistic-regression-and-poisson-glms.md
        notes: >-
          Overdispersion example: dispersion 8.3, Poisson SE 0.0155 against robust 0.0509. A test using the first would have called the effect highly significant. An offset turns a count into a rate per day. Clustering on user brought that 27.8% down to 3.5%, and robust errors change the uncertainty without changing the estimate.
        narration: >-
          Choose the model from the outcome, then check it. A continuous outcome takes ordinary least squares. A
          yes or no outcome takes logistic regression, with a log-odds link. A count takes Poisson, with an
          offset, which turns a count into a rate per day. These are one family: a linear predictor, a
          distribution and a link function. Then run diagnostics on residuals, leverage and clusters. Cluster on
          the user: otherwise there were 27.8 percent false positives at a nominal 5 percent, and clustering
          brought that to 3.5 percent. Overdispersed? In one example dispersion was 8.3, and robust errors were
          far larger than Poisson ones. Use robust errors or negative binomial.

      - layout: code
        beat: practice
        title: "A logistic coefficient of 0.4 is not one number"
        recall: What does a logistic coefficient of 0.4 do to the odds, and to probability at baselines of 2% and 50%?
        answer: "It always multiplies the odds by 1.49, but the probability change depends on the baseline: 2% goes to 3% (+1 point), while 50% goes to 59.9% (+9.9 points)."
        lang: Python
        code: |-
          from scipy.special import expit, logit

          for base in (0.02, 0.20, 0.50, 0.80):
              new = expit(logit(base) + 0.4)
              print(base, round(new, 3), round(new - base, 3))
          # 0.02 0.03  0.01
          # 0.2  0.272 0.072
          # 0.5  0.599 0.099
          # 0.8  0.856 0.056
        bullets:
          - "Odds always multiply by 1.49."
          - "Points depend on the baseline."
        takeaway: Report average marginal effects to stakeholders, since an odds ratio implies a different point change at each baseline.
        source: notes/06b-logistic-regression-and-poisson-glms.md
        notes: >-
          Odds ratios are constant and hard to act on. A point change is what a stakeholder can use, and it has to be averaged over the baselines in the data.
        narration: >-
          A logistic coefficient of 0.4 is not one number. Odds always multiply by 1.49. But the change in
          probability depends on where you start. The code converts a baseline to log-odds, adds 0.4, and converts
          back. From 2 percent you reach 3 percent, a gain of one point. From 20 percent you reach 27.2 percent,
          up 7.2 points. From 50 percent, 59.9, up 9.9 points. From 80 percent, 85.6, up 5.6 points. Odds ratios
          are constant and hard to act on. A point change is what a stakeholder can use, so report average
          marginal effects.

      - layout: table
        beat: pitfalls
        title: Three standard errors that were confidently wrong
        recall: Name three signs that a model's standard error cannot be trusted, and the fix for each.
        answer: "Separation (coefficient 28.52, SE 171,433): use a weakly informative prior. Overdispersion (Poisson SE 0.0155 vs robust 0.0509): robust SEs or negative binomial. Several rows per user (27.8% false positives): cluster on the user, giving 3.5%."
        header: [What you see, What it is, What to do]
        widths: [4.4, 3.2, 3.8]
        rows:
          - ["Coefficient 28.52, SE 171,433", Separation, A weakly informative prior]
          - ["Dispersion 8.3: Poisson SE 0.0155, robust 0.0509", Overdispersion, Robust SEs or negative binomial]
          - ["27.8% false positives at a nominal 5%", Several rows per user, "Cluster on the user: 3.5%"]
        takeaway: A fitted model always prints a standard error, so check separation, dispersion and clustering before you believe it.
        source: notes/06b-logistic-regression-and-poisson-glms.md
        notes: >-
          Separation is a predictor that splits the outcome perfectly, and it is not a strong effect. Gelman and colleagues showed a Cauchy prior with scale 2.5 on standardised inputs gives stable fits, which leads into the Bayesian pillar. Robust and clustered errors change the uncertainty and leave the estimate where it was. The clustering figure is from note 06.
        narration: >-
          A fitted model always prints a standard error, so three signs say not to believe it. A coefficient of
          28.52 with a standard error of 171,433 is separation, where a predictor splits the outcome perfectly. It
          is not a strong effect. Use a weakly informative prior. A dispersion of 8.3, with a Poisson standard
          error of 0.0155 against a robust 0.0509, is overdispersion. Use robust errors or negative binomial. And
          27.8 percent false positives at a nominal 5 percent come from several rows per user. Cluster on the user
          and it falls to 3.5 percent. Robust and clustered errors change the uncertainty and leave the estimate
          where it was.

  - title: A model is a claim about the rows
    summary: Write the process · Bias and coverage · Turning points · Big data
    notes: >-
      So far we have asked whether an estimate is precise. Now we ask whether it estimates the right thing, and to test that we write down the process that made the rows.
    narration: >-
      So far we have asked whether an estimate is precise. Now we ask whether it estimates the right thing. To
      test that, we write down the process that made the rows. We cover writing the process, bias and coverage,
      turning points, and big data.
    slides:
      - layout: statement
        beat: problem
        title: A coupon lifts spend 22%, and a regression says 95%
        kicker: The problem
        statement: "We wrote the simulation, so we know the truth. A straight line in tenure says about 95%, and across a thousand datasets its 95% interval never contains the truth."
        attribution: Larkspur simulation, 800 customers per dataset
        takeaway: Precision cannot rescue the wrong form, so write down the process and the estimand before choosing an estimator.
        source: notes/07-data-generating-process.md
        notes: >-
          Nothing was miscalculated. The line is the wrong shape for tenure, and more data only makes the wrong answer more precise.
        narration: >-
          A coupon lifts spend by 22 percent, and a regression says 95 percent. We wrote the simulation, so we
          know the truth. A straight line in tenure says about 95 percent. Across a thousand datasets of 800
          customers each, its 95 percent interval never contains the truth. Nothing was miscalculated. The line is
          the wrong shape for tenure, and more data only makes the wrong answer more precise. Precision cannot
          rescue the wrong form. So write down the process and the estimand before choosing an estimator.

      - layout: flow
        beat: fundamentals
        title: Name the number you want before you choose a model
        recall: What are the estimand, the estimator and the estimate, and which comes first?
        answer: "The estimand is the number you want, the estimator is the recipe, and the estimate is what one dataset gives. The estimand comes first: fix it and write down the process before choosing an estimator."
        steps:
          - {label: Estimand, sub: "the number you want"}
          - {label: Process, sub: "how the rows were made"}
          - {label: Estimator, sub: "the recipe"}
          - {label: Estimate, sub: "what one dataset gives"}
          - {label: Simulate, sub: "does the recipe cover?", accent: "D4621A"}
        bullets:
          - "One coupon, two estimands: worth **15.29** pounds averaged over all customers, **18.98** over those who got one."
          - "On the log scale its effect is one fixed number, **0.20**."
        takeaway: Fix the estimand and write down the process first, because one treatment has several true effects and an estimator answers only one.
        source: notes/07-data-generating-process.md
        notes: >-
          Three words to keep apart. The estimand is the number you want, the estimator is the recipe, and the estimate is what one dataset gives. Because we wrote the process, we know the truth, so we can grade any recipe against it.
        narration: >-
          Name the number you want before you choose a model. Keep three words apart. The estimand is the number
          you want. The estimator is the recipe. The estimate is what one dataset gives. Write the process, and
          you can simulate to ask whether the recipe covers the truth. One coupon has two estimands. It is worth
          15.29 pounds averaged over all customers, and 18.98 over those who got one. On the log scale its effect
          is one fixed number, 0.20. Because we wrote the process, we know the truth, so we can grade any recipe
          against it. An estimator answers only one of the several true effects.

      - layout: code
        beat: practice
        title: "Simulate first: the wrong form never covers the truth"
        recall: Across 1,000 simulated datasets, how did the linear and quadratic tenure models do on bias and coverage?
        answer: "Against a truth of 0.200, the difference in means (bias 0.488) and linear tenure (0.485) both had 0% coverage. The quadratic and the spline had no bias and covered 94.1% and 94.3%."
        lang: Text output
        code: |-
          truth 0.200, 1000 datasets, n=800
          estimator       mean    bias    sd   cover
          diff in means  0.688   0.488 0.054   0.000
          linear tenure  0.685   0.485 0.054   0.000
          quadratic      0.200  -0.000 0.040   0.941
          spline df=5    0.200  -0.000 0.040   0.943
        bullets:
          - "Linear in tenure barely beats no adjustment."
          - "The spline finds the form unaided."
          - "**Coverage zero:** tight, and always wrong."
        takeaway: A simulation grades the procedure rather than one answer, and coverage is the grade that shows the form is wrong.
        source: notes/07-data-generating-process.md
        notes: >-
          One dataset gives 0.663, 0.666, 0.195 and 0.196, which looks like a modelling choice until you run a thousand. The specification belongs to the whole model: fit the pounds in levels and the mean is 20.18 against a true 15.29, with coverage of 74.5%.
        narration: >-
          Simulate first. The true effect is 0.200, and we run 1,000 datasets of 800 customers. A plain difference
          in means averages 0.688, a bias of 0.488, and its interval never covers the truth. A linear term in
          tenure barely does better. A quadratic averages 0.200 with almost no bias, and covers 94.1 percent of
          the time. A spline with five degrees of freedom finds the form unaided, at 94.3 percent. The wrong forms
          are tight and always wrong. One dataset gives 0.663, 0.666, 0.195 and 0.196, which looks like a
          modelling choice until you run a thousand. A simulation grades the procedure, and coverage is the grade.

      - layout: image
        beat: pitfalls
        title: A quadratic must turn, even when the data do not
        recall: What peak does a quadratic report when the truth rises then flattens, and how do you check a claimed turning point?
        answer: "It reports a peak at 50.1 [46.3, 55.4] although the truth rises then flattens and never falls. Check a claimed turning point with data past the turn, a spline, or a theory."
        image: ../../sources/images/stats-dgp-quadratic-story.png
        caption: Two worlds, one significant squared term. Peak at 29.2 is real; peak at 50.1 is invented.
        bullets:
          - "**Rises then falls:** peak 29.2 [28.7, 29.6]."
          - "**Rises then flattens:** peak 50.1 [46.3, 55.4], and the truth never falls."
          - "**Check:** data past the turn, a spline, a theory."
        takeaway: A significant squared term does not show a turning point, because a quadratic has to turn somewhere.
        source: notes/07-data-generating-process.md
        notes: >-
          The squared term in the flattening world has a p-value of 3.6e-19 and the story it tells is false. In fairness, the invented decline is small: a fall of 0.06 on the log scale after the peak, against a true rise of 0.03. A careful reader would not quote that as a story; a less careful one would quote the turning point and its p-value.
        narration: >-
          A quadratic must turn, even when the data do not. Take two worlds that both give a significant squared
          term. In the first, the outcome rises then falls, and the peak is real, at 29.2, with an interval from
          28.7 to 29.6. In the second, it rises then flattens and the truth never falls. Yet the quadratic reports
          a peak at 50.1, with an interval from 46.3 to 55.4. That peak is invented. To check a claimed turn, look
          for data past it, fit a spline, or find a theory. A significant squared term does not show a turning
          point, because a quadratic has to turn somewhere.

      - layout: compare
        beat: pitfalls
        title: To explain and to predict are different jobs
        recall: Why can a short wrong model win on held-out error at n = 30, and what happens as n grows?
        answer: "With correlated predictors and a small sample, the short model saves more variance than its bias costs, so it wins 78% of held-out tests at n = 30 (RMSE 2.070 vs 2.107). At n = 300 it ties, and at n = 3,000 the true form wins 81%."
        lead: "Shmueli (2010), simulated: the true form against a shorter wrong model, scored on held-out rows."
        emphasis: right
        left:
          title: Small n, the wrong model wins
          bullets:
            - "n = 30: wrong model wins 78% of held-out tests"
            - "RMSE 2.070 against 2.107, about 2% apart"
            - "Its slope is 1.184; true 1.0, true form 1.004"
          tag: Good forecast, wrong coefficient
        right:
          title: Large n, the truth catches up
          bullets:
            - "n = 300: a tie, 0.512"
            - "n = 3,000: true form wins 81%"
            - "Choose by the job: effect or forecast"
          tag: Say which job you are doing
        takeaway: Winning on held-out error says the forecast is good, and says nothing about whether a coefficient is right.
        source: notes/07-data-generating-process.md
        notes: >-
          Selection rules disagree too. At n of 800, the share of runs choosing the true form was 0 for R squared, 0.39 for adjusted R squared, 0.77 for AIC, 0.98 for BIC and 0.70 for cross-validation. Adjusted R squared preferred degree 10 by 0.659 to 0.658. Breiman's Rashomon point is the same: many models fit equally well and tell different stories.
        narration: >-
          To explain and to predict are different jobs. Here is a simulation, after Shmueli. The true form is set
          against a shorter, wrong model, scored on held-out rows. At n of 30, the wrong model wins 78 percent of
          held-out tests. The two errors are about 2 percent apart, 2.070 against 2.107, and the wrong model's
          slope is 1.184 where the true slope is 1.0. So it is a good forecast with a wrong coefficient. At n of
          3,000 the true form wins 81 percent. Choose by the job: effect or forecast. Winning on held-out error
          says the forecast is good, and says nothing about whether a coefficient is right.

      - layout: image
        beat: pitfalls
        title: A million self-selected rows, worth 278 random ones
        recall: Why can a million self-selected rows have the error of 278 random rows, and why does the interval not warn you?
        answer: "A tiny tilt in who responds (10.9% vs 9.6%, rho 0.02) gives the same error, 0.0275 vs 0.0276, as 278 random rows. More rows shrink the interval but not the bias, so it covers the truth in 0% of draws against 95.3%."
        image: ../../sources/images/stats-dgp-meng-interval.png
        caption: Same error, opposite honesty. A selected sample's interval is tight and misses.
        bullets:
          - "Response 10.9% with the trait, 9.6% without: **rho 0.02**."
          - "**RMSE 0.0275 against 0.0276**, a tie."
          - "**Coverage 0% of 50 draws against 95.3%.**"
        takeaway: Sample size shrinks the interval around the bias, so a large selected sample is confidently wrong.
        source: notes/07-data-generating-process.md
        notes: >-
          Meng's identity says the error is rho times the root of one minus f over f, times the standard deviation; it checked here to a difference of minus 3.5e-14. You cannot estimate rho from the sample. Selection also breaks external validity, and reweighting depends on what drove it: the population value is 0.157; selected on tenure gives 0.117, reweighted to 0.169; selected on keenness gives 0.265, and reweighted it stays 0.264. Better fit is no defence: a sample that opted in by segment scored R squared 0.774 and RMSE 0.990 on itself, and 2.461 on the population, where the best line manages 1.984.
        narration: >-
          A million self-selected rows can be worth only 278 random ones. Here the response rate is 10.9 percent
          with the trait and 9.6 percent without, a correlation of 0.02. That tiny tilt gives an error of 0.0275,
          against 0.0276 for the random sample, so the two tie. But the intervals differ. Across 50 draws, the
          selected sample's interval covered the truth 0 percent of the time, against 95.3 percent for the random
          sample. Sample size shrinks the interval around the bias. So a large selected sample is confidently
          wrong. And you cannot estimate that correlation from the sample itself.

  - title: The same units, over time
    summary: Between and within · Two-way effects · Coverage · Event studies
    notes: >-
      Panels let a unit act as its own control, which removes everything fixed about it. We will see how much that buys and exactly where it stops.
    narration: >-
      Panels let a unit act as its own control, which removes everything fixed about it. We will see how much that
      buys and exactly where it stops. We cover between and within variation, two-way effects, coverage, and event
      studies.
    slides:
      - layout: statement
