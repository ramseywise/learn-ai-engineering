        narration: >-
          Between stores the slope falls, and within stores it rises. The variance splits into 15.79 in total,
          10.51 between stores and 5.28 within them. A fixed-effects model throws away the first part on purpose.
          Between stores the slope is minus 1.488. With store effects only it is minus 0.041, because season still
          confounds. With store and week effects it is 0.472, with a standard error of 0.026. Fixed effects choose
