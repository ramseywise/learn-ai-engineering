  - title: Look before you summarise
    summary: Types and units · Impossible values · Shape picks the summary · Whose average
    notes: >-
      The first job is to find out what the data are. Most errors that reach a decision start here rather than in the statistics.
    narration: >-
      The first job is to find out what the data are. Most errors that reach a decision start here rather than in
      the statistics. In this part we check types and units, hunt for impossible values, let the shape pick the
      summary, and ask whose average a number really is.
    slides:
      - layout: statement
        beat: problem
        title: Finance asks for the average customer
        kicker: The problem
        statement: "Mean spend is 3.30. The median is zero, 95% of users spent nothing, and that was after two rows at 48,000 were removed."
        attribution: Larkspur synthetic extract, 20,000 users
        takeaway: Before quoting any summary, establish what one row is and what shape the column has.
        source: notes/01-descriptive-statistics-and-eda.md
        notes: >-
          With those two bad rows left in, the raw mean is 8.10. Neither number describes anyone. By the end of this part we will know which number answers which question.
        narration: >-
          Finance asks Larkspur for the average customer. Mean spend is 3.30. The median is zero, because 95
          percent of users spent nothing, and that is after two rows at 48,000 were removed. With those two bad
          rows left in, the raw mean is 8.10. Neither number describes anyone. By the end of this part we will
          know which number answers which question. For now, the rule is simple. Before quoting any summary,
          establish what one row is and what shape the column has. So let us start by looking at the data
          properly.

      - layout: flow
        beat: fundamentals
        title: EDA is a loop that ends in a written finding
        recall: What are the stages of the EDA loop and how does it end?
        answer: "Type-check, hunt impossible values, look at shape, choose the summaries the shape allows, then write it down. It ends when someone else can act on the written findings, including every row you removed."
        steps:
          - {label: Type-check, sub: "what is one row?"}
          - {label: Impossible values, sub: "missing, negative, duplicate"}
          - {label: Shape, sub: "one column at a time"}
          - {label: Summaries, sub: "what the shape allows"}
          - {label: Write it down, sub: "findings and questions", accent: "D4621A"}
        bullets:
          - "**Count every exclusion:** 6 refunds and 2 test rows, with a named owner to confirm."
          - "**Missing is data:** compare missing and non-missing groups before dropping."
          - "A new question sends you back to the start."
        takeaway: An EDA is finished when someone else can act on the written findings, including every row you removed.
        source: notes/01-descriptive-statistics-and-eda.md
        notes: >-
          Tukey's point was that inference answers a framed question, and exploration tells you whether you framed the right one. Each exclusion is an analyst's choice, so write it down.
        narration: >-
          Exploring data is a loop with five stages. Type-check, by asking what one row is. Hunt for impossible
          values, such as missing, negative or duplicate ones. Look at the shape, one column at a time. Choose the
          summaries that shape allows. Then write it all down, as findings and questions. Count every exclusion.
          Here that was 6 refunds and 2 test rows, with a named owner to confirm them. Missing is data too, so
          compare the missing and non-missing groups before dropping anything. Each exclusion is an analyst's
          choice, so write it down. An exploration is finished when someone else can act on your written findings,
          including every row you removed.

      - layout: code
        beat: practice
        title: Two rows in twenty thousand ran the summary
        recall: What do two 48,000 rows do to the buyers' mean, standard deviation and median?
        answer: "Cleaned buyers have mean 65.86, SD 93.65 and median 37.38. With the two 48,000 rows left in, the mean jumps to 161.25 and the SD to 2,139.32, while the median barely moves (37.45)."
        lang: Text output
        code: |-
          buyers, cleaned
            mean 65.86   median 37.38
            std  93.65   IQR     60.75

          with the two 48,000 rows left in
            mean 161.25  median 37.45
            std  2139.32
        bullets:
          - "**Mean and SD** chase the tail."
          - "**Median, IQR, MAD** ignore it."
          - "A big gap between them is your outlier alarm."
        takeaway: When mean and median disagree by a lot, the tail is running the summary, so look at the tail.
        source: notes/01-descriptive-statistics-and-eda.md
        notes: >-
          The right summary depends on the question. Finance forecasting a total needs the mean. A product manager describing a typical buyer wants the median. Neither is more true.
        narration: >-
          Take the Larkspur buyers. Once cleaned, their mean is 65.86 and their median 37.38, with a standard
          deviation of 93.65. Leave the two 48,000 rows in, and the mean jumps to 161.25 and the standard
          deviation to 2,139.32. The median barely moves, from 37.38 to 37.45. The mean and standard deviation
          chase the tail. The median, the interquartile range and MAD ignore it. So a big gap between mean and
          median is your outlier alarm. Which summary is right depends on the question. Finance forecasting a
          total needs the mean. A product manager describing a typical buyer wants the median. When they disagree
          by a lot, look at the tail.

      - layout: table
