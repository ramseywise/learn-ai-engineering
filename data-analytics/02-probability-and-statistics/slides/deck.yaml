          the truth is plus 0.5, so a point adds half a unit. Clustering takes the standard error to 0.044 and
          leaves the estimate where it is. This simulation is deliberately extreme, with a correlation between
          store means of minus 0.996, so the wrong sign is impossible to miss. A tiny standard error on a pooled
