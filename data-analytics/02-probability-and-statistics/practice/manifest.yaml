# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/5_Statistical_Analysis.ipynb"
    purpose: "Notebook covering probability distributions, hypothesis tests, A/B testing with power analysis, and correlation versus causation."
    demonstrates:
      - "notes/01-descriptive-statistics-and-eda.md"
      - "notes/03-distributions-and-sampling.md"
      - "notes/05-hypothesis-testing.md"
    pattern: analysis
    language: jupyter
    runs_offline: false
    verified_by: none
    licence: course
  - path: "practice/ch07_data_generating_process.py"
    purpose: "Simulated datasets with known truth showing how fit, specification and generalisation affect which estimates recover the true parameters."
    demonstrates:
      - "notes/07-data-generating-process.md"
    pattern: analysis
    language: python
    runs_offline: true
    verified_by: none
    verification_note: "Tried `uv run ch07_data_generating_process.py` in a temporary copy and it timed out after 120s; not confirmed."
    licence: course
  - path: "practice/ch08_panel_data.py"
    purpose: "One simulated store-by-week panel with a known effect, comparing which estimators (including fixed effects) recover it."
    demonstrates:
      - "notes/08-panel-data-and-fixed-effects.md"
    pattern: analysis
    language: python
    runs_offline: true
    verified_by: "uv run ch08_panel_data.py"
    licence: course
  - path: "practice/chartstyle.py"
    purpose: "Helper module holding the house matplotlib style for this pillar's charts; not an example."
    demonstrates: []
    pattern: other
    language: python
    runs_offline: true
    verified_by: none
    licence: course
  - path: "practice/courses"
    purpose: "Three lecture-note scripts from Coursera courses (umich_statistical_analysis.py, wesleyan_data_cleaning.py, wesleyan_inferential_statistics.py); none parses: umich_statistical_analysis.py fails at line 327 on an unterminated string, wesleyan_data_cleaning.py uses Python 2 print and wesleyan_inferential_statistics.py has a %matplotlib magic, so they are notes, not runnable scripts."
    demonstrates:
      - "notes/01-descriptive-statistics-and-eda.md"
