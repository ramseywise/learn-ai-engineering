  - title: Rules of thumb
    agenda: false
    divider: false
    slides:
      - layout: cards
        title: What to carry out of this lecture
        cards:
          - title: Trace
            body: One trace per turn, one child per call. Agree metadata keys on day one.
            accent: 0EA5C9
          - title: Score
            body: Name runs after versions. Floors on rule categories. Read categories, not the average.
            accent: D4621A
          - title: Judge
            body: One judge per failure. Evidence before verdict. Strong judge on positives only.
            accent: 5B21B6
          - title: Query
            body: Read-only and scoped. Filter twice. Summaries before raw traces.
            accent: 0F7490
          - title: Contract
            body: Validate in CI. Keep a random slice. Promote checks per segment on measured precision.
            accent: 1E3A5F
          - title: Dashboard
            body: Three input buckets. p95 per route with n. Protect the cache first. Read beside the judges.
            accent: D4621A
        notes: >-
          Each card is one part of the lecture. If you only keep one idea: the tool that shows you the money won't show you the
          wrong answers, so you need the whole set.

