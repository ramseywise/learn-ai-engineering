          - ["Answers on Sonnet 5.5", "+0.46", "Must pass the gate"]
          - ["Judges through the Batch API", "+0.05", "Results up to a day late"]
          - ["Fix the retry loop", "+0.03", "Better for customers too"]
          - ["Router on Opus (the wrong way)", "-0.05", "The router is already 0.1% of spend"]
        highlight: [0]
        takeaway: Protect the cache first, cap the loops, batch the judges, then test cheaper models through the release gate.
        source: notes/06-cost-and-latency-dashboards.md
