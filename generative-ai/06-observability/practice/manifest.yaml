# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/check_blocks.py"
    purpose: "Checker, not an example: runs every Python block in the observability notes against local fakes and compares them with their printed output."
    demonstrates: []
    pattern: other
    language: python
    runs_offline: false
    verified_by: none
    licence: course
  - path: "practice/make_dashboard_chart.py"
    purpose: "Renders a three-panel dashboard of daily cost per resolved ticket and p95 latency by route from the synthetic support-agent traces into sources/images."
    demonstrates:
      - "notes/06-cost-and-latency-dashboards.md"
    pattern: other
    language: python
    runs_offline: true
    verified_by: "uv run --no-project --with pandas --with matplotlib python make_dashboard_chart.py"
    licence: course
  - path: "practice/support_agent"
    purpose: "Package of a stubbed support agent with synthetic traces, price table, online scorers, rule-based judges, golden set, replay and a fake Langfuse backend, shared by the observability chapters."
    demonstrates:
      - "notes/01-tracing-with-langfuse.md"
      - "notes/02-scoring-datasets-experiments.md"
      - "notes/03-judge-pipelines-over-trace-exports.md"
      - "notes/05-support-agent-observability.md"
      - "notes/06-cost-and-latency-dashboards.md"
    pattern: eval
    language: python
    runs_offline: true
    verified_by: none
    licence: course
  - path: "practice/trace_server.py"
    purpose: "Read-only MCP server over the synthetic support-agent traces, served over stdio and registrable in Claude Code."
    demonstrates:
      - "notes/04-langfuse-mcp-server.md"
    pattern: tool-agent
    language: python
    runs_offline: true
    verified_by: none
    licence: course
