# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/ablation.py"
    purpose: "One-variable-at-a-time ablation on the Tallybook kit comparing embedding models and dense against hybrid retrieval with local models (downloads about 2.5 GB of ONNX weights on first run)."
    demonstrates: []
    pattern: retrieval
    language: python
    runs_offline: false
    verified_by: none
    licence: course
  - path: "practice/check_blocks.py"
    purpose: "Checker, not an example: runs every Python block in this pillar's notes and compares it with its printed output (needs many packages and model downloads)."
    demonstrates: []
    pattern: other
    language: python
    runs_offline: false
    verified_by: none
    licence: course
  - path: "practice/ragkit.py"
    purpose: "Shared Tallybook RAG kit: synthetic documents, a BM25 retriever, a hand-built stand-in embedder, reciprocal-rank fusion and recall/MRR/NDCG scoring, needing only numpy and printing a retriever scoreboard."
    demonstrates:
      - "notes/01-rag-pipeline.md"
    pattern: retrieval
    language: python
    runs_offline: true
    verified_by: "uv run --with numpy python ragkit.py"
    licence: course
  - path: "practice/versioned_rules_lab.py"
    purpose: "Retrieval over a generated rulebook whose text changes by legal effect date, showing how versioned amendments change the retrieved answer and which customer controls need review."
    demonstrates:
      - "notes/07b-security-changing-text-multimodal-and-live-indexes.md"
    pattern: retrieval
    language: python
    runs_offline: true
    verified_by: "uv run versioned_rules_lab.py"
    licence: course
