# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/coding-agent"
    purpose: "Small coding agent with a read, edit, test loop, sandbox limits and stopping rules, run end to end on a toy repo with a scripted stub model."
    demonstrates:
      - "notes/04-coding-agent.md"
    pattern: loop
    language: python
    runs_offline: true
    verified_by: "cd coding-agent && uv run python -m unittest test_agent"
    licence: course
  - path: "practice/data-analysis-agent"
    purpose: "Analysis agent over the data-analytics pillar's tips and Titanic files (read-only SQL and pandas tools, profiling, a claim validator and charts) driven by a scripted stub model; the tests need the gitignored Titanic file fetched first."
    demonstrates:
      - "notes/05-data-analysis-agent.md"
    pattern: tool-agent
    language: python
    runs_offline: false
    verified_by: "cd data-analysis-agent && uv run --with pandas --with matplotlib python -m unittest test_agent"
    licence: course
  - path: "practice/deep-research-bot"
    purpose: "Vendored workshop repository 'Building Agents from Scratch' (three notebooks plus a deep_research_bot package with tools, evaluation and tests); not confirmed to run without keys or network."
    demonstrates:
      - "notes/02-deep-research-bot.md"
    pattern: tool-agent
    language: python
    runs_offline: false
    verified_by: none
    verification_note: "A test ships with it but no run was recorded in this pass."
    licence: unrecorded
  - path: "practice/deep_research_bench"
    purpose: "Vendored DeepResearch Bench code and prompts (RACE scoring script, utils, run_benchmark.sh) for scoring deep-research reports; not confirmed to run without keys or network."
    demonstrates:
      - "notes/02-deep-research-bot.md"
    pattern: eval
    language: python
    runs_offline: false
    verified_by: none
    licence: unrecorded
  - path: "practice/scoping-an-ai-product"
    purpose: "Standard-library cost model for a hypothetical support-drafting assistant: volumes, wages and savings are assumptions and prices are vendor list prices read on 2026-11-02."
    demonstrates:
      - "notes/07-scoping-an-ai-product.md"
    pattern: other
    language: python
    runs_offline: true
    verified_by: "cd scoping-an-ai-product && uv run cost_model.py"
    licence: course
