# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/nn-zero-to-hero"
    purpose: "Vendored 'Neural Networks: Zero to Hero' notebooks (micrograd, makemore, nanogpt folders) from its README, which lists the video lectures they accompany."
    demonstrates:
      - "notes/01-micrograd.md"
      - "notes/02-makemore.md"
      - "notes/03-nanogpt.md"
    pattern: other
    language: jupyter
    runs_offline: false
    verified_by: none
    licence: unrecorded
  - path: "practice/run_note.py"
    purpose: "Tool, not an example: runs a note's Python code blocks top to bottom in one shared namespace."
    demonstrates:
      - "notes/03-nanogpt.md"
    pattern: other
    language: python
    runs_offline: false
    verified_by: none
    licence: course
