# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/01-research-agent"
    purpose: "One research agent answering the same question over a six-document corpus built three ways (no framework, LangGraph, Google ADK, plus LCEL) with a deterministic stub model, with a demo script per note."
    demonstrates:
      - "notes/01-react-from-scratch-to-langgraph.md"
      - "notes/02-agentic-search-persistence-streaming.md"
      - "notes/03-long-term-memory-with-langgraph.md"
      - "notes/04-google-adk.md"
      - "notes/05-langsmith.md"
      - "notes/06-framework-selection.md"
      - "notes/07-lcel-composition-in-practice.md"
    pattern: tool-agent
    language: python
    runs_offline: true
    verified_by: "cd 01-research-agent && uv run --with langgraph --with langchain-core python demo_01_react.py"
    licence: course
