  - layout: table
    title: Price a run before you plan one
    recall: What share of Llama 2's training data would five years of support tickets be?
    lead: Every pretraining figure reduces to a few multiplications.
    header:
    - Question
    - Arithmetic
    - Answer
    widths:
    - 3
    - 4.6
    - 3
    highlight:
    - 3
    rows:
    - - Cloud bill, Llama 2 7B
      - '184,320 A100 GPU-hours at $30 per 8×A100 server-hour'
      - '**about $691,200**'
    - - Training memory, 1.5B params
      - Weights, gradients and 2 Adam statistics, 4 bytes each
      - '**24 GB** before activations'
    - - Tokens per parameter
      - 2T tokens on 7B parameters
      - '**286**, against Chinchilla''s 20'
    - - Five years of tickets
      - '5 × 365 × 20,000 tickets × 300 tokens, a generous guess'
      - '**10.95B tokens**, 0.55% of Llama 2''s data'
    takeaway: Do the multiplication first. Even generous ticket volumes are a fraction of a percent of Llama 2's data,
      so continue pretraining or fine-tune.
    source: notes/15-pretraining-runs-cost-and-scale.md
    notes: 'This is the answer to the question that opened the part, in four lines of arithmetic. Llama 2 7B took 184,320
      A100 GPU-hours, which is about $691,000 at $30 an hour for an eight-GPU server. Adam needs four values per weight,
      so 1.5 billion parameters take 24 GB before any activations. Llama 2 trained at 286 tokens per parameter, well past
      the Chinchilla ratio of 20, on purpose: a smaller model on more tokens costs more to train and less to run. The
      ticket volume is an assumption, chosen to be generous, and it still comes to 0.55% of what Llama 2 saw.'
  - layout: compare
    title: Continued pretraining adds knowledge, SFT adds behaviour
    recall: How many SFT examples did InstructGPT use?
    emphasis: right
    left:
      title: Continued pretraining
      bullets:
      - Raw domain text
      - Same next-token loss
      - Adds **knowledge**
      tag: A domain the base lacks
    right:
      title: Supervised fine-tuning
      bullets:
      - (instruction, response) demonstrations
      - Loss on response tokens, `ignore_index=-100`
      - Adds **format and behaviour**
      - 'InstructGPT: about 13,000 examples'
      tag: A skill or form it lacks
    takeaway: 'Same loss, different data: raw text adds knowledge, demonstrations add behaviour, so name what is
      missing first.'
    source: notes/07-sft-and-instruction-tuning.md
    notes: These two get confused, and they have the same loss. Continued pretraining feeds raw domain text, and
      adds knowledge. Supervised fine-tuning feeds demonstrations, and teaches a format. So you need to ask what
      is missing. InstructGPT used about 13,000 demonstrations, and typical sets run from 10,000 to 100,000, though
      much of the format gain arrives early.
  - layout: cards
    title: What goes wrong when you fine-tune
    recall: What happens if you fine-tune on facts the model does not know?
    cards:
    - title: Unknown facts
      body: The model fits them slowly and test accuracy falls. Early stopping or "I don't know" labels help.
      accent: D4621A
    - title: Forgetting
      body: Weights that held older knowledge move. Replay old data or limit which weights move.
    - title: Classification
      body: Replace the head, train the last blocks, and take the loss on the last token.
    takeaway: Fine-tuning can damage what a model already knows, so stop early, replay old data and limit which
      weights move.
    source: notes/07-sft-and-instruction-tuning.md
    notes: Fine-tuning has failure modes you can plan for. Teach a model facts it doesn't know, and it fits them
      slowly while its test accuracy falls. Moving weights makes it forget. And a classification head needs far
      less work than a full fine-tune. Early stopping and replay are cheap, so plan for them from the start.
  - layout: code
    title: Preference training pays for separation, not confidence
    recall: What value does this loss start at when the two scores are tied?
    lang: python
    code: "def reward_loss(r_win, r_lose):\n    # -log sigmoid(r_win - r_lose)\n    gap = r_win - r_lose\n    return\
      \ -F.logsigmoid(gap).mean()\n\n# tied scores: loss = ln 2\n# only the gap matters"
    bullets:
    - '**Comparisons** are cheaper than demonstrations.'
    - '**Starts at** `ln 2` when the scores tie.'
    - '**Best-of-N** gets many gains with no RL training.'
    takeaway: Preference training rewards the gap between winner and loser, which is why comparison data is such
      good value.
    source: notes/08-preference-optimisation-overview.md
    notes: Comparing two acceptable answers is far cheaper than writing a good one, and it captures which of two
      right answers people prefer. The reward-model loss pushes the winner's score above the loser's. It starts
      at ln 2 when the scores are tied, and it depends only on their difference. Raising both does nothing.
  - layout: compare
    title: RLHF needs a reward model and RL, DPO needs neither
    recall: How does DPO avoid a reward model?
    emphasis: right
    left:
      title: RLHF
      bullets:
      - Train a reward model on ranked pairs
      - Run PPO against it
      - Delicate, with two models to train
      tag: The classic route
    right:
      title: DPO
      bullets:
      - Closed-form optimal policy
      - Classification loss on log-probability ratios
      - Frozen reference model
      tag: Often the practical start
    takeaway: DPO turns preference optimization into a classification loss, so you can start without a reward model
      or PPO.
    source: notes/08-preference-optimisation-overview.md
    notes: The classic route trains a reward model, then runs PPO against it, which is delicate. DPO notices that
      the optimal policy has a closed form in the reward, so you can substitute it and get a classification loss
      on log-probability ratios against a frozen reference. Constitutional AI replaces human harm labels with model
      critiques against written principles. People still write those principles.
  - layout: code
    title: LoRA starts as a no-op and trains only a small update
    recall: Why is the model unchanged at the start of LoRA training?
    lang: python
    code: "class LoRA(nn.Module):\n    def __init__(self, W, r, alpha):\n        super().__init__()\n        self.W\
      \ = W.requires_grad_(False)\n        d_in, d_out = W.shape[1], W.shape[0]\n        self.A = nn.Parameter(\n\
      \            torch.randn(r, d_in) * 0.01)\n        self.B = nn.Parameter(\n            torch.zeros(d_out,\
      \ r))\n        self.scale = alpha / r\n\n    def forward(self, x):\n        update = self.B @ self.A\n   \
      \     W = self.W + self.scale * update\n        return x @ W.T"
    bullets:
    - '**B starts at zero**, so step 0 is the base model.'
    - '**Commonly targets** `q_proj` and `v_proj`.'
    - '**QLoRA:** a 4-bit NF4 base, for less memory.'
    takeaway: LoRA trains a small low-rank update on frozen weights, merged for serving, so most teams should start
      there.
    source: notes/09-peft-and-fine-tuning-in-practice.md
    notes: Full fine-tuning needs gradients and optimizer state for every weight, several times the model's memory.
      LoRA freezes the matrix and adds a low-rank update B times A. Because B starts at zero, the model is unchanged
      at step 0. Trained, the update gets merged for serving, with no overhead. QLoRA holds the frozen base in 4-bit
      NF4 for less memory in training.
  - layout: table
    title: Prompt, retrieve or fine-tune?
    recall: When is fine-tuning the wrong answer?
    lead: Try them from the top. Each row costs more than the last.
    header:
    - Symptom
    - Lever
    widths:
    - 5.2
    - 5
    highlight:
    - 1
    rows:
    - - Wrong format or tone
      - '**Prompt:** instructions and examples'
    - - Missing or stale facts
      - '**Retrieve:** the next pillar'
    - - Format unstable after good prompting, with thousands of examples
      - '**Fine-tune**, with LoRA first'
    - - Which of two right answers it prefers
      - '**Preference optimization**'
    takeaway: Prompt first, retrieve for facts, and fine-tune only for behaviour that good prompting could not stabilise.
    source: notes/09-peft-and-fine-tuning-in-practice.md
    notes: This table is the decision you came for, and it answers the question we opened with. Missing or stale
      facts call for retrieval, whatever anyone tells you. A format that prompting can reach calls for prompting.
      Fine-tuning is for a behaviour that stays unstable after good prompting, when you also have thousands of examples.
      Try them in this order.
- title: How you use it, and run it
  summary: Prompts · Chains · A tiny GPT · The API · Open weights
  notes: 'Finally, we put the model to work: a prompt, a chain, a build-it-yourself check, a hosted API and a local
    runtime.'
  slides:
  - layout: statement
    title: A one-line prompt returned a paragraph about billing
    kicker: The problem
    statement: A prompt is the conditioning context for next-token prediction. It is the cheapest change you will
      ever make, because no weight moves.
    attribution: Fix it, then measure it. One good output proves nothing.
    source: notes/10-prompting-fundamentals.md
    notes: 'Now we use the thing. Our triage prompt says only: classify this ticket. Sometimes it returns billing,
      sometimes a paragraph about what billing is. Nothing in the model is broken. A prompt is the only thing we
      have changed so far, and it is the cheapest change we will ever make, because no weight moves.'
  - layout: cards
    title: Five principles, and the last two are about how you work
    recall: What are the five principles of prompting?
    cards:
    - title: Give direction
      body: Say who it is, what the job is and what good looks like.
    - title: Specify format
      body: JSON with allowed labels. Then validate it.
    - title: Provide examples
      body: 3–5 varied ones when format must be reliable.
    - title: Evaluate quality
      body: Labelled, held-out set. Rate blind. Log parse rate and cost.
      accent: D4621A
    - title: Divide labor
      body: Split tasks so each step can be checked.
    takeaway: Give direction, format and examples, but evaluation on a labelled set is what turns a prompt into
      something you can trust.
    source: notes/10-prompting-fundamentals.md
    notes: These are Phoenix and Taylor's five principles. Direction, format and examples are about what you write.
      Evaluation and division of labor are about how you work, and they matter the most, since output is sampled.
      Run each variant over a labelled set instead of judging from one good output.
  - layout: flow
    title: Wrap every call in a retry with a designed exit
    recall: "What do you do with a reply that fails validation?"
    steps:
    - label: Template
      sub: direction, format, examples
    - label: Model
      sub: a paid call
    - label: Validate
      sub: parses, label allowed
      accent: D4621A
    - label: Label or human
      sub: after capped retries
    bullets:
    - '**Cap retries,** and name the fallback.'
    - '**Log** accuracy, parse rate and calls per ticket.'
    takeaway: Validate each reply, retry up to a cap, and route the rest to a human, logging what the retries cost.
    source: notes/10-prompting-fundamentals.md
    notes: Here is the shape every production prompt ends up with. Template, model, then a check that it parses
      and the label is allowed. If it fails and retries are left, go again. If retries run out, it goes to a person.
      Every retry is a paid call, so log the calls alongside accuracy to see what the retry is costing.
  - layout: code
    title: LangChain makes each box a swappable Runnable
    recall: What does the pipe operator do in LCEL?
    lang: python
    code: "from langchain_core.language_models import (\n    FakeListChatModel)\nfrom langchain_core.output_parsers\
      \ import (\n    StrOutputParser)\nfrom langchain_core.prompts import (\n    ChatPromptTemplate)\n\nprompt\
      \ = ChatPromptTemplate.from_template(\n    'Label this ticket: {ticket}')\nmodel = FakeListChatModel(responses=['billing'])\n\
      chain = prompt | model | StrOutputParser()\n\nchain.invoke({'ticket': 'charged twice'})\nchain.batch([{'ticket':\
      \ 'a'}, {'ticket': 'b'}])"
    bullets:
    - '**A Runnable** has invoke, batch and stream.'
    - '**Fake models** test wiring, not quality.'
    - '**Loops or approval?** Move to LangGraph.'
    takeaway: LCEL pipes Runnables into a chain that can batch and stream, and a fake model makes its wiring cheap
      to test.
    source: notes/11-langchain-basics.md
    notes: LangChain's value is one common interface. A prompt, a model and a parser all implement invoke, batch
      and stream, so the pipe composes them and the chain gains those methods with no new code. A fake chat model
      makes wiring tests free and deterministic. That tests the plumbing and says nothing about answer quality.
  - layout: table
    title: Five checks catch most model bugs
    recall: What should the loss be at step 0, and how do you test the causal mask?
    lead: Each takes minutes, on a model small enough for a laptop.
    header:
    - Check
    - Expected
    - If not
    widths:
    - 3
    - 4
    - 3.4
    rows:
    - - Loss at step 0
      - About `ln(vocab)`; 4.17 for 65 characters
      - Initialization or target shift
    - - Overfit one batch
      - Loss falls towards 0
      - Model or optimizer wiring
    - - Causal mask
      - Earlier logits unchanged
      - Mask missing or transposed
    - - Train vs val
      - Tracked together
      - Overfitting
    - - Parameter count
      - Matches hand calculation
      - Tying or layer sizes
    takeaway: Write the model once and run these checks, since a bad mask still trains and only a direct test will
      reveal it.
    source: notes/12-build-a-tiny-gpt.md
    notes: The fastest way to learn the model is to write one, as Karpathy and Raschka both have you do. The chapter's
      CPU script is about 80 lines and runs these checks. When the fine-tune produces garbage, these tell you whether
      you have a bad mask or a bad learning rate. Note that a missing mask still trains and the loss still falls.
  - layout: compare
    title: The request that worked last year can now return a 400
    recall: What replaces a forced tool_choice on current Claude models?
    emphasis: right
    left:
      title: In older tutorials
      bullets:
      - '`tool_choice` forcing one tool'
      - '`temperature`, `top_p`, `top_k`'
      - Assistant prefill
      - Thinking budgets
      tag: 400 on current models
    right:
      title: What to use now
      bullets:
      - '`messages.parse` with a schema'
      - Or a `strict` tool under `auto`
      - Prompt names the tool, code checks the call
      - Adaptive thinking
      tag: claude-opus-5-5
    takeaway: Current Claude models reject forced tools and sampling settings, so use structured outputs or strict
      tools under auto.
    source: notes/13-calling-models-from-code.md
    notes: The hosted API moves. On current Claude models, forcing a tool with tool_choice returns a 400. So do
      temperature, top_p and top_k on Opus 5.5, as well as assistant prefill and thinking budgets. If you copied
      code from an older tutorial, that is a likely cause. Read the 400's message, and pin the model id so changes
      are deliberate.
  - layout: code
    title: The tool loop has three details that hand-rolled code gets wrong
    recall: What are the three details of a correct tool loop?
    lang: python
    code: "for turn in range(max_turns):\n    r = client.create(messages)\n    if r.stop_reason == 'refusal':\n\
      \        return 'refused'\n    messages.append(\n        {'role': 'assistant', 'content': r.content})\n  \
      \  if r.stop_reason != 'tool_use':\n        return text_of(r)\n    results = [run(b) for b in r.content\n\
      \               if b.type == 'tool_use']\n    messages.append(\n        {'role': 'user', 'content': results})\n\
      return 'hit the cap'"
    bullets:
    - '**Entire content** goes back.'
    - '**One user turn** carries all results.'
    - '**Cap turns;** send tool errors as `is_error`.'
    takeaway: Append all assistant content, send every result in one user turn, cap the turns, and check stop_reason
      first.
    source: notes/13-calling-models-from-code.md
    notes: This loop is the seed of every agent. First, append the whole assistant content, or the API can't match
      results to calls. Second, return all results for a turn in one user message, each with its id. Third, cap
      the turns, since a model that keeps calling tools is a cost incident. The history goes back each time, which
      is why long loops get expensive.
  - layout: table
