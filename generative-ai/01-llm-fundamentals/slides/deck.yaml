# LLM Fundamentals lecture deck. Covers notes 01-15, including the b parts (01b, 02b, 03b, 06b).
# Build: make slides PILLAR=generative-ai/01-llm-fundamentals STRICT=1 PREVIEW=1
# Spec:  .claude/skills/slides/references/deck-spec.md
# Running example: a support-ticket assistant that invents a refund policy.
deck:
  title: How LLMs work
  subtitle: 'LLM fundamentals: what a model is, how it is trained, and how to use one'
  tagline: It predicts · It is trained · You use it · You run it
  reference: 'Notes: generative-ai/01-llm-fundamentals'
  output: llm-fundamentals.pptx
  notes: 'Today we follow one thing: a support-ticket assistant that invents a refund policy. To understand why,
    we go through what a model is, how it gets trained, how to prompt and call it, and how to run it yourself. By
    the end you will know which lever fits which problem, and why the assistant still needs the next pillar.'
parts:
- title: How a model works
  summary: Tokens · Attention · Scale · Decoding · Hallucination
  notes: We start from what the model sees. Everything surprising about LLMs follows from next-token prediction
    over subword tokens.
  slides:
  - layout: statement
    title: Our assistant just invented a refund policy. Why?
    kicker: The problem
    statement: An LLM predicts the next token. Almost everything surprising about it follows from that one sentence.
    attribution: Plausible is what it was trained for. True was never in the loss.
    source: notes/01-tokens-and-embeddings.md
    notes: A team ships a ticket assistant, and it confidently cites a refund policy that does not exist. Nothing
      crashed. To see why that was the expected behaviour, we start with what the model actually receives when a
      customer types a sentence. Then we follow that sentence all the way through to the next token.
  - layout: flow
    title: From a customer message to one next token
    recall: "How does a model get from a customer's text to the next token?"
    steps:
    - label: Tokens
      sub: BPE subwords
    - label: Embeddings
      sub: a vector per token, plus position
    - label: Blocks
      sub: attention and MLP, stacked
    - label: Logits
      sub: a score per vocabulary item
    - label: Sample
      sub: pick one, append, repeat
      accent: D4621A
    bullets:
    - '**Tokens**, not characters or words, are the unit of cost and context.'
    - Each step sees only tokens, which explains trouble with **letters and counting**.
    takeaway: The model turns tokens into vectors, mixes them with attention, and samples one next token at a time.
    source: notes/01-tokens-and-embeddings.md
    notes: Here is the whole forward pass on one line. Text becomes integer tokens, tokens become vectors with a
      position signal, blocks of attention mix them, and the last position produces a score for each word in the
      vocabulary. We sample one, append it and go round again. The next few slides open each box.
  - layout: compare
    title: Why tokens set both the bill and the blind spots
    recall: Why can a model fail to reverse a string that it reads correctly?
    lead: 'Same short sentence with GPT-4 tokenization: a median of 7 tokens in English, 72 in Burmese.'
    emphasis: right
    left:
      title: What tokens give you
      bullets:
      - A fixed vocabulary
      - Any string can be encoded
      - Units with more meaning than characters
      tag: Why BPE won
    right:
      title: What tokens cost you
      bullets:
      - Billing and limits **per token**
      - Rare languages cost more, and often score worse
      - Letters inside a token are not directly visible
      tag: What to plan for
    takeaway: Tokens make any text encodable, but they set the bill and hide the letters, so measure in tokens.
    source: notes/01-tokens-and-embeddings.md
    notes: 'BPE gives a fixed vocabulary that can still encode any string, and that design has two consequences.
      Since prices and limits are per token, some languages cost far more: a short sentence took a median of 7 tokens
      in English and 72 in Burmese. And since the letters sit inside a token, a model can read a string correctly
      and still fail to reverse it.'
  - layout: code
    level: deep
    title: A dot product counts length, a cosine only direction
    recall: When do dot product, cosine and L2 distance rank neighbours the same way?
    lang: python
    code: |-
      q = np.array([3.0, 4.0])
      docs = {"53 deg away": np.array([1.0, 0.0]),
              "same way, 10x": np.array([30.0, 40.0]),
              "right angle": np.array([-4.0, 3.0])}
      cos = lambda a, b: a @ b / (norm(a) * norm(b))
      for name, d in docs.items():
          print(name, q @ d, round(cos(q, d), 2))
      # 53 deg away      3.0  0.6
      # same way, 10x  250.0  1.0
      # right angle      0.0  0.0
    bullets:
    - '**Dot product:** multiply entry by entry, then add.'
    - '**10× longer** gives a 10× larger dot product.'
    - '**Cosine** divides the lengths out: 1 to −1.'
    - '**At length 1** dot = cosine, and L2 ranks the same.'
    takeaway: Scale embeddings to length 1 and dot product, cosine and L2 distance pick the same neighbours.
    source: notes/01-tokens-and-embeddings.md
    notes: 'An embedding is a vector, a list of d_model numbers. The dot product multiplies two vectors entry by entry
      and adds, so it is large when they point the same way and zero at right angles. It also grows with length: the
      vector pointing the same way but ten times longer scores 250 against 3. Cosine similarity divides the lengths
      out. Once every vector has length 1, the dot product is the cosine, and since squared L2 distance is 2 minus 2
      times the dot product, all three rank neighbours the same way. Attention scores, next, are plain dot products.'
  - layout: table
    title: Position schemes differ in where the order signal goes
    recall: Which position schemes act inside attention, and which act on the input?
    lead: Attention alone is order-blind, so every model adds position somewhere.
    header:
    - Scheme
    - Used by
    - Idea
    widths:
    - 2
    - 2.2
    - 5
    rows:
    - - Learned absolute
      - GPT-2, GPT-3
      - A second embedding table indexed by position, added to the token embedding
    - - Sinusoidal
      - Original transformer
      - Fixed sine and cosine patterns added to the input
    - - Relative
      - Transformer-XL, T5
      - A term for the query-key offset, added inside attention
    - - Rotary (RoPE)
      - Llama, most open models
      - Rotate queries and keys by a position-dependent angle, so the score depends on the offset
    - - ALiBi
      - BLOOM, MPT
      - Subtract a per-head linear penalty proportional to distance from the scores
    - - None (NoPE)
      - Research models
      - No position signal; the causal mask lets a decoder work out order
    takeaway: Learned and sinusoidal positions go on the input; relative, RoPE and ALiBi act on the query-key score.
    source: notes/01b-position-encodings-and-context-extension.md
    notes: Chapter 01 built a learned table and RoPE by hand. This table puts all six schemes side by side. The one
      distinction to remember is where the signal enters. Learned and sinusoidal positions are added to the token
      embedding. Relative encodings, RoPE and ALiBi change the query-key score inside attention. NoPE adds nothing,
      and in a decoder the causal mask is enough for the model to recover order.
  - layout: compare
    title: A RoPE model breaks past its training length, and rescaling positions mends it
    recall: What happens to a RoPE model run past its training length, and what fixes it without retraining?
    emphasis: right
    left:
      title: Qwen-7B as trained (2,048 tokens)
      bullets:
      - 'arXiv perplexity **3.78** at 2,048 tokens'
      - '**39.35** at 4,096'
      - '**2,645** at 16,384'
    right:
      title: With scaling added at inference
      bullets:
      - Dynamic NTK scaling, LogN attention scaling and window attention
      - No retraining
      - '**3.49** at 8,192 and **4.32** at 16,384'
      tag: It stops breaking; that does not show it uses the far context
    takeaway: Rescale positions (interpolation, NTK, YaRN) so long inputs map back into the trained range, then test your own task at the length you will use.
    source: notes/01b-position-encodings-and-context-extension.md
    notes: Qwen-7B was trained on 2,048 tokens. Run as is, perplexity climbs from 3.78 to 39.35 at 4,096 and 2,645 at
      16,384. Position interpolation divides every position by the extension factor, NTK-aware scaling raises the
      RoPE base, dynamic scaling does it only past the training length. With dynamic NTK, LogN scaling and window
      attention it holds 3.49 at 8,192 and 4.32 at 16,384 without retraining. Be careful, though. Like ALiBi's result,
      this shows the model does not break, not that it uses the far context. A model can accept 128k tokens and still
      retrieve or copy badly from them.
  - layout: image
    title: The causal mask is why one pass can train every position
    recall: How do you test that a causal mask works?
    image: ../sources/images/build-a-large-language-model-from-scratch-fig3-19.png
    caption: Attention weights without and with the causal mask (Raschka, 2024, Fig. 3-19)
    bullets:
    - '**Query** compares with each **key**; the weights average the **values**.'
    - '**Mask:** no position sees a later one.'
    - '**Test:** change a later token; earlier outputs stay the same.'
    takeaway: Attention weights tokens by relevance, and the causal mask makes one pass train every position honestly.
    source: notes/02-attention-and-the-transformer-block.md
    notes: 'These are attention weights for one short sentence, without the mask on the left and with it on the
      right. The upper triangle is gone, so no position can see later ones. That one matrix lets a single forward
      pass train each position to predict the next token. And it gives us a test: change a later token, and nothing
      earlier may move.'
  - layout: cards
    level: deep
    title: Read attention by its shapes
    recall: What does Q Kᵀ cost, and why is K transposed?
    cards:
    - title: Matrix product
      body: '(m × k)(k × n) gives (m × n). Each entry is one dot product, so the cost is about **2·m·n·k FLOPs**.'
    - title: Transpose
      body: 'Kᵀ turns (T × d_k) into (d_k × T), so Q Kᵀ is a **T × T** grid of query-key dot products.'
    - title: Broadcasting
      body: Line shapes up from the right. A (T × T) grid plus a (T,) vector adds it to every row.
    - title: Low rank
      accent: D4621A
      body: 'A rank-r matrix is (m × r)(r × n). At 1,000 × 1,000 and rank 4: **8,000** numbers, not 1,000,000.'
    takeaway: Inner sizes must match and drop out, a product costs 2·m·n·k FLOPs, and a low-rank matrix stores as
      two thin factors, which is LoRA.
    source: notes/02-attention-and-the-transformer-block.md
    notes: 'Before the attention code, the four pieces of matrix arithmetic it uses. In a matrix product the inner
      sizes must match and drop out, and each entry is a dot product of a row with a column, which gives the 2 m n k
      FLOP estimate you can use for any layer. The transpose is why the scores are Q times K transpose: without it the
      shapes would not line up. Broadcasting is how a bias or mask applies to every row in one line. And rank: a
      matrix built from r underlying rows can be stored as two thin factors. In the note, a random 1,000 by 1,000
      matrix has rank 1,000, while one built from two rank-4 factors has rank 4 and needs 125 times fewer numbers.
      That is the idea behind LoRA in chapter 9.'
  - layout: code
    title: Attention is short enough to hold in your head
    recall: Why divide by the square root of d_k?
    lang: python
    code: "def attend(q, k, v, mask):\n    # q, k, v: (batch, T, d_k)\n    s = q @ k.transpose(-2, -1)\n    s =\
      \ s / k.shape[-1] ** 0.5\n    s = s.masked_fill(~mask, float('-inf'))\n    w = s.softmax(dim=-1)  # (batch,\
      \ T, T)\n    return w @ v"
    bullets:
    - '**Dividing by √d_k** keeps the softmax from going one-hot.'
    - '**T × T scores:** cost is quadratic in context.'
    - '**Heads** repeat this with their own projections.'
    takeaway: Attention is a masked, scaled softmax over dot products, and its T by T matrix is what makes context
      expensive.
    source: notes/02-attention-and-the-transformer-block.md
    notes: 'This is scaled dot-product attention with the mask. Dot products grow with dimension, so we divide by
      the square root of d_k to stop the softmax becoming one-hot. Anything masked goes to minus infinity, so it
      gets zero weight after the softmax. The real cost shows here too: the score matrix is T by T, so it is quadratic
      in context.'
  - layout: image
    title: A block adds an MLP, residuals and LayerNorm, and then you stack it
    recall: What do the residual and the LayerNorm each contribute?
    image: ../sources/images/huyen-ai-engineering-fig2-6.png
    caption: The composition of a transformer (Huyen, AI Engineering, 2025, Fig. 2-6)
    bullets:
    - '**Residual:** a direct path for gradients.'
    - '**LayerNorm:** stable activations, no batch statistics.'
    - '**Attention** dominates the cost of a block.'
    takeaway: 'A GPT is one block repeated: attention and an MLP, with residuals and LayerNorm to keep deep stacks
      trainable.'
    source: notes/02-attention-and-the-transformer-block.md
    notes: A block is attention followed by a position-wise MLP, each with a residual and a LayerNorm. Residuals
      give gradients a direct path through deep stacks. LayerNorm keeps activations in a stable range. GPTs are
      this block stacked, with an embedding underneath and a linear head on top.
  - layout: image
    title: Trained heads specialise, but a high weight is not an explanation
    recall: Is an attention weight an explanation of the model's answer?
    image: ../sources/images/voita-multihead-roles-fig1.png
    caption: Encoder heads by layer, relevance and function (Voita et al., 2019, Fig. 1)
    bullets:
    - 'Important heads are **positional**, **syntactic** or **rare-word** heads.'
    - 'Pruning removed **38 of 48** encoder heads for a drop of only 0.15 BLEU.'
    - Jain and Wallace found alternative weights that left the prediction unchanged.
    takeaway: Use attention as a place to look, not as the reason for an answer.
    kicker: Voita et al., 2019
    source: notes/02b-what-trained-attention-does.md
    notes: Plotting the weights is easy and over-reading them is easier. Voita et al. ranked the encoder heads of a
      translation model and found three kinds that matter. Pruning the rest left quality almost unchanged. Jain and
      Wallace trained classifiers with attention and found different weights that gave the same prediction, and weak
      agreement with gradient importance. So weights show where a head drew from, nothing more.
  - layout: bullets
    title: Many heads park their weight on the first token
    recall: What is an attention sink?
    lead: Large transformers put tokens to uses nobody designed.
    bullets:
    - 'An **attention sink** is a head that puts most of its weight on the first token as a no-op.'
    - 'Gemma 7B run without its bos token fell from **82.57 to 0.00** on RULER at 4,096 tokens.'
    - 'On HellaSwag it fell from **80.61 to 27.35**.'
    - 'ViT cuts an image into **16x16** patches and treats each as a token.'
    - 'In DINOv2 ViT-g about **2%** of patch tokens held roughly **10x** the norm of the rest.'
    takeaway: A head that sits on the first token is probably a no-op, so dropping that token can break a model that was trained with it.
    source: notes/02b-what-trained-attention-does.md
    notes: Language models have their own version of the vision outliers. Many heads put most of their weight on
      the first token, which the note calls an attention sink. Clark et al. first saw it in BERT on the SEP token.
      Barbero et al. dropped the bos token from Gemma 7B and RULER collapsed from 82.57 to 0.00. That says more
      about bos than about sinks, but it is the practical warning. Images reach a transformer as 16x16 patches, and
      Darcet et al. found about 2% of DINOv2 patch tokens carried roughly ten times the norm, which they fixed with
      register tokens. The vision results were measured on patches; the language results are separate studies.
  - layout: table
    title: Parameters tell you the memory, not the ability
    recall: How do you estimate the memory for a model's weights?
    lead: Weights only. Serving adds the KV cache and activations.
    header:
    - Model
    - fp16
    - int8
    - 4-bit
    widths:
    - 4
    - 2
    - 2
    - 2
    rows:
    - - GPT-2 small (124M)
      - 0.25 GB
      - 0.12 GB
      - 0.06 GB
    - - Llama 2 7B
      - 14 GB
      - 7 GB
      - 3.5 GB
    - - Llama 2 70B
      - 140 GB
      - 70 GB
      - 35 GB
    takeaway: Size a model as parameters times bytes before you download it, and treat the count as memory rather
      than ability.
    source: notes/03-scale-and-the-model-zoo.md
    notes: Memory for the weights is parameters times bytes per parameter. So you can size a model on the back of
      an envelope before you download it. Note that this says nothing about ability. LLaMA's 13B beat the 175B GPT-3
      on most benchmarks in its report, because it was trained on far more data per parameter.
  - layout: compare
    title: Chinchilla changed what a training budget should buy
    recall: Why might an operator train past 20 tokens per parameter?
    emphasis: right
    left:
      title: Kaplan (2020)
      bullets:
      - Scale models up faster than data
      - Bigger felt safer
      tag: Overturned
    right:
      title: Chinchilla (2022)
      bullets:
      - Scale parameters and tokens about equally
      - '**About 20 tokens per parameter**'
      - Inference-heavy operators may train past it
      tag: The training optimum
    takeaway: Chinchilla says scale data and parameters together, yet operators train past 20 tokens per parameter
      to cut inference cost.
    source: notes/03-scale-and-the-model-zoo.md
    notes: Kaplan's fit suggested bigger models with less data. Chinchilla found that for a fixed compute budget
      you should scale parameters and tokens about equally, at roughly 20 tokens per parameter. But it is a training
      optimum. If inference traffic dwarfs training, a smaller model trained past that point costs less over its
      life. And mixture of experts splits size from compute again.
  - layout: cards
    title: Three ways around the quadratic cost of attention
    recall: What are the three ways to avoid attention's quadratic cost?
    lead: Not every LLM is a transformer.
    cards:
    - title: Keep attention, change the mix
      bullets:
      - 'Kimi Linear: **3** linear layers per attention layer'
      - 48B total, 3B active
      - 'RULER at 128K: **84.3** against 81.3 for full attention, with up to **75%** less KV cache'
    - title: Replace it with a fixed-size state
      accent: D4621A
      bullets:
      - Linear attention, RetNet, Mamba, RWKV
      - Generating a token costs the same at any position
      - Everything kept from the prompt must fit in the state
    - title: Change the generation order
      accent: 0EA5C9
      bullets:
      - 'LLaDA 8B on 2.3T tokens: MMLU **65.9** against 65.4 for LLaMA 3 8B on 15T'
      - 'GSM8K **70.3** against 48.7'
      - No KV cache, and the output length is fixed in advance
    takeaway: Fixed-size state makes long sequences cheap and loses what does not fit, so the field's answer is hybrids with a few attention layers.
    source: notes/03b-beyond-the-transformer.md
    notes: Attention cost grows quadratically with length. There are three answers. Keep attention and mix in cheaper
      layers; Kimi Linear uses three linear layers to every attention layer and cut KV cache by up to 75 percent.
      Replace attention with a fixed-size state, as in linear attention, RetNet, Mamba and RWKV. Or change the
      generation order, as LLaDA does with masked diffusion. Most comparisons here stop at a few billion parameters
      and use the authors' own benchmarks, so treat wins at 3B as saying little about 70B.
  - layout: code
    level: deep
    title: A fixed-size state gives the same outputs as a growing cache
    recall: Why is generation cheap in a linear-attention model?
    lang: python
    code: |-
      import numpy as np
      rng = np.random.default_rng(0)
      d, T = 4, 6
      phi = lambda x: np.maximum(x, 0) + 1e-3
      q, k, v = (rng.normal(size=(T, d)) for _ in range(3))

      parallel = []                      # each step looks back at every key
      for t in range(T):
          w = np.array([phi(q[t]) @ phi(k[s]) for s in range(t + 1)])
          parallel.append((w[:, None] * v[: t + 1]).sum(0) / w.sum())

      S, z, recurrent = np.zeros((d, d)), np.zeros(d), []
      for t in range(T):                 # the same, over a fixed state
          S += np.outer(phi(k[t]), v[t])
          z += phi(k[t])
          recurrent.append(phi(q[t]) @ S / (phi(q[t]) @ z))
      print("same outputs:", np.allclose(parallel, recurrent))
    bullets:
    - 'Prints **same outputs: True**.'
    - 'The state is **20** numbers at any length.'
    - 'A softmax KV cache at 10,000 tokens holds **80,000**.'
    takeaway: Causal linear attention is a recurrence over a fixed-size state, so a token costs the same at position 10,000 as at position 10.
    source: notes/03b-beyond-the-transformer.md
    notes: NumPy, one head, a made-up feature map. The first loop is the usual view, with a growing cache. The second
      carries a state whose size does not depend on how many tokens came before. The outputs match. The state is
      what makes generation cheap and what the limits are about, because everything the model remembers of the
      prompt has to fit in it.
  - layout: flow
    title: Prefill is parallel, decode is one token at a time
    recall: What does the KV cache store, and what does it cost?
    steps:
    - label: Prompt
      sub: all tokens known
    - label: Prefill
      sub: one parallel pass
    - label: KV cache
      sub: keys and values kept
      accent: 94A3B8
    - label: Decode
      sub: one pass per token
    bullets:
    - '**Input tokens** are cheap in time; **output tokens** are sequential.'
    - '**The KV cache** grows linearly with context, on top of the weights.'
    takeaway: Prefill reads in parallel and decode writes serially, and the KV cache trades growing memory for that
      speed.
    source: notes/04-decoding-and-inference-behaviour.md
    notes: Two very different phases hide inside one request. Prefill reads the whole prompt in one parallel pass.
      Decode produces one token per forward pass, each waiting for the last. The KV cache means a new token needs
      to compute only its own keys and values, but the cache grows linearly with context, on top of the memory for
      the weights.
  - layout: image
    title: Temperature reshapes the choice among the logits
    recall: What does a temperature above 1 do to the distribution?
    image: ../sources/images/huyen-ai-engineering-fig2-16.png
    caption: Softmax probabilities of two tokens as temperature rises (Huyen, AI Engineering, 2025, Fig. 2-16)
    bullets:
    - '**Above 1** flattens, **below 1** sharpens, **0** is argmax.'
    - '**Top-k** keeps a fixed count. **Top-p** adapts to the shape.'
    - Temperature 0 on an API is still **not fully reproducible**.
    takeaway: Sampling settings shape which token gets chosen, and they control variety without making the answer
      true.
    source: notes/04-decoding-and-inference-behaviour.md
    notes: Temperature divides the logits before the softmax. Above 1 flattens the distribution, and below 1 sharpens
      it. Zero is implemented as argmax. On the chart you can see two tokens with logits 1 and 2 drift towards each
      other as temperature rises. On your own open-weight model you control this. Current Claude models no longer
      accept it, which we return to later.
  - layout: cards
    title: Spending more compute and constraining the output
    recall: What does constrained decoding guarantee, and what does it leave open?
    cards:
    - title: Test-time compute
      body: Several samples per request, then choose. Quality rises with samples and so does cost.
    - title: Constrained decoding
      body: Mask tokens the grammar forbids at each step. Shape is guaranteed, truth is not.
      accent: D4621A
    - title: GQA
      body: Several query heads share a key/value head, which shrinks the KV cache at small quality cost.
    takeaway: Decoding-time levers trade compute or memory for quality, and constraints fix an answer's shape but
      not its truth.
    source: notes/04-decoding-and-inference-behaviour.md
    notes: 'Two more levers at decoding time. You can draw several samples and take the best, which spends compute
      at inference. And you can mask tokens the grammar forbids, which guarantees the shape. Shape is all it guarantees:
      a valid JSON object can still hold a wrong value. That distinction turns up in every structured-output system
      we use.'
  - layout: compare
    title: 'Why it invents things: two hypotheses, neither settled'
    recall: What are the two hypotheses for hallucination?
    emphasis: left
    left:
      title: Snowballing
      bullets:
      - Cannot tell given text from generated text
      - Each error becomes context for the next
      tag: Self-delusion
    right:
      title: Imitating knowledge
      bullets:
      - SFT shows confident answers
      - It learns the form without the facts
      tag: Mismatched internal knowledge
    takeaway: 'Treat hallucination as structural: both leading explanations come from how the model is trained,
      so design checks.'
    source: notes/05-hallucination-and-base-vs-assistant.md
    notes: Back to our invented refund policy. A base model is a text-continuer, so assistant behaviour had to be
      added in post-training. There are two main explanations for hallucination. One is that the model cannot tell
      given text from its own, so errors snowball. The other is that fine-tuning teaches it to imitate knowledge
      it does not have. Neither is settled, and both imply that you check its answers.
  - layout: bullets
    title: 'Monday: check what your model can and cannot see'
    recall: What kind of error can self-consistency not catch?
    bullets:
    - '**Count tokens** in your real prompts, in each language you serve.'
    - '**Size the model** before you download it: parameters times bytes.'
    - '**Check the chat template** matches training. A mismatch degrades quality silently.'
    - '**Compare samples** to flag invented facts, knowing that consistent errors pass.'
    - '**Calibrate** self-reported confidence on your own data.'
    takeaway: Measure tokens and memory, match the chat template, and verify facts instead of trusting a model's
      fluency.
    source: notes/05-hallucination-and-base-vs-assistant.md
    notes: Here is what to do with this part next week. These checks cost almost nothing. SelfCheckGPT's idea, comparing
      samples, is a good cheap filter, but it can't catch an error the model makes consistently. And calibrate any
      self-reported confidence on your own data.
- title: How it is trained and adapted
  summary: Pretraining · Cost and scale · SFT · Preference · LoRA
  notes: Now we follow the weights through their stages, so we can pick the right lever instead of reaching for
    fine-tuning first.
  slides:
  - layout: statement
    title: Should we train a model on five years of tickets?
    kicker: The problem
    statement: Pretraining buys knowledge, supervised fine-tuning buys format, preference optimization buys judgment,
      and LoRA makes the last two affordable.
    attribution: Know which stage a problem belongs to before you reach for fine-tuning.
    source: notes/06-pretraining-data-and-objectives.md
    notes: 'Someone will ask this. Before anyone reaches for a GPU, we need to know what training optimises, what
      it needs and what it costs. The short answer is that five years of tickets are several orders of magnitude
      too small to pretrain a base model. The longer answer is what this part covers: which stage of training a
      problem belongs to.'
  - layout: flow
    title: One set of weights passes through several stages
    recall: About what share of InstructGPT's compute went into pretraining?
    steps:
    - label: Pretraining
      sub: knowledge, about 98% of compute
    - label: SFT
      sub: format and behaviour
    - label: Preference
      sub: judgment between answers
      accent: D4621A
    - label: Serve
      sub: with a chat template
    bullets:
    - '**Same weights** throughout: each stage inherits the last.'
    - '**Your own training** almost always begins after pretraining.'
    takeaway: Weights flow from pretraining to fine-tuning to preference optimization, so choose the stage that
      matches your problem.
    source: notes/06-pretraining-data-and-objectives.md
    notes: Follow the weights. Pretraining takes almost all of the compute, about 98% for InstructGPT, and builds
      the base model. Fine-tuning gives it format. Preference optimization gives it judgment. Each stage inherits
      what came before. Parameter-efficient methods make the later stages affordable to you, since they do not need
      retraining from scratch.
  - layout: code
    title: The training objective fits on one slide
    recall: What should the loss be before training, and why?
    lang: python
    code: "for x, y in batches:   # y is x shifted by one\n    logits = model(x)\n    loss = F.cross_entropy(\n\
      \        logits.view(-1, vocab),\n        y.view(-1))\n    opt.zero_grad()\n    loss.backward()\n    opt.step()"
    bullets:
    - '**Labels** are the input shifted by one.'
    - '**Teacher forcing** makes training parallel.'
    - '**Step 0 loss** should be about `ln(vocab)`.'
    takeaway: Pretraining is next-token cross-entropy, parallel through teacher forcing, and step-0 loss near ln(vocab)
      checks the wiring.
    source: notes/06-pretraining-data-and-objectives.md
    notes: The whole of pretraining is this loop. Inputs and labels are the same tokens shifted by one, so no human
      labels are needed. Each position sees the true previous tokens, which is teacher forcing, and that is why
      training is parallel while generation is not. Before you train, the loss should be about ln of the vocabulary
      size.
  - layout: table
    level: deep
    title: Cross-entropy is the loss, entropy its floor, KL the gap
    recall: Why does minimising cross-entropy also minimise KL divergence?
    lead: 'A true next-token distribution p = (0.5, 0.25, 0.25) and a model q = (0.4, 0.4, 0.2), in nats.'
    header: [Quantity, Formula, Meaning, Value]
    widths: [2.2, 2.4, 4.2, 1.6]
    rows:
    - [Entropy, '`−Σ p ln p`', 'The data''s own uncertainty: the floor', '**1.04**']
    - [Cross-entropy, '`−Σ p ln q`', 'Surprise predicting p with q: the loss', '**1.09**']
    - ['KL(p || q)', '`H(p,q) − H(p)`', 'The model''s extra cost, never negative', '**0.05**']
    - ['KL(q || p)', '`Σ q ln(q/p)`', 'Not symmetric: RLHF''s penalty form', '0.054']
    - [Perplexity, '`exp(H(p,q))`', 'Effective number of tokens in play', '**2.97** (best 2.83)']
    highlight: [1]
    takeaway: The data's entropy does not depend on the model, so minimising cross-entropy minimises KL, and perplexity
      is exp of the loss.
    source: notes/06-pretraining-data-and-objectives.md
    notes: 'The loss on the last slide is a cross-entropy. Logs turn the product of per-token probabilities into a
      sum, and we use natural logs, so the unit is nats; divide by ln 2 for bits. Entropy is how uncertain the data
      itself is. Cross-entropy is the average surprise when you predict with q, and with one true token it is just
      minus ln q of that token. KL is the difference, and since the entropy does not depend on the model, minimising
      one minimises the other. The loss can never go below the entropy. KL is not symmetric: pretraining uses the
      forward form, which punishes a model for missing a token the data uses, and RLHF penalises the reverse form
      against a frozen reference. Perplexity is exp of the cross-entropy, the effective number of tokens the model
      is choosing between. These numbers come from the three-token example in the note, run with NumPy.'
  - layout: image
    title: A small corpus teaches you to memorise
    recall: What does a widening gap between training and validation loss show?
    image: ../sources/images/build-a-large-language-model-from-scratch-fig5-12.png
    caption: Training and validation loss on a short story (Raschka, 2024, Fig. 5-12)
    bullets:
    - '**5,145 tokens, 10 epochs:** train 0.39, validation about 6.4.'
    - '**Company data** is several orders of magnitude too small.'
    - '**Memory:** Adam keeps two extra values per weight.'
    takeaway: On little data a model memorises, so continue pretraining or fine-tune rather than pretraining on
      company data.
    source: notes/06-pretraining-data-and-objectives.md
    notes: 'This is what overfitting looks like. On a 5,145-token story, ten epochs drive training loss to 0.39
      while validation stalls near 6.4. The model is memorising. That is why your tickets alone will not pretrain
      a useful model: it would learn your tickets. Training also needs far more memory than inference, since Adam
      keeps two extra values per weight.'
  - layout: flow
    title: Pretraining text is filtered before it is mixed
    recall: How does a raw crawl become a training stream?
    steps:
    - label: Crawl
      sub: Common Crawl snapshot
    - label: Rules
      sub: line and page filters
    - label: Dedup
      sub: paragraph hashes
    - label: Quality score
      sub: rules, perplexity or a classifier
    - label: Mixture
      sub: weights per source
    bullets:
    - 'T5: the unfiltered 6.1TB crawl scored worst on every task (GLUE **81.46** against **83.28** filtered).'
    - 'CCNet: duplicate paragraphs made up **70%** of a monthly snapshot.'
    takeaway: More tokens are not better tokens; filtering and mixture move scores as much as architecture does.
    source: notes/06b-pretraining-data.md
    notes: A pretrained model is its data. Most pretraining text starts as Common Crawl, then line and page rules,
      paragraph dedup, language ID, a quality score and mixture weights. In T5's ablation the unfiltered crawl
      scored worst on every task. Menus and cookie notices repeat across pages, which is why paragraph hashing
      removes so much. The next slide shows the cost of filtering hard.
  - layout: compare
    title: Heavy filtering kept reasoning and gave up stored facts
    recall: What did phi-3-mini's heavy filtering keep and give up?
    emphasis: right
    left:
      title: Kept
      bullets:
