      rather than the name.
    source: notes/14-open-weight-models-and-local-inference.md
    notes: Quantization names map to measured sizes. These are real file sizes from one community conversion of
      a 7.61B-parameter model. Q4 takes more than 4 bits per parameter, because of per-block scale data and tensors
      kept at higher precision. The file is a floor, since the KV cache grows with the context you ask for. Start
      at Q4_K_M, then compare with a larger file on your own eval.
  - layout: cards
    title: Three runtimes, and when local beats the API
    recall: What are the strongest reasons to run locally?
    cards:
    - title: Ollama
      body: One command, and a local server on port 11434.
    - title: llama.cpp
      body: Control over layers and context, on the widest range of hardware.
    - title: transformers
      body: The route to fine-tuning. Your sampling controls are back.
    - title: When local wins
      body: Data rules, weight access, offline, pinning. On cost, only at high steady volume.
      accent: D4621A
    takeaway: Choose local for data rules and control, and work out cost with your own volume, because it rarely
      wins on price alone.
    source: notes/14-open-weight-models-and-local-inference.md
    notes: 'Ollama for simplicity, llama.cpp for control and small devices, transformers for fine-tuning and research.
      As for when to run locally at all, the strong reasons are data residency, access to the weights, offline use
      and pinning. On cost alone the arithmetic is usually against you: with an assumed 1,000 dollars a month for
      a server, break-even against Haiku 5.5 was about 9 million short triage tickets a month.'
- title: Wrap-up
  agenda: false
  divider: false
  slides:
  - layout: cards
    title: Rules of thumb to carry out of the room
    recall: Which one sentence explains most of an LLM's surprising behaviour?
    cards:
    - title: Plausible, not true
      body: Design for hallucination. Do not hope it away.
    - title: Tokens are the unit
      body: Of cost, latency and context. Count them.
    - title: Check step 0
      body: Loss near `ln(vocab)`, or there is a bug.
    - title: Form, not facts
      body: Fine-tune for behaviour. Retrieve facts. LoRA first.
      accent: D4621A
    - title: Measure prompts
      body: Labelled set, several runs, blind rating.
    - title: Check stop_reason
      body: Cap loops, log usage, validate outputs.
    takeaway: Models predict plausible tokens, so count tokens, validate outputs, measure prompts and retrieve your
      facts.
    source: notes/05-hallucination-and-base-vs-assistant.md
    notes: 'If you remember only this slide, you can still debug most LLM problems you will meet. Each rule goes
      with a part of the lecture, and each rests on the idea that we began with: the model predicts plausible next
      tokens.'
  - layout: bullets
    title: Where this goes next
    recall: What can the assistant still not do at the end of this pillar?
    bullets:
    - '**02 RAG and retrieval:** knowledge the model was not trained on.'
    - '**03 Agentic foundations:** the tool loop, grown up.'
    - '**05 RL:** post-training in depth.'
    - '**08 Eval:** how you know any of it worked.'
    - '**ai-engineering 07, inference engineering:** serving at scale.'
    takeaway: The assistant still lacks your facts, so retrieval comes next, then agents, post-training depth and
      evaluation.
    source: notes/14-open-weight-models-and-local-inference.md
    notes: The assistant is now well-prompted, called correctly and possibly local. It still does not know our refund
      policy, and that was where we began. The next pillar gives it knowledge it wasn't trained on. Then agents
      let it act, and the eval pillar tells you if any of this worked.
