# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/conversation_scoring_lab.py"
    purpose: "Scores generated screening conversations against a four-item rubric with stub scorers that have planted behaviours, to compare scorers with human labels; standard library only."
    demonstrates:
      - "notes/06-evaluating-agents.md"
      - "notes/15-calibration-against-human-labels.md"
    pattern: judge
    language: python
    runs_offline: true
    verified_by: "uv run conversation_scoring_lab.py"
    licence: course
  - path: "practice/eval-suite-ci"
    purpose: "TypeScript eval gate for CI: 24 cases, three graders including a tool-trajectory check, a stored baseline and a process exit code, with the run phase split from a model-free assert phase."
    demonstrates:
      - "notes/10-evals-in-ci.md"
    pattern: eval
    language: typescript
    runs_offline: true
    verified_by: "cd eval-suite-ci && npx --yes tsx test.ts"
    licence: course
  - path: "practice/eval-suite-ci-py"
    purpose: "Python twin of the CI eval gate: same cases, graders and byte-identical baseline.json, with gate.py as the model-free second phase and a sample GitHub Actions job."
    demonstrates: []
    pattern: eval
    language: python
    runs_offline: true
    verified_by: "cd eval-suite-ci-py && uv run test.py"
    licence: course
  - path: "practice/judge_checks_and_critiques.py"
    purpose: "Uses code checks and critiques as evidence about a judge, with deterministic rule judges from the observability support_agent and planted failures as labels; part 4 needs a real model and is separate."
    demonstrates:
      - "notes/14-calibrating-judges-with-checks-and-critiques.md"
    pattern: judge
    language: python
    runs_offline: true
    verified_by: "uv run judge_checks_and_critiques.py"
    licence: course
