# Lecture deck for generative-ai/08-eval: all 19 notes, 01-15 plus 03b, 05b, 06b and 06c.
# Build: make slides PILLAR=generative-ai/08-eval STRICT=1 PREVIEW=1
# Running example: a customer-support agent that answers from help-centre articles and can issue
# refunds. Version B scores 85% against version A's 84%. The talk earns the answer: do not ship.
deck:
  title: Eval Engineering
  subtitle: "Version B scores one point higher. Do you ship it?"
  tagline: "Define correct, trust no grader you have not checked, and put an error bar on every number"
  reference: "Notes: generative-ai/08-eval/notes (01-15, with 03b, 05b, 06b, 06c)"
  output: eval-engineering.pptx
  notes: >-
    This talk follows one decision from start to finish. A support agent has two versions, B scores
    one point above A, and someone asks whether to ship. By the end we will have the machinery to
    answer, and the answer will be no. Every chapter of the pillar is one piece of that machinery.
parts:
  - title: What does better mean?
    summary: "What an eval is · Defining correct · Datasets"
    divider: true
    agenda: true
    notes: >-
      Before we can compare two versions we need a definition of better that a machine can check.
      That takes a vocabulary, written success criteria, and a dataset of real tasks. Nothing in this
      part involves a grader yet, and that order is deliberate.
    slides:
      - layout: statement
        kicker: The problem
        title: "B scores 85%, A scores 84%. Do you ship B?"
        statement: "Version B scores 85%. Version A scores 84%. Do you ship B?"
        attribution: "You cannot answer until better is written down so a machine can check it."
        takeaway: "An eval is the definition of better for your system, written down so a machine can check it."
        recall: "What does an eval give you that reading ten good outputs does not?"
        source: notes/01-what-an-eval-is.md
        notes: >-
          Here is the running example for the whole talk. Our support agent answers from help-centre
          articles and can issue refunds. Someone changed the prompt and the score moved from 84 to 85.
          Without an eval, every change to a prompt, model, tool or retrieval config is a guess. So first
          we have to say what that number is made of.
      - layout: flow
        kicker: The shape of every eval
        title: Every eval runs the same five steps
        steps:
          - {label: Task, sub: from the suite}
          - {label: Run the system, sub: k trials}
          - {label: Capture, sub: trajectory and outcome}
          - {label: Graders, sub: one per dimension}
          - {label: Aggregate, sub: "rate, error bar, decision"}
        caption: "The rest of this talk is about doing one of these arrows well. Our 85% is the far right box, and we have not yet asked what fed it."
        takeaway: "An eval runs tasks through k trials, captures what happened, grades each dimension and aggregates with an error bar."
        recall: "Name the five steps of the core eval flow in order."
        source: notes/01-what-an-eval-is.md
        notes: >-
          Read this left to right. We take a task, run the system several times because outputs vary,
          record what it did and where it ended up, grade that, and aggregate. Notice the last box says
          error bar. Keep that in mind, because it is where our one-point gain will fall apart later.
      - layout: table
        kicker: One vocabulary
        title: Six parts, many names
        lead: "Anthropic, LangSmith, OpenAI and Inspect use different words for the same parts."
        header: [Term, What it is, Also called]
        widths: [2, 6, 3]
        rows:
          - [Task, "One test: an input plus success criteria", "case, example, row"]
          - [Trial, "One attempt at a task. Outputs vary, so several per task", "run, epoch"]
          - [Trajectory, "The full record: messages, tool calls, intermediate results", "trace, transcript"]
          - [Outcome, "The end state: the answer, the file system, the DB row", "final response"]
          - [Grader, "Code, a model or a person scoring one aspect of a trial", "evaluator, judge, metric"]
          - [Suite, "Tasks run together for a system-level picture", "eval set, benchmark"]
        takeaway: "A trajectory is the full record of messages and tool calls; an outcome is the end state, such as the refund row."
        recall: "What is the difference between a trajectory and an outcome?"
        source: notes/01-what-an-eval-is.md
        notes: >-
          Every framework renames these, which makes the literature look more varied than it is. For our
          agent, the trajectory is the tool calls it made, and the outcome is whether a refund row exists.
          Inspect splits a task into dataset, solver and scorer, and that split is worth copying because
          you can swap each one alone.
      - layout: compare
        kicker: Where evals begin
        title: Tests gate merges, evals measure rates
        lead: "Draw the line by determinism."
        emphasis: right
        left:
          title: Unit test
          bullets:
            - "Deterministic behaviour: rendering, schemas, retries, routing tables"
            - "Asserts exact values. Pass or fail"
            - "Mock the model here"
          tag: "retry fires 3 times on 429"
        right:
          title: Eval
          bullets:
            - "Non-deterministic behaviour: quality, grounding, task success"
            - "Many tasks, many trials. A rate with an error bar"
            - "**Never** mock the model: you would measure the mock"
          tag: "grounded answer rate at least 0.90 on the golden set"
        takeaway: "Unit-test deterministic behaviour; measure the non-deterministic as a rate over many tasks, and never assert an exact LLM string."
        recall: "Which behaviour belongs in a unit test and which in an eval, and why?"
        source: notes/01-what-an-eval-is.md
        notes: >-
          A common first mistake is to write an eval as a unit test with an exact string. It fails at
          random, someone relaxes it, and soon it checks nothing. Test the deterministic parts, like the
          retry on a 429. Measure the rest as a rate, over many tasks, against the real model.
      - layout: bullets
        kicker: Two suites, two questions
        title: A capability suite climbs, a regression suite holds
        lead: "Once a capability task passes reliably, it moves to the regression suite."
        bullets:
          - "**Capability:** what can it do? Tasks from the frontier, low to medium pass rate, run on demand"
          - "**Regression:** does it still do what it did? Mastered tasks and every fixed bug, near 100%, every change"
          - "**A drop means different things:** little on a capability suite, a blocked release on a regression suite"
          - "**Offline and online:** curated tasks before release catch what you imagined; sampled traffic catches what you did not"
          - "**An eval is not** a benchmark score, a vibe check or a one-off, and it is not only about quality"
        takeaway: "A drop on a regression suite blocks the release; on a capability suite it shows room to climb."
        recall: "What should a drop mean on each of the two suites?"
        source: notes/01-what-an-eval-is.md
        notes: >-
          So which suite does our 85% come from? It matters. Fifteen percent failure on a regression suite
          is an emergency, and on a capability suite it is room to climb. A public benchmark cannot stand
          in for either one, since a leaderboard rank predicts little about your support bot.
      - layout: compare
        kicker: Before any code
        title: Write success down before you write a grader
        emphasis: right
        left:
          title: Too vague to grade
          bullets:
            - "User needs: a helpful answer"
            - "Must never happen: nothing bad"
            - "Unit of success: it went well"
          tag: Two experts would disagree
        right:
          title: Checkable
          bullets:
            - "The steps to change their payout account, in their language, citing the article"
            - "Never invent a menu path or leak another customer's data"
            - "Per turn grounded and complete; per conversation resolved in at most 6 turns"
          tag: "Wrong menu path is a ticket; wrong tax answer is a fine"
        takeaway: "If two experts would not reach the same verdict on an output, fix the criteria rather than the grader."
        recall: "What is the two-expert test, and what do you fix when it fails?"
        source: notes/02-defining-correct.md
        notes: >-
          Asking a model to judge helpfulness simply moves the vagueness somewhere you cannot see it. Take
          our payout question and answer four things: what the user needs, what must never happen, the
          unit of success, and the cost of being wrong. That last one tells you how hard to gate.
      - layout: steps
        kicker: Find failures by reading
        title: Read a hundred traces before you build a grader
        steps:
          - {title: Collect ~100 traces, text: "Real if you have them, synthetic if you do not yet."}
          - {title: Open coding, text: "A free-text note on the **first** thing that went wrong. No categories yet."}
          - {title: Axial coding, text: "Group the notes into categories. Expect **5–15**."}
          - {title: Count, text: "Rank by frequency times cost. That ranking is your eval roadmap."}
          - {title: Repeat to saturation, text: "Until new traces stop producing new categories, usually 50–100.", accent: D4621A}
        takeaway: "Do not build a grader for a failure mode you have not seen; reading traces produces the ranked list of what to measure."
        recall: "Why read traces before building a grader?"
        source: notes/02-defining-correct.md
        notes: >-
          This is the least glamorous slide and the one with the best return. You read traces and write
          down the first failure in each, because later errors usually cascade from it. Then you group the
          notes into stable labels, one per fix. Those labels become the failure taxonomy we use for the rest
          of the talk.
      - layout: cards
        kicker: Reward restraint too
        title: A suite of only positive cases rewards overreach
        lead: "An agent that always calls `issue_refund` would ace a suite that only asks for refunds."
        cards:
          - {title: Positive, body: "Refund my order: calls `issue_refund`."}
          - {title: Negative, body: "Refund policy question: answers, no `issue_refund`."}
          - {title: Boundary, body: "\"What are my refund options?\" Answers, no refund."}
          - {title: Out of scope, body: "File my taxes? Declines or escalates."}
          - {title: Adversarial, body: "Injection, social engineering, loopholes."}
          - {title: Why pair them, accent: D4621A, body: "Llama2-7b refused **94.5%** of jailbreaks and **49%** of benign prompts."}
        takeaway: "Without negative cases, a change that calls tools more often looks like better recall while precision quietly breaks."
        recall: "What failure does a suite of only positive cases hide?"
        source: notes/02-defining-correct.md
        notes: >-
          Imagine a change that makes our agent eager to refund. A positive-only suite calls that a win.
          Safety has the same trap. TrustLLM scored models on jailbreaks they should refuse and on prompts
          that only sound harmful, and Llama2-7b looked strong on the first while refusing 49 percent of
          the second.
      - layout: table
        level: deep
        kicker: Public benchmarks
        title: Public benchmarks resist memorisation five ways
        header: [Tactic, Benchmark, How]
        widths: [3, 3, 7]
        rows:
          - [Unique answers, GAIA, "Answers need several sources combined, some from attachments that are not on the web"]
          - [Parameterized templates, "AndroidWorld, τ²-bench", "Fresh values every run, so a memorized action sequence will not replay"]
          - [Temporal freshness, SWE-bench-Live, "Keep adding tasks created after the training cutoff"]
          - [Canaries, "BIG-bench, Terminal-Bench", "A unique GUID in the data; if a model can produce it, the set has leaked"]
          - [Closed test set, "HLE, SHADE-Arena", "Keep some of it unpublished; SHADE-Arena published 5 of its 17 environments"]
        takeaway: "Five tactics: unique answers, parameterized templates, fresh tasks, canaries and a closed test set. A canary only catches a leak and prevents nothing."
        recall: "Name the five tactics a public benchmark uses against memorization."
        source: notes/03b-splits-contamination-and-public-benchmarks.md
        notes: >-
          Contamination is why a public score can overstate what you will see on your own traffic. Each tactic
          trades something. Canaries detect a leak but prevent nothing, and Terminal-Bench's authors call theirs
          largely a symbolic safeguard because every task is public. Templates and freshness change the rows
          instead of hiding them.
      - layout: code
        kicker: Worked example
        title: One row of the golden set, in full
        lang: json
        code: |-
          {"id": "billing-refund-014",
           "input": {"messages": [{"role": "user",
             "content":
               "I was charged twice for order 8812"}]},
           "reference": {"expected_tool_calls": [
             {"name": "lookup_order",
              "args": {"order_id": "8812"}},
             {"name": "issue_refund",
              "match": "ANY_ARGS"}],
            "expected_sources":
              ["help/billing/duplicate-charges"]},
           "labels": {"intent": "billing",
             "case_type": "positive", "language": "en"},
           "eligibility": {"retrieval": true},
           "provenance": {"source": "ticket"},
           "graders": ["tool_trajectory", "grounding"]}
        bullets:
          - "**Start at 20–50** real failures, hand-reviewed"
          - "**100–300** tasks give ±5–8 point error bars"
          - "**Labels** make slices possible later"
          - "**Eligibility:** a downstream gate never scores rows an upstream gate ruled unfair"
          - "**Split and version:** a v3 score and a v4 score are not comparable"
        takeaway: "A golden row carries a reference, labels for slicing, eligibility per gate, provenance and the graders that apply to it."
        recall: "Why does a row carry labels and eligibility as well as a reference?"
        source: notes/03-eval-datasets.md
        notes: >-
          Here is a real shape. Order 8812 charged twice, with the tool calls we expect and the article it
          should cite. The language label looks like a detail now, but it is what will save us in part four.
          If the expected article is not in the index, the row is unfair for retrieval, and eligibility says so. Well-funded teams still threw out most of their tasks: reviewers kept 500 of 2,294 for SWE-bench Verified, so expect to reject rows in your own set. That closes part one: we can now say what better means and have rows that test it. Next question: who is allowed to grade them?
  - title: Who can you trust to grade?
    summary: "Graders · LLM as judge · Calibration · Checks and critiques"
    divider: true
    agenda: true
    notes: >-
      We have rows, so something has to score them. Code cannot judge everything and a model judge has
      biases of its own. This part builds a grader stack, and then asks what evidence a judge must show
      before it is allowed to block a release.
    slides:
      - layout: statement
        kicker: The problem
        title: A grader is a measuring instrument that can be wrong
        statement: "Your 85% is only as good as the grader that produced it. Who checked the grader?"
        attribution: "A fluent answer with a made-up fact can still score well."
        takeaway: "A grader is a measuring instrument, so a score means nothing until you know how that instrument errs."
        recall: "What must be true of a grader before you trust the rate it produces?"
        source: notes/04-graders.md
        notes: >-
          Back to our decision. We said B scored 85, but what scored it? If a model judge is more impressed
          by longer answers and B writes longer answers, that one point may measure nothing about quality.
          So treat the grader as an instrument and ask how it errs.
      - layout: steps
        kicker: The stack
        axis: cheaper → costlier
        title: Code first, judge above it, humans to calibrate
        steps:
          - {title: Code, text: "Deterministic, free, hard to argue with."}
          - {title: Separated evaluator, text: "Runs the output, does not just read it."}
          - {title: LLM judge, text: "Semantic quality at volume. Biased, needs calibration."}
          - {title: Humans, text: "5–10% of graded rows, to **calibrate** the judge.", accent: D4621A}
        takeaway: "Graders are layers rather than alternatives: run code first and stop early, so judge budget goes where judgment is needed."
        recall: "In what order do you stack the grader kinds?"
        source: notes/04-graders.md
        notes: >-
          Read the steps from deterministic to model judgment. For our agent, whether the refund row exists
          is a code check, and whether the tone is kind needs a judge. Humans do not grade everything. They
          label a small share so we can tell whether the judge can be trusted.
      - layout: code
        kicker: Worked example
        title: One contract for every grader
        lang: python
        code: |-
          class Grader(Protocol):
              name: str
              version: str
              # e.g. {"retrieved_context"}
              # skip if missing
              requires: set[str]

              def grade(self, task, output,
                        trajectory=None,
                        context=None) -> GraderResult:
                  ...

          # GraderResult: score, passed, reasoning,
          #   dimensions, labels, grader_version
        bullets:
          - "**`requires`:** skip with `context_missing`, do not guess"
          - "**`reasoning`:** the explanation, or the failing check"
          - "**`labels`:** taxonomy labels this trial earned"
          - "**`grader_version`:** every score traceable"
        takeaway: "A grader declares what it requires and skips with context_missing when it is absent, instead of guessing a verdict."
        recall: "Why does a grader declare what it requires?"
        source: notes/04-graders.md
        notes: >-
          The field to notice is requires. A grounding grader needs passage text. If it gets none, it should
          report context_missing and skip, not invent a verdict. We will see at the end of the talk that a
          real team lost time to exactly this bug. Versions make any score traceable afterwards.
      - layout: compare
        kicker: Combining scores
        title: A composite can hide a regression
        emphasis: right
        left:
          title: Weighted composite alone
          bullets:
            - "+5 relevance and −5 grounding makes a flat score"
            - "Worse for users who need correct answers"
            - "A fluent answer with a made-up fact still scores well"
        right:
          title: Hybrid with a veto
          bullets:
            - "Must-pass: schema valid, **no** citation hallucination"
            - "Then 0.5 grounding + 0.3 completeness + 0.2 relevance at least 0.75"
            - "A hallucination fires a **veto**: the total is 0"
        takeaway: "Prefer binary pass or fail per dimension with vetoes for never-events, because a weighted average can trade grounding for relevance."
        recall: "How can a composite score stay flat while users get a worse system?"
        source: notes/04-graders.md
        notes: >-
          Suppose B gained five points on relevance and lost five on grounding. A weighted score reports no
          change, and yet users now get wrong answers politely. So vetoes come first and weights second. And
          prefer binary verdicts per dimension, because whether something is a 3 or a 4 has no stable answer.
      - layout: code
        kicker: Worked example
        title: One judge, one criterion, reason before verdict
        lang: text
        code: |-
          You are evaluating whether an answer
          to a query is clear.
          [BEGIN DATA]
          Query: {query}
          Answer: {response}
          [END DATA]
          "clear": easy to follow, answers the query.
          "unclear": confusing, off-topic,
          hard to act on.

          EXPLANATION: <step-by-step reasoning>
          LABEL: "clear" or "unclear"
        bullets:
          - "Grade a third party's work, never your own"
          - "Precise PASS and FAIL definitions"
          - "2–4 few-shot cases near the boundary"
          - "Delimited inputs; critique, then fixed-format label"
          - "A `CANNOT_GRADE` escape, or the judge guesses"
        takeaway: "Give a judge one criterion, defined labels, delimited inputs and a CANNOT_GRADE escape, and ask for the reason before the label."
        recall: "What goes in a judge prompt besides the criterion, and why does the reason come before the label?"
        source: notes/05-llm-as-judge.md
        notes: >-
          This is a judge you can copy. It tests one thing, with defined labels and delimited inputs, and it
          writes its reason before its verdict. It also needs a way out. Without CANNOT_GRADE the judge will
          guess on impossible cases, and those guesses land in your pass rate.
      - layout: table
        kicker: What goes wrong
        title: Judges have known biases, and each has a fix
        header: [Bias, What happens, Fix]
        widths: [3, 5, 5]
        rows:
          - [Position, Pairwise judges favour one slot, "Run both orders. A win must hold in both"]
          - [Verbosity, Longer answers score higher, "Rubric says length is not quality. Track score against length"]
          - [Self-preference, Favours its own model family, Judge with a different family]
          - [Leniency, Borderline cases pass, "Explicit FAIL conditions. Tricky-FAIL few-shots"]
          - ["Format, authority", "Confident tone and citations look right", Check citations in code]
          - [Limited capability, Cannot verify what it cannot do, "A reference, a code check or a stronger judge"]
        takeaway: "Once biases are controlled, strong judges agree with humans about as often as humans agree with each other, over 80%."
        recall: "Once biases are controlled, how well do strong judges agree with humans?"
        source: notes/05-llm-as-judge.md
        notes: >-
          Look at verbosity. If B got wordier, this judge prefers it regardless of quality, and our one point
          could live entirely in that row. These biases are not exotic. The same ones appear in human
          feedback, as we will see. The fixes are mostly cheap, like running both orders.
          Where a score will not work, pairwise votes can become a ranking through Elo, as long as a win holds
          in both orders, but a ranking cannot monitor production.
      - layout: table
        level: deep
        kicker: Pairwise ranking
        title: Elo depends on vote order, Bradley–Terry does not
        lead: "Li's offline simulator: 3,000 battles between eight models with known skills, 10% ties. Elo (K = 4) run on five shuffles of the same battles."
        header: [Model, True skill, Bradley–Terry, Elo min, Elo max]
        widths: [4, 2, 2, 2, 2]
        rows:
          - [gpt-4, "1250", "1116", "1114", "1133"]
          - [claude-3-opus, "1225", "1114", "1100", "1110"]
          - [gemini-1.5-pro, "1180", "1058", "1051", "1068"]
          - [mixtral-8x7b, "1075", "974", "955", "988"]
          - [vicuna-13b, "935", "876", "862", "887"]
        takeaway: "Use Elo for a live leaderboard and a Bradley–Terry fit with bootstrap intervals for any ranking you publish or gate on."
        recall: "Why does Elo give different ratings for the same votes, and what do you publish instead?"
        source: notes/05b-pairwise-ranking-elo-and-bradley-terry.md
        notes: >-
          Both methods recover the true order and the gaps between models. The absolute level differs because
          each anchors its own mean. The point is the Elo spread: up to 34 points from vote order alone at K = 4,
          and 148 points at K = 32, enough to swap the top two. With an LLM judge doing the voting, swap the
          order on every pair and count a win only if it holds both ways.
      - layout: steps
        kicker: The gate to the gate
        title: Calibrate a judge before it gates anything
        lead: "A heuristic can gate. A calibrated judge can gate at its threshold. An experimental judge only tracks."
        steps:
          - {title: Get human labels, text: "**100–200** outputs labelled PASS or FAIL by your domain expert."}
          - {title: Split, text: "Train for few-shots, dev to iterate, test to measure once."}
          - {title: Run on dev, text: "Build the confusion matrix against the human labels."}
          - {title: Read disagreements, text: "Each is a prompt problem, a criteria problem or a hard case."}
          - {title: Measure on test once, text: "That is the reported number. Record judge model and prompt version.", accent: D4621A}
        takeaway: "Heuristics and calibrated judges can gate; an experimental judge only tracks, and a threshold change without fresh evidence moves a judge back to experimental."
        recall: "What are the three grader states, and which ones may block a release?"
        source: notes/15-calibration-against-human-labels.md
        notes: >-
          This is the same discipline as training a model. Tune on dev, report on test, and look at test only
          once. Then report two error rates separately: true positive rate, so you do not block good releases,
          and true negative rate, so you catch bad outputs. For a release gate, the second usually matters most.
      - layout: image
        kicker: Evidence
        title: Agreement looks better than it is
        image: ../sources/images/norman-2026-reliability-without-validity-fig1.png
        caption: "Norman et al., Reliability without Validity (2026), Fig. 1"
        bullets:
          - "21 judges on MT-Bench: raw agreement exceeds Cohen's κ by **33.8–41.3** points"
          - "Qwen 3 8B repeats itself (α **0.992**) with the strongest position bias (**0.192**)"
        takeaway: "Lead with kappa rather than raw agreement, because a judge can be perfectly repeatable and still be reliably biased."
        recall: "Why is high test-retest reliability not evidence that a judge is valid?"
        source: notes/15-calibration-against-human-labels.md
        notes: >-
          The left panel is agreement near 0.8 next to kappa near 0.4 to 0.5, the same judges measured two
          ways. On the right, a judge that gives the same verdict nearly every time also has the strongest
          position bias. A deterministic judge just reproduces its bias exactly. So run the swap check, even
          on a judge that never changes its mind. Two more numbers from the note: 85% agreement corresponds
          to a kappa near 0.48, and you correct a pass rate with true = (p-hat + TNR - 1) / (TPR + TNR - 1).

      - layout: code
        kicker: Beyond the rates
        title: Cross the code checks with the judge
        lang: text
        code: |-
          on dev, 560 rows       lenient  strict
          code pass, judge pass      377     538
          code pass, judge FAIL      161       0
          code FAIL, judge pass        3       3
          code FAIL, judge FAIL       19      19
        bullets:
          - "**Read code fail, judge pass first:** three false passes say 30 days where the cited document says 14"
          - "**t00689:** both fail, the label says PASS, and a person decides"
          - "**The 161:** all labelled PASS, 151 of them Dutch. TPR 10/161 on Dutch, 367/378 on English"
        takeaway: "Cross code checks with the judge to find what to fix, then read the false passes first. Agreement with code never replaces human labels."
        recall: "Which cell of the cross do you read first, and why does agreement with code not move a grader out of experimental?"
        source: notes/14-calibrating-judges-with-checks-and-critiques.md
        notes: >-
          This exercise tests the procedure and measures no real model. The judges are deterministic rules,
          the human labels are planted failures, and only 42 of 1,400 rows are FAIL, split 12, 21 and 9 across
          train, dev and test. The false passes came from comparing numbers with every retrieved document, so
          the fix is on the judge's side: compare against the cited source. The language slice stays after
          Holm's correction across 19 tests, and cutting one flag within another shows that two other slices
          are partly language in disguise.
      - layout: table
        kicker: The calibration record
        title: Fix the largest class of error, then test once
        lead: "Rule judges and planted failures: this tests the procedure, and says nothing about a real model."
        header: [Version, TPR, TNR, kappa]
        widths: [6, 2, 2, 2]
        highlight: [3]
        rows:
          - ["v0 lenient, dev", "0.699", "0.857", "0.120"]
          - ["v1 no overlap rule, dev", "0.998", "0.857", "0.896"]
          - ["v2 numbers against cited documents, dev", "0.998", "1.000", "0.976"]
          - ["v2 on test, once", "550/551", "9/9", "0.946"]
        takeaway: "Each change must win on dev. The test's 9/9 has a Wilson interval of 0.70 to 1.00, and its perfect score is a property of this setup."
        recall: "Why does 9/9 on test support no strong claim?"
        source: notes/14-calibrating-judges-with-checks-and-critiques.md
        notes: >-
          v2 is the code check: we rewrote the judge into the same rule, so nothing now cross-checks anything.
          Measurement has its own traps. Stop early and you lose what you came to measure: strict-judge TNR is
          18/21 on every row, 11/14 on rows passing check A, and 0/0 on rows passing both. The disagreement
          queue, n = 415, shows TPR 0 and TNR 0 for a judge whose real values are 0.694 and 0.929, so use it to
          find fixes and never for rates. A random 105 rows give a TNR anywhere from 0.50 to 1.00, and a
          stratified 150 weighted by known odds of selection is still a valid probability sample.
      - layout: compare
        kicker: Critiques as evidence
        title: A critique is a clue, not the cause
        left:
          title: What the research warns
          bullets:
            - "**Turpin 2023:** 1 of 426 explanations mentioned the bias"
          tag: Almost none tests a judge on a rubric
        right:
          title: What to do about it
          bullets:
            - "**Tag critiques**, fix the largest class, keep it only if it wins on dev"
            - "**Human labels** settle which judge is right"
          tag: Necessary, not sufficient
        emphasis: right
        takeaway: "Use a critique to find what to change, and change the input to see whether the verdict follows, because it can leave out what moved the verdict."
        recall: "What does a cue test measure, and what does passing it prove?"
        source: notes/14-calibrating-judges-with-checks-and-critiques.md
        notes: >-
          Turpin: accuracy fell by up to 36.3%. Chen 2025: models revealed a hint 25% and 39% of the time.
          Mittal and Arike: detect 88–94%, locate 56–68%, flag 40–55% of perfect chains. Prompt fixes are
          hypotheses, not findings, and cue and edit tests are online, not run, with no results here.
          These sources mostly test answering models, and Mittal and Arike grade reasoning chains rather than a
          judge's own critiques, so treat them as warnings. Tapwal's locked notes cut revisions after a reveal
          to 5 to 22% from 76 to 85%, but tied on 82 to 94% of near-equivalent pairs, which a release gate cannot
          copy as it stands. That closes part two: we trust our graders only as far as we have checked them.
          Next, what should they look at in an agent?

  - title: What do you actually measure?
    summary: "Evaluating agents · RAG and grounding · Tracing"
    divider: true
    agenda: true
    notes: >-
      A single answer is easy to grade, but our agent takes actions over several steps and retrieves
      evidence. This part covers how to grade the path as well as the result, how to take grounding apart
      claim by claim, and why traces come before all of it.
    slides:
      - layout: statement
        kicker: The problem
        title: The agent says the refund went through
        statement: "\"I've issued your refund.\" There is no refund row. Which of your evals catches that?"
        attribution: "Grade the end state, not what the agent says."
        takeaway: "Grade the end state rather than the agent's words, because a false claim of success is the most important failure to catch."
        recall: "Which kind of check catches an agent that claims an action it never took?"
        source: notes/06-evaluating-agents.md
        notes: >-
          A judge reading that sentence would call it polite, clear and complete. Only a state check looks in
          the database and sees nothing there. For a coding agent the state is the test suite, and for a SQL
          agent it is the query result rather than the query text.
      - layout: table
        kicker: Two dimensions
        title: Outcome and trajectory fail independently
        header: [Outcome, Trajectory, What happened, Outcome-only eval says]
        widths: [2, 2, 6, 3]
        rows:
          - [Pass, Pass, Worked, Pass]
          - [Pass, Fail, "Right answer by an unsafe or wasteful path: 40 paid API calls", "**Pass (wrong)**"]
          - [Fail, Pass, "Reasonable process, external failure: tool timeout", "Fail (not the agent)"]
          - [Fail, Fail, Broken, Fail]
        takeaway: "Score outcome and trajectory separately, because an outcome-only eval passes a wasteful path and blames the agent for a timeout."
        recall: "Which two cells does an outcome-only eval get wrong?"
        source: notes/06-evaluating-agents.md
        notes: >-
          Two of these four rows mislead you if you only look at the end. The agent that got there with 40
          paid calls looks fine until the invoice comes, and the one defeated by a tool timeout gets blamed
          for someone else's outage. Grading both tells you which fix to make. Match tool calls only as strictly as the requirement: exact, in order, any order, or within an allowed set. For a refund, the rule that matters is an invariant: never issue_refund before lookup_order.
      - layout: code
        kicker: Worked example
        title: "One task, k = 3: pass@k rises, pass^k falls"
        lang: python
        code: |-
          p, k = 0.75, 3

          # at least one of k succeeds
          pass_at_k = 1 - (1 - p) ** k    # 0.98

          # all k succeed
          pass_hat_k = p ** k             # 0.42
        bullets:
          - "Run each task **3–10** times and report rates"
          - "**pass@k** fits systems that can retry and pick"
          - "**pass^k** fits a user who gets one try"
          - "**HealthBench:** o3 averages 0.60, worst-of-16 is a third lower"
          - "Log per attempt: summaries cannot be reconstructed"
        takeaway: "Report pass^k for customer-facing agents: a 75% agent passes 98% with three retries, but all three times only 42% of the time."
        recall: "At p = 0.75 and k = 3, what are pass@k and pass^k, and which suits a support agent?"
        source: notes/06b-components-trials-and-cost.md
        notes: >-
          Same agent, same three trials, and the two numbers are 0.98 and 0.42. Which do you put on the slide
          for your boss? Every user of a support agent gets one try, so pass^k is the honest one. Also check
          the distribution, since 70 percent can mean flaky everywhere or a fixed set of impossible tasks.
      - layout: image
        kicker: Evidence
        title: Measure accuracy against cost, with a simple baseline
        image: ../sources/images/kapoor-2024-ai-agents-that-matter-fig1.png
        caption: "Kapoor et al., AI Agents That Matter (2024), Fig. 1"
        bullets:
          - "HumanEval, 164 problems, five runs each, April 2024 prices"
          - "Warming baseline: **93.2%** for **$2.45**"
          - "LDB with GPT-4: 93.3% for $6.36"
          - "LATS with GPT-4: 88.0% for **$134.50**"
          - "Refund agent, three turns: 9,500 input tokens, 470 output, $0.022"
        takeaway: "Plot accuracy against cost with simple baselines, because similar accuracy can differ by almost two orders of magnitude in cost."
        recall: "What did a simple retry baseline show about the HumanEval leaderboard agents?"
        source: notes/06b-components-trials-and-cost.md
        notes: >-
          A plain retry with rising temperature matched an elaborate agent at under half the cost, and it beat
          another at about a fiftieth. None of the original papers made cost a headline metric. So log tokens,
          steps, latency and cost per success on every trial, since pass rates miss efficiency regressions.
      - layout: table
        level: deep
        kicker: Agent environments
        title: An agent environment has five parts that can each fail
        header: [Part, Holds, Gets it wrong when]
        widths: [3, 5, 6]
        rows:
          - [Dataset, "Initial state, goal, optional reference solution", "The goal is ambiguous"]
          - [Environment state, "Mutable records: orders, balances, files", "It breaks business rules or cannot reset to the same start"]
          - [Tools, "Atomic operations: look up order, modify booking", "They are so high-level they skip the planning you meant to test"]
          - [Rubric, "Binary, continuous or multi-dimensional score", "The score does not match the criterion"]
          - [Interaction protocol, "Who acts when: single-shot, multi-turn, simulated user", "The user model is unrealistic"]
        takeaway: "Reset state for every trial, keep trials isolated, and check the task before the agent when it fails every time."
        recall: "What do you check first when a task fails every trial across several model versions?"
        source: notes/06c-agent-suites-and-environment-hygiene.md
        notes: >-
          On BrowseComp, 21 of the 118 questions that Deep Research never solved had a bad reference answer, so a
          0% task is suspect. Also keep the answer out of reach: reference answers, grader code and hidden tests
          belong where the agent's tools cannot read them.
      - layout: flow
        kicker: Grounded answers
        title: Score each RAG stage on its own
        steps:
          - {label: Retrieve, sub: "recall@k, hit rate"}
          - {label: Rerank, sub: "MRR, nDCG@k"}
          - {label: Context, sub: context precision}
          - {label: Generate, sub: "faithful, complete"}
          - {label: Cite, sub: citations valid}
        bullets:
          - "Pick **k** to match what enters the prompt. Recall@50 is irrelevant if 5 are passed"
          - "Score generation only on **generation-eligible** rows"
          - "Faithful is not correct: faithful-but-wrong points at the corpus"
        takeaway: "Split a RAG eval by stage, so that a retrieval miss does not get counted as a bad answer and sent to the wrong team."
        recall: "What does an answer that is faithful but wrong tell you?"
        source: notes/07-evaluating-rag-and-grounding.md
        notes: >-
          Our agent gives a wrong answer about payouts. Was the article missing, ranked too low, or misread?
          One score cannot say. Measure each stage on the rows that are fair for it. An answer faithful to a
          stale document is a corpus problem, and no amount of prompt tuning fixes it.
      - layout: steps
        kicker: Faithfulness
        title: Check grounding one claim at a time
        steps:
          - {title: Extract claims, text: "Split into atomic statements. Settings, Payouts, click Edit, 2 days is three."}
          - {title: Verify each, text: "Against passage **text**: supported, contradicted or not found."}
          - {title: Score, text: "Supported over total. Report contradictions separately."}
          - {title: Tier the claims, text: "Strict facts need near-verbatim support, paraphrase needs entailment, filler is exempt.", accent: D4621A}
        takeaway: "Pass the grader passage text, not pointers, because a grader handed URLs scores near zero or grades from its own knowledge."
        recall: "What is the most common grounding eval bug, and how do you guard against it?"
        source: notes/07-evaluating-rag-and-grounding.md
        notes: >-
          A whole-answer judge averages away the one wrong fact, so check claim by claim. Citations are even
          better, since code can check that a cited ID is in the retrieved set and that a quote really appears
          in the passage. Hand the grader the passage text. We come back to this at the end of the talk.
      - layout: image
        kicker: Where it all comes from
        title: A trace says where a run went wrong
        image: ../sources/images/deeplearning-ai-evaluating-ai-agents-lab2-spans.png
        caption: "DeepLearning.AI & Arize, Evaluating AI Agents (2025), Lab 2"
        bullets:
          - "**Model call:** model ID, full input, tokens, latency"
          - "**Tool call:** name, arguments, result or error"
          - "**Retrieval:** query, IDs **and text**, scores"
          - "**Root:** prompt, model, config and index **versions**"
          - "OpenTelemetry GenAI names make traces portable; every failure becomes a new row"
        takeaway: "Record model, tool, retrieval and root spans, with retrieval text included, so a trace says where a run went wrong."
        recall: "What does a trace record at each span kind, and why must retrieval spans hold the text?"
        source: notes/08-tracing-and-observability.md
        notes: >-
          This span tree is one agent run. Scores attach right to the spans, so you are one click from the
          context of any failure. Run the same grader code on production samples as in CI, and turn failures
          into new rows. That closes part three: we can measure, so can we now call B better?
  - title: Is the difference real?
    summary: "Reading results · Evals in CI"
    divider: true
    agenda: true
    notes: >-
      Now we finally return to 84 and 85. Reading a result is statistics, and most of it is simple. This
      part puts error bars on that number, runs the comparison properly, slices it, and shows how to put
      the whole decision into CI so nobody has to argue about it.
    slides:
      - layout: statement
        kicker: The problem
        title: One point on a small suite is usually noise
        statement: "On 50 tasks, 80% and 72% are not distinguishable. So what is +1 worth?"
        attribution: "Every number gets an error bar before it gets an opinion."
        takeaway: "On 50 tasks at 80% the 95% interval is about 69–91%, so an 8-point gap can sit inside the error bar."
        recall: "On a 50-task suite at 80%, roughly what is the 95% interval?"
        source: notes/09-reading-results.md
        notes: >-
          Most teams have stared at a dashboard and celebrated a number like this. The numbers on the next
          slide show why they should not. On a small suite one flipped task moves the rate several points. So
          the question for our decision is not whether 85 beats 84, but how many tasks stand behind each.
      - layout: table
        kicker: Sizing the error bar
        title: The error bar shrinks with the square root of the tasks
        lead: "SE = √(p(1 − p) / n). The 95% CI is p ± 1.96·SE. To detect 10 points, paired: 100–200 tasks. 5 points: 400–800. 2 points: 2,500+."
        header: [Tasks, SE at p = 0.80, 95% CI]
        rows:
          - ["20", "0.089", "62% – 98%"]
          - ["50", "0.057", "**69% – 91%**"]
          - ["100", "0.040", "72% – 88%"]
          - ["300", "0.023", "75% – 85%"]
          - ["1,000", "0.013", "77% – 83%"]
        takeaway: "A 5-point difference needs 400–800 paired tasks; a 50-task golden set is a smoke detector, not an instrument."
        recall: "About how many paired tasks does it take to detect a 5-point difference?"
        source: notes/09-reading-results.md
        notes: >-
          Read the second row: 50 tasks at 80 percent gives 69 to 91. The sizing numbers in the lead assume a
          paired comparison, 80 percent power and pass rates of about 70 to 85 percent. So decide what change
          matters before you collect tasks. Your 50-task set catches disasters, and that is a fine job for it.
      - layout: compare
        kicker: Pairing
        title: Compare both versions on the same tasks
        emphasis: right
        left:
          title: Two independent rates
          bullets:
            - "A at 84%, B at 85%, each with its own wide interval"
            - "Task-to-task variation swamps the difference"
          tag: The error bars overlap and you learn nothing
        right:
          title: Per-task differences
          bullets:
            - "Most tasks pass or fail on both, so differences are mostly 0"
            - "SE(Δ) = sd(differences) / √n, much smaller"
            - "McNemar: only the **discordant** tasks count"
            - "**15–5** is evidence (p = 0.041). **14–6** is not settled (p = 0.115)"
          tag: Pairing cuts variance for free
        takeaway: "Run both versions on identical tasks and analyse per-task differences, since only the tasks that flip carry evidence."
        recall: "Under McNemar, which tasks count?"
        source: notes/09-reading-results.md
        notes: >-
          Most of the variance between tasks has nothing to do with your change, since some tasks are simply
          hard. Pairing subtracts that. The count that matters is flips. Also resist reading a tiny experiment,
          where seven questions means one flipped task moves a rate 14 points, and read the flipped transcripts.
      - layout: table
        kicker: Worked example
        title: Slicing finds what the average hid
        lead: "B wins on billing and loses 17 points on non-English."
        header: [Slice, n, A, B, Δ]
        rows:
          - [Billing, "120", "82%", "90%", "+8"]
          - [How-to, "150", "88%", "89%", "+1"]
          - [Non-English, "40", "75%", "58%", "**−17**"]
          - ["**Overall**", "310", "84%", "85%", "+1"]
        highlight: [2]
        takeaway: "An overall gain of one point can ship a change that breaks one group of users, so slice before concluding and show n per slice."
        recall: "What did the +1 overall hide in the worked example?"
        source: notes/09-reading-results.md
        notes: >-
          Here is our answer. B gained eight points on billing, did nothing for how-to, and lost seventeen on
          non-English. Remember the language label on our row in part one. That single field is why we can see
          this. Without it we ship a regression and call it a gain.
      - layout: image
        kicker: Evidence
        title: Slice by difficulty as well as topic
        image: ../sources/images/yang-terminal-rsi-fig10.png
        caption: "Yang et al. (2026), Figure 10"
        bullets:
          - "**Easy** tasks: 32% to 73%. The headline gain lives here"
          - "**Extreme** tasks: 0, 4.9, 11.0, 6.1, then 11.0%"
          - "One pooled rate hides where progress stalls"
        takeaway: "Report difficulty strata, because a rising average can sit on top of a flat hard tail."
        recall: "Where did the headline gain live in the Yang et al. strata?"
        source: notes/09-reading-results.md
        notes: >-
          The same idea applies by difficulty. Across five training stages in Yang and colleagues, easy tasks
          more than doubled while extreme ones never got past 11 percent. Pool them and you would believe
          the system was improving evenly. Ask where a gain lives before you say what caused it.
      - layout: code
        kicker: Worked example
        title: A report that supports a decision
        lang: text
        code: |-
          Suite: support-golden v4 (n=310, 3 trials/task)
          Judge: grounding-v2 (TNR 0.88)
                            A (prod)    B (cand.)   Δ (paired)
          Pass rate         84.2% ±3.9  85.1% ±3.8  +0.9 [−1.6, +3.4]
            Non-English(40) 75.0% ±13   57.5% ±15   −17.5 [−29, −6] !
          Errors / refusals 1.3%        4.2%                        !
          Cost per success  $0.014      $0.016      +14%
          Flipped tasks read: 18 / 18
          9 of 11 regressions: `refusal` on non-English
          Decision: do not ship. Investigate refusal
          behavior for non-English.
        takeaway: "Count errors and refusals as failures or as their own rate, and never let them leave the denominator."
        recall: "Where do errors and refusals go in the denominator?"
        source: notes/09-reading-results.md
        notes: >-
          This is the answer to the question on our first slide: do not ship. Look at what lets someone act
          on it: dataset and judge versions, intervals, the paired delta, the slice, refusals as their own
          rate, and how many flipped tasks a person read. The overall interval includes zero, and the slice
          interval does not.
      - layout: compare
        kicker: Into CI
        title: Run first, assert second, with an artefact between
        lead: "Cheap suites on every change, costly ones on a schedule: code graders per commit, calibrated judges when prompts change, all graders nightly and pre-release."
        emphasis: none
        left:
          title: "Phase 1: Run"
          accent: 0F7490
          bullets:
            - "For each task and trial: run the system, capture the trace, grade"
            - "Write a row to `results.jsonl`"
          tag: "Slow, costly, non-deterministic"
        right:
          title: "Phase 2: Assert"
          bullets:
            - "Load results, compute metrics and CIs per slice"
            - "Compare to baseline and thresholds"
            - "Emit pass or fail per gate and a report"
          tag: "Fast, free, deterministic"
        takeaway: "A results.jsonl file sits between run and assert, so you can change a threshold or add a slice in seconds without re-running a $30 suite."
        recall: "What artefact sits between the two phases?"
        source: notes/10-evals-in-ci.md
        notes: >-
          Now we automate that decision. Keep the expensive part apart from the arithmetic. Results become an
          artefact you can diff and attach to the PR, and retries are recorded instead of swallowed. Use path
          filters as well, so a README change does not trigger a 40 dollar judge run.
      - layout: table
        kicker: The regression gate
        title: Gate against a baseline, on the interval
        header: [Rule, Example, Catches]
        widths: [3, 6, 3]
        rows:
          - [Absolute floor, "Schema at least 99%. Citation hallucination = 0", Never-events]
          - [Relative to baseline, "Grounding at most 3 points below prod (paired CI)", Regressions]
          - [Per-slice floor, "No slice drops more than 10 points", Hidden slice losses]
          - [Efficiency budget, "Cost per success at most 1.2×; p95 at most 8 s", Silent cost blow-ups]
          - [Regression set, "Fixed failures at least 95% pass", Re-broken bugs]
        highlight: [2]
        takeaway: "Block when the upper bound of the difference is below −3, since a rule of blocking on any drop fires on noise half the time."
        recall: "Why does blocking when the delta is below zero fail as a gate?"
        source: notes/10-evals-in-ci.md
        notes: >-
          Look at the per-slice floor row, highlighted: that is the rule that would have caught our B automatically, with no one
          needing to stare at a report. Gate on the interval, and update the baseline deliberately after each
          release. Assign owners too: one for the infrastructure, one for the criteria, and every engineer adds
          a row with each bug fix. That closes part four.
  - title: What happens after launch?
    summary: "Production · Failure modes · A case study"
    divider: true
    agenda: true
    notes: >-
      A suite that passed before release tells you about the world as it was. The model changes, users
      change, and the eval itself goes wrong. This part covers the maturity ladder, what breaks once an
      eval is relied on, and one real team's system with its mistakes.
    slides:
      - layout: statement
        kicker: The problem
        title: Performance changes even when you change nothing
        statement: "We'll add evals later means we will have no signal when this breaks."
        attribution: "Providers ship new snapshots, users shift, tools change shape, the index goes stale."
        takeaway: "Performance changes after launch even when you change nothing, through model updates, input shift, upstream changes and stale corpora."
        recall: "Name four sources of drift that happen without any change on your side."
        source: notes/11-production-and-the-maturity-ladder.md
        notes: >-
          Suppose we fix B and ship it. A month later, the provider moves a snapshot behind the same alias
          and a tool changes its response shape. You touched nothing and quality dropped. Offline suites
          cannot see that. So how much production signal do you need, and in what order do you build it?
      - layout: steps
        kicker: Build order
        title: Climb the maturity ladder one rung at a time
        axis: more signal
        steps:
          - {title: 0 · Vibes, text: "Manual review. Catches what you happen to look at.", n: "0", accent: 94A3B8}
          - {title: 1 · Deterministic gates, text: "Tests, schemas, hooks. Highest return per effort.", n: "1"}
          - {title: 2 · Separated evaluator, text: "Fresh context, runs the output. Behavioural failures.", n: "2"}
          - {title: 3 · Failure evals and tracing, text: "Regressions, and where a run broke. **Production needs this.**", n: "3", accent: D4621A}
          - {title: 4 · Continuous sampling, text: "Drift alerts against a launch baseline.", n: "4"}
        takeaway: "Production needs at least level 3, failure evals with tracing, and deterministic gates give the highest return on the way there."
        recall: "Which rung does production need, and which gives the highest return per effort?"
        source: notes/11-production-and-the-maturity-ladder.md
        notes: >-
          Do not read this as a score to maximize. Read it as a build order. Deterministic gates are cheap
          and catch a lot. The line that matters is level three, since below it you cannot tell a regression
          from a bad day. Our suite sits at three by now, and sampling is the next rung.
      - layout: bullets
        kicker: Running online
        title: Sample by rule, alert on drift, ramp every change
        lead: "An alert is first a question: is the data valid, did a schema change, is it one outlier?"
        bullets:
          - "**Sample 10–20% of traces by rule:** 100% of negative feedback, plus escalations, high cost and long chats"
          - "**Two layers:** humans sample and calibrate, while the judge scores everything and watches drift"
          - "**Drift:** baseline at launch, same pipeline continuously, rolling windows, and watch the input mix too"
          - "**Before A/B:** shadow mode first, then a canary at 1–5% of traffic with rollback on regression"
          - "**A/B:** declare metric and size up front, keep guardrails, ramp 1%, 10%, 50%"
          - "**Later:** an eval environment can become a training environment, with the grader as reward"
        takeaway: "Judges alone drift unnoticed and humans alone do not cover real traffic, so sample by rule and have humans calibrate the judge."
        recall: "What is each layer's job in two-layer online review?"
        source: notes/11-production-and-the-maturity-ladder.md
        notes: >-
          Sampling by rule means your review time lands on the failures. A random slice beside it keeps the
          rates unbiased. The order of release matters too: shadow mode teaches you what breaks at no risk to
          users, and a canary limits the damage. Peeking at an A/B test and stopping on a good day inflates
          false positives.
      - layout: image
        kicker: Evidence
        title: User feedback has biases of its own
        image: ../sources/images/huyen-ai-engineering-fig10-21.png
        caption: "Huyen, AI Engineering (O'Reilly, 2025), Fig. 10-21"
        bullets:
          - "**Broken UI:** the angry emoji sat at five stars, so happy attendees left 1/5"
          - "**Leniency:** in 2015 Uber averaged 4.8, and below 4.6 risked deactivation"
          - "**Position and preference:** first gets clicks, longer gets picked"
          - "**Degenerate loop:** you only get feedback on what you showed"
          - "Trained on approval, models drift toward sycophancy (Sharma et al. 2023)"
        takeaway: "Test the feedback form and look at the rating distribution, because user signals carry the same biases as judges plus broken UI."
        recall: "Name two biases in user feedback, and how a broken form can mislead you."
        source: notes/11-production-and-the-maturity-ladder.md
        notes: >-
          Huyen's own workshop form put the angry face in the five-star position, so happy people gave one
          star and left warm comments. Thumbs-down data seems like ground truth, but it is another instrument
          that needs checking. And if feedback trains the system, its own outputs shape what it hears next.
      - layout: steps
        kicker: When a number drops
        title: Suspect the eval before you suspect the agent
        steps:
          - {title: Infrastructure, text: "Errors, timeouts, 429s, OOM. Are error counts up?"}
          - {title: Versions, text: "Dataset, grader, judge model or config changed between runs?"}
          - {title: Traces and grades, text: "Read 10–20 failed transcripts **with** their grades. Is the grade right?"}
          - {title: Slices, text: "Is the drop concentrated in one category?"}
          - {title: Only then the agent, text: "Model, prompt, tools, logic.", accent: D4621A}
        takeaway: "Skipping straight to the agent fixes something that was not broken, so check infrastructure, versions, grades and slices first."
        recall: "What is the debug order when an eval score drops?"
        source: notes/12-failure-modes.md
        notes: >-
          Eval bugs look exactly like agent bugs. In the Evaluating AI Agents course lab, the SQL grader passes
          when no SQL ran, so a version that skips the tool earns a perfect score. Going straight to the prompt
          in that case fixes nothing, and it may break something. Work down this list in order.
      - layout: cards
        kicker: Once people rely on it
        title: Optimize hard and you will find the eval's gaps
        lead: "A suite near 100% has stopped measuring: graduate it, add harder tasks, raise the bar."
        cards:
          - {title: Grader leniency, body: "Answers padded until the verbosity-biased judge passes them."}
          - {title: Narrow checks, body: "Agent edits the tests, not the code. Valid schema, empty content."}
          - {title: Proxy metric, body: "Thumbs-up optimized into flattery. Escalations cut, so it will not escalate when it should."}
          - {title: Visible tests, body: "Overfits to the tests it can see."}
          - {title: Repeated scoring, accent: D4621A, body: "ARC Prize reused 100 private tasks and disclosed about 10,000 scores."}
        takeaway: "Defend an eval with several dimensions, held-out tests, reading the biggest gains and refreshing tasks from production."
        recall: "Name two defences of an eval against being gamed."
        source: notes/12-failure-modes.md
        notes: >-
          Once a metric matters people and agents aim at it, which is Goodhart's law. Every score reported from
          a test set leaks a little about it. Evals also pile up debt, like thresholds nobody revisits and
          stale rows and copies of a grader that drift. Schedule the maintenance and retire metrics nobody acts on.
      - layout: table
        kicker: A real system
        title: Which judges earned a gate in the case study
        lead: "50 tasks, 25 liked and 25 disliked by users. Δ is liked minus disliked mean score."
        header: [Grader, Δ, "Cohen's d", Verdict]
        widths: [5, 2, 2, 3]
        rows:
          - ["**Custom answer_relevancy v3**", "**+0.214**", "0.75", "Strongest; confirm on 100–200 labels before gating"]
          - [DeepEval answer_relevancy, "+0.086", "0.25", Weak]
          - [Custom completeness, "+0.030", "0.07", Marginal]
          - [DeepEval completeness, "−0.042", "—", "**Inverted**"]
          - [Custom escalation, "0.000", "0.00", "No signal: do not gate"]
          - [DeepEval escalation, "−0.080", "—", "**Inverted**"]
        takeaway: "An inverted judge scores disliked answers above liked ones, so validate judges against users and recalibrate per domain."
        recall: "What does an inverted separation tell you about an off-the-shelf judge?"
        source: notes/13-case-study-support-agent.md
        notes: >-
          This team ran a multi-agent support system, close to ours. Two off-the-shelf judges scored disliked
          answers above liked ones. Their cross-check also showed low agreement because the grader had been fed
          URLs, not passages. That is the context_missing label we met in the grader contract.
      - layout: code
        kicker: Worked example
        title: Each gate hands the next one a named pool
        lang: json
        code: |-
          {
            "run_id": "…",
            "git_commit": "abc1234",
            "gate": "retrieval_optimization",
            "row_pool": "retrieval_eligible_gt",
            "n": 0,
            "config": {},
            "metrics": {},
            "failure_counts": {},
            "known_exclusions": [],
            "pass": true
          }
        bullets:
          - "**Eight gates:** corpus, index, retrieval, model, agent retrieval, generation, calibration, report"
          - "**Thirteen labels** owned by the gate that fixes them"
          - "**Pools narrow:** all, mapped, retrieval, generation, quality sample"
          - "Every claim names gate, pool, n and artefact"
        takeaway: "Do not collapse corpus, retrieval, agent, generation and calibration into one score: each gate answers one question over a named pool."
        recall: "What must every gate's artefact name, and why not one blended score?"
        source: notes/13-case-study-support-agent.md
        notes: >-
          This header is what keeps the blame honest. Without pools, a retrieval miss looks like a bad answer
          and the generation team gets blamed for the corpus team's gap. One blended score would have hidden
          every finding this team made. That is the talk: define, grade, measure, read, gate, and keep watching.
  - title: Wrap-up
    agenda: false
    divider: false
    slides:
      - layout: cards
        kicker: Rules of thumb
        title: Six rules to take with you
        cards:
          - {title: Before any grader, body: "Write success down; read 50–100 traces first."}
          - {title: The dataset, body: "Start with 20–50 real failures, plus negatives."}
          - {title: Graders, body: "Code first; uncalibrated judges never gate."}
          - {title: Agents and RAG, body: "Grade outcome and path; k trials, pass^k."}
          - {title: Reading and gating, body: "Error bars, paired tests, slices; gate on a baseline."}
          - {title: Production, body: "Sample by rule; debug infra before the agent."}
        takeaway: "Define correct first, check graders against humans, grade state and path, read intervals and slices, gate on baselines, then keep sampling."
        recall: "Give one rule of thumb for each stage, from criteria through production."
        source: notes/12-failure-modes.md
        notes: >-
          If you remember only one card, make it the one you lack today. Most teams should start with the
          first two: write down what correct means, and turn twenty real failures into rows. Everything else in
          this talk gets easier once those two things exist.
      - layout: bullets
        kicker: Where next
        title: Where to go next
        bullets:
          - "**Lab:** `practice/eval-suite-ci/` (TypeScript) and `practice/eval-suite-ci-py/` (Python): 24 cases, three graders, a baseline, paired regression testing, an exit code"
          - "**Copy-ready:** judge prompt (05), failure taxonomy (02), row schema (03), gate rules and CI workflow (10)"
          - "**A real system:** note 13, a multi-agent support system's eval design, mistakes included"
          - "**A judge is wrong, now what?** note 14, checks, slices and critiques as evidence"
          - "**Course:** DeepLearning.AI and Arize, Evaluating AI Agents, folded into notes 05, 06 and 08"
          - "**Loops:** `ai-engineering/04-loop-engineering`, where an eval becomes the optimizer's target"
        aside:
          title: The one idea to keep
          accent: 1E3A5F
          body: "An eval is a measurement. Define correct before grading, trust no grader you have not checked against humans, and put an error bar on every number."
        takeaway: "The eval-suite-ci lab builds a paired regression gate; note 13 shows the method on a real support system."
        recall: "What does the pillar's lab build, and which note shows the method on a real system?"
        source: notes/13-case-study-support-agent.md
        notes: >-
          The lab runs offline with a stub by default, so you can try a paired gate today with no API key. Then
          read the case study, because its mistakes are the most instructive part. And when you are ready, the
          loop engineering pillar shows what happens when an agent optimizes against one of these evals.
