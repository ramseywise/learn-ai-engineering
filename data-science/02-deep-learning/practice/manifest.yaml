# Practice manifest: one entry per example. Validated by scripts/practice/check_manifest.py (make manifest-check).
examples:
  - path: "practice/autoencoder.py"
    purpose: "Trains autoencoders on scikit-learn's bundled 8x8 digits to show the bottleneck, denoising and reconstruction error as an anomaly score."
    demonstrates:
      - "notes/05-sequence-models.md"
    pattern: analysis
    language: python
    runs_offline: true
    verified_by: "uv run autoencoder.py"
    licence: course
  - path: "practice/chartstyle.py"
    purpose: "Helper module holding the house matplotlib style for this pillar's charts; not an example."
    demonstrates: []
    pattern: other
    language: python
    runs_offline: true
    verified_by: none
    licence: course
  - path: "practice/data_mismatch.py"
    purpose: "Runs the four-error diagnostic when deployment data differs from training, using clean digits against shifted and noisy ones."
    demonstrates: []
    pattern: analysis
    language: python
    runs_offline: true
    verified_by: "uv run data_mismatch.py"
    licence: course
  - path: "practice/deep-learning-starter-simple-lstm.ipynb"
    purpose: "Notebook from a Kaggle competition showing a simple LSTM baseline on time-structured data."
    demonstrates:
      - "notes/06-neural-text-models.md"
    pattern: analysis
    language: jupyter
    runs_offline: false
    verified_by: none
    licence: unrecorded
  - path: "practice/depth_degradation.py"
    purpose: "Shows plain networks degrade with depth while residual ones do not, on digits over 10 epochs."
    demonstrates: []
    pattern: analysis
    language: python
    runs_offline: true
    verified_by: "uv run depth_degradation.py"
    licence: course
  - path: "practice/forget_gate_gradient.py"
    purpose: "Measures the gradient from each input step back through 50 steps in an untrained LSTM-style memory network."
    demonstrates: []
    pattern: analysis
    language: python
    runs_offline: true
    verified_by: "uv run forget_gate_gradient.py"
    licence: course
  - path: "practice/imdb_models.py"
    purpose: "Trains four text models on 5,000 IMDB reviews and plots train against test; reads an IMDB CSV that is not committed (about three minutes on a CPU)."
    demonstrates: []
    pattern: analysis
    language: python
    runs_offline: false
    verified_by: none
    verification_note: "Tried `uv run imdb_models.py` in a temporary copy and it timed out after 120s; not confirmed."
    licence: course
  - path: "practice/lr_sweep.py"
    purpose: "Sweeps the learning rate by factors of ten for an MLP on digits with Adam over three seeds."
    demonstrates: []
    pattern: analysis
    language: python
    runs_offline: true
    verified_by: "uv run lr_sweep.py"
    licence: course
  - path: "practice/moons_boundary.py"
    purpose: "NumPy backprop on make_moons showing the decision boundary with and without a hidden layer."
    demonstrates: []
    pattern: analysis
    language: python
    runs_offline: true
    verified_by: "uv run moons_boundary.py"
    licence: course
  - path: "practice/ng-deep-learning"
    purpose: "Vendored Coursera deep-learning specialisation notebooks (five course folders), several written for TensorFlow 1.x with compat updates."
    demonstrates:
      - "notes/01-neural-networks-fundamentals.md"
      - "notes/02-optimisation-and-regularisation.md"
      - "notes/03-structuring-ml-projects.md"
      - "notes/04-convolutional-networks.md"
      - "notes/05-sequence-models.md"
    pattern: analysis
    language: jupyter
    runs_offline: false
    verified_by: none
    licence: unrecorded
  - path: "practice/transaction_sequence_lab.py"
    purpose: "Card fraud as a sequence problem on generated data: aggregates against a GRU, leaks, late labels, cost and drift (3 to 6 minutes on a laptop CPU, depending on what else is running; less with `--seeds 1`)."
    demonstrates:
      - "notes/05-sequence-models.md"
    pattern: analysis
    language: python
    runs_offline: true
    verified_by: "uv run transaction_sequence_lab.py"
    licence: course
  - path: "practice/vision_project"
    purpose: "Helper package for the vision labs: generated shapes written to an image folder, a Dataset, the scratch CNN and ResNet-18 builders, and train_step/test_step; not an example on its own."
    demonstrates:
      - "notes/04b-vision-in-practice.md"
    pattern: other
    language: python
    runs_offline: true
    verified_by: none
    licence: course
  - path: "practice/vision_transfer.py"
    purpose: "Measures a scratch CNN against a frozen and a fine-tuned ImageNet ResNet-18 on 1%, 10% and 100% of generated shapes over 3 seeds, plus BatchNorm and augmentation rows (about 13 minutes on an M4 Pro; first run downloads about 45 MB of weights)."
    demonstrates:
      - "notes/04b-vision-in-practice.md"
    pattern: finetune
    language: python
    runs_offline: false
    verified_by: "uv run vision_transfer.py"
    licence: course
  - path: "practice/vit_from_paper.py"
    purpose: "Builds a Vision Transformer from Eq. 1-4 of the ViT paper, checks ViT-B/16's parameter count against torchvision, and trains a small one from scratch against a frozen ImageNet ViT-B/16 (first run downloads about 330 MB of weights)."
    demonstrates:
      - "notes/05b-transformer-encoders.md"
      - "notes/04b-vision-in-practice.md"
    pattern: finetune
    language: python
    runs_offline: false
    verified_by: "uv run vit_from_paper.py"
    licence: course
