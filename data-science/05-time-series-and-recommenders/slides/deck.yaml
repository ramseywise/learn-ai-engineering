# Time series and recommenders lecture deck. Covers notes/01-time-series-ml.md,
# notes/02-collaborative-filtering-and-matrix-factorisation.md, notes/03-two-tower-and-evaluation.md,
# notes/04-entity-matching-and-learning-to-rank.md, notes/05-learning-a-similarity-function.md.
# Build: make slides PILLAR=data-science/05-time-series-and-recommenders STRICT=1 PREVIEW=1
# Spec:  .claude/skills/slides/references/deck-spec.md
# Running examples: hourly bike rentals (UCI), a synthetic customer cash-flow case, MovieLens 100K, then a generated payment ledger.
# Every number was measured by running the code in the notes, except those attributed to a paper.
deck:
  title: Time Series and Recommenders
  subtitle: When rows are not exchangeable
  tagline: |-
    Forecast honestly · Rank what people see · Know that it worked · Match records
  reference: "Notes: data-science/05-time-series-and-recommenders"
  output: time-series-and-recommenders.pptx
  notes: >-
    Three problems today, one lesson. First a bike operator who needs tomorrow's demand by midnight, then a film site that
    wants a top ten list for each person, then a ledger of bank lines to match to invoices with no shared ID. All three break
    the habit of shuffling rows and holding some out. In all three, the usual failure is an evaluation that flatters the model,
    so the procedure matters more than the architecture.

parts:
  - title: Forecasting without fooling yourself
    summary: Issue time · Baselines · Backtests · Leaks · Sequence models · Segments
    notes: >-
      We start with an operator who plans vans at midnight. What would a forecast really have scored on the day it was issued?
    slides:
      - layout: statement
        title: Our shuffled test says the forecast is great. Is it?
        kicker: The problem
        recall: Why does a shuffled test overstate how well a forecast will do?
        statement: "A forecast is a promise about a future you cannot see, so shuffled rows report an accuracy you will never get."
        attribution: State when the forecast is issued before you fit anything
        takeaway: Shuffled validation tests interpolation between known points, whereas a forecast has to predict a future it cannot see.
        source: notes/01-time-series-ml.md
        notes: >-
          Rows here are not exchangeable. Each one is correlated with its neighbours, features must have been known at prediction
          time, and the level drifts so the test set can sit outside anything seen in training. So how do we set this up?

      - layout: cards
        title: Four things to state before any model
        recall: Which four choices define a forecasting problem, and what do they decide?
        cards:
          - title: Issue time
            body: When the forecast is made. Here, midnight.
          - title: Horizon
            body: How far ahead. Here, 1 to 24 hours.
          - title: Information set
            body: What is known at issue time. Calendar and past rentals, not tomorrow's weather.
          - title: Loss
            body: What an error costs. Here, absolute error in bikes.
        takeaway: A forecasting problem is defined by its issue time, horizon, information set and loss, and these decide which features are legal.
        source: notes/01-time-series-ml.md
        notes: >-
          Every later decision depends on these four. The issue time alone tells you that nothing nearer than 24 hours can be a feature
          if you want one model for every hour of tomorrow.

      - layout: flow
        title: A backtest replays history one fold at a time
        recall: What does an expanding-window backtest train on at each cut?
        steps:
          - label: Cut
            sub: Pick a date in the past
          - label: Train
            sub: Fit only on data before it
          - label: Issue
            sub: Forecast each midnight in the next month
          - label: Score
            sub: Record MAE and MASE for this fold
        loop: Move the cut one month on and repeat
        caption: Six folds from July to December 2012. Report each fold, since an average can hide one bad month.
        takeaway: An expanding-window backtest trains only on the past at each cut, and gives you as many looks at the future as you have folds.
        source: notes/01-time-series-ml.md
        notes: >-
          This is what Hyndman and Athanasopoulos call time series cross-validation. Bergmeir, Hyndman and Koo add a nuance: plain K-fold
          is fine for purely autoregressive models with uncorrelated residuals, but not with a drifting level and a decision made at a set moment.

      - layout: table
        title: Dividing by a known level beat the naive by a quarter
        kicker: Worked example
        recall: Why model the ratio to a known level when a series is growing and you use trees?
        lead: Six monthly folds. MASE divides the error by that of a seasonal naive on past data, so below 1 beats it.
        header: [Model, MAE (bikes), MASE]
        widths: [3, 1, 1]
        rows:
          - [Same hour yesterday, "80.4", "1.317"]
          - [Same hour last week, "66.0", "1.074"]
          - [GBM on absolute counts, "55.4", "0.906"]
          - [GBM relative to last week's level, "48.2", "0.786"]
        highlight: [3]
        takeaway: A regression tree cannot predict above its training targets, so model the ratio to a known level when the series is growing.
        source: notes/01-time-series-ml.md
        notes: >-
          Demand rose 64 percent from 2011 to 2012. A tree predicts averages of targets it has seen, so it is capped. Dividing by last week's
          level takes MASE from 0.906 to 0.786 in one line. Note that October is the only month above 1, because of Hurricane Sandy.

      - layout: compare
        title: Three leaks that each look like a breakthrough
        recall: What should you ask of every feature to catch a leak?
        lead: The honest model scores MASE 0.786 on these folds.
        emphasis: left
        left:
          title: What the leak reports
          bullets:
            - "Previous-hour lag: **0.419**"
            - "Actual weather: **0.615**"
            - "Shuffled 5-fold: **0.747**"
          tag: Looks like progress
        right:
          title: Why it is not real
          bullets:
            - At midnight you do not have the previous hour
            - In production you only have a weather forecast
            - Neighbouring hours end up in training
          tag: Unavailable in production
        takeaway: For each feature ask when its value becomes available, and treat any actual standing in for a forecast as an upper bound.
        source: notes/01-time-series-ml.md
        notes: >-
          The weather case is the tempting one. To measure it properly you need archived forecasts as they were issued. The shuffled folds
          flatter us least here because every feature is at least a day old, but 5 percent can still change a close decision.

      - layout: code
        title: DLinear is two linear maps and a moving average
        recall: What should any complex forecaster have to beat first, and on what evidence?
        lang: python
        code: |-
          class DLinear(nn.Module):
              def __init__(self, L, H, kernel=25):
                  super().__init__()
                  self.avg = nn.AvgPool1d(kernel, stride=1,
                  padding=kernel // 2,
                  count_include_pad=False)
                  self.seasonal = nn.Linear(L, H)
                  self.trend = nn.Linear(L, H)
              def forward(self, x):
                  trend = self.avg(x.unsqueeze(1)).squeeze(1)
                  y = self.seasonal(x - trend)
                  return y + self.trend(trend)
        bullets:
          - "Zeng et al. (AAAI 2023): one-layer models beat Transformers on nine datasets"
          - "Attention is permutation invariant, which loses order"
          - "This trains in seconds on a laptop"
        takeaway: On nine long-horizon datasets a one-layer linear model beat Transformer forecasters, so any complex forecaster should have to beat it first.
        source: notes/01-time-series-ml.md
        notes: >-
          Recurrent networks read a window step by step, temporal convolutions stack dilated filters, and this linear model just separates
          trend from remainder. All three have the same interface: 168 hours in, 24 out.

      - layout: table
        title: Trees beat networks here, on one short series
        recall: On a small single series, what do you try first, and what must a deep model do?
        lead: Each network saw 168 hours and predicted 24, with no calendar input. MASE, six folds.
        header: [Model, MASE, Train time]
        widths: [3, 1, 1]
        rows:
          - [GBM relative, "0.786", Seconds]
          - [TCN, "0.981", About 2 min]
          - [LSTM, "1.039", About 1 min]
          - [DLinear, "1.056", 2 s]
          - [Same hour last week, "1.074", None]
        highlight: [0]
        takeaway: On a small single series start with features and trees, and make any deep model beat that number in the same backtest.
        source: notes/01-time-series-ml.md
        notes: >-
          This is one series with a few hundred training windows. In M5, with 42,840 related series, cross-learning and LightGBM won, and only
          35.8 percent of teams beat the seasonal naive. DeepAR and its relatives are designed for many series, and a single short one starves them.

      - layout: cards
        title: "Case: forecasting each segment's cash flow, on synthetic data"
        kicker: Case study
        recall: In the segment case, what is a control world for?
        cards:
          - title: The question
            body: Every fourth Monday, finance wants each segment's net cash for the next four weeks.
          - title: The data
            body: "Synthetic, not real customers: 400 businesses and 156 weeks of signed weekly cash."
          - title: The test
            body: "Eight issue dates, each predicting four weeks from earlier data only. Scored by MASE."
          - title: The checks
            body: Random groups in place of segments, and a control world with no real groups.
        takeaway: A control world has no real groups in it, so any gain that appears there cannot come from segments.
        source: notes/01-time-series-ml.md
        notes: >-
          This data is generated by a lab, so we know the truth. Segments are four HDBSCAN clusters plus a noise group of 131 customers, frozen at the
          first issue date. Every lag is at least four weeks. The model is a GBM with the target divided by a known level, as in the bike case, and MASE
          is scaled by the same-week-last-year naive.

      - layout: image
        title: One synthetic world said that segments don't help
        kicker: Case study
        recall: Why did the seed 42 table read as "segments don't help"?
        image: ../../sources/images/ts-segment-forecast-mase.png
        caption: "Synthetic data, seed 42, eight walk-forward folds. Generated by the customer-segments lab."
        bullets:
          - "**Per segment** 0.961, against **global** 0.945"
          - "**Random groups** 0.936, ahead of the real segments"
          - "**Naive** 1.234: read models against this row, not against 1"
        takeaway: On one seed per-segment models lost to both a global model and random groups, which reads as "segments don't help".
        source: notes/01-time-series-ml.md
        notes: >-
          Read the blue dots, the segment totals. The naive row sits above 1 because the test weeks are harder than the history that sets the scale, and learned
          models improve on it by about a quarter. The per-segment model looks like a waste of effort, since groups drawn at random did better. Before you believe
          that, ask how many worlds it rests on: one, and eight folds.

      - layout: table
        title: "Five more worlds reversed it: segments help only where real"
        kicker: Case study
        recall: Across five worlds, where did the gain from segments appear, and where did it vanish?
        lead: "Synthetic data. Segment-total MASE, lower is better. Five-world columns are averages."
        header: [Model, "Seed 42, planted", "Five worlds, planted", "Five worlds, control"]
        widths: [3, 2, 2, 2]
        rows:
          - [Global, "0.945", "1.105", "0.999"]
          - [Global + segment feature, "0.930", "1.026", "1.004"]
          - [One per segment, "0.961", "1.024", "1.014"]
          - [One per random group, "0.936", "1.115", "1.007"]
        highlight: [1]
        takeaway: Real groups cut the error with a feature or a split alike, and the gain vanishes for random groups and in the control world.
        source: notes/01-time-series-ml.md
        notes: >-
          Against the global model, the feature wins in all five planted worlds, per segment in four, and random groups in one. The feature gets as much as a split,
          with one model to maintain. In single customers the effect is small: 1.133 global against 1.126 with the feature and 1.137 per segment.

      - layout: steps
        title: Segment a forecast only after it beats random groups
        kicker: Case study
        recall: What must segments beat, and on how many worlds, before you trust the gain?
        steps:
          - title: One global model
            text: Start there, with the naive row beside it
          - title: Add a feature
            text: Use the segment as a feature before any split
          - title: Split on evidence
            text: Only for a segment that wins across later folds
          - title: Compare with fakes
            text: Random groups and a control world
          - title: Repeat
            text: One table of eight folds gave the wrong answer here
        takeaway: Segments help a forecast only when they are real, so test any gain against random groups, a control and more than one seed.
        source: notes/01-time-series-ml.md
        notes: >-
          All of this is synthetic, so treat it as a lesson in method and not a fact about real customers. Two more things in the chapter: one segment of 161 customers,
          growth SaaS and seasonal retail, really does want its own model, at 0.807 against 1.123 for global, while per segment loses in the other four groups. And
          SMAPE disagrees with MASE, ranking the four-weeks-ago naive at 105.0 above the global model at 123.7, because net cash crosses zero.

  - title: The best predictor, the worst list
    summary: Sparse data · Biases and factors · Top-N · EASE · Implicit feedback
    notes: >-
      Now a film site wants a top ten list per person. We have MovieLens 100K, and we start where the Netflix Prize started, predicting stars.
    slides:
      - layout: statement
        title: Our best rating model loses to a bestseller list
        kicker: The problem
        recall: Why can a model trained to predict stars rank worse than popularity?
        statement: "Nobody sees your RMSE. People see ten films chosen from the whole catalogue."
        attribution: "Score for the top ten (NDCG@10, explained next): MF on ratings 0.034, popularity 0.075."
        takeaway: A model trained to predict the stars people gave can rank worse than popularity, because it was never asked to rank anything.
        source: notes/02-collaborative-filtering-and-matrix-factorisation.md
        notes: >-
          We will build the model that causes this result and then see what fixes it. The matrix has 943 users, 1,682 films and is 94 percent empty.
          The top tenth of films hold 43 percent of the ratings.

      - layout: cards
        title: NDCG gives more credit for hits near the top of the list
        kicker: How we score a list
        recall: What does NDCG reward that plain recall does not?
        cards:
          - title: Recall@10
            body: The share of a user's relevant test items that reached the list, capped by how many could fit.
          - title: NDCG@10
            body: The same idea with more credit near the top. Each hit counts 1 / log2(rank + 1), then we divide by the best possible list.
          - title: Coverage
            body: The share of the catalogue that appears on anybody's list.
        takeaway: NDCG is recall that cares about order, so a hit at the top counts for more than a hit further down, and a perfect list scores 1.
        source: notes/02-collaborative-filtering-and-matrix-factorisation.md
        notes: >-
          Think of a list of ten films. Recall asks how many of the films you went on to like made the list. NDCG asks the same, and also asks where they sit, because people
          read from the top. Dividing by the best possible list keeps the score between 0 and 1 for every user. Coverage stops a list of bestsellers looking good.

      - layout: flow
        title: Split interaction logs by time, not at random
        recall: What does a random split of interaction logs do to NDCG, and why?
        steps:
          - label: Global cut first
            sub: Only 109 of 301 future raters have any history
          - label: Per-user split
            sub: Oldest 80% train, next 10% validate, newest 10% test
          - label: Name the compromise
            sub: Some global information still crosses the line
        caption: "A random 90/10 split lifts EASE from NDCG 0.126 to 0.309 with no change in the model."
        takeaway: Random holdout lets a model see the future, which on our data more than doubled NDCG for the same model.
        source: notes/02-collaborative-filtering-and-matrix-factorisation.md
        notes: >-
          MovieLens users rate in one sitting, so a global time cut leaves most future raters with no history. On a real system, use the global cut.

      - layout: bullets
        title: Biased matrix factorisation, and what each part buys
        recall: In biased matrix factorisation, which parts capture most of the rating signal?
        lead: "**rating = mean + b_user + b_item + p_user · q_item**, fitted only on observed cells"
        bullets:
          - "Predict the mean: RMSE **1.229**"
          - "Add user and item biases: **1.015**"
          - "Add 20 latent factors: **0.996**"
          - "Koren et al.: Netflix's own system 0.9514, grand prize target 0.8563"
        aside:
          title: What factors find
          body: Real structure with no genre input. Star Wars lands next to The Empire Strikes Back.
        takeaway: User and item biases capture most of the rating signal, and latent factors add the interaction term on top.
        source: notes/02-collaborative-filtering-and-matrix-factorisation.md
        notes: >-
          The biases alone take RMSE down by about 0.21, the factors another 0.02. These are from a chronological split, which is harder than the
          random holdouts behind many published MovieLens numbers.

      - layout: code
        title: EASE trains with one matrix inverse
        recall: How does EASE learn its item-item matrix, and why is the diagonal zero?
        lang: python
        code: |-
          def fit_ease(R, lam=100.0):
              G = (R.T @ R).toarray().astype(float)
              G[np.diag_indices_from(G)] += lam
              P = np.linalg.inv(G)
              B = -P / np.diag(P)
              np.fill_diagonal(B, 0)
              return B

          scores = R[users] @ B
        bullets:
          - "Predict each item column from the others"
          - "Zero diagonal: no item may predict itself"
          - "Cubic in items, so tens of thousands at most"
        takeaway: EASE learns an item-item matrix in closed form with one matrix inverse, and its zero diagonal stops each item predicting itself.
        source: notes/02-collaborative-filtering-and-matrix-factorisation.md
        notes: >-
          Steck reports this beating deep models on most public datasets in his paper. It fits in a fraction of a second here. The inverse limits it to
          catalogues in the tens of thousands, which is what pushes larger systems to factor models.

      - layout: image
        title: Models built to rank beat a popularity list
        kicker: Worked example
        recall: On full-catalogue top-10, which kind of model beat popularity?
        image: ../../sources/images/recsys-ranking-coverage.png
        caption: "861 test users, full catalogue: EASE reaches NDCG@10 0.126 at 22% coverage; popularity 0.075 at 4%. Run `practice/02_ranking_plot.py`."
        takeaway: On full-catalogue top-10, models that target ranking beat popularity, and the simplest learned model led on our data.
        source: notes/02-collaborative-filtering-and-matrix-factorisation.md
        notes: >-
          Relevant means rated 4 or 5, minus what the user has seen. Recall@10 follows the same order: EASE 0.155, ALS 0.138, kNN 0.137, BPR 0.126, popularity 0.090, MF on ratings 0.043. One small dataset, so treat this as a demonstration of method. Watch coverage too. A high NDCG with 4 percent coverage is a bestseller list.

      - layout: compare
        title: Implicit data has no dislikes, so model it differently
        recall: What are the two ways to model implicit feedback?
        lead: Not watching may mean disinterest, or never having seen it.
        left:
          title: iALS (Hu et al., 2008)
          bullets:
            - Weight every cell by confidence, 1 + alpha r
            - Closed-form alternating solves
            - "Their alpha = 40 ranked last on our binary data"
          tag: Fit all cells
        right:
          title: BPR (Rendle et al., 2009)
          bullets:
            - A seen item should beat an unseen one
            - Sample triples, take gradient steps
            - Related to optimising AUC
          tag: Fit the order
        takeaway: Implicit feedback has no negative signal, so either weight all cells by confidence with iALS or optimise pairwise order with BPR.
        source: notes/02-collaborative-filtering-and-matrix-factorisation.md
        notes: >-
          A published hyperparameter is a fact about somebody else's data. Hu's alpha worked on television viewing counts. Ours is binary, and the
          validation grid put that setting last.

      - layout: statement
        title: Simple methods keep winning, so measure them first
        recall: Which simple methods belong in every recommender table, and why?
        statement: "Of 18 published top-n algorithms, 7 could be reproduced, 6 of those often lost to simple heuristics, and the last did not consistently beat a tuned linear method."
        attribution: Dacrema, Cremonesi and Jannach, RecSys 2019
        takeaway: Most published neural recommenders that could be reproduced lost to tuned simple methods, so put popularity, kNN and EASE in every table.
        source: notes/02-collaborative-filtering-and-matrix-factorisation.md
        notes: >-
          Rendle and colleagues also showed in 2020 that a well-tuned dot product beat the MLP similarity from Neural Collaborative Filtering. Take from this a
          working habit more than a verdict on deep learning.

  - title: Serving millions, and knowing it works
    summary: Two towers · logQ · Cold start · Sampled metrics · IPS · A/B tests
    notes: >-
      EASE won, but it cannot serve a catalogue of millions, and a new film leaves it helpless. Then the harder question: how do you know any of this works?
    slides:
      - layout: statement
        title: A new film has no ratings. What does EASE recommend?
        kicker: The problem
        recall: Which two limits of interaction-only models motivate feature-based retrieval?
        statement: "A matrix cannot rank an item it has never seen, and an item matrix stops fitting long before millions of items."
        attribution: Two towers learn embeddings from features instead
        takeaway: Interaction-only models cannot rank a new item and do not scale to millions, which is what motivates feature-based retrieval.
        source: notes/03-two-tower-and-evaluation.md
        notes: >-
          EASE's score for a film it never saw is zero everywhere. And the matrix inverse is cubic in items. We need something that embeds from features and serves quickly.

      - layout: flow
        title: Large systems narrow the catalogue in stages
        recall: Why is retrieval judged on recall?
        steps:
          - label: Retrieval
            sub: Millions to hundreds. Judged on recall.
          - label: Ranking
            sub: Hundreds to tens. Rich features, judged at the top.
          - label: Re-ranking
            sub: Diversity, freshness, business rules.
        caption: "Covington, Adams and Sargin, RecSys 2016. The towers cannot share inputs, so cross-features go to the ranker."
        takeaway: Retrieval narrows the catalogue cheaply and is judged on recall, because anything it drops can never be recovered downstream.
        source: notes/03-two-tower-and-evaluation.md
        notes: >-
          Because the towers never see each other's inputs, all item vectors can be precomputed into a nearest neighbour index. Serving is one forward pass and one lookup.

      - layout: code
        title: One line stops in-batch softmax punishing popularity
        recall: Why does in-batch softmax hurt popular items, and what is the fix?
        lang: python
        code: |-
          for b in torch.randperm(len(u)).split(bs):
              logits = m.user(u[b]) @ m.item(i[b]).T / tau
              if logq:
                  logits = logits - logp[i[b]]
              same = i[b][:, None] == i[b][None, :]
              same.fill_diagonal_(False)
              logits = logits.masked_fill(same, -1e9)
              loss = F.cross_entropy(logits, targets)
        bullets:
          - "Popular items are the most common negatives"
          - "Subtract log frequency: **training only**"
          - "Mask duplicates of the positive"
        takeaway: In-batch negatives over-penalise popular items, so subtract each candidate's log sampling probability from its logit during training.
        source: notes/03-two-tower-and-evaluation.md
        notes: >-
          Yi and colleagues give this correction from importance sampling. On Wikipedia with 5.3 million pages they report Recall@10 going from 0.0643 to 0.1065 at tau 0.07.

      - layout: table
        title: The correction turns a losing tower into a contender
        kicker: Worked example
        recall: What did the logQ correction do to the two-tower model, and what did the plain model do?
        lead: Same split and metrics as the previous part. NDCG@10 gives more credit to hits near the top.
        header: [Model, Recall@10, NDCG@10, Coverage]
        widths: [3, 1, 1, 1]
        rows:
          - [EASE, "0.155", "0.126", "0.22"]
          - ["Two-tower, logQ", "0.141", "0.110", "0.31"]
          - [Popularity, "0.090", "0.075", "0.04"]
          - ["Two-tower, plain", "0.053", "0.038", "0.86"]
        highlight: [1]
        takeaway: The logQ correction lifted our tower from below popularity to close to EASE, while the uncorrected model scattered over the catalogue.
        source: notes/03-two-tower-and-evaluation.md
        notes: >-
          EASE still wins on this small catalogue. The tower has to earn its complexity elsewhere, and cold start is where it does: on films hidden from training it reaches
          recall 0.22 against 0.08 for random, and EASE only matches random.

      - layout: image
        title: A sampled metric reversed two models
        recall: What can ranking against sampled negatives do to the order of two models?
        image: ../../sources/images/recsys-sampled-metric.png
        caption: "HR@10, same models and users. Against 99 negatives EASE 0.591, tower 0.617. Against the full catalogue EASE 0.137, tower 0.125. Run `practice/03_sampled_metric_plot.py`."
        takeaway: Sampled metrics are inconsistent with exact ones and can reverse model order, so rank the whole catalogue whenever you can.
        source: notes/03-two-tower-and-evaluation.md
        notes: >-
          Krichene and Rendle prove this is not noise. As the sample shrinks, all metrics collapse towards AUC. We see it directly here: numbers roughly four to nine times too high, and the order flipped. The tower's lead holds up to 499 negatives and ends at 999, so a paper's choice of sample size can decide the winner.

      - layout: table
        title: Reweighting recovers the value of an unshipped policy
        recall: What does IPS need from the logs, and what does it cost?
        lead: Simulated bandit, 200,000 logged events, so the true value is known.
        header: [Estimate, Value]
        widths: [3, 1]
        rows:
          - [True value of the new policy, "0.2162"]
          - [Logged CTR of the old policy, "0.0801"]
          - [Naive CTR on matching events, "0.2955"]
          - [IPS, "0.2190"]
          - [Self-normalised IPS, "0.2161"]
        highlight: [4]
        takeaway: IPS reweights logged events by inverse propensity to estimate a new policy, but it needs logged probabilities and pays for them in variance.
        source: notes/03-two-tower-and-evaluation.md
        notes: >-
          200,000 events shrink to an effective sample of about 3,200. Li and colleagues built the replay version for Yahoo news on 33 million uniformly randomised events.
          Log your propensities now, because you cannot add them later.

      - layout: steps
        title: Each stage earns the next, more expensive one
        recall: Why must offline stages remove candidates before an A/B test?
        steps:
          - title: Full-catalogue offline
            text: Cheap, biased by logs
          - title: Counterfactual estimate
            text: Needs logged propensities
          - title: Small live ramp
            text: Guardrails, latency, bugs
          - title: A/B test
            text: "1% lift on a 5% rate: about 3 million per arm"
          - title: Long-term holdout
            text: Catches slow effects
        takeaway: Only a live test measures the real counterfactual, and because it needs millions of users each offline stage must remove candidates first.
        source: notes/03-two-tower-and-evaluation.md
        notes: >-
          Netflix describes offline experiments as assuming members would have behaved the same way under the new algorithm. YouTube reports that live results do not always correlate with offline ones.
          Netflix also estimates that recommendations influence about 80 percent of hours streamed.

  - title: Which invoice, if any?
    summary: Blocking · Evidence in bits · Ranking · Constraints · Abstaining
    notes: >-
      Now there is no user and no catalogue, only bank lines and invoices with no shared ID. We retrieve, rank and then decide whether to link at all. The ledger is generated, so the true links are known exactly and no real supplier or payment is in it.
    slides:
      - layout: statement
        title: 99.5% accurate on pairs, and 27% of lines are wrong. Why?
        kicker: The problem
        recall: Why can a pair classifier score above 99% and still get a quarter of bank lines wrong?
        statement: "A pair classifier scored 99.5% accuracy, and only 72.7% of bank lines ended up with exactly the right invoices."
        attribution: "Generated ledger, one seed, 866 test lines. Answering no to every pair scores 98.7%."
        takeaway: Nearly every pair is a non-match, so score whole lines and ask whether each one ended up with exactly the right set of invoices.
        source: notes/04-entity-matching-and-learning-to-rank.md
        notes: >-
          This is the job of a clerk with a stack of bank lines and a stack of invoices. A wrong link is also two errors, not one. Of 101 wrong top picks, 97 invoices were wrongly marked paid and 101 lines had their true invoices left open. About three quarters of the wrong picks, 0.752, were the right supplier and the wrong invoice, so what is left is telling near-identical invoices apart. The threshold also handed 62 lines several invoices, and only 2 of those were real batches.

      - layout: image
        title: Blocking cuts 17 million pairs and caps all that follows
        recall: What does blocking cost, and which two numbers do you read together?
        image: ../../sources/images/recsys-match-blocking.png
        caption: "All pairs 17,372,000. Recall of true links, seed 0: 0.9447 at 12 candidates, 0.9782 at 157 and still 0.9782 at 250. Run `practice/04_matching_lab.py`."
        bullets:
          - "**All keys together:** keep 97.3% of true links at 78 candidates per line"
          - "**Best reduction, 99.99%:** keeps only 39.6%"
          - "**Recall by kind:** batch 0.8707, part 0.9235, single 0.9981"
        takeaway: Anything outside the block is rejected unseen, so read reduction beside recall, split by kind of payment.
        source: notes/04-entity-matching-and-learning-to-rank.md
        notes: >-
          Blocking means comparing only pairs that share some cheap property, such as a close amount or a similar name. Recall is the share of true links still inside the block. Fellegi and Sunter already had this accounting in 1969: pairs outside the block are links you decided against without looking. Going from 157 to 250 candidates buys nothing, because the links still missing fail on another key, with a split amount, a hidden name and no reference. Only a new kind of key could reach them.

      - layout: code
        title: Evidence adds up in bits, and the middle goes to a person
        kicker: Fellegi and Sunter, 1969
        recall: What are m and u, and why did Fellegi and Sunter use three outcomes?
        lead: "m is how often an agreement level appears among true matches, u among non-matches. Each extra bit of log2(m/u) doubles the odds."
        lang: output
        code: |-
          Weights in bits, from labelled training pairs
            amount     exact 5.52       within 3% -0.59      far -1.79
            name       strong 2.49      none -0.36           weak -3.9
            reference  all digits 11.27 one digit off 8.95   missing 0.0   other -12.04
            date       near due 1.16    later -2.54          far -5.87

          Three decisions, thresholds set on validation, read on test
          link    9.25 bits or more      305 pairs   precision 1.000
          review  in between            6864 pairs   of which true 0.073
          reject  below -2.00 bits     57176 pairs   true pairs lost 17 of 824
        takeaway: A reference one digit off still multiplies the odds by about 500, and independent weights leave a review pile that ranking has to shrink.
        source: notes/04-entity-matching-and-learning-to-rank.md
        notes: >-
          This reads like the odds form of Bayes' rule, adding evidence field by field if the fields are independent given match status. The link region is clean, but it holds only 305 of 824 true pairs, with nearly 7,000 pairs sent to review for 866 lines. These weights know nothing about the other candidates on the same line. Notice that a weak name scores below no name at all. That comes from the block, which selected on the same fields, so read the weights as conditional on the block. We did not run a language model here. Ditto is the reference for messy text, and its authors warn it may not capture numeric-heavy matching well.

      - layout: cards
        title: Three ways to train a ranker differ in what one example is
        recall: What is one training example in pointwise, pairwise and listwise ranking, and why can't NDCG be optimised directly?
        cards:
          - title: Pointwise
            body: One candidate and its label. Fit a classifier and sort. It never looks at the rest of the list.
          - title: Pairwise
            body: Two candidates from one bank line. The target is which should come first. This is RankNet.
          - title: Listwise
            body: A whole list, with a loss that depends on all of it. Here, XE-NDCG.
          - title: LambdaMART
            body: Boosted trees on pairwise gradients, each multiplied by how much NDCG would change if the two swapped.
        takeaway: The bank line is the query and its invoices the documents, and the setups differ in whether the model learns from an item, a pair or a list.
        source: notes/04-entity-matching-and-learning-to-rank.md
        notes: >-
          Each candidate gets a grade: 2 for a true link, 1 for another invoice from the right supplier, 0 for anything else. Sorting makes NDCG, in Burges's words, everywhere either discontinuous or flat, so it has no useful gradient. LambdaRank's fix is blunt: write no loss, just write down the gradient you want. Bruch's objection is that this leaves no objective to analyse. It works anyway. An ensemble of LambdaMART rankers won a track of the 2010 Yahoo challenge, though Burges's paper presents no experiments of its own.

      - layout: table
        title: LambdaMART won, and most of its gain is training on pairs
        kicker: Measured
        recall: Where did LambdaMART's gain over pointwise trees come from, and what did the NDCG factor add?
        lead: "Mean over five generated ledgers. Train on the earliest 60% of lines, test on the last 20%, scoring only lines whose true link survived the block."
        header: [Model, NDCG@5, Top-1]
        widths: [3, 1, 1]
        rows:
          - [Closest amount, "0.5397", "0.4714"]
          - [Fellegi-Sunter weights, "0.8703", "0.8332"]
          - [Pointwise trees, "0.9129", "0.8513"]
          - ["Pairwise linear (RankNet)", "0.9374", "0.8440"]
          - ["Pairwise trees, no NDCG factor", "0.9416", "0.8541"]
          - [Pairwise trees + NDCG factor, "0.9451", "0.8600"]
          - [LambdaMART (LightGBM), "**0.9469**", "0.8628"]
          - [Listwise trees (XE-NDCG), "0.9413", "0.8495"]
        highlight: [6]
        takeaway: Moving to pairs added about 0.03, and the famous NDCG factor only 0.0035, so the training example mattered more than the weight.
        source: notes/04-entity-matching-and-learning-to-rank.md
        notes: >-
          LambdaMART wins on NDCG in all five paired comparisons, but read where the gain comes from. The biggest step is having features at all, from 0.54 to 0.87. A pairwise linear model at 0.9374 beats pointwise trees at 0.9129, so here the objective matters more than the model family. Pointwise linear scored 0.9101. The factor's 0.0035 is real, about an eighth of what moving to pairs bought. Listwise lost all five ledgers by 0.0056, though Bruch's web search benchmarks went the other way, 48.23 against 48.08 and 73.37 against 73.00, so the gap is small and depends on the data. Top-1 is noisier: the trees sit within about 0.015 with a standard deviation over 0.02, so don't claim an order from it. We chose this generator's difficulties, so run it on your own data before trusting the close results.

      - layout: table
        title: The obvious one-to-one constraint lost, 678 to 689
        recall: Why did one-to-one assignment lower the score, and for which kind of payment?
        lead: "Hungarian assignment uses each line and each invoice at most once. Top picks counted right, one generated ledger, LambdaMART scores."
        header: [Kind of payment, Lines, Independent top pick, One-to-one]
        widths: [3, 1, 2, 2]
        rows:
          - [Single, "635", "585", "594"]
          - [Batch, "35", "19", "25"]
          - [Part payment, "120", "**85**", "**59**"]
          - [All lines with a true link, "790", "**689**", "**678**"]
        highlight: [2]
        takeaway: Two lines paying one invoice is what the constraint forbids, so check any hard constraint against the real shape of the data, kind by kind.
        source: notes/04-entity-matching-and-learning-to-rank.md
        notes: >-
          We expected assignment to win, and it lost. Independent picks left 98 invoices claimed by more than one line, so the repair looked obvious. Singles and batches did improve, but the constraint is false for the part you most need to get right. For batches the fix is arithmetic, not learning. Search the supplier's invoices for a unique set that sums to the payment, and batches go from 0 to 22 of 35 fully right, with no wrong sets and one single lost. The 8 ambiguous lines go to a person. We have not measured exempting likely part payments from the constraint.

      - layout: image
        title: The margin over second links far more lines safely
        recall: What should a matcher abstain on, and did the better ranker help by itself?
        image: ../../sources/images/recsys-match-abstain.png
        caption: "Coverage is the share of bank lines linked automatically. Generated ledger, one seed, 866 test lines, 76 with no invoice. Run `practice/04_matching_lab.py`."
        bullets:
          - "**At 99% precision:** margin links 68.5%, top score 40.3%, same model"
          - "**At 90%:** the top score covers more, 87.8% against 83.7%"
          - "**Ranker's NDCG gain:** no help here, pointwise probability links 40.9% at 99%"
        takeaway: Ranking always returns something, even for payroll, so decide whether to link from a separate signal and check it on a coverage curve.
        source: notes/04-entity-matching-and-learning-to-rank.md
        notes: >-
          A ranker only promises order within a bank line, so comparing raw scores across lines asks something it was not trained for. The margin is how far the top candidate is ahead of the second. The ranker did not change at all, and a better question of its output gained 28 points of coverage at 99 percent precision. Where to stand on that curve is a business decision based on the price of a wrong link and the price of review, which is DS 01/13. The corrections people make in the queue become your next labels, with the selection bias DS 01/14 measures.

      - layout: table
        title: Tuning beat a frozen encoder here, then flattened
        recall: How do you tell whether more labelled pairs would pay when tuning an encoder?
        lead: "Generated catalogues of about 1,700 records, `all-MiniLM-L6-v2`, 400 steps, batch 32, three seeds. Seed noise about 0.01."
        header: [Model, Pairs, Recall@10, Look-alikes in top 10]
        widths: [4, 1.2, 1.6, 2.4]
        highlight: [4]
        rows:
          - [TF-IDF characters, "0", "0.456", "0.089"]
          - [Frozen pretrained, "0", "0.134", "0.030"]
          - [Tuned in-batch, "100", "0.799", "0.371"]
          - [Tuned in-batch, "300", "0.881", "0.476"]
          - [Tuned in-batch, "1,000", "0.908", "0.494"]
          - [Tuned in-batch, "3,000", "0.912", "0.501"]
        takeaway: Measure frozen and a character baseline first, then train at three sizes. When the last step gains less than seed noise, more labels of that kind won't pay.
        source: notes/05-learning-a-similarity-function.md
        notes: >-
          Don't take 13.4% to 90.8% as what tuning does in general. It's the size of the gap on this text, mostly codes, grades and dimensions, where the frozen model has the least to work with. The 1,000 to 5,000 pairs rule of thumb we traced cites no study. Pairs come from closing the match labels into groups and allowing one pair per known group in a batch, so no known match is used as a negative, though unlabelled matches can still land there. Look-alikes rise with tuning too, which the next slide returns to.

      - layout: compare
        title: What a headline recall hides
        recall: Mining left recall flat. What did it buy, and why do you still need an attribute check?
        left:
          title: A family it never saw
          bullets:
            - "Trained on all families **0.917**, without this one **0.715** (1,000 pairs, mean of three)"
            - "Worst family: bearing, **0.578**. TF-IDF averages 0.451"
            - "WDC Products: R-SupCon F1 **82.15** seen, **53.31** unseen"
          tag: A generous test, since the families share a format
        right:
          title: Mining hard negatives
          bullets:
            - "Add hardest ranks: recall **0.908** to **0.906**, look-alikes **0.494** to **0.363**"
            - "Hardest only: recall **0.852**, look-alikes 0.250"
            - "Rank 11 to 100: no change, 0.908 and 0.502"
          tag: 1,000 pairs, three seeds
        takeaway: Put a held-out family beside your headline score, and keep the attribute check, since more than a third of the top 10 are look-alikes even after mining.
        source: notes/05-learning-a-similarity-function.md
        notes: >-
          Mining works on a metric you may not have been measuring. About 4.7% of the hardest mined records were true matches the labels missed, and removing them left recall within noise, 0.893. Facebook's search team found rank 101 to 500 best on their much larger corpus, so test a band and don't copy one. For the loss, start with in-batch softmax: Musgrave et al. on vision data found newer losses barely beat 2006 contrastive. On WDC, Ditto held 67.94 and RoBERTa 69.75 on unseen products, because those read the pair together.

  - title: Rules of thumb
    agenda: false
    divider: false
    slides:
      - layout: cards
        title: What to remember
        recall: Which two habits apply to both forecasts and recommenders?
        cards:
          - title: Issue time first
            body: A feature is legal only if it existed at the issue time.
          - title: Baselines in every table
            body: Seasonal naive for forecasts, popularity and EASE for lists.
          - title: Trees before networks
            body: Divide by a level and beat them in the same backtest.
          - title: Score what people see
            body: Full catalogue and whole bank lines, not RMSE, sampled negatives or pair accuracy.
          - title: Correct the sampler
            body: LogQ in training, for in-batch softmax.
          - title: Offline chooses, live decides
            body: Log propensities and budget for an A/B test.
        takeaway: In forecasts, lists and matches, score what the decision will really see, and keep simple baselines in every table.
        source: notes/03-two-tower-and-evaluation.md  # also: notes/04-entity-matching-and-learning-to-rank.md
        notes: >-
          Both halves of today came down to the same two habits: an evaluation that matches the real decision, and a simple method to beat.
      - layout: bullets
        title: Where next
        recall: Where do you go next for experiment statistics, and for exploration and replay?
        bullets:
          - "**Text as features:** LLM embeddings fill the two-tower content slot, in the NLP pillar"
          - "**Experiment statistics:** the A/B ladder in data analytics, experimentation and causality"
          - "**Bandits:** the RL pillar in generative AI develops exploration and replay"
          - "**Language models:** LLM fundamentals in generative AI"
          - "**Pricing the review queue:** automate, review or reject, in classical ML"
        takeaway: Next, carry these habits to text features, experiments, bandits and review queues.
        source: notes/03-two-tower-and-evaluation.md
        notes: >-
          Each of these picks up a thread from today. The A/B ladder and the bandit replay are the two that follow most directly from the last part.
