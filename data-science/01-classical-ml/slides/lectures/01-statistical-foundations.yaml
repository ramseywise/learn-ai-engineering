        title: The uniform API is a design decision
        recall: What does the scikit-learn paper claim about its API, and what doesn't it measure?
        kicker: "Pedregosa et al., JMLR 2011"
        left:
          title: What the paper claims
          bullets: ["API consistency over many algorithms", "For non-specialists", "By code convention, not inheritance"]
