      - layout: image
        beat: practice
        level: deep
        section: The scikit-learn API in four lines
        title: Which estimators have which methods
        recall: Which estimators predict, and which transform?
        kicker: "Müller and Guido, ch. 8"
        image: ../../../sources/images/mueller-guido-api-table.png
        caption: "Image source: Müller and Guido, Introduction to Machine Learning with Python, ch. 8."
        takeaway: Classifiers, regressors and some clusterers predict, preprocessors and feature extractors transform, and all of them fit.
        source: notes/01-statistical-foundations.md
        notes: A reference slide, to come back to when you're unsure which method a given object offers.

      - layout: code
        beat: practice
        level: deep
        section: The scikit-learn API in four lines
        title: Writing your own estimator takes three rules
        recall: How do you make a custom class work as a scikit-learn estimator?
        lang: python
        code: |-
          class Ranked(ClassifierMixin, BaseEstimator):
              def __init__(self, rank=0):
                  self.rank = rank       # store it, no logic

              def fit(self, X, y):
                  c, n = np.unique(y, return_counts=True)
                  self.classes_ = c      # state ends in _
                  self.label_ = c[np.argsort(-n)[self.rank]]
                  return self

              def predict(self, X):
                  return np.full(len(X), self.label_)
        bullets:
          - "**Inherit** a mixin, `BaseEstimator`."
          - "**`__init__`** only stores hyperparameters."
          - "**`fit`** returns `self`."
        takeaway: Subclass BaseEstimator and a mixin, keep logic out of __init__, and return self from fit.
        source: notes/01-statistical-foundations.md
        notes: >-
          An illustration written for this slide and run on iris, following the rules in Müller and Guido chapter 8. Follow those
          rules and your object works in pipelines and grid search.

  - title: Pitfalls
    summary: Five first mistakes · A rule that loses to guessing · What to carry forward
    notes: Each of these is a mistake with a symptom you can spot, and a fix you can apply on Monday.
    slides:
      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: Five ways a first model misleads you
        recall: What's the symptom of fixing variance with a bigger model?
        header: [Pitfall, Symptom, Fix]
        widths: [3.4, 4, 3.8]
        rows:
          - [Accuracy without the base rate, "76% on adult census is what always saying <=50K gets", Print the class shares before fitting]
          - [Treating noise as bias, The test score stops improving with any model or feature, "Estimate the noise from repeat labels or human agreement"]
          - [Reading the test set while developing, The score drops the day it meets real data, Tune on validation or CV]
          - [Fixing variance with a bigger model, "Train rises, test falls", "Regularise, simplify or add data"]
          - [Shuffling data that has an order, "Great offline, poor live, on time-stamped or grouped rows", "Split by time or group, as production meets the data"]
        takeaway: A bigger model raises train and lowers test when the problem is variance, so regularise, simplify or add data.
        source: notes/01-statistical-foundations.md
        notes: >-
          Treating noise as bias is the expensive one. If human labellers disagree with each other on a fifth of the rows, no
          amount of tuning gets you past that. Measure the noise before you spend the week.

      - layout: code
        beat: pitfalls
        level: practice
        section: Pitfalls
        title: A sensible rule can lose to guessing
        recall: Why compare a sensible-looking rule to the base rate?
        lead: "On adult census: predict over $50k if `education-num` is 13 or more."
        lang: python
        code: |-
          ((adult["education-num"] >= 13) == (adult["income"] == ">50K")).mean()

          # 0.752   the rule
          # 0.759   always guessing <=50K
        takeaway: On accuracy, a sensible-looking rule at 0.752 loses to the base rate of 0.759, so check before you believe it.
        source: notes/01-statistical-foundations.md
        notes: >-
          More education does go with higher income, and the rule still loses on accuracy to knowing nothing. That doesn't make
          education useless. It says you need a better question and a better measure, which is where the next lectures go.

